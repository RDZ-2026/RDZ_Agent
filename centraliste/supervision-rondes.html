<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDZ Security Management SA — Supervision des rondes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --red:#8B1A1A; --red-dark:#6B1212;      /* UI applicative */
  --report-red:#C8102E;                    /* rapports imprimables */
  --ink:#1a1a1a; --paper:#ffffff;
  --line:#d0d0d0; --line-soft:#e0e0e0;
  --bg-meta:#f0f0f0; --bg-soft:#f7f7f7;
  --ok:#1b7a3d; --warn:#b8860b; --danger:#8B1A1A;
  --radius-ui:2px; --radius-card:10px; --radius-section:8px;
  --font:Arial, Helvetica, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg-soft);color:var(--ink);font-size:14px}
.hidden{display:none!important}
/* ── En-tête identique au tableau de bord (index.html, 2026) ── */
.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(100deg,#081421,#11263a 64%,#183149 100%);border-bottom:3px solid #e3062c;box-shadow:0 7px 25px rgba(4,16,29,.25)}
.hdr-inner{max-width:1420px;margin:0 auto;min-height:74px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.hdr-brand{display:flex;align-items:center;gap:18px;min-width:0}
.hdr-logo{width:105px;height:52px;flex:0 0 105px;display:flex;align-items:center;justify-content:center;padding:5px 8px;background:#fff;border-radius:9px;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.hdr-logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.hdr-name{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.hdr-sub{font-size:9.5px;color:#afbecb;letter-spacing:.04em;margin-top:4px}
.hdr-meta{padding-left:22px;border-left:1px solid rgba(255,255,255,.13);font-size:10px;color:#aebdca;text-align:right;line-height:1.5}
.bnr{position:relative;overflow:hidden;background:linear-gradient(112deg,#0b1927 0,#142b3f 65%,#1d3a50 100%)}
.bnr:after{content:"";position:absolute;right:-40px;top:-125px;width:440px;height:310px;background:radial-gradient(circle,rgba(227,6,44,.17),transparent 68%);pointer-events:none}
.bnr-inner{position:relative;z-index:1;max-width:1420px;margin:0 auto;min-height:82px;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.bnr-title{font-size:18px;font-weight:700;color:#fff;letter-spacing:.01em}
.bnr-title:before{content:"RDZ";display:inline-flex;width:38px;height:25px;align-items:center;justify-content:center;margin-right:12px;border-radius:7px;background:#e3062c;font-size:9px;letter-spacing:.12em;color:#fff;vertical-align:2px}
.bnr-home{color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:8px 12px;white-space:nowrap}
.bnr-home:hover{background:rgba(255,255,255,.18)}
@media(max-width:680px){
  .hdr-inner,.bnr-inner{padding-left:14px;padding-right:14px}
  .hdr-inner{min-height:66px}.hdr-brand{gap:10px}
  .hdr-logo{width:70px;height:41px;flex-basis:70px;padding:4px 6px}
  .hdr-name{font-size:10.5px}.hdr-sub{font-size:8px}.hdr-meta{display:none}
  .bnr-inner{min-height:70px;padding-top:14px;padding-bottom:14px}.bnr-title{font-size:13px}
}
@media print{.hdr,.bnr{display:none!important}}
main{max-width:1250px;margin:0 auto;padding:20px 20px 60px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:var(--radius-ui);padding:12px 14px;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.04em}
.filters input,.filters select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:var(--radius-ui);padding:8px 9px;background:#fff;min-width:150px}
.btn{font-family:inherit;font-size:13.5px;font-weight:700;border-radius:var(--radius-ui);padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 9px;font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:var(--radius-ui);padding:12px 14px}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:12px;color:#666;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
table.list{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
table.list th{background:var(--bg-meta);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#555;padding:9px 10px;border-bottom:1px solid var(--line)}
table.list td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover{background:#fbf3f3}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.t-ok{background:#e5f4ea;color:var(--ok)}
.t-warn{background:#fff3d6;color:#8a6100}
.t-bad{background:#fbe5e5;color:var(--danger)}
.t-run{background:#e6efff;color:#1d4ed8}
.t-grey{background:#eee;color:#666}
.muted{color:#777;font-size:12.5px}
.state-msg{padding:28px;text-align:center;color:#777;background:#fff;border:1px dashed var(--line);border-radius:var(--radius-ui);line-height:1.5}
.err{background:#fff2f2;border:1px solid #e3b9b9;color:var(--danger);padding:10px 12px;border-radius:var(--radius-ui);margin-bottom:12px}
.back{display:inline-block;margin-bottom:14px;border:1px solid var(--line);padding:7px 12px;border-radius:var(--radius-ui);cursor:pointer;font-family:inherit;font-size:13px;background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-ui);padding:16px;margin-bottom:14px}
.card h3{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--red);margin-bottom:10px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px}
.dgrid .k{font-size:11.5px;color:#777;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.dgrid .v{font-size:14.5px;font-weight:700;margin-top:2px}
.pt{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.pt:last-child{border-bottom:none}
.pt .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:#e8e8e8;color:#555}
.pt.ok .n{background:var(--ok);color:#fff}
.pt.miss .n{background:var(--danger);color:#fff}
.pt.supp .n{background:#1d4ed8;color:#fff}
.pt .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pt .nm{font-weight:700;font-size:15px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs figure{width:120px}
.thumbs img{width:120px;height:90px;object-fit:cover;border:1px solid var(--line);border-radius:var(--radius-ui);cursor:zoom-in;display:block;background:#eee}
.thumbs figcaption{font-size:11px;color:#777;margin-top:2px}
.thumbs .wait{width:120px;height:90px;display:grid;place-items:center;text-align:center;font-size:11.5px;color:#8a6100;background:#fff8e6;border:1px dashed #e0c97a;border-radius:var(--radius-ui)}
.cmt{margin-top:7px;background:var(--bg-soft);border-left:3px solid var(--line);padding:7px 10px;font-size:13.5px}
.rap{margin-top:7px;background:#fff7ed;border-left:3px solid #ea580c;padding:7px 10px;font-size:13px;line-height:1.45}
.motif{background:#fff2f2;border:1px solid #e3b9b9;padding:10px 12px;border-radius:var(--radius-ui);margin-top:10px}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:94vw;max-height:94vh;box-shadow:0 0 30px rgba(0,0,0,.5)}

/* ── Rapport imprimable (style RDZ Reports) ── */
#report-wrap{position:fixed;inset:0;z-index:400;background:#e9e9e9;overflow:auto;padding:20px}
.no-print{max-width:820px;margin:0 auto 14px;display:flex;gap:10px;justify-content:flex-end}
.rpt{max-width:820px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.15);overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.rpt-head{background:#1a1a1a;border-top:4px solid #C8102E;color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.rpt-kind{color:#C8102E;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.rpt-title{font-size:22px;font-weight:700;margin-top:4px}
.rpt-site{font-size:13px;color:#ccc;margin-top:3px}
.rpt-logo{background:#fff;border-radius:50%;width:86px;height:86px;display:grid;place-items:center;flex:0 0 86px}
.rpt-logo img{width:70px;height:auto}
.rpt-meta{background:#f0f0f0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 24px}
.rpt-meta .k{font-size:10px;color:#777;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rpt-meta .v{font-size:13.5px;font-weight:700;margin-top:3px}
.rpt-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:#fff}
.rpt-body{padding:18px 24px}
.rpt-sec{border:1.5px solid #d0d0d0;border-radius:8px;margin-bottom:14px;overflow:hidden;break-inside:avoid}
.rpt-sec-t{background:#d0d0d0;color:#C8102E;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px}
.rpt-sec-b{padding:12px}
.rpt-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px}
.rpt-f .k{font-size:9.5px;color:#999;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rpt-f .v{font-size:13px;padding:3px 0;border-bottom:1px solid #e0e0e0;min-height:20px}
.rpt-tbl{width:100%;border-collapse:collapse;font-size:12px}
.rpt-tbl th{text-align:left;font-size:9.5px;color:#777;text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid #d0d0d0;padding:5px 6px}
.rpt-tbl td{border-bottom:1px solid #e8e8e8;padding:6px;vertical-align:top}
.rpt-tbl tr{break-inside:avoid}
.rpt-ph{display:flex;gap:4px;flex-wrap:wrap}
.rpt-ph img{width:64px;height:48px;object-fit:cover;border-radius:4px;border:1px solid #ddd}
.rpt-foot{background:#1a1a1a;border-top:3px solid #C8102E;color:#bbb;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:10.5px;line-height:1.5}
.rpt-foot img{height:30px;background:#fff;border-radius:4px;padding:3px 6px}
@media print{
  @page{margin:12mm;size:A4}
  body > *:not(#report-wrap){display:none!important}
  #report-wrap{position:static;background:#fff;padding:0;overflow:visible}
  .no-print{display:none!important}
  .rpt{box-shadow:none;max-width:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hm(iso){ if(!iso) return '—'; const d = new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function dmy(iso){ if(!iso) return '—'; const d = new Date(iso); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
function dur(a, b){ if(!a || !b) return '—'; const m = Math.max(0, Math.round((new Date(b)-new Date(a))/60000)); return m < 60 ? m+' min' : Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'); }
function arr(x){ return Array.isArray(x) ? x : []; }
function chunks(a, n){ const r = []; for(let i = 0; i < a.length; i += n) r.push(a.slice(i, i+n)); return r; }
async function inQuery(table, col, ids, sel){
  const out = [];
  for(const c of chunks([...new Set(ids)].filter(Boolean), 150)){
    const { data, error } = await sb.from(table).select(sel||'*').in(col, c);
    if(error) throw error; out.push(...(data||[]));
  }
  return out;
}
function statusOf(e){
  if(e.statut === 'en_cours') return { k:'en_cours', html:'<span class="tag t-run">En cours</span>', color:'#1d4ed8', label:'En cours' };
  if(arr(e.manquants).length) return { k:'incomplete', html:'<span class="tag t-warn">Incomplète</span>', color:'#b8860b', label:'Incomplète' };
  return { k:'complete', html:'<span class="tag t-ok">Complète</span>', color:'#1b7a3d', label:'Complète' };
}

/* ───────────── Chargement ───────────── */
(function initDates(){
  const to = new Date(), from = new Date(); from.setDate(from.getDate() - 6);
  document.getElementById('f-from').value = ymd(from); document.getElementById('f-to').value = ymd(to);
})();
async function load(){
  const box = document.getElementById('l-table');
  document.getElementById('l-msg').innerHTML = '';
  box.innerHTML = '<div class="state-msg">Chargement…</div>';
  const from = new Date(document.getElementById('f-from').value + 'T00:00:00');
  const to = new Date(document.getElementById('f-to').value + 'T00:00:00'); to.setDate(to.getDate() + 1);
  if(isNaN(from) || isNaN(to) || to <= from){ box.innerHTML = '<div class="state-msg">Période invalide.</div>'; return; }
  try{
    const { data, error } = await sb.from('rondes_executions').select('*')
      .gte('debut_at', from.toISOString()).lt('debut_at', to.toISOString()).order('debut_at', { ascending:false }).limit(2000);
    if(error) throw error;
    EXECS = data || [];
    const ids = EXECS.map(e => e.id);
    [SCANS, PHOTOS] = await Promise.all([ inQuery('rondes_scans', 'execution_id', ids), inQuery('rondes_photos', 'execution_id', ids) ]);
    const rids = [];
    EXECS.forEach(e => rids.push(...arr(e.rapport_ids)));
    SCANS.forEach(s => rids.push(...arr(s.rapport_ids)));
    RAPPORTS = new Map();
    if(rids.length){
      try{ (await inQuery('journal_entrees', 'id', rids, 'id,date_rapport,heure_rapport,agent_nom,situation,actions,localisation,localisation_autre,created_at')).forEach(r => RAPPORTS.set(String(r.id), r)); }
      catch(e){ document.getElementById('l-msg').innerHTML = `<div class="err">Rapports liés non chargés : ${esc(e.message)}</div>`; }
    }
  }catch(e){
    box.innerHTML = `<div class="err">Chargement impossible : ${esc(e.message||e)}<br>La migration « migration-rondes.sql » a-t-elle été lancée ?</div>`; return;
  }
  fillSelect('f-site', [...new Set(EXECS.map(e => e.site_nom).filter(Boolean))].sort());
  fillSelect('f-agent', [...new Set(EXECS.map(e => e.agent_nom).filter(Boolean))].sort());
  renderList();
}
function fillSelect(id, vals){
  const sel = document.getElementById(id), keep = sel.value;
  sel.innerHTML = '<option value="">Tous</option>' + vals.map(v => `<option>${esc(v)}</option>`).join('');
  if(vals.includes(keep)) sel.value = keep;
}
function filtered(){
  const s = document.getElementById('f-site').value, a = document.getElementById('f-agent').value, st = document.getElementById('f-stat').value;
  return EXECS.filter(e => (!s || e.site_nom === s) && (!a || e.agent_nom === a) && (!st || statusOf(e).k === st));
}
function scansOf(e){ return SCANS.filter(s => s.execution_id === e.id).sort((a,b) => (a.rang||0) - (b.rang||0)); }
function photosOfScan(id){ return PHOTOS.filter(p => p.scan_id === id); }
function rapportsOfExec(e){ return arr(e.rapport_ids).concat(...scansOf(e).map(s => arr(s.rapport_ids))).filter(id => RAPPORTS.has(String(id))); }

function renderList(){
  const list = filtered();
  const done = list.filter(e => e.statut !== 'en_cours');
  const complete = done.filter(e => !arr(e.manquants).length).length;
  const missed = done.reduce((n,e) => n + arr(e.manquants).length, 0);
  const supp = list.reduce((n,e) => n + scansOf(e).filter(s => s.hors_ronde).length, 0);
  document.getElementById('kpis').innerHTML =
    `<div class="kpi"><b>${list.length}</b><span>Rondes</span></div>
     <div class="kpi"><b>${done.length ? Math.round(complete*100/done.length) + ' %' : '—'}</b><span>Rondes complètes</span></div>
     <div class="kpi"><b>${missed}</b><span>Points manqués</span></div>
     <div class="kpi"><b>${supp}</b><span>Points supplémentaires</span></div>`;
  const box = document.getElementById('l-table');
  if(!list.length){ box.innerHTML = '<div class="state-msg">Aucune ronde sur cette période.</div>'; return; }
  box.innerHTML = `<table class="list"><thead><tr><th>Date</th><th>Heures</th><th>Site</th><th>Ronde</th><th>Agent</th><th>Points</th><th>Manqués / motif</th><th>Ordre</th><th>Photos</th><th>Rapports</th><th>Statut</th></tr></thead><tbody>` +
    list.map(e => {
      const sc = scansOf(e), st = statusOf(e);
      const planned = sc.filter(s => !s.hors_ronde).length, sup = sc.filter(s => s.hors_ronde).length;
      const nPh = PHOTOS.filter(p => p.execution_id === e.id && p.type === 'agent').length;
      const nRap = rapportsOfExec(e).length;
      const man = arr(e.manquants);
      return `<tr onclick="openDetail('${esc(e.id)}')">
        <td>${dmy(e.debut_at)}</td>
        <td>${hm(e.debut_at)} → ${e.fin_at ? hm(e.fin_at) : '…'}<div class="muted">${dur(e.debut_at, e.fin_at)}</div></td>
        <td>${esc(e.site_nom)}</td><td>${esc(e.ronde_nom)}</td><td>${esc(e.agent_nom)}</td>
        <td><b>${planned}/${e.nb_prevus ?? arr(e.points_prevus).length}</b>${sup ? `<div class="muted">+${sup} suppl.</div>` : ''}</td>
        <td>${man.length ? `<span class="tag t-bad">${man.length} manqué${man.length>1?'s':''}</span><div class="muted">${esc(e.motif||'')}${e.motif_precision ? ' — ' + esc(e.motif_precision) : ''}</div>` : (e.statut === 'en_cours' ? '<span class="muted">—</span>' : '<span class="tag t-ok">Aucun</span>')}</td>
        <td>${e.ordre_respecte === false ? '<span class="tag t-warn">Différent</span>' : e.ordre_respecte ? '<span class="tag t-ok">Respecté</span>' : '<span class="muted">—</span>'}</td>
        <td>${nPh || '<span class="muted">—</span>'}</td>
        <td>${nRap ? '📝 ' + nRap : '<span class="muted">—</span>'}</td>
        <td>${st.html}</td></tr>`;
    }).join('') + '</tbody></table>';
}

/* ───────────── Détail ───────────── */
function thumbsHtml(list){
  if(!list.length) return '';
  return `<div class="thumbs">${list.map(p => p.url
    ? `<figure><img src="${esc(p.url)}" alt="" onclick="zoom('${esc(p.url)}')"><figcaption>${p.type === 'auto' ? '📸 Image du scan' : '📷 Photo agent'}</figcaption></figure>`
    : `<figure><div class="wait">⏳ ${p.type === 'auto' ? 'Image du scan' : 'Photo'}<br>en attente d'envoi<br>(WiFi)</div></figure>`).join('')}</div>`;
}
function rapHtml(ids){
  return arr(ids).map(id => {
    const r = RAPPORTS.get(String(id));
    return r ? `<div class="rap">📝 <b>Rapport main courante</b> · ${r.date_rapport ? dmy(r.date_rapport + 'T12:00:00') : ''} ${esc(r.heure_rapport||'')}<br>${esc(r.situation||'')}${r.actions ? '<br><i>Actions : ' + esc(r.actions) + '</i>' : ''}</div>`
             : `<div class="muted" style="margin-top:6px">📝 Rapport ouvert depuis ce point mais pas (encore) clôturé par l'agent.</div>`;
  }).join('');
}
function scanBlock(s, idx, kind){
  const ph = photosOfScan(s.id).sort((a,b) => (a.type === 'auto' ? -1 : 1) - (b.type === 'auto' ? -1 : 1));
  return `<div class="pt ${kind}"><div class="n">${kind === 'supp' ? '+' : idx}</div><div>
    <div class="h"><span class="nm">${esc(s.pointeau_nom)}</span><span class="tag ${kind === 'supp' ? 't-run' : 't-ok'}">${kind === 'supp' ? 'Point supplémentaire · ' : ''}Pointé à ${hm(s.scanned_at)}</span><span class="muted">${s.rang}${s.rang === 1 ? 'er' : 'e'} point scanné</span></div>
    ${thumbsHtml(ph)}
    ${s.commentaire ? `<div class="cmt">💬 ${esc(s.commentaire)}</div>` : ''}
    ${rapHtml(s.rapport_ids)}
  </div></div>`;
}
function openDetail(id){
  cur = EXECS.find(e => e.id === id); if(!cur) return;
  const e = cur, sc = scansOf(e), st = statusOf(e);
  const byPt = new Map(sc.filter(s => !s.hors_ronde).map(s => [String(s.pointeau_id), s]));
  const man = new Set(arr(e.manquants).map(m => String(m.id)));
  const planned = arr(e.points_prevus).map((p,i) => {
    const s = byPt.get(String(p.id));
    if(s) return scanBlock(s, i+1, 'ok');
    return `<div class="pt ${man.has(String(p.id)) ? 'miss' : ''}"><div class="n">${i+1}</div><div><div class="h"><span class="nm">${esc(p.nom)}</span>
      ${man.has(String(p.id)) ? '<span class="tag t-bad">Non pointé</span>' : '<span class="tag t-grey">Pas encore pointé</span>'}</div></div></div>`;
  }).join('');
  const supp = sc.filter(s => s.hors_ronde);
  document.getElementById('d-body').innerHTML = `
    <div class="card"><h3>🔁 ${esc(e.ronde_nom)} — ${esc(e.site_nom)}</h3>
      <div class="dgrid">
        <div><div class="k">Agent</div><div class="v">${esc(e.agent_nom)}</div></div>
        <div><div class="k">Date</div><div class="v">${dmy(e.debut_at)}</div></div>
        <div><div class="k">Début → fin</div><div class="v">${hm(e.debut_at)} → ${e.fin_at ? hm(e.fin_at) : 'en cours'}</div></div>
        <div><div class="k">Durée</div><div class="v">${dur(e.debut_at, e.fin_at)}</div></div>
        <div><div class="k">Points pointés</div><div class="v">${byPt.size} / ${arr(e.points_prevus).length}${supp.length ? ' (+' + supp.length + ' suppl.)' : ''}</div></div>
        <div><div class="k">Ordre de passage</div><div class="v">${e.ordre_respecte === false ? '⚠ Différent de l\'ordre prévu' : e.ordre_respecte ? 'Respecté' : '—'}</div></div>
        <div><div class="k">Statut</div><div class="v">${st.html}</div></div>
      </div>
      ${arr(e.manquants).length ? `<div class="motif"><b>${arr(e.manquants).length} point(s) non pointé(s)</b> — Motif : <b>${esc(e.motif||'—')}</b>${e.motif_precision ? '<br>' + esc(e.motif_precision) : ''}</div>` : ''}
    </div>
    <div class="card"><h3>Points de la ronde (ordre prévu)</h3>${planned || '<div class="muted">Aucun point.</div>'}</div>
    ${supp.length ? `<div class="card"><h3>Points supplémentaires</h3>${supp.map(s => scanBlock(s, 0, 'supp')).join('')}</div>` : ''}
    ${arr(e.rapport_ids).length ? `<div class="card"><h3>Rapports sur le site pendant la ronde</h3>${rapHtml(e.rapport_ids)}</div>` : ''}`;
  document.getElementById('v-list').classList.add('hidden');
  document.getElementById('v-detail').classList.remove('hidden');
  window.scrollTo(0,0);
}
function backToList(){ document.getElementById('v-detail').classList.add('hidden'); document.getElementById('v-list').classList.remove('hidden'); }
function zoom(url){ document.getElementById('lb-img').src = url; document.getElementById('lightbox').classList.remove('hidden'); }

/* ───────────── Rapport imprimable ───────────── */
function openReport(){
  const e = cur; if(!e) return;
  const sc = scansOf(e), st = statusOf(e);
  const byPt = new Map(sc.filter(s => !s.hors_ronde).map(s => [String(s.pointeau_id), s]));
  const rows = arr(e.points_prevus).map((p,i) => ({ n: i+1, nom: p.nom, s: byPt.get(String(p.id)) || null }))
    .concat(sc.filter(s => s.hors_ronde).map(s => ({ n:'+', nom: s.pointeau_nom, s, supp:true })));
  const phs = s => s ? photosOfScan(s.id).filter(p => p.url).map(p => `<img src="${esc(p.url)}" alt="">`).join('') : '';
  const raps = rapportsOfExec(e).map(id => RAPPORTS.get(String(id)));
  document.getElementById('report').innerHTML = `<div class="rpt">
    <div class="rpt-head"><div><div class="rpt-kind">Rapport de ronde</div><div class="rpt-title">${esc(e.ronde_nom)}</div><div class="rpt-site">${esc(e.site_nom)}</div></div>
      <div class="rpt-logo"><img src="${LOGO}" alt="RDZ"></div></div>
    <div class="rpt-meta">
      <div><div class="k">Date</div><div class="v">${dmy(e.debut_at)}</div></div>
      <div><div class="k">Heure</div><div class="v">${hm(e.debut_at)} → ${e.fin_at ? hm(e.fin_at) : '…'}</div></div>
      <div><div class="k">Agent</div><div class="v">${esc(e.agent_nom)}</div></div>
      <div><div class="k">Statut</div><div class="v"><span class="rpt-badge" style="background:${st.color}">${st.label}</span></div></div>
    </div>
    <div class="rpt-body">
      <div class="rpt-sec"><div class="rpt-sec-t">Synthèse</div><div class="rpt-sec-b"><div class="rpt-fields">
        <div class="rpt-f"><div class="k">Points pointés</div><div class="v">${byPt.size} / ${arr(e.points_prevus).length}</div></div>
        <div class="rpt-f"><div class="k">Points supplémentaires</div><div class="v">${sc.filter(s => s.hors_ronde).length}</div></div>
        <div class="rpt-f"><div class="k">Durée</div><div class="v">${dur(e.debut_at, e.fin_at)}</div></div>
        <div class="rpt-f"><div class="k">Ordre de passage</div><div class="v">${e.ordre_respecte === false ? 'Différent de l\'ordre prévu' : e.ordre_respecte ? 'Respecté' : '—'}</div></div>
        <div class="rpt-f"><div class="k">Points non pointés</div><div class="v">${arr(e.manquants).map(m => esc(m.nom)).join(', ') || 'Aucun'}</div></div>
        <div class="rpt-f"><div class="k">Motif</div><div class="v">${esc(e.motif || '—')}${e.motif_precision ? ' — ' + esc(e.motif_precision) : ''}</div></div>
      </div></div></div>
      <div class="rpt-sec"><div class="rpt-sec-t">Détail des points</div><div class="rpt-sec-b">
        <table class="rpt-tbl"><thead><tr><th>N°</th><th>Point</th><th>Heure</th><th>Commentaire</th><th>Images</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${r.n}</td><td><b>${esc(r.nom)}</b>${r.supp ? '<br><span style="color:#1d4ed8;font-size:10.5px">Point supplémentaire</span>' : ''}</td>
          <td>${r.s ? hm(r.s.scanned_at) : '<b style="color:#C8102E">Non pointé</b>'}</td><td>${r.s ? esc(r.s.commentaire||'') : ''}</td><td><div class="rpt-ph">${phs(r.s)}</div></td></tr>`).join('')}
        </tbody></table></div></div>
      ${raps.length ? `<div class="rpt-sec"><div class="rpt-sec-t">Rapports main courante liés</div><div class="rpt-sec-b">${raps.map(r => `<div style="margin-bottom:8px;font-size:12.5px"><b>${esc(r.heure_rapport||'')}</b> — ${esc(r.situation||'')}${r.actions ? '<br><i>Actions : ' + esc(r.actions) + '</i>' : ''}</div>`).join('')}</div></div>` : ''}
    </div>
    <div class="rpt-foot"><div style="display:flex;gap:12px;align-items:center"><img src="${LOGO}" alt="RDZ"><div>RDZ Security Management SA<br>Document généré automatiquement — usage interne et client.</div></div>
      <div style="text-align:right">Réf. RONDE-${esc(String(e.id).toUpperCase())}<br>Édité le ${dmy(new Date().toISOString())} à ${hm(new Date().toISOString())}</div></div>
  </div>`;
  document.getElementById('report-wrap').classList.remove('hidden');
}
function closeReport(){ document.getElementById('report-wrap').classList.add('hidden'); }

load();
</script>
</body>
</html>
