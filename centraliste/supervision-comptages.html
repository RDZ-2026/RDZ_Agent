<!-- RDZ · supervision-comptages · v1 · 2026-10-05
     Relecture GÉNÉRIQUE de tous les modules de comptage (centraliste/).
     Boucle de remontée : comptage-agent.html → comptage_releves → ICI.
     Aucun code propre à un module : les colonnes, tuiles, courbes et
     répartitions sont construites à partir de comptage_champs (config faite
     dans comptage-config.html). Un nouveau module ou un nouveau compteur
     apparaît donc ici automatiquement, sans développement.

     - Filtres : module, site, période (jour / 7 j / 30 j / mois / dates libres)
     - Tableau de bord : total par compteur, évolution, répartition des listes
     - Liste des relevés : détail, correction, suppression, rapport individuel
     - Rapport de synthèse imprimable, charte « RDZ Reports » (même en-tête,
       logo et pied de page que supervision-journal.html — RPTO_LOGO_B64)
     - Export Excel (SheetJS) : onglets Synthèse par jour + Relevés

     Règle d'agrégation : chaque relevé porte les quantités comptées pendant
     ce relevé → on ADDITIONNE les relevés (par jour, semaine ou mois selon
     la longueur de la période, pour rester lisible). -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDZ — Supervision des comptages</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --red:#8B1A1A; --red-dark:#6B1212; --report-red:#C8102E;
  --ink:#1a1a1a; --paper:#ffffff;
  --line:#d0d0d0; --line-soft:#e0e0e0;
  --bg-meta:#f0f0f0; --bg-soft:#f7f7f7;
  --ok:#1b7a3d; --warn:#b8860b; --danger:#8B1A1A;
  --radius-ui:2px; --radius-card:10px; --radius-section:8px;
  --font:Arial, Helvetica, sans-serif;
  --ink-2:#52514e; --ink-3:#8a8986;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg-soft);color:var(--ink);-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--red);color:#fff;padding:12px 18px;border-bottom:4px solid var(--red-dark)}
header .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
header .brand{font-weight:bold;letter-spacing:.5px;font-size:14px}
header .sub{font-size:12px;opacity:.9;margin-top:2px}
header a.home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.8);padding:6px 10px;border-radius:var(--radius-ui);white-space:nowrap;font-weight:bold}
main{flex:1;padding:18px}
.hidden{display:none!important}
.state-msg{text-align:center;color:#999;font-size:14px;padding:30px 10px}
.err{background:#fdecea;border:1px solid #f5b5ae;color:#8B1A1A;border-radius:var(--radius-ui);padding:10px 12px;font-size:13px;margin-bottom:12px}

/* Filtres */
.filters{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius-ui);padding:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:150px}
.f label{font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.4px;color:#777}
.f select,.f input{font-family:var(--font);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-ui);background:#fff;color:var(--ink)}
.f.grow{flex:1}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:var(--radius-ui);padding:8px 11px;font-size:12.5px;font-weight:bold;cursor:pointer;color:#555;font-family:var(--font)}
.pill.on{background:var(--red);color:#fff;border-color:var(--red)}
.actions-row{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{background:var(--red);color:#fff;border:1px solid var(--red-dark);border-radius:var(--radius-ui);padding:9px 14px;font-size:13px;font-weight:bold;cursor:pointer;font-family:var(--font);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn-sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-ok{background:var(--ok);border-color:#145c2e}

/* Tableau de bord */
.period-line{font-size:13px;color:var(--ink-2);margin:-4px 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius-ui);padding:14px 14px 12px;position:relative}
.tile .k{font-size:11.5px;font-weight:bold;color:var(--ink-2);text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.tile .sw{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.tile .v{font-size:30px;font-weight:900;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.tile.neutral .v{color:var(--ink-2)}
.card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius-ui);padding:14px 16px;margin-bottom:16px}
.card h3{font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.4px;color:var(--ink);margin-bottom:10px}
.card .hint{font-size:12px;color:var(--ink-3);margin:-6px 0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

/* Graphique */
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);border-radius:var(--radius-ui);padding:8px 10px;font-size:12px;min-width:150px;z-index:5;display:none}
.tip .h{font-weight:bold;margin-bottom:5px;color:var(--ink)}
.tip .r{display:flex;align-items:center;gap:6px;color:var(--ink-2);padding:1px 0}
.tip .r b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.tip .r i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* Répartition (barres horizontales) */
.dist-row{display:grid;grid-template-columns:minmax(80px,32%) 1fr 70px;align-items:center;gap:10px;font-size:13px;padding:4px 0}
.dist-row .lb{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist-row .bar{height:14px;background:var(--bg-meta);border-radius:2px;overflow:hidden}
.dist-row .bar span{display:block;height:100%;border-radius:0 4px 4px 0}
.dist-row .n{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* Tableau des relevés */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:#777;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
.tbl td{padding:8px;border-bottom:1px solid var(--bg-meta);white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.note{white-space:normal;min-width:160px;color:var(--ink-2)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#fbf6f6}
.tbl tfoot td{font-weight:bold;border-top:2px solid var(--line);background:var(--bg-soft)}

/* Modale détail */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;overflow-y:auto;padding:40px 14px}
.overlay.open{display:block}
.modal{background:#fff;max-width:560px;margin:0 auto;border-top:3px solid var(--red);border-radius:var(--radius-ui);padding:20px}
.modal h2{font-size:15px;color:var(--red);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.modal .meta{font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
.efield{margin-bottom:11px}
.efield label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:#888;font-weight:bold;margin-bottom:5px}
.efield input,.efield select,.efield textarea{width:100%;font-family:var(--font);font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--radius-ui);padding:9px 10px}
.efield textarea{min-height:64px;resize:vertical}
.mphoto img{max-width:100%;max-height:260px;border-radius:var(--radius-section);border:1px solid var(--line-soft);display:block}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line-soft)}
.mfoot .sp{flex:1}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:11px 18px;border-radius:var(--radius-ui);font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300}
.toast.show{opacity:1}.toast.err{background:var(--danger)}

/* Rapport imprimable — en pop-up plein écran (comme supervision-journal.html) */
.report-view{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;overflow-y:auto;padding:24px 16px}
.report-view.open{display:block}
.report-view .report-inner{max-width:820px;margin:0 auto}
.report-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.rp-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.rp-tbl th{background:#f0f0f0;color:#555;text-transform:uppercase;font-size:9.5px;letter-spacing:1px;padding:6px;text-align:left;border-bottom:1px solid #d0d0d0}
.rp-tbl td{padding:6px;border-bottom:1px solid #eee;color:#1a1a1a;white-space:nowrap}
.rp-tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.rp-tbl tfoot td{font-weight:700;background:#f7f7f7;border-top:1.5px solid #d0d0d0}
.rp-avoid{break-inside:avoid;page-break-inside:avoid}
@media print{
  body > *:not(.report-view){display:none!important}
  .report-view{display:block!important;position:static!important;background:none!important;overflow:visible!important;margin:0;max-width:100%;padding:0}
  .report-view .report-inner{max-width:100%!important;margin:0!important}
  .report-toolbar{display:none!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  @page{margin:12mm;size:A4}
}
@media (max-width:640px){
  main{padding:12px}
  .actions-row{margin-left:0;width:100%}
  .actions-row .btn{flex:1}
}

/* ═══════════════════════════════════════════════════════════════
   RDZ DESIGN SYSTEM 2026 · Supervision / Exploitation
   Couche de présentation écran uniquement — aucun fonctionnel.
   ═══════════════════════════════════════════════════════════════ */
@media screen {
  :root{
    --red:#e3062c;--red-dark:#bd0825;--report-red:#e3062c;
    --navy:#142130;--navy-2:#223241;--navy-3:#304457;
    --ink:#102033;--ink-2:#52657d;--ink-3:#7d8ca0;
    --paper:#fff;--line:#d9e2eb;--line-soft:#e9eef3;
    --bg-meta:#eef3f7;--bg-soft:#f4f7fa;
    --ok:#198754;--warn:#b7791f;--danger:#c62828;
    --radius-ui:10px;--radius-card:16px;--radius-section:14px;
    --font:Inter,"Segoe UI",Arial,Helvetica,sans-serif;
  }
  html{background:#e8eef3}
  body{background:#e8eef3;color:var(--ink)}
  .wrap{
    max-width:1240px;background:linear-gradient(180deg,#f8fafc 0,#f2f6f9 100%);
    box-shadow:0 0 50px rgba(20,33,48,.09)
  }
  header{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    padding:14px 22px;border-bottom:4px solid var(--red);
    box-shadow:0 5px 18px rgba(15,28,42,.16)
  }
  header .top{min-height:48px}
  header .brand{font-size:15px;font-weight:800;letter-spacing:.055em;color:#fff}
  header .sub{font-size:12px;color:#c8d2dc;opacity:1;margin-top:4px;font-weight:500}
  header a.home{
    min-height:38px;display:inline-flex;align-items:center;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
    border-radius:10px;padding:8px 12px;font-size:12px;color:#fff;
    transition:background .15s ease,border-color .15s ease,transform .15s ease
  }
  header a.home:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28)}
  header a.home:active{transform:translateY(1px)}
  main{padding:22px 24px 30px}

  .filters{
    border:1px solid var(--line);border-radius:var(--radius-card);padding:17px 18px;
    gap:13px;background:rgba(255,255,255,.98);
    box-shadow:0 7px 22px rgba(34,50,65,.07);margin-bottom:18px
  }
  .f{gap:6px}
  .f label,.efield label{
    font-size:10.5px;color:#6d7e93;letter-spacing:.055em;font-weight:800
  }
  .f select,.f input,.efield input,.efield select,.efield textarea{
    min-height:40px;border:1px solid #ccd7e2;border-radius:9px;background:#fff;
    color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease
  }
  .f select:hover,.f input:hover,.efield input:hover,.efield select:hover,.efield textarea:hover{border-color:#aebdcb}
  .f select:focus,.f input:focus,.efield input:focus,.efield select:focus,.efield textarea:focus{
    outline:none;border-color:#71869c;box-shadow:0 0 0 3px rgba(48,68,87,.10)
  }
  .pills{gap:6px}
  .pill{
    min-height:40px;border:1px solid #ccd7e2;border-radius:9px;padding:8px 12px;
    color:#42556c;background:#f9fbfc;transition:all .15s ease
  }
  .pill:hover{border-color:#9fb0c0;background:#f3f6f9}
  .pill.on{background:var(--navy-2);border-color:var(--navy-2);color:#fff;box-shadow:0 3px 8px rgba(34,50,65,.16)}
  .btn{
    min-height:40px;border:1px solid var(--red);border-radius:9px;padding:9px 14px;
    background:var(--red);box-shadow:0 3px 8px rgba(227,6,44,.12);
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease
  }
  .btn:hover{background:var(--red-dark);border-color:var(--red-dark);box-shadow:0 5px 12px rgba(227,6,44,.18)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible,.pill:focus-visible,header a.home:focus-visible{
    outline:3px solid rgba(227,6,44,.22);outline-offset:2px
  }
  .btn:disabled{opacity:.45;box-shadow:none}
  .btn-sec{background:#fff;color:#26384b;border-color:#cbd6e1;box-shadow:none}
  .btn-sec:hover{background:#f3f6f9;color:#17283a;border-color:#aebdcb;box-shadow:none}
  .btn-ok{background:var(--ok);border-color:var(--ok);box-shadow:none}
  .btn-ok:hover{background:#146c43;border-color:#146c43}
  .period-line{color:var(--ink-2);margin:-2px 2px 15px;font-size:12.5px;font-weight:600}

  .tiles{gap:12px;margin-bottom:18px}
  .tile{
    border:1px solid var(--line);border-radius:var(--radius-section);padding:16px 16px 14px;
    box-shadow:0 5px 16px rgba(34,50,65,.055);overflow:hidden
  }
  .tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
  .tile .k{font-size:10.5px;color:#61738a;letter-spacing:.055em}
  .tile .sw{border-radius:50%}
  .tile .v{font-size:31px;color:#122236;letter-spacing:-.035em;margin-top:7px}
  .tile .s{color:#8290a2}
  .tile.neutral:before{background:#8b99a9}

  .card{
    border:1px solid var(--line);border-radius:var(--radius-card);padding:17px 18px;
    box-shadow:0 6px 20px rgba(34,50,65,.055);margin-bottom:18px
  }
  .card h3{
    font-size:12px;color:#23364a;letter-spacing:.055em;margin-bottom:12px;
    display:flex;align-items:center;gap:10px
  }
  .card h3:after{content:"";height:1px;background:#e2e8ef;flex:1}

  .grid2{gap:18px}
  .legend span{color:#5f7085}
  .tip{border-color:#d5dee7;border-radius:9px;box-shadow:0 8px 24px rgba(20,33,48,.14)}
  .dist-row .bar{height:12px;background:#edf2f6;border-radius:20px}
  .dist-row .bar span{border-radius:20px}
  .dist-row .n{color:#607188;font-weight:700}

  .tbl-wrap{border:1px solid var(--line);border-radius:11px;overflow:auto}
  table.tbl{font-size:12.5px}
  .tbl th{
    padding:10px 11px;color:#53667d;background:#f1f5f8;border-bottom:1px solid #d7e0e8;
    font-size:10px;letter-spacing:.055em;top:0
  }
  .tbl td{padding:10px 11px;border-bottom:1px solid #e8edf2}
  .tbl tbody tr{transition:background .12s ease}
  .tbl tbody tr:hover{background:#f7f9fb}
  .tbl tfoot td{background:#f2f6f9;border-top:1px solid #cfd9e2;color:#203348}

  .overlay{background:rgba(12,24,36,.62);backdrop-filter:blur(3px);padding:32px 14px}
  .modal{
    max-width:600px;border:1px solid rgba(255,255,255,.55);border-top:4px solid var(--red);
    border-radius:16px;padding:22px;box-shadow:0 22px 60px rgba(8,18,29,.26)
  }
  .modal h2{font-size:16px;color:#17283a;letter-spacing:.02em;text-transform:none}
  .modal .meta{color:#718196;margin-top:3px}
  .mphoto img{border-radius:12px;border-color:#dbe3eb}
  .mfoot{border-top-color:#e3e9ef;padding-top:14px}

  .toast{
    background:var(--navy);border-radius:10px;box-shadow:0 8px 24px rgba(15,28,42,.22);
    font-size:13px
  }
  .toast.err{background:var(--danger)}

  .report-view{background:rgba(12,24,36,.68);backdrop-filter:blur(3px)}
  .report-toolbar{
    position:sticky;top:10px;z-index:2;background:rgba(20,33,48,.96);
    border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:9px;
    box-shadow:0 8px 24px rgba(8,18,29,.2)
  }
  .report-toolbar .btn-sec{background:#fff}

  .state-msg{color:#7d8ca0}
  .err{background:#fff2f2;border:1px solid #f1c4c7;color:#a71920;border-radius:10px}

  @media (max-width:760px){
    header{padding:12px 14px}
    header .brand{font-size:12.5px}
    header .sub{font-size:11px}
    header a.home{padding:7px 9px}
    main{padding:14px 12px 22px}
    .filters{padding:14px;border-radius:13px}
    .f,.f.grow{width:100%;min-width:0}
    .pills{width:100%}
    .pill{flex:1 1 calc(33.333% - 6px);padding:8px 7px}
    .actions-row{gap:7px}
    .actions-row .btn{flex:1 1 160px}
    .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
    .tile{padding:14px 13px}
    .tile .v{font-size:27px}
    .grid2{grid-template-columns:1fr}
    .card{padding:14px}
    .dist-row{grid-template-columns:minmax(70px,35%) 1fr 58px;gap:7px}
    .overlay{padding:18px 10px}
    .modal{padding:17px;border-radius:14px}
  }
  @media (max-width:420px){
    .tiles{grid-template-columns:1fr}
    .pill{flex-basis:calc(50% - 6px)}
    header .brand{letter-spacing:.02em}
  }
}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <div class="brand">RDZ SECURITY MANAGEMENT SA</div>
        <div class="sub">Supervision — Comptages</div>
      </div>
      <a class="home" href="../index.html">← Accueil</a>
    </div>
  </header>

  <main>
    <div id="global-err"></div>

    <div class="filters">
      <div class="f"><label>Module de comptage</label><select id="flt-type" onchange="onTypeChange()"></select></div>
      <div class="f"><label>Site</label><select id="flt-site" onchange="render()"><option value="">Tous les sites</option></select></div>
      <div class="f grow">
        <label>Période</label>
        <div class="pills" id="period-pills">
          <button class="pill" data-p="today" onclick="setPeriod('today')">Aujourd'hui</button>
          <button class="pill" data-p="7" onclick="setPeriod('7')">7 jours</button>
          <button class="pill" data-p="30" onclick="setPeriod('30')">30 jours</button>
          <button class="pill" data-p="month" onclick="setPeriod('month')">Ce mois</button>
          <button class="pill" data-p="prevmonth" onclick="setPeriod('prevmonth')">Mois dernier</button>
          <button class="pill" data-p="custom" onclick="setPeriod('custom')">Dates…</button>
        </div>
      </div>
      <div class="f hidden" id="custom-dates" style="flex-direction:row;gap:8px;min-width:0">
        <div class="f" style="min-width:0"><label>Du</label><input type="date" id="flt-from" onchange="loadReleves()"></div>
        <div class="f" style="min-width:0"><label>Au</label><input type="date" id="flt-to" onchange="loadReleves()"></div>
      </div>
      <div class="actions-row">

// Couleurs des séries : palette catégorielle validée (ordre fixe), attribuée
// selon la POSITION du compteur dans la config — jamais selon son classement,
// pour qu'un compteur garde toujours la même couleur quels que soient les filtres.
const SERIES = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
const MAX_SERIES = 8;

/* ---------- Utilitaires ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',2600); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function daysBetween(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); }
const JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function fmtDate(s){ if(!s) return '—'; const d=parseYmd(s); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
function fmtDateShort(s){ const d=parseYmd(s); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0'); }
function fmtDateLong(s){ const d=parseYmd(s); return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]+' '+d.getFullYear(); }
function hm(t){ return t ? String(t).slice(0,5) : '—'; }
function fmtN(n){ return Number(n||0).toLocaleString('fr-CH'); }
function isoWeekStart(s){ const d=parseYmd(s); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return ymd(d); }

/* ---------- État ---------- */
let types = [];            // comptage_types
let champsByType = {};     // type_id -> comptage_champs (tous, y compris masqués)
let releves = [];          // comptage_releves du module + période
let period = { key:'7', from:'', to:'' };
let view = null;           // résultat de compute(), réutilisé par rapport/Excel

/* ---------- Chargement ---------- */
async function init(){
  setPeriod('7', true);
  try{
    const [{data:t,error:e1},{data:c,error:e2}] = await Promise.all([
      sb.from('comptage_types').select('*').order('ordre'),
      sb.from('comptage_champs').select('*').order('ordre')
    ]);
    if(e1) throw e1; if(e2) throw e2;
    types = t||[];
    champsByType = {};
    (c||[]).forEach(x=>{ (champsByType[x.comptage_type_id]=champsByType[x.comptage_type_id]||[]).push(x); });
  }catch(e){
    document.getElementById('dash').innerHTML = '<div class="err">Impossible de charger les modules de comptage (réseau, ou migration-comptage.sql pas encore exécutée ?).</div>';
    return;
  }
  const sel = document.getElementById('flt-type');
  if(!types.length){
    sel.innerHTML = '<option value="">—</option>';
    document.getElementById('dash').innerHTML = '<div class="state-msg">Aucun module de comptage n\'a encore été créé. Crée-le dans <b>Paramétrage — Modules de comptage</b>.</div>';
    return;
  }
  sel.innerHTML = types.map(t=>`<option value="${t.id}">${esc((t.icone?t.icone+' ':'')+t.nom)}${t.actif?'':' (inactif)'}</option>`).join('');
  const urlType = new URLSearchParams(location.search).get('type');
  const pre = urlType && types.find(t=>t.slug===urlType || t.id===urlType);
  if(pre) sel.value = pre.id;
  await loadReleves();
}
function currentType(){ return types.find(t=>t.id===document.getElementById('flt-type').value) || null; }
function onTypeChange(){ document.getElementById('flt-site').value=''; loadReleves(); }

function setPeriod(key, silent){
  period.key = key;
  document.querySelectorAll('#period-pills .pill').forEach(p=>p.classList.toggle('on', p.dataset.p===key));
  const today = ymd(new Date());
  document.getElementById('custom-dates').classList.toggle('hidden', key!=='custom');
  if(key==='today'){ period.from=today; period.to=today; }
  else if(key==='7'){ period.from=addDays(today,-6); period.to=today; }
  else if(key==='30'){ period.from=addDays(today,-29); period.to=today; }
  else if(key==='month'){ const d=new Date(); period.from=ymd(new Date(d.getFullYear(),d.getMonth(),1)); period.to=today; }
  else if(key==='prevmonth'){ const d=new Date(); period.from=ymd(new Date(d.getFullYear(),d.getMonth()-1,1)); period.to=ymd(new Date(d.getFullYear(),d.getMonth(),0)); }
  else if(key==='custom'){
    const f=document.getElementById('flt-from'), t=document.getElementById('flt-to');
    if(!f.value) f.value = period.from || addDays(today,-6);
    if(!t.value) t.value = period.to || today;
    return silent ? null : loadReleves();
  }
  if(!silent) loadReleves();
}

async function loadReleves(){
  const t = currentType(); if(!t) return;
  if(period.key==='custom'){
    period.from = document.getElementById('flt-from').value;
    period.to = document.getElementById('flt-to').value;
    if(!period.from || !period.to) return;
    if(period.from>period.to){ const x=period.from; period.from=period.to; period.to=x; }
  }
  document.getElementById('dash').innerHTML = '<div class="state-msg">Chargement…</div>';
  try{
    const { data, error } = await sb.from('comptage_releves').select('*')
      .eq('comptage_type_id', t.id).gte('date_releve', period.from).lte('date_releve', period.to)
      .order('date_releve',{ascending:false}).order('heure_releve',{ascending:false}).limit(5000);
    if(error) throw error;
    releves = data||[];
  }catch(e){
    releves = [];
    document.getElementById('dash').innerHTML = '<div class="err">Impossible de charger les relevés : '+esc(e.message)+'</div>';
    return;
  }
  // Liste des sites présents (on garde le choix courant s'il existe encore)
  const siteSel = document.getElementById('flt-site');
  const cur = siteSel.value;
  const sites = [...new Set(releves.map(r=>r.site_nom).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
  siteSel.innerHTML = '<option value="">Tous les sites</option>' + sites.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  if(sites.includes(cur)) siteSel.value = cur;
  render();
}

/* ---------- Colonnes du module : config + anciens champs encore présents dans les relevés ---------- */
function columnsFor(typeId, rows){
  const cfg = (champsByType[typeId]||[]).slice().sort((a,b)=>(a.ordre||0)-(b.ordre||0));
  const cols = cfg.map(c=>({ id:c.id, libelle:c.libelle, type:c.type, options:c.options||[], actif:c.actif }));
  const known = new Set(cols.map(c=>c.id));
  rows.forEach(r=>(r.valeurs||[]).forEach(v=>{
    if(v && v.champ_id && !known.has(v.champ_id)){ known.add(v.champ_id); cols.push({ id:v.champ_id, libelle:v.libelle+' (supprimé)', type:v.type, options:[], actif:false, orphan:true }); }
  }));
  // Un champ masqué/supprimé n'apparaît que s'il a des valeurs sur la période
  const hasVal = id => rows.some(r=>(r.valeurs||[]).some(v=>v.champ_id===id && v.valeur!=null && v.valeur!=='' && v.valeur!==0));
  return cols.filter(c=>c.actif || hasVal(c.id));
}
function valOf(r, id){ const v=(r.valeurs||[]).find(x=>x.champ_id===id); return v ? v.valeur : null; }

/* ---------- Calculs ---------- */
function compute(){
  const t = currentType();
  const site = document.getElementById('flt-site').value;
  const rows = releves.filter(r=>!site || r.site_nom===site);
  const cols = columnsFor(t.id, rows);
  const counters = cols.filter(c=>c.type==='compteur');
  const lists = cols.filter(c=>c.type==='choix');
  counters.forEach((c,i)=>c.color = SERIES[i % MAX_SERIES]);

  const totals = {}; counters.forEach(c=>totals[c.id]=0);
  rows.forEach(r=>counters.forEach(c=>totals[c.id]+= (parseInt(valOf(r,c.id))||0)));

  // Répartition des listes : nb de relevés par choix
  const dists = lists.map(l=>{
    const m = {}; (l.options||[]).forEach(o=>m[o]=0);
    let none = 0;
    rows.forEach(r=>{ const v=valOf(r,l.id); if(v) m[v]=(m[v]||0)+1; else none++; });
    return { col:l, entries:Object.entries(m), none };
  });

  // Granularité de l'évolution
  const span = daysBetween(period.from, period.to) + 1;
  const gran = span===1 ? 'releve' : span<=45 ? 'jour' : span<=200 ? 'semaine' : 'mois';
  const asc = rows.slice().sort((a,b)=>(a.date_releve+(a.heure_releve||'')).localeCompare(b.date_releve+(b.heure_releve||'')));
  let points = [];
  if(gran==='releve'){
    points = asc.map(r=>({ label:hm(r.heure_releve), full:fmtDateLong(r.date_releve)+' · '+hm(r.heure_releve)+(r.agent_nom?' · '+r.agent_nom:''), vals:Object.fromEntries(counters.map(c=>[c.id, parseInt(valOf(r,c.id))||0])), n:1 }));
  } else {
    // Tous les créneaux de la période, même vides (un trou = 0, visible tel quel)
    const keys = [];
    let d = period.from;
    while(d<=period.to){
      const k = gran==='jour' ? d : gran==='semaine' ? isoWeekStart(d) : d.slice(0,7);
      if(!keys.includes(k)) keys.push(k);
      d = addDays(d,1);
    }
    const map = {}; keys.forEach(k=>map[k]={ vals:Object.fromEntries(counters.map(c=>[c.id,0])), n:0 });
    asc.forEach(r=>{
      const k = gran==='jour' ? r.date_releve : gran==='semaine' ? isoWeekStart(r.date_releve) : r.date_releve.slice(0,7);
      if(!map[k]) return;
      map[k].n++;
      counters.forEach(c=>map[k].vals[c.id]+= (parseInt(valOf(r,c.id))||0));
    });
    points = keys.map(k=>({
      label: gran==='jour' ? fmtDateShort(k) : gran==='semaine' ? 'Sem. '+fmtDateShort(k) : MOIS[parseInt(k.slice(5))-1].slice(0,4)+'. '+k.slice(2,4),
      full: gran==='jour' ? fmtDateLong(k) : gran==='semaine' ? 'Semaine du '+fmtDate(k) : MOIS[parseInt(k.slice(5))-1]+' '+k.slice(0,4),
      vals: map[k].vals, n: map[k].n }));
  }

  // Tableau jour par jour (rapport + Excel) — uniquement les jours avec relevés
  const byDay = {};
  asc.forEach(r=>{
    const k=r.date_releve;
    if(!byDay[k]) byDay[k]={ date:k, n:0, vals:Object.fromEntries(counters.map(c=>[c.id,0])) };
    byDay[k].n++;
    counters.forEach(c=>byDay[k].vals[c.id]+= (parseInt(valOf(r,c.id))||0));
  });
  const days = Object.values(byDay).sort((a,b)=>a.date.localeCompare(b.date));

  const agents = [...new Set(rows.map(r=>r.agent_nom).filter(Boolean))];
  const sites = [...new Set(rows.map(r=>r.site_nom).filter(Boolean))];
  return { type:t, site, rows, cols, counters, lists, totals, dists, gran, points, days, agents, sites, span };
}

/* ---------- Rendu écran ---------- */
function periodLabel(){
  return period.from===period.to ? fmtDateLong(period.from) : 'Du '+fmtDate(period.from)+' au '+fmtDate(period.to);
}
function render(){
  const t = currentType(); if(!t) return;
  view = compute();
  const v = view;
  document.getElementById('period-line').innerHTML = `<b>${esc(t.nom)}</b> · ${esc(periodLabel())}${v.site?' · '+esc(v.site):''}`;
  document.getElementById('btn-report').disabled = !v.rows.length;
  document.getElementById('btn-xlsx').disabled = !v.rows.length;
  if(!v.rows.length){
    document.getElementById('dash').innerHTML = '<div class="card"><div class="state-msg">Aucun relevé sur cette période'+(v.site?' pour ce site':'')+'.</div></div>';
    return;
  }
  const GRAN_TXT = { releve:'un point par relevé', jour:'total par jour', semaine:'total par semaine', mois:'total par mois' };
  let html = '<div class="tiles">';
  v.counters.forEach(c=>{
    html += `<div class="tile"><div class="k"><span class="sw" style="background:${c.color}"></span>${esc(c.libelle)}</div><div class="v">${fmtN(v.totals[c.id])}</div><div class="s">${v.days.length>1?'moy. '+fmtN(Math.round(v.totals[c.id]/v.days.length))+' / jour':'total'}</div></div>`;
  });
  html += `<div class="tile neutral"><div class="k">Relevés</div><div class="v">${fmtN(v.rows.length)}</div><div class="s">${v.agents.length} agent(s) · ${v.sites.length} site(s)</div></div>`;
  html += '</div>';

  if(v.counters.length){
    html += `<div class="card"><h3>Évolution</h3><div class="hint">${GRAN_TXT[v.gran]} — survolez le graphique pour le détail</div>${lineChart(v.points, v.counters, true)}</div>`;
  }
  if(v.dists.length){
    html += '<div class="grid2">' + v.dists.map(d=>`<div class="card"><h3>${esc(d.col.libelle)}</h3><div class="hint">nombre de relevés par choix</div>${distHtml(d, v.rows.length)}</div>`).join('') + '</div>';
  }
  html += `<div class="card"><h3>Relevés (${v.rows.length})</h3><div class="hint">Cliquez sur une ligne pour voir le détail, corriger ou imprimer le relevé.</div>${tableHtml(v)}</div>`;
  document.getElementById('dash').innerHTML = html;
  bindChartHover();
}

function distHtml(d, total){
  const max = Math.max(1, ...d.entries.map(e=>e[1]));
  let h = d.entries.map(([lbl,n])=>`<div class="dist-row"><span class="lb" title="${esc(lbl)}">${esc(lbl)}</span><span class="bar"><span style="width:${(n/max*100).toFixed(1)}%;background:${SERIES[0]}"></span></span><span class="n">${n} · ${total?Math.round(n/total*100):0}%</span></div>`).join('');
  if(d.none) h += `<div class="dist-row"><span class="lb" style="color:#999">Non renseigné</span><span class="bar"><span style="width:${(d.none/max*100).toFixed(1)}%;background:#bdbcb8"></span></span><span class="n">${d.none} · ${Math.round(d.none/total*100)}%</span></div>`;
  return h || '<div class="state-msg">Aucune donnée.</div>';
}

function cellVal(r,c){
  const v = valOf(r,c.id);
  if(c.type==='compteur') return fmtN(parseInt(v)||0);
  return v ? esc(v) : '<span style="color:#bbb">—</span>';
}
function tableHtml(v){
  const head = `<tr><th>Date</th><th>Heure</th><th>Site</th><th>Agent</th>${v.cols.map(c=>`<th class="${c.type==='compteur'?'num':''}">${esc(c.libelle)}</th>`).join('')}<th>Note</th><th></th></tr>`;
  const body = v.rows.map((r,i)=>`<tr onclick="openDetail(${i})"><td>${fmtDate(r.date_releve)}</td><td>${hm(r.heure_releve)}</td><td>${esc(r.site_nom||'—')}</td><td>${esc(r.agent_nom||'—')}</td>${v.cols.map(c=>`<td class="${c.type==='compteur'?'num':''}">${cellVal(r,c)}</td>`).join('')}<td class="note">${esc(r.note||'')}</td><td>${r.photo_url?'📷':''}</td></tr>`).join('');
  const foot = `<tr><td colspan="4">Total période</td>${v.cols.map(c=>`<td class="${c.type==='compteur'?'num':''}">${c.type==='compteur'?fmtN(v.totals[c.id]):''}</td>`).join('')}<td></td><td></td></tr>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`;
}

/* ---------- Graphique d'évolution (SVG, une seule échelle, sans librairie) ---------- */
let _chartSeq = 0;
window.__charts = {};
function niceMax(m){ if(m<=5) return 5; const p=Math.pow(10,Math.floor(Math.log10(m))); const f=m/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function lineChart(points, counters, interactive){
  const n = points.length;
  if(!n || !counters.length) return '';
  const id = 'ch'+(++_chartSeq);
  window.__charts[id] = { points, counters };
  const W=760, H=260, pL=40, pR=16, pT=14, pB=30;
  const iw=W-pL-pR, ih=H-pT-pB;
  const maxV = niceMax(Math.max(1, ...points.flatMap(p=>counters.map(c=>p.vals[c.id]||0))));
  const x = i => n===1 ? pL+iw/2 : pL + i*iw/(n-1);
  const y = v => pT + ih - (v/maxV)*ih;
  let g = '';
  // Grille récessive (4 graduations)
  for(let k=0;k<=4;k++){
    const val = maxV*k/4, yy = y(val);
    g += `<line x1="${pL}" y1="${yy.toFixed(1)}" x2="${W-pR}" y2="${yy.toFixed(1)}" stroke="${k===0?'#c9c8c4':'#ecebe8'}" stroke-width="1"/>`;
    g += `<text x="${pL-6}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#8a8986" font-family="Arial">${fmtN(Math.round(val))}</text>`;
  }
  // Étiquettes X sous-échantillonnées
  const step = Math.max(1, Math.ceil(n/10));
  points.forEach((p,i)=>{
    if(i%step!==0 && i!==n-1) return;
    if(i===n-1 && i%step!==0 && (n-1)%step < step*0.6) return;
    const anchor = n===1 ? 'middle' : i===0 ? 'start' : i===n-1 ? 'end' : 'middle';
    g += `<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="${anchor}" font-size="11" fill="#8a8986" font-family="Arial">${esc(p.label)}</text>`;
  });
  // Courbes
  counters.forEach(c=>{
    const pts = points.map((p,i)=>`${x(i).toFixed(1)},${y(p.vals[c.id]||0).toFixed(1)}`);
    if(n>1) g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${c.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(n<=40) points.forEach((p,i)=>{ g += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.vals[c.id]||0).toFixed(1)}" r="${n===1?5:3.5}" fill="${c.color}" stroke="#fff" stroke-width="2"/>`; });
  });
  // Couche de survol
  let hover = '';
  if(interactive){
    hover += `<line class="xh" x1="0" y1="${pT}" x2="0" y2="${pT+ih}" stroke="#8a8986" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>`;
    const bw = n===1 ? iw : iw/(n-1);
    points.forEach((p,i)=>{ hover += `<rect data-i="${i}" x="${(x(i)-bw/2).toFixed(1)}" y="${pT}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent"/>`; });
  }
  const legend = `<div class="legend">${counters.map(c=>`<span><i style="background:${c.color}"></i>${esc(c.libelle)}</span>`).join('')}</div>`;
  return `<div class="chart-wrap" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet" role="img" aria-label="Évolution des compteurs">${g}${hover}</svg><div class="tip"></div></div>${counters.length>1?legend:''}`;
}
function bindChartHover(){
  document.querySelectorAll('.chart-wrap').forEach(wrap=>{
    const ch = window.__charts[wrap.dataset.chart]; if(!ch) return;
    const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip'), xh = svg.querySelector('.xh');
    if(!xh) return;
    svg.querySelectorAll('rect[data-i]').forEach(rc=>{
      rc.addEventListener('mouseenter', ()=>{
        const i = +rc.dataset.i, p = ch.points[i];
        const cx = parseFloat(rc.getAttribute('x')) + parseFloat(rc.getAttribute('width'))/2;
        xh.setAttribute('x1',cx); xh.setAttribute('x2',cx); xh.style.display='';
        tip.innerHTML = `<div class="h">${esc(p.full)}</div>` + ch.counters.map(c=>`<div class="r"><i style="background:${c.color}"></i>${esc(c.libelle)}<b>${fmtN(p.vals[c.id]||0)}</b></div>`).join('') + (p.n>1?`<div class="r" style="color:#999;margin-top:3px">${p.n} relevés</div>`:'');
        tip.style.display='block';
        const box = svg.getBoundingClientRect(), scale = box.width/760;
        let left = cx*scale + 12; if(left + 170 > box.width) left = cx*scale - 182;
        tip.style.left = Math.max(0,left)+'px'; tip.style.top = '10px';
      });
    });
    svg.addEventListener('mouseleave', ()=>{ xh.style.display='none'; tip.style.display='none'; });
  });
}

/* ---------- Détail / correction / suppression d'un relevé ---------- */
let detailRow = null;
function openDetail(i){
  const r = view.rows[i]; if(!r) return;
  detailRow = r;
  const cols = view.cols;
  document.getElementById('modal').innerHTML = `
    <h2>${esc(view.type.nom)}</h2>
    <div class="meta">${fmtDateLong(r.date_releve)} à ${hm(r.heure_releve)} · ${esc(r.site_nom||'—')} · ${esc(r.agent_nom||'—')}</div>
    ${cols.map(c=> c.type==='compteur'
      ? `<div class="efield"><label>${esc(c.libelle)}</label><input type="number" min="0" inputmode="numeric" data-cid="${c.id}" value="${parseInt(valOf(r,c.id))||0}"></div>`
      : `<div class="efield"><label>${esc(c.libelle)}</label><select data-cid="${c.id}"><option value="">—</option>${[...new Set([...(c.options||[]), valOf(r,c.id)].filter(Boolean))].map(o=>`<option ${valOf(r,c.id)===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`
    ).join('')}
    <div class="efield"><label>Note</label><textarea id="m-note">${esc(r.note||'')}</textarea></div>
    ${r.photo_url?`<div class="efield mphoto"><label>Photo</label><a href="${esc(r.photo_url)}" target="_blank"><img src="${esc(r.photo_url)}" alt=""></a></div>`:''}
    <div class="mfoot">
      <button class="btn btn-sec" style="color:var(--danger);border-color:#eab8b8" onclick="deleteReleve()">🗑 Supprimer</button>
      <span class="sp"></span>
      <button class="btn btn-sec" onclick="openReleveReport()">📄 Rapport</button>
      <button class="btn btn-sec" onclick="closeModal()">Fermer</button>
      <button class="btn" onclick="saveReleve()">💾 Enregistrer</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); detailRow=null; }
async function saveReleve(){
  const r = detailRow; if(!r) return;
  const valeurs = (r.valeurs||[]).map(v=>Object.assign({},v));
  document.querySelectorAll('#modal [data-cid]').forEach(el=>{
    const cid = el.dataset.cid;
    const col = view.cols.find(c=>c.id===cid);
    const nv = col.type==='compteur' ? Math.max(0, parseInt(el.value)||0) : (el.value||null);
    const ex = valeurs.find(v=>v.champ_id===cid);
    if(ex) ex.valeur = nv; else valeurs.push({ champ_id:cid, libelle:col.libelle, type:col.type, valeur:nv });
  });
  const note = document.getElementById('m-note').value.trim() || null;
  try{
    const { error } = await sb.from('comptage_releves').update({ valeurs, note }).eq('id', r.id);
    if(error) throw error;
    r.valeurs = valeurs; r.note = note;
    closeModal(); render(); toast('✓ Relevé corrigé');
  }catch(e){ toast('Erreur : '+e.message, true); }
}
async function deleteReleve(){
  const r = detailRow; if(!r) return;
  if(!confirm('Supprimer définitivement ce relevé ?')) return;
  try{
    const { error } = await sb.from('comptage_releves').delete().eq('id', r.id);
    if(error) throw error;
    releves = releves.filter(x=>x.id!==r.id);
    closeModal(); render(); toast('Relevé supprimé');
  }catch(e){ toast('Erreur : '+e.message, true); }
}

/* ============================================================
   Rapports imprimables — charte « RDZ Reports »
   (rpParkShell / rpSec / rpFieldO / rpPhotoBoxO repris de
   supervision-journal.html, bandeau méta à 4 colonnes paramétrables)

}
function rpPhotoBoxO(label,url){

}
// longSection=true : section qui peut s'étendre sur plusieurs pages (grands tableaux) —
// sans ça, l'impression la repousse en entier sur la page suivante et laisse un trou.
function rpSec(numTitre, innerHtml, longSection){
  return `<div class="${longSection?'':'rp-avoid'}" style="margin-bottom:2rem;border:1.5px solid #d0d0d0;border-radius:8px;overflow:hidden">
    <div style="font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#C8102E;background:#d0d0d0;padding:.7rem 1rem">${esc(numTitre)}</div>
    <div style="padding:1.2rem 1rem">${innerHtml}</div>
  </div>`;
}
// metaCells : [{label, html}] — 4 cases dans le bandeau gris
function rpShell(labelTxt, titleTxt, metaCells, bodyHtml, ref){
  const cells = metaCells.map((m,i)=>`<div style="padding:.9rem 1rem;${i<metaCells.length-1?'border-right:1px solid #ddd':''}"><label style="display:block;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#999;margin-bottom:5px">${esc(m.label)}</label><div style="font-size:13px;color:#1a1a1a;font-weight:600">${m.html}</div></div>`).join('');
  return `<div style="max-width:800px;margin:0 auto;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,0.1);font-family:Arial,sans-serif">
    <div style="background:#1a1a1a;padding:1.5rem 2rem">
      <div style="height:4px;background:#C8102E;margin:-1.5rem -2rem 1.25rem"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:1.5rem">
        <div style="flex:1">
          <div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#C8102E;margin-bottom:6px">${esc(labelTxt)}</div>
          <div style="font-size:20px;font-weight:700;color:#fff">${esc(titleTxt||'—')}</div>
        </div>
        <div style="background:#fff;border-radius:8px;padding:8px 14px;flex-shrink:0"><img src="data:image/png;base64,${RPTO_LOGO_B64}" style="height:52px;width:auto;display:block"></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(${metaCells.length},1fr);background:#f0f0f0">${cells}</div>
    <div style="padding:1.5rem 2rem">${bodyHtml}</div>
    <div style="background:#1a1a1a;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;border-top:3px solid #C8102E">
      <div style="display:flex;align-items:center;gap:.75rem">
        <div style="background:#fff;border-radius:6px;padding:5px 10px"><img src="data:image/png;base64,${RPTO_LOGO_B64}" style="height:28px;width:auto;display:block"></div>
        <div style="font-size:10px;color:#aaa;line-height:1.6">RDZ Security Management SA © ${new Date().getFullYear()}<br>Document confidentiel — Usage officiel uniquement</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:#666;font-weight:600;margin-bottom:4px">Réf. : ${esc(ref)}</div>
        <div style="font-size:10px;color:#888;line-height:1.7;text-align:right">contact@rdz-security-management.ch<br>+41 22 552 26 99 · Quai du Seujet 22, Genève</div>
      </div>
    </div>
  </div>`;
}
function rpTile(lbl, val, color){
  return `<div style="border:1.5px solid #e0e0e0;border-radius:8px;padding:12px 14px;background:#fff">
    <div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#888;display:flex;align-items:center;gap:6px">${color?`<span style="width:9px;height:9px;border-radius:2px;background:${color};display:inline-block"></span>`:''}${lbl}</div>
    <div style="font-size:26px;font-weight:700;color:#1a1a1a;margin-top:4px">${val}</div></div>`;
}
function openReport(html){ document.getElementById('report-content').innerHTML = html; const rv=document.getElementById('report-view'); rv.classList.add('open'); rv.scrollTop=0; }
function closeReport(){ document.getElementById('report-view').classList.remove('open'); }

/* ---------- Rapport de synthèse (période + module + site) ---------- */
function openSyntheseReport(){
  const v = view; if(!v || !v.rows.length) return;
  let n = 0; const sec = t => (++n)+' — '+t;
  let body = '';

  // 1. Chiffres clés
  if(v.counters.length){
    body += rpSec(sec('Chiffres clés'), `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">
      ${v.counters.map(c=>rpTile(esc(c.libelle), fmtN(v.totals[c.id]), c.color)).join('')}
      ${rpTile('Relevés', fmtN(v.rows.length))}
    </div>${v.days.length>1?`<div style="font-size:11.5px;color:#888;margin-top:10px">Sur ${v.days.length} jour(s) avec relevés — moyenne par jour : ${v.counters.map(c=>esc(c.libelle)+' '+fmtN(Math.round(v.totals[c.id]/v.days.length))).join(' · ')}</div>`:''}`);
  }
  // 2. Évolution
  if(v.counters.length && v.points.length>1){
    const GT = { releve:'Évolution — relevé par relevé', jour:'Évolution — total par jour', semaine:'Évolution — total par semaine', mois:'Évolution — total par mois' };
    body += rpSec(sec(GT[v.gran]), lineChart(v.points, v.counters, false));
  }
  // 3. Répartitions des listes
  if(v.dists.length){
    body += rpSec(sec('Répartition'), v.dists.map(d=>`<div style="margin-bottom:14px"><div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">${esc(d.col.libelle)}</div>${distHtml(d, v.rows.length)}</div>`).join(''));
  }
  // 4. Détail par jour (si plusieurs jours)
  if(v.days.length>1 && v.counters.length){
    body += rpSec(sec('Détail par jour'), `<table class="rp-tbl"><thead><tr><th>Date</th><th class="num">Relevés</th>${v.counters.map(c=>`<th class="num">${esc(c.libelle)}</th>`).join('')}</tr></thead>
      <tbody>${v.days.map(d=>`<tr><td>${fmtDateLong(d.date)}</td><td class="num">${d.n}</td>${v.counters.map(c=>`<td class="num">${fmtN(d.vals[c.id])}</td>`).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="num">${v.rows.length}</td>${v.counters.map(c=>`<td class="num">${fmtN(v.totals[c.id])}</td>`).join('')}</tr></tfoot></table>`, v.days.length>12);
  }
  // 5. Liste des relevés (bornée pour rester imprimable)
  const LIM = 150;
  const asc = v.rows.slice().reverse();
  body += rpSec(sec('Relevés'+(asc.length>LIM?` (${LIM} premiers sur ${asc.length} — liste complète dans l'export Excel)`:'')),
    `<table class="rp-tbl"><thead><tr><th>Date</th><th>Heure</th>${v.sites.length>1?'<th>Site</th>':''}<th>Agent</th>${v.cols.map(c=>`<th class="${c.type==='compteur'?'num':''}">${esc(c.libelle)}</th>`).join('')}</tr></thead>
    <tbody>${asc.slice(0,LIM).map(r=>`<tr><td>${fmtDate(r.date_releve)}</td><td>${hm(r.heure_releve)}</td>${v.sites.length>1?`<td>${esc(r.site_nom||'—')}</td>`:''}<td>${esc(r.agent_nom||'—')}</td>${v.cols.map(c=>`<td class="${c.type==='compteur'?'num':''}">${cellVal(r,c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`, true);
  // 6. Observations des agents
  const notes = asc.filter(r=>r.note);
  if(notes.length){
    body += rpSec(sec('Observations des agents'), notes.map(r=>`<div style="padding:7px 0;border-bottom:1px solid #eee;font-size:12.5px"><span style="color:#888">${fmtDate(r.date_releve)} ${hm(r.heure_releve)} · ${esc(r.agent_nom||'—')}</span><br>${esc(r.note)}</div>`).join(''), true);
  }

  const meta = [
    { label:'Période', html: period.from===period.to ? fmtDate(period.from) : fmtDate(period.from)+' – '+fmtDate(period.to) },
    { label:'Site', html: esc(v.site || (v.sites.length===1 ? v.sites[0] : v.sites.length+' sites')) },
    { label:'Relevés', html: fmtN(v.rows.length) },
    { label:'Agents', html: esc(v.agents.length<=2 ? v.agents.join(', ') : v.agents.length+' agents') }
  ];
  const ref = 'CPT-'+(v.type.slug||'').toUpperCase().slice(0,10)+'-'+period.from.replace(/-/g,'')+(period.to!==period.from?'-'+period.to.replace(/-/g,''):'');
  openReport(rpShell('Rapport de comptage — synthèse', v.type.nom, meta, body, ref));
}

/* ---------- Rapport individuel d'un relevé ---------- */
function openReleveReport(){
  const r = detailRow; if(!r) return;
  const cols = view.cols;
  const counters = cols.filter(c=>c.type==='compteur'), lists = cols.filter(c=>c.type==='choix');
  let body = '';
  if(counters.length) body += rpSec('1 — Comptage', `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">${counters.map(c=>rpTile(esc(c.libelle), fmtN(parseInt(valOf(r,c.id))||0), c.color)).join('')}</div>`);
  const infos = lists.map(c=>rpFieldO(esc(c.libelle), esc(valOf(r,c.id)||'—'))).join('');
  body += rpSec((counters.length?'2':'1')+' — Informations', `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px">${infos}${rpFieldO('Site', esc(r.site_nom||'—'))}</div>${rpFieldO('Note', esc(r.note||'—'))}`);
  body += rpSec((counters.length?'3':'2')+' — Preuve photographique', `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">${rpPhotoBoxO('Photo jointe', r.photo_url)}</div>`);
  const meta = [
    { label:'Date', html: fmtDate(r.date_releve) },
    { label:'Heure', html: hm(r.heure_releve) },
    { label:'Agent', html: esc(r.agent_nom||'—') },
    { label:'Statut', html: '<span style="display:inline-block;padding:.3rem 1rem;border-radius:20px;font-size:12px;font-weight:700;background:#eff6ff;color:#2563eb;border:1.5px solid #2563eb">Relevé</span>' }
  ];
  closeModal();
  openReport(rpShell('Rapport de comptage — '+view.type.nom, r.site_nom || view.type.nom, meta, body, String(r.id||'').slice(0,8).toUpperCase()));
}

/* ---------- Export Excel ---------- */
// Date Excel « pure » (numéro de série) calculée en UTC — évite le décalage de
// quelques secondes / d'un fuseau horaire que SheetJS introduit avec des objets
// Date locaux (même famille que le piège technique n°1).
function xlDate(s){ const [y,m,d]=s.split('-').map(Number); return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000; }
function xlFormatDates(ws, col, fromRow, toRow){
  for(let r=fromRow;r<=toRow;r++){ const c=ws[XLSX.utils.encode_cell({r,c:col})]; if(c && c.t==='n') c.z='dd.mm.yyyy'; }
}
function exportExcel(){
  const v = view; if(!v || !v.rows.length) return;
  if(typeof XLSX==='undefined'){ toast('Module Excel non chargé (réseau ?)', true); return; }
  const wb = XLSX.utils.book_new();

  // Onglet Synthèse : une ligne par jour, une colonne par compteur
  const syn = [[v.type.nom + ' — ' + periodLabel() + (v.site?' — '+v.site:'')], [],
    ['Date','Relevés', ...v.counters.map(c=>c.libelle)],
    ...v.days.map(d=>[xlDate(d.date), d.n, ...v.counters.map(c=>d.vals[c.id])]),
    ['Total', v.rows.length, ...v.counters.map(c=>v.totals[c.id])]];
  const ws1 = XLSX.utils.aoa_to_sheet(syn);
  xlFormatDates(ws1, 0, 3, 2+v.days.length);
  ws1['!cols'] = [{wch:14},{wch:10}, ...v.counters.map(c=>({wch:Math.max(12,c.libelle.length+2)}))];
  XLSX.utils.book_append_sheet(wb, ws1, 'Synthèse');

  // Onglet Relevés : une ligne par relevé, une colonne par compteur/liste
  const asc = v.rows.slice().reverse();
  const head = ['Date','Heure','Site','Agent', ...v.cols.map(c=>c.libelle), 'Note', 'Photo'];
  const rows = asc.map(r=>[xlDate(r.date_releve), hm(r.heure_releve), r.site_nom||'', r.agent_nom||'',
    ...v.cols.map(c=>{ const x=valOf(r,c.id); return c.type==='compteur' ? (parseInt(x)||0) : (x||''); }), r.note||'', r.photo_url||'']);
  const ws2 = XLSX.utils.aoa_to_sheet([head, ...rows]);
  xlFormatDates(ws2, 0, 1, rows.length);
  ws2['!cols'] = [{wch:12},{wch:8},{wch:18},{wch:18}, ...v.cols.map(c=>({wch:Math.max(12,c.libelle.length+2)})), {wch:40},{wch:20}];
  ws2['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:rows.length, c:head.length-1} }) };
  XLSX.utils.book_append_sheet(wb, ws2, 'Relevés');

  // Onglet Répartition des listes (si le module en a)
  if(v.dists.length){
    const aoa = [];
    v.dists.forEach(d=>{ aoa.push([d.col.libelle,'Relevés','%']); d.entries.forEach(([l,n])=>aoa.push([l,n, v.rows.length?Math.round(n/v.rows.length*100):0])); if(d.none) aoa.push(['Non renseigné', d.none, Math.round(d.none/v.rows.length*100)]); aoa.push([]); });
    const ws3 = XLSX.utils.aoa_to_sheet(aoa); ws3['!cols']=[{wch:28},{wch:10},{wch:6}];
    XLSX.utils.book_append_sheet(wb, ws3, 'Répartition');
  }
  const fname = 'Comptage_' + (v.type.slug||'module') + (v.site?'_'+v.site.replace(/[^\w-]+/g,'-'):'') + '_' + period.from + (period.to!==period.from?'_'+period.to:'') + '.xlsx';
  XLSX.writeFile(wb, fname);
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeReport(); } });
init();
