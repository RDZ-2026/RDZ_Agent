:root{

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);}
.screen.hidden{display:none;}
.topbar{flex-shrink:0;height:54px;background:var(--anth);display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:3px solid var(--red);}
.tb-back{width:34px;height:34px;background:rgba(255,255,255,.1);border:none;border-radius:6px;color:#fff;font-size:18px;cursor:pointer;}
.tb-title{color:#fff;font-size:14px;font-weight:700;}
.tb-sub{color:rgba(255,255,255,.5);font-size:10px;}
.body{flex:1;overflow-y:auto;padding:14px;}

.mission-btn{width:100%;padding:22px;background:#fff;border:1px solid var(--border);border-left:5px solid var(--red);border-radius:8px;margin-bottom:14px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:16px;}
.mission-btn:active{background:var(--bg);}
.mission-ico{font-size:32px;}
.mission-lbl{font-size:16px;font-weight:700;}
.mission-desc{font-size:12px;color:var(--gray);margin-top:2px;}

.fg{margin-bottom:16px;}
.fl{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px;}
.fi{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;color:#1a1a1a;}
.fi:focus{outline:none;border-color:var(--red);}
.fi-ta{min-height:70px;resize:vertical;font-family:inherit;}
.readonly-val{font-size:13px;color:var(--gray);padding:9px 12px;background:#fff;border-radius:8px;border:1px solid var(--border);}

.photo-btns{display:flex;gap:10px;margin-bottom:8px;}
.photo-btn{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:#1a1a1a;cursor:pointer;text-align:center;}
.photo-btn:active{background:var(--bg);}
.photo-preview{margin-top:6px;}
.photo-thumb-wrap{position:relative;display:inline-block;}
.photo-thumb{max-width:140px;max-height:140px;border-radius:8px;border:1px solid var(--border);display:block;}
.photo-thumb-del{position:absolute;top:-8px;right:-8px;background:#991b1b;color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;line-height:1;}

.counter-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.counter-lbl{font-size:13px;font-weight:700;margin-bottom:12px;text-align:center;}
.counter-row{display:flex;align-items:center;justify-content:center;gap:18px;}
.counter-btn{width:52px;height:52px;border-radius:50%;border:none;background:var(--anth);color:#fff;font-size:26px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.counter-btn:active{background:var(--red);}
.counter-btn.minus{background:var(--bg);color:var(--anth);border:2px solid var(--border2);}
.counter-val{font-size:34px;font-weight:900;min-width:70px;text-align:center;border:none;background:transparent;color:var(--red);}
.counter-val:focus{outline:none;}

.btn-submit{margin:18px 0 30px;width:100%;padding:15px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;}
.btn-submit:disabled{opacity:.5;}

#toasts{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:999;width:calc(100% - 24px);max-width:380px;}

<script>
// ═══ RDZSync v4 — brique commune, collée telle quelle (voir rdz-sync-v4.js) ═══
(function (global) {
  'use strict';

  var Q_TEXT = 'rdz_sync_queue';
  var Q_PHOTO = 'rdz_sync_photo_queue';
  var Q_LOG = 'rdz_sync_log';
  var LOG_MAX = 30;

  var _client = null;
  var _onChange = null;
  var _flushingText = false;
  var _flushingPhotos = false;

  function readLS(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; } }
  function writeLS(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {} notify(); }

  function notify() {
    var st = getStatus();
    if (typeof _onChange === 'function') { try { _onChange(st); } catch (e) {} }
    renderBadge(st);
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function dataUrlToBlob(dataUrl) {
    var parts = dataUrl.split(',');
    var mime = (parts[0].match(/:(.*?);/) || [, 'application/octet-stream'])[1];
    var bin = atob(parts[1]); var n = bin.length; var u8 = new Uint8Array(n);
    while (n--) u8[n] = bin.charCodeAt(n);
    return new Blob([u8], { type: mime });
  }

  function pushLog(entry) {
    var log = readLS(Q_LOG);
    log.unshift(entry);
    if (log.length > LOG_MAX) log = log.slice(0, LOG_MAX);
    writeLS(Q_LOG, log);
  }

  /* ---------- détection WiFi (best-effort, jamais garantie) ---------- */
  function isWifi() {
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!c) return null;               // inconnu (iPhone/Safari notamment)
      if (typeof c.type === 'string') return c.type === 'wifi';
      if (typeof c.effectiveType === 'string') return null; // effectiveType = vitesse, pas le support
      return null;
    } catch (e) { return null; }
  }

  /* ---------- badge visuel ---------- */
  function ensureBadge() {
    var b = document.getElementById('rdz-sync-badge');
    if (b) return b;
    b = document.createElement('div');
    b.id = 'rdz-sync-badge';
    b.style.cssText =
      'position:fixed;left:12px;bottom:12px;z-index:99999;' +
      'font:600 12.5px Arial,Helvetica,sans-serif;color:#fff;' +
      'background:#b8860b;padding:8px 12px;border-radius:2px;line-height:1.5;' +
      'box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;cursor:pointer;max-width:260px;';
    b.title = 'Cliquer pour forcer la synchronisation';
    b.onclick = function () { flushText(); flushPhotos(true); };
    document.body.appendChild(b);
    return b;
  }
  function renderBadge(st) {
    if (typeof document === 'undefined' || !document.body) return;
    var b = ensureBadge();
    var parts = [];
    if (st.textPending > 0) parts.push('⏳ ' + st.textPending + ' donnée(s) en attente de réseau');
    if (st.photoPending > 0) parts.push('📷 ' + st.photoPending + ' photo(s) en attente de WiFi');
    if (parts.length === 0) { b.style.display = 'none'; return; }
    b.innerHTML = parts.join('<br>');
    b.style.display = 'block';
  }

  /* ---------- API publique ---------- */
  function init(opts) {
    opts = opts || {};
    _client = opts.client || _client;
    if (typeof opts.onChange === 'function') _onChange = opts.onChange;
    if (typeof global.addEventListener === 'function') {
      global.addEventListener('online', function () { flushText(); tryAutoPhotos(); });
    }
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (c && typeof c.addEventListener === 'function') {
        c.addEventListener('change', tryAutoPhotos);
      }
    } catch (e) {}
    if (typeof document !== 'undefined') {
      var start = function () { notify(); flushText(); tryAutoPhotos(); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    }
    return API;
  }

  function tryAutoPhotos() { if (isWifi() === true) flushPhotos(false); }

  /* save() : NON bloquant. Le texte est mis en file et une tentative
     d'envoi part immédiatement (auto, sur n'importe quel réseau).
     Les photos sont mises de côté et attendent le WiFi ou un geste manuel. */
  function save(item) {
    var textEntry = {
      id: uid(),
      module: item.module || 'inconnu',
      table: item.table,
      op: item.op || 'insert',
      onConflict: item.onConflict || null,
      row: Object.assign({}, item.row || {}),
      photoField: item.photoField || null,
      bucket: item.bucket || null,
      pendingPhotos: item.photos || [],   // gardées ici jusqu'à ce que le texte soit parti
      ts: new Date().toISOString(),
      tries: 0
    };
    var q = readLS(Q_TEXT); q.push(textEntry); writeLS(Q_TEXT, q);
    setTimeout(flushText, 0);
    return textEntry.id;
  }

  /* ---------- file TEXTE : envoi auto, tout réseau ---------- */
  function flushText() {
    if (_flushingText || !_client) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingText = true;
    var q = readLS(Q_TEXT); var i = 0;

    function next() {
      if (i >= q.length) { _flushingText = false; return; }
      var it = q[i];
      var qb = _client.from(it.table);
      // Pas de .select() après écriture : on ne dépend jamais d'une permission de
      // LECTURE en plus de la permission d'ÉCRITURE (une table plus ancienne peut
      // autoriser l'insert sans autoriser le select en retour — .select() y échouerait
      // silencieusement et la ligne resterait bloquée en file indéfiniment).
      // On utilise l'id fourni côté agent (row.id, déjà généré via uid() par tous les
      // modules) pour rattacher les photos ensuite.
      var req = (it.op === 'upsert')
        ? qb.upsert(it.row, it.onConflict ? { onConflict: it.onConflict } : undefined)
        : qb.insert(it.row);

      req.then(function (res) {
        if (res && res.error) throw res.error;
        // succès texte : retirer de la file texte + logguer
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) cur.splice(idx, 1);
        writeLS(Q_TEXT, cur);
        pushLog({ ts: new Date().toISOString(), module: it.module, table: it.table, kind: 'texte', ok: true });

        // s'il y avait des photos en attente, les basculer dans la file photo
        // (rattachées via l'id fourni côté agent dans row.id)
        var rowId = it.row && it.row.id != null ? it.row.id : null;
        if (it.pendingPhotos && it.pendingPhotos.length) {
          if (rowId == null) {
            console.warn('RDZSync: photos ignorées — aucun id fourni dans row.id pour', it.table);
          } else {
            var pq = readLS(Q_PHOTO);
            it.pendingPhotos.forEach(function (p) {
              pq.push({
                id: uid(), module: it.module, table: it.table, rowId: rowId,
                bucket: it.bucket, field: p.field || it.photoField, name: p.name || 'photo.jpg',
                dataUrl: p.dataUrl, ts: new Date().toISOString(), tries: 0
              });
            });
            writeLS(Q_PHOTO, pq);
            tryAutoPhotos();
          }
        }
        i++; next();
      }).catch(function (err) {
        console.warn('RDZSync: échec écriture', it.module, it.table, err && (err.message || err));
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; cur[idx].lastError = err && (err.message || String(err)) || null; writeLS(Q_TEXT, cur); }
        _flushingText = false; // réseau probablement absent : on retentera au prochain online/ouverture
      });
    }
    next();
  }

  /* ---------- file PHOTOS : envoi WiFi (best-effort) ou manuel (force=true) ---------- */
  function flushPhotos(force) {
    if (_flushingPhotos || !_client) return;
    if (!force && isWifi() !== true) return; // pas de WiFi détecté et pas d'appui manuel -> on attend
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingPhotos = true;
    var q = readLS(Q_PHOTO); var i = 0;

    function next() {
      if (i >= q.length) { _flushingPhotos = false; return; }
      var p = q[i];
      var path = p.module + '/' + Date.now() + '_' + p.name;
      var blob = dataUrlToBlob(p.dataUrl);
      _client.storage.from(p.bucket).upload(path, blob, { upsert: true })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var pub = _client.storage.from(p.bucket).getPublicUrl(path);
          var url = pub && pub.data ? pub.data.publicUrl : null;
          var patch = {}; patch[p.field] = url;
          return _client.from(p.table).update(patch).eq('id', p.rowId);
        })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) cur.splice(idx, 1);
          writeLS(Q_PHOTO, cur);
          pushLog({ ts: new Date().toISOString(), module: p.module, table: p.table, kind: 'photo', ok: true });
          i++; next();
        })
        .catch(function (err) {
          console.warn('RDZSync: échec envoi photo', p.module, p.table, err && (err.message || err));
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; cur[idx].lastError = err && (err.message || String(err)) || null; writeLS(Q_PHOTO, cur); }
          _flushingPhotos = false;
        });
    }
    next();
  }

  function getStatus() {
    return {
      textPending: readLS(Q_TEXT).length,
      photoPending: readLS(Q_PHOTO).length,
      log: readLS(Q_LOG),
      isWifi: isWifi()
    };
  }

  var API = {
    init: init, save: save, flushText: flushText, flushPhotos: flushPhotos,
    getStatus: getStatus, QUEUE_KEYS: { text: Q_TEXT, photo: Q_PHOTO, log: Q_LOG }
  };
  (typeof window !== 'undefined' ? window : global).RDZSync = API;
})(typeof window !== 'undefined' ? window : this);

// Générateur d'UUID v4 valide (piège technique n°10 des instructions du projet) : à utiliser
// UNIQUEMENT quand un id connu côté agent est nécessaire pour rattacher une photo après coup
// (piège n°6) — ne jamais utiliser le uid() interne de RDZSync (non-UUID) pour ce cas, les
// colonnes id des tables du projet étant de type uuid côté Postgres.
function uuidv4(){
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0'));
  return `${h[0]}${h[1]}${h[2]}${h[3]}-${h[4]}${h[5]}-${h[6]}${h[7]}-${h[8]}${h[9]}-${h[10]}${h[11]}${h[12]}${h[13]}${h[14]}${h[15]}`;
}

// ═══ PHOTO (caméra / galerie — voir piège technique n°3) ═══
function onPhotoSelected(input, ctx){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    if(ctx==='c'){ photoDataC = reader.result; } else { photoDataF = reader.result; }
    renderPhotoPreview(ctx);
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function renderPhotoPreview(ctx){
  const data = ctx==='c' ? photoDataC : photoDataF;
  const el = document.getElementById('photo-preview-'+ctx);
  if(!el) return;
  el.innerHTML = data
    ? `<div class="photo-thumb-wrap"><img class="photo-thumb" src="${data}"><button type="button" class="photo-thumb-del" onclick="clearPhoto('${ctx}')">✕</button></div>`
    : '';
}
function clearPhoto(ctx){
  if(ctx==='c') photoDataC = null; else photoDataF = null;
  renderPhotoPreview(ctx);
}

    ambiances = a||[]; origines = o||[];
    document.getElementById('f-ambiance').innerHTML = '<option value="">— Sélectionner —</option>' +
      ambiances.map(x=>`<option value="${escHtml(x.label)}">${escHtml(x.label)}</option>`).join('');
  }catch(e){ toast('Erreur chargement config : '+e.message, true); }
}

// ═══ COMPTAGE ═══
function openComptage(){
  counters = { affluence:0, rappels:0, evictions:0 };
  ['affluence','rappels','evictions'].forEach(k=>document.getElementById('c-'+k).value=0);
  document.getElementById('f-agent-c').textContent = AGENT_NOM;
  document.getElementById('f-ambiance').value='';
  document.getElementById('f-note-c').value='';
  photoDataC = null; renderPhotoPreview('c');
  showScreen('s-comptage');
}
function incr(key, delta){
  counters[key] = Math.max(0, (counters[key]||0) + delta);
  document.getElementById('c-'+key).value = counters[key];
}
function setVal(key, val){
  counters[key] = Math.max(0, parseInt(val)||0);
  document.getElementById('c-'+key).value = counters[key];
}
async function submitComptage(){
  const ambiance = document.getElementById('f-ambiance').value;
  const poste = document.getElementById('f-poste-c').value.trim() || 'IHEID - MDP';
  const note = document.getElementById('f-note-c').value.trim();
  if(!ambiance){ toast('⚠️ Sélectionnez une ambiance', true); return; }
  const btn = document.getElementById('btn-submit-c');
  btn.disabled = true; btn.textContent = 'Envoi…';
  try{
    RDZSync.save({
      module: 'bibliotheque', table: 'bibliotheque_comptages',
      row: {
        id: uuidv4(), agent_nom: AGENT_NOM, poste_garde: poste,
        date_rapport: todayStr(), heure_rapport: nowTimeStr(),
        affluence: counters.affluence, ambiance,
        rappels_reglement: counters.rappels, evictions: counters.evictions,
        note: note || null
      },
      bucket: photoDataC ? 'bibliotheque-photos' : null,
      photoField: 'photo_url',
      photos: photoDataC ? [{ name: 'comptage.jpg', dataUrl: photoDataC }] : []
    });
    toast('✅ Rapport pris en compte' + (navigator.onLine ? '' : ' (hors-ligne — remontera dès le retour du réseau)'));
    showScreen('s-home');
  }catch(e){ toast('Erreur : '+e.message, true); }
  finally{ btn.disabled=false; btn.textContent='✅ Enregistrer le rapport'; }
}

// ═══ FILTRAGE ═══
function openFiltrage(){
  filtrageCounters = {}; filtrageExtra = { rappels:0, evictions:0 };
  origines.forEach(o => filtrageCounters[o.label] = 0);
  photoDataF = null;
  renderFiltrage();
  showScreen('s-filtrage');
}
function renderFiltrage(){
  const el = document.getElementById('filtrage-counters');
  let html = origines.map(o => `
    <div class="counter-card">
      <div class="counter-lbl">Entrées ${escHtml(o.label)}</div>
      <div class="counter-row">
        <button class="counter-btn minus" onclick="incrF('${escHtml(o.label)}',-1)">−</button>
        <input class="counter-val" type="number" value="${filtrageCounters[o.label]||0}" onchange="setValF('${escHtml(o.label)}',this.value)">
        <button class="counter-btn" onclick="incrF('${escHtml(o.label)}',1)">+</button>
      </div>
    </div>`).join('');

  html += `
    <div class="counter-card">
      <div class="counter-lbl">Rappels au règlement</div>
      <div class="counter-row">
        <button class="counter-btn minus" onclick="incrFExtra('rappels',-1)">−</button>
        <input class="counter-val" id="cf-rappels" type="number" value="${filtrageExtra.rappels}" onchange="setValFExtra('rappels',this.value)">
        <button class="counter-btn" onclick="incrFExtra('rappels',1)">+</button>
      </div>
    </div>
    <div class="counter-card">
      <div class="counter-lbl">Entrée refusée / Éviction</div>
      <div class="counter-row">
        <button class="counter-btn minus" onclick="incrFExtra('evictions',-1)">−</button>
        <input class="counter-val" id="cf-evictions" type="number" value="${filtrageExtra.evictions}" onchange="setValFExtra('evictions',this.value)">
        <button class="counter-btn" onclick="incrFExtra('evictions',1)">+</button>
      </div>
    </div>
    <div class="fg"><label class="fl">Agent</label><div class="readonly-val">${escHtml(AGENT_NOM)}</div></div>
    <div class="fg"><label class="fl">Poste de garde</label><input class="fi" id="f-poste-f" value="IHEID - MDP"></div>
    <div class="fg">
      <label class="fl">Notes (facultatif)</label>
      <textarea class="fi fi-ta" id="f-note-f" placeholder="Précision à ajouter au rapport…"></textarea>
    </div>
    <div class="fg">
      <label class="fl">Photo (facultatif)</label>
      <div class="photo-btns">
        <button type="button" class="photo-btn" onclick="document.getElementById('photo-camera-f').click()">📷 Caméra</button>
        <button type="button" class="photo-btn" onclick="document.getElementById('photo-gallery-f').click()">🖼 Galerie</button>
      </div>
      <input type="file" id="photo-camera-f" accept="image/*" capture="environment" style="display:none" onchange="onPhotoSelected(this,'f')">
      <input type="file" id="photo-gallery-f" accept="image/*" style="display:none" onchange="onPhotoSelected(this,'f')">
      <div class="photo-preview" id="photo-preview-f"></div>
    </div>
    <button class="btn-submit" id="btn-submit-f" onclick="submitFiltrage()">✅ Enregistrer le rapport</button>
  `;
  el.innerHTML = html;
  renderPhotoPreview('f');
}
function incrF(label, delta){
  filtrageCounters[label] = Math.max(0, (filtrageCounters[label]||0)+delta);
  renderFiltrage();
}
function setValF(label, val){
  filtrageCounters[label] = Math.max(0, parseInt(val)||0);
  renderFiltrage();
}
function incrFExtra(key, delta){
  filtrageExtra[key] = Math.max(0, (filtrageExtra[key]||0)+delta);
  document.getElementById('cf-'+key).value = filtrageExtra[key];
}
function setValFExtra(key, val){
  filtrageExtra[key] = Math.max(0, parseInt(val)||0);
  document.getElementById('cf-'+key).value = filtrageExtra[key];
}
async function submitFiltrage(){
  const poste = document.getElementById('f-poste-f').value.trim() || 'IHEID - MDP';
  const note = document.getElementById('f-note-f').value.trim();
  const btn = document.getElementById('btn-submit-f');
  btn.disabled = true; btn.textContent = 'Envoi…';
  try{
    RDZSync.save({
      module: 'bibliotheque', table: 'bibliotheque_filtrages',
      row: {
        id: uuidv4(), agent_nom: AGENT_NOM, poste_garde: poste,
        date_rapport: todayStr(), heure_rapport: nowTimeStr(),
        entrees: filtrageCounters,
        rappels_reglement: filtrageExtra.rappels, evictions_refus: filtrageExtra.evictions,
        note: note || null
      },
      bucket: photoDataF ? 'bibliotheque-photos' : null,
      photoField: 'photo_url',
      photos: photoDataF ? [{ name: 'filtrage.jpg', dataUrl: photoDataF }] : []
    });
    toast('✅ Rapport pris en compte' + (navigator.onLine ? '' : ' (hors-ligne — remontera dès le retour du réseau)'));
    showScreen('s-home');
  }catch(e){ toast('Erreur : '+e.message, true); }
  finally{ btn.disabled=false; btn.textContent='✅ Enregistrer le rapport'; }
}

loadConfig();
</script>
