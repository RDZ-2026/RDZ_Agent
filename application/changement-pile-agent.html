<!-- RDZ · changement-pile-agent · v1 · 2026-08-17 -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RDZ Agent — Changements de pile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --rdz-red: #8B1A1A;
    --rdz-red-dark: #6B1212;
    --rdz-red-light: #f5e8e8;
    --rdz-black: #1a1a1a;
    --rdz-gray: #4a4a4a;
    --rdz-border: #d0ccc5;
    --rdz-bg: #f5f4f2;
  }
  html, body { height: 100%; }
  body { font-family: Arial, Helvetica, sans-serif; background: var(--rdz-bg); color: var(--rdz-black); min-height: 100vh; }

  .app-header { background: var(--rdz-red); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .app-header-txt { display: flex; flex-direction: column; gap: 2px; }
  .app-header-name { font-size: 13px; font-weight: 700; color: #fff; letter-spacing: .06em; text-transform: uppercase; }
  .app-header-sub { font-size: 10.5px; color: rgba(255,255,255,.65); }
  .back-btn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4); color: #fff; font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 2px; text-decoration: none; white-space: nowrap; }
  .back-btn:active { background: rgba(255,255,255,.3); }

  .content { padding: 16px; padding-bottom: 40px; }

  .site-bar { background: #fff; border: 1px solid var(--rdz-border); border-radius: 2px; padding: 12px 14px; margin-bottom: 16px; }
  .site-bar label { font-size: 10.5px; font-weight: 700; color: var(--rdz-gray); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 6px; }
  .site-select { width: 100%; padding: 10px 12px; border-radius: 2px; border: 1px solid var(--rdz-border); font-size: 14.5px; background: #fff; color: var(--rdz-black); }

  .form-box { background: #fff; border: 1px solid var(--rdz-border); border-radius: 2px; padding: 16px; margin-bottom: 16px; }
  .field-group { margin-bottom: 14px; }
  .field-group:last-child { margin-bottom: 0; }
  .field-label { font-size: 10.5px; font-weight: 700; color: var(--rdz-gray); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 6px; }
  .field-input { width: 100%; padding: 11px 13px; border-radius: 2px; border: 1.5px solid var(--rdz-border); font-size: 15px; background: #fff; color: var(--rdz-black); font-family: Arial, sans-serif; }
  .field-input:focus { outline: none; border-color: var(--rdz-red); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field-group { flex: 1; }

  .submit-btn { display: block; width: 100%; background: var(--rdz-red); color: #fff; border: none; padding: 14px; border-radius: 2px; font-size: 14px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; cursor: pointer; margin-top: 4px; }
  .submit-btn:active { background: var(--rdz-red-dark); }
  .submit-btn:disabled { background: var(--rdz-border); color: var(--rdz-gray); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--rdz-black); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transition: opacity .3s; white-space: nowrap; pointer-events: none; }
  .toast.show { opacity: 1; }

  .today-section { margin-top: 4px; }
  .today-label { font-size: 10.5px; font-weight: 700; color: var(--rdz-gray); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .today-row { background: #fff; border: 1px solid var(--rdz-border); border-left: 3px solid var(--rdz-red); border-radius: 2px; padding: 10px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .today-time { font-size: 12px; font-weight: 700; color: var(--rdz-black); flex-shrink: 0; width: 44px; }
  .today-info { flex: 1; min-width: 0; }
  .today-name { font-size: 13px; font-weight: 700; }
  .today-meta { font-size: 11px; color: var(--rdz-gray); margin-top: 1px; }
  .empty-today { font-size: 12px; color: #9a9a9a; font-style: italic; padding: 10px 0; }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-header-txt">
    <div class="app-header-name">RDZ Security Management</div>
    <div class="app-header-sub">Changements de pile</div>
  </div>
  <a class="back-btn" href="mobile.html">‹ Retour</a>
</div>

<div class="content">

  <div class="site-bar">
    <label for="site-select">Site</label>
    <select class="site-select" id="site-select" onchange="onSiteChange()">
      <option value="IHEID - REGM">IHEID - REGM</option>
      <option value="IHEID - MDE">IHEID - MDE</option>
      <option value="IHEID - Barton Pavillons">IHEID - Barton Pavillons</option>
    </select>
  </div>

  <div class="form-box">
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Localisation</label>
        <input type="text" class="field-input" id="f-localisation" placeholder="Ex : 8611, Pavillon D1" autocomplete="off">
      </div>
      <div class="field-group">
        <label class="field-label">Heure</label>
        <input type="time" class="field-input" id="f-heure">
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Date <span style="text-transform:none;font-weight:400">(modifiable pour un rapport en différé)</span></label>
      <input type="date" class="field-input" id="f-date">
    </div>
    <button class="submit-btn" id="btn-submit" onclick="saveChangementPile()">✓ Enregistrer</button>
  </div>

  <div class="today-section">
    <div class="today-label">Enregistrés aujourd'hui sur ce site</div>
    <div id="today-list"><div class="empty-today">Chargement…</div></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ═══ RDZSync v4 — copie de référence, collée telle quelle (voir application/rdz-sync-v4.js) ═══ */
(function (global) {
  'use strict';

  var Q_TEXT = 'rdz_sync_queue';
  var Q_PHOTO = 'rdz_sync_photo_queue';
  var Q_LOG = 'rdz_sync_log';
  var LOG_MAX = 30;

  var _client = null;
  var _onChange = null;
  var _flushingText = false;
  var _flushingPhotos = false;

  function readLS(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; } }
  function writeLS(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {} notify(); }

  function notify() {
    var st = getStatus();
    if (typeof _onChange === 'function') { try { _onChange(st); } catch (e) {} }
    renderBadge(st);
  }

  function uidSync() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function dataUrlToBlob(dataUrl) {
    var parts = dataUrl.split(',');
    var mime = (parts[0].match(/:(.*?);/) || [, 'application/octet-stream'])[1];
    var bin = atob(parts[1]); var n = bin.length; var u8 = new Uint8Array(n);
    while (n--) u8[n] = bin.charCodeAt(n);
    return new Blob([u8], { type: mime });
  }

  function pushLog(entry) {
    var log = readLS(Q_LOG);
    log.unshift(entry);
    if (log.length > LOG_MAX) log = log.slice(0, LOG_MAX);
    writeLS(Q_LOG, log);
  }

  function isWifi() {
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!c) return null;
      if (typeof c.type === 'string') return c.type === 'wifi';
      if (typeof c.effectiveType === 'string') return null;
      return null;
    } catch (e) { return null; }
  }

  function ensureBadge() {
    var b = document.getElementById('rdz-sync-badge');
    if (b) return b;
    b = document.createElement('div');
    b.id = 'rdz-sync-badge';
    b.style.cssText =
      'position:fixed;left:12px;bottom:12px;z-index:99999;' +
      'font:600 12.5px Arial,Helvetica,sans-serif;color:#fff;' +
      'background:#b8860b;padding:8px 12px;border-radius:2px;line-height:1.5;' +
      'box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;cursor:pointer;max-width:260px;';
    b.title = 'Cliquer pour forcer la synchronisation';
    b.onclick = function () { flushText(); flushPhotos(true); };
    document.body.appendChild(b);
    return b;
  }
  function renderBadge(st) {
    if (typeof document === 'undefined' || !document.body) return;
    var b = ensureBadge();
    var parts = [];
    if (st.textPending > 0) parts.push('⏳ ' + st.textPending + ' donnée(s) en attente de réseau');
    if (st.photoPending > 0) parts.push('📷 ' + st.photoPending + ' photo(s) en attente de WiFi');
    if (parts.length === 0) { b.style.display = 'none'; return; }
    b.innerHTML = parts.join('<br>');
    b.style.display = 'block';
  }

  function init(opts) {
    opts = opts || {};
    _client = opts.client || _client;
    if (typeof opts.onChange === 'function') _onChange = opts.onChange;
    if (typeof global.addEventListener === 'function') {
      global.addEventListener('online', function () { flushText(); tryAutoPhotos(); });
    }
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (c && typeof c.addEventListener === 'function') {
        c.addEventListener('change', tryAutoPhotos);
      }
    } catch (e) {}
    if (typeof document !== 'undefined') {
      var start = function () { notify(); flushText(); tryAutoPhotos(); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    }
    return API;
  }

  function tryAutoPhotos() { if (isWifi() === true) flushPhotos(false); }

  function save(item) {
    var textEntry = {
      id: uidSync(),
      module: item.module || 'inconnu',
      table: item.table,
      op: item.op || 'insert',
      onConflict: item.onConflict || null,
      row: Object.assign({}, item.row || {}),
      photoField: item.photoField || null,
      bucket: item.bucket || null,
      pendingPhotos: item.photos || [],
      ts: new Date().toISOString(),
      tries: 0
    };
    var q = readLS(Q_TEXT); q.push(textEntry); writeLS(Q_TEXT, q);
    setTimeout(flushText, 0);
    return textEntry.id;
  }

  function flushText() {
    if (_flushingText || !_client) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingText = true;
    var q = readLS(Q_TEXT); var i = 0;

    function next() {
      if (i >= q.length) { _flushingText = false; return; }
      var it = q[i];
      var qb = _client.from(it.table);
      var req = (it.op === 'upsert')
        ? qb.upsert(it.row, it.onConflict ? { onConflict: it.onConflict } : undefined)
        : qb.insert(it.row);

      req.then(function (res) {
        if (res && res.error) throw res.error;
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) cur.splice(idx, 1);
        writeLS(Q_TEXT, cur);
        pushLog({ ts: new Date().toISOString(), module: it.module, table: it.table, kind: 'texte', ok: true });

        var rowId = it.row && it.row.id != null ? it.row.id : null;
        if (it.pendingPhotos && it.pendingPhotos.length) {
          if (rowId == null) {
            console.warn('RDZSync: photos ignorées — aucun id fourni dans row.id pour', it.table);
          } else {
            var pq = readLS(Q_PHOTO);
            it.pendingPhotos.forEach(function (p) {
              pq.push({
                id: uidSync(), module: it.module, table: it.table, rowId: rowId,
                bucket: it.bucket, field: p.field || it.photoField, name: p.name || 'photo.jpg',
                dataUrl: p.dataUrl, ts: new Date().toISOString(), tries: 0
              });
            });
            writeLS(Q_PHOTO, pq);
            tryAutoPhotos();
          }
        }
        i++; next();
      }).catch(function () {
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; writeLS(Q_TEXT, cur); }
        _flushingText = false;
      });
    }
    next();
  }

  function flushPhotos(force) {
    if (_flushingPhotos || !_client) return;
    if (!force && isWifi() !== true) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingPhotos = true;
    var q = readLS(Q_PHOTO); var i = 0;

    function next() {
      if (i >= q.length) { _flushingPhotos = false; return; }
      var p = q[i];
      var path = p.module + '/' + Date.now() + '_' + p.name;
      var blob = dataUrlToBlob(p.dataUrl);
      _client.storage.from(p.bucket).upload(path, blob, { upsert: true })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var pub = _client.storage.from(p.bucket).getPublicUrl(path);
          var url = pub && pub.data ? pub.data.publicUrl : null;
          var patch = {}; patch[p.field] = url;
          return _client.from(p.table).update(patch).eq('id', p.rowId);
        })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) cur.splice(idx, 1);
          writeLS(Q_PHOTO, cur);
          pushLog({ ts: new Date().toISOString(), module: p.module, table: p.table, kind: 'photo', ok: true });
          i++; next();
        })
        .catch(function () {
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; writeLS(Q_PHOTO, cur); }
          _flushingPhotos = false;
        });
    }
    next();
  }

  function getStatus() {
    return {
      textPending: readLS(Q_TEXT).length,
      photoPending: readLS(Q_PHOTO).length,
      log: readLS(Q_LOG),
      isWifi: isWifi()
    };
  }

  var API = {
    init: init, save: save, flushText: flushText, flushPhotos: flushPhotos,
    getStatus: getStatus, QUEUE_KEYS: { text: Q_TEXT, photo: Q_PHOTO, log: Q_LOG }
  };
  (typeof window !== 'undefined' ? window : global).RDZSync = API;
})(typeof window !== 'undefined' ? window : this);

const SUPABASE_URL = 'https://pdewmubikmotqzbxmyeq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkZXdtdWJpa21vdHF6YnhteWVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDU3MjgsImV4cCI6MjA5NDg4MTcyOH0.SRuhERPmB5_7a58nJ5oMg4a8mujnoLBv8dxkxvyNWao';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
RDZSync.init({ client: sb });

const LS_SITE = 'rdz_pile_last_site';
const AGENT_ID = localStorage.getItem('rdz_agent_id');
const AGENT_NOM = localStorage.getItem('rdz_agent_nom');
if (!AGENT_ID) { window.location.href = 'mobile.html'; }

function today() { return new Date().toISOString().split('T')[0]; }
function nowHM() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function initForm() {
  const savedSite = localStorage.getItem(LS_SITE);
  if (savedSite) document.getElementById('site-select').value = savedSite;
  document.getElementById('f-heure').value = nowHM();
  document.getElementById('f-date').value = today();
  loadTodayList();
}

function onSiteChange() {
  localStorage.setItem(LS_SITE, document.getElementById('site-select').value);
  loadTodayList();
}

async function loadTodayList() {
  const site = document.getElementById('site-select').value;
  const el = document.getElementById('today-list');
  el.innerHTML = '<div class="empty-today">Chargement…</div>';
  try {
    const { data, error } = await sb.from('changements_pile')
      .select('*')
      .eq('site', site)
      .eq('date_changement', today())
      .order('heure_changement', { ascending: false });
    if (error) throw error;
    if (!data || data.length === 0) {
      el.innerHTML = '<div class="empty-today">Aucun changement de pile enregistré aujourd\'hui pour ce site.</div>';
      return;
    }
    el.innerHTML = data.map(o => `
      <div class="today-row">
        <div class="today-time">${(o.heure_changement || '').slice(0,5)}</div>
        <div class="today-info">
          <div class="today-name">${escHtml(o.localisation || '—')}</div>
          <div class="today-meta">${escHtml(o.agent_nom || '')}</div>
        </div>
      </div>`).join('');
  } catch (err) {
    el.innerHTML = `<div class="empty-today">Erreur de chargement.</div>`;
  }
}

async function saveChangementPile() {
  const site = document.getElementById('site-select').value;
  const localisation = document.getElementById('f-localisation').value.trim();
  const heure = document.getElementById('f-heure').value;
  const date = document.getElementById('f-date').value;

  if (!heure) { alert('Veuillez indiquer une heure.'); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';

  RDZSync.save({
    module: 'changement-pile', table: 'changements_pile',
    row: {
      date_changement: date || today(),
      heure_changement: heure + ':00',
      site,
      localisation: localisation || null,
      agent_id: AGENT_ID,
      agent_nom: AGENT_NOM
    }
    // Pas d'id ni de photo : rien à faire suivre par le sous-système photo de RDZSync.
  });

  btn.disabled = false;
  btn.textContent = '✓ Enregistrer';

  toast('✓ Pris en compte' + (navigator.onLine ? '' : ' (hors-ligne — remontera dès le retour du réseau)'));
  document.getElementById('f-localisation').value = '';
  document.getElementById('f-heure').value = nowHM();
  loadTodayList();
}

initForm();
</script>
</body>
</html>
