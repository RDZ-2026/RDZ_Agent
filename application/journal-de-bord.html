<!-- RDZ · journal-de-bord · v2 · 2026-08-07 -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RDZ — Journal de bord</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --red:#8B1A1A; --red-dark:#6B1212;
  --report-red:#C8102E;
  --ink:#1a1a1a; --paper:#ffffff;
  --line:#d0d0d0; --line-soft:#e0e0e0;
  --bg-meta:#f0f0f0; --bg-soft:#f7f7f7;
  --ok:#1b7a3d; --warn:#b8860b; --danger:#8B1A1A;
  --radius-ui:2px; --radius-card:10px; --radius-section:8px;
  --font:Arial, Helvetica, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg-soft);color:var(--ink);-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg-soft);display:flex;flex-direction:column}
header{background:var(--red);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50}
header .brand{font-weight:bold;letter-spacing:.5px;font-size:14px}
header .sub{font-size:12px;opacity:.9;margin-top:2px}
header .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
header a.home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:var(--radius-ui);white-space:nowrap}
main{flex:1;padding:16px}
.hidden{display:none!important}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:#555;margin-bottom:14px}
.crumbs .c{background:#fff;border:1px solid var(--line-soft);border-radius:20px;padding:4px 11px}
.crumbs .c.act{background:var(--red);color:#fff;border-color:var(--red)}
.screen-title{font-size:17px;font-weight:bold;margin:0 0 14px;color:var(--ink)}
.group-btn{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1px solid var(--line-soft);
  border-radius:var(--radius-section);padding:16px;margin-bottom:12px;text-align:left;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.04);transition:border-color .1s}
.group-btn:active{border-color:var(--red)}
.group-btn .ic{font-size:26px;width:34px;text-align:center;flex-shrink:0}
.group-btn .txt .t{font-weight:bold;font-size:15.5px;color:var(--ink)}
.group-btn .txt .d{font-size:12.5px;color:#666;margin-top:2px}
.group-btn .chev{margin-left:auto;color:#bbb;font-size:20px}
.back-btn{background:none;border:none;color:var(--red);font-size:14px;font-weight:bold;cursor:pointer;padding:6px 0;margin-bottom:10px}
.state-msg{text-align:center;color:#999;font-size:14px;padding:30px 10px}
.err{background:#fdecea;border:1px solid #f5b5ae;color:#8B1A1A;border-radius:var(--radius-ui);padding:10px 12px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <div class="brand">RDZ SECURITY MANAGEMENT SA</div>
        <div class="sub">Journal de bord</div>
      </div>
      <a class="home" href="mobile.html">← Menu</a>
    </div>
  </header>

  <main>
    <div class="crumbs" id="crumbs"></div>

    <!-- Écran 1 : site -->
    <section id="screen-site">
      <div class="screen-title">Où êtes-vous ?</div>
      <div id="site-list"><div class="state-msg">Chargement des sites…</div></div>
    </section>

    <!-- Écran 2 : activité -->
    <section id="screen-activite" class="hidden">
      <button class="back-btn" onclick="goSite()">← Changer de site</button>
      <div class="screen-title">Que faites-vous&nbsp;?</div>
      <div id="activite-list"><div class="state-msg">Chargement…</div></div>
    </section>
  </main>
</div>

<script>
/* ===================== Journal de bord — LANCEUR PUR ===================== */
const SUPABASE_URL = 'https://pdewmubikmotqzbxmyeq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkZXdtdWJpa21vdHF6YnhteWVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDU3MjgsImV4cCI6MjA5NDg4MTcyOH0.SRuhERPmB5_7a58nJ5oMg4a8mujnoLBv8dxkxvyNWao';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentSite = null;      // {id, nom}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function show(id){ ['screen-site','screen-activite'].forEach(s=>{
  document.getElementById(s).classList.toggle('hidden', s!==id); }); window.scrollTo(0,0); }

function renderCrumbs(){
  const c = document.getElementById('crumbs');
  c.innerHTML = currentSite ? `<span class="c act">${esc(currentSite.nom)}</span>` : '';
}

/* ---------- Écran 1 : sites ---------- */
async function loadSites(){
  const box = document.getElementById('site-list');
  try{
    const { data, error } = await sb.from('sites').select('id,nom').eq('actif',true).order('nom');
    if(error) throw error;
    if(!data || !data.length){ box.innerHTML = '<div class="state-msg">Aucun site actif.</div>'; return; }
    box.innerHTML = data.map(s=>`
      <button class="group-btn" onclick='pickSite(${JSON.stringify(s).replace(/'/g,"&#39;")})'>
        <span class="ic">📍</span>
        <span class="txt"><span class="t">${esc(s.nom)}</span></span>
        <span class="chev">›</span>
      </button>`).join('');
  }catch(e){ box.innerHTML = `<div class="err">Impossible de charger les sites (réseau ?).</div>`; }
}
function pickSite(s){ currentSite = s; renderCrumbs(); loadActivites(); show('screen-activite'); }
function goSite(){ renderCrumbs(); show('screen-site'); }

/* ---------- Écran 2 : activités ---------- */
async function loadActivites(){
  const box = document.getElementById('activite-list');
  box.innerHTML = '<div class="state-msg">Chargement…</div>';
  try{
    const { data, error } = await sb.from('journal_activites').select('*')
      .eq('actif',true).or('site_id.is.null,site_id.eq.'+currentSite.id).order('ordre');
    if(error) throw error;
    if(!data || !data.length){ box.innerHTML = '<div class="state-msg">Aucune activité configurée pour ce site.</div>'; return; }
    box.innerHTML = data.map(a=>`
      <button class="group-btn" onclick='pickActivite(${JSON.stringify(a).replace(/'/g,"&#39;")})'>
        <span class="ic">${esc(a.icone||'📝')}</span>
        <span class="txt"><span class="t">${esc(a.label)}</span>${a.description?`<span class="d">${esc(a.description)}</span>`:''}</span>
        <span class="chev">›</span>
      </button>`).join('');
  }catch(e){ box.innerHTML = `<div class="err">Impossible de charger les activités (réseau ?).</div>`; }
}

/* Route vers le module cible en transmettant site + activité dans l'adresse.
   - type 'lien'  : cible_url (module existant)
   - type 'rapport' (ou cible_url vide) : rapport-standard.html
   Les paramètres site/activité sont toujours ajoutés ; les modules qui n'en
   ont pas besoin les ignorent simplement. */
function pickActivite(a){
  let target = (a.type === 'lien' && a.cible_url) ? a.cible_url : 'rapport-standard.html';
  const p = new URLSearchParams();
  if(currentSite){ p.set('site_id', currentSite.id); p.set('site', currentSite.nom); }
  p.set('activite', a.label);
  target += (target.indexOf('?') >= 0 ? '&' : '?') + p.toString();
  window.location.href = target;
}

loadSites();
</script>
</body>
</html>
