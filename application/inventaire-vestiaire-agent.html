<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RDZ — Inventaire Vestiaire</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --red:#8B1A1A;--red-d:#6B1212;--anth:#2d2d2d;
  --bg:#f0f0f3;--white:#fff;--border:#e2e2e6;--border2:#d0d0d6;
  --gray:#4a4a4a;--gray3:#9a9a9a;--green:#166534;--green-l:#dcfce7;--amber:#92400e;--amber-l:#fef3c7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);}
.screen.hidden{display:none;}
.topbar{flex-shrink:0;height:54px;background:var(--anth);display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:3px solid var(--red);}
.tb-back{width:34px;height:34px;background:rgba(255,255,255,.1);border:none;border-radius:6px;color:#fff;font-size:18px;cursor:pointer;}
.tb-title{color:#fff;font-size:14px;font-weight:700;}
.tb-sub{color:rgba(255,255,255,.5);font-size:10px;}
.body{flex:1;overflow-y:auto;padding:14px;}
.state-msg{text-align:center;padding:50px 16px;color:var(--gray3);font-size:13px;}

.big-btn{width:100%;padding:18px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;}
.session-card{background:#fff;border:1px solid var(--border);border-left:4px solid var(--amber);border-radius:6px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
.session-card:active{background:var(--bg);}
.session-agent{font-size:13px;font-weight:700;}
.session-meta{font-size:11.5px;color:var(--gray);margin-top:3px;}

.cat-title{font-size:11px;font-weight:700;color:#fff;background:var(--anth);padding:8px 14px;text-transform:uppercase;letter-spacing:.05em;margin-top:10px;}
.cat-title:first-child{margin-top:0;}
.art-card{background:#fff;border-bottom:1px solid var(--border);padding:11px 14px;}
.art-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.taille-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.taille-lbl{width:50px;font-size:12.5px;font-weight:700;color:var(--gray);flex-shrink:0;}
.taille-theo{font-size:11px;color:var(--gray3);width:70px;flex-shrink:0;}
.taille-input{flex:1;padding:8px 10px;border:1.5px solid var(--border2);border-radius:6px;font-size:14px;text-align:center;}
.taille-input.filled{background:var(--green-l);border-color:#86efac;}
.taille-input.ecart{background:#fef2f2;border-color:#fca5a5;}

.btn-finish{margin:16px 14px 26px;width:calc(100% - 28px);padding:14px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
#toasts{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:999;width:calc(100% - 24px);max-width:380px;}
.toast{background:var(--anth);color:#fff;padding:9px 13px;border-radius:9px;font-size:12.5px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3);}
.toast.err{background:#991b1b;}
</style>
</head>
<body>

<!-- ÉCRAN 1 : ACCUEIL -->
<div class="screen" id="s-home">
  <div class="topbar">
    <div><div class="tb-title">🔄 Inventaire Vestiaire</div><div class="tb-sub">RDZ Security Management</div></div>
  </div>
  <div class="body">
    <button class="big-btn" onclick="startNewSession()">➕ Démarrer un nouvel inventaire</button>
    <div id="sessions-list"></div>
  </div>
</div>

<!-- ÉCRAN 2 : COMPTAGE -->
<div class="screen hidden" id="s-count">
  <div class="topbar">
    <button class="tb-back" onclick="showScreen('s-home')">←</button>
    <div><div class="tb-title">Comptage en cours</div><div class="tb-sub" id="count-agent-name"></div></div>
  </div>
  <div class="body" id="count-body"><div class="state-msg">⏳ Chargement…</div></div>
  <button class="btn-finish" onclick="finishSession()">✅ Terminer l'inventaire</button>
</div>

<div id="toasts"></div>

<script>
// ═══ RDZSync v4 — brique commune, collée telle quelle (voir rdz-sync-v4.js) ═══
(function (global) {
  'use strict';

  var Q_TEXT = 'rdz_sync_queue';
  var Q_PHOTO = 'rdz_sync_photo_queue';
  var Q_LOG = 'rdz_sync_log';
  var LOG_MAX = 30;

  var _client = null;
  var _onChange = null;
  var _flushingText = false;
  var _flushingPhotos = false;

  function readLS(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; } }
  function writeLS(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {} notify(); }

  function notify() {
    var st = getStatus();
    if (typeof _onChange === 'function') { try { _onChange(st); } catch (e) {} }
    renderBadge(st);
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function dataUrlToBlob(dataUrl) {
    var parts = dataUrl.split(',');
    var mime = (parts[0].match(/:(.*?);/) || [, 'application/octet-stream'])[1];
    var bin = atob(parts[1]); var n = bin.length; var u8 = new Uint8Array(n);
    while (n--) u8[n] = bin.charCodeAt(n);
    return new Blob([u8], { type: mime });
  }

  function pushLog(entry) {
    var log = readLS(Q_LOG);
    log.unshift(entry);
    if (log.length > LOG_MAX) log = log.slice(0, LOG_MAX);
    writeLS(Q_LOG, log);
  }

  /* ---------- détection WiFi (best-effort, jamais garantie) ---------- */
  function isWifi() {
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!c) return null;               // inconnu (iPhone/Safari notamment)
      if (typeof c.type === 'string') return c.type === 'wifi';
      if (typeof c.effectiveType === 'string') return null; // effectiveType = vitesse, pas le support
      return null;
    } catch (e) { return null; }
  }

  /* ---------- badge visuel ---------- */
  function ensureBadge() {
    var b = document.getElementById('rdz-sync-badge');
    if (b) return b;
    b = document.createElement('div');
    b.id = 'rdz-sync-badge';
    b.style.cssText =
      'position:fixed;left:12px;bottom:12px;z-index:99999;' +
      'font:600 12.5px Arial,Helvetica,sans-serif;color:#fff;' +
      'background:#b8860b;padding:8px 12px;border-radius:2px;line-height:1.5;' +
      'box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;cursor:pointer;max-width:260px;';
    b.title = 'Cliquer pour forcer la synchronisation';
    b.onclick = function () { flushText(); flushPhotos(true); };
    document.body.appendChild(b);
    return b;
  }
  function renderBadge(st) {
    if (typeof document === 'undefined' || !document.body) return;
    var b = ensureBadge();
    var parts = [];
    if (st.textPending > 0) parts.push('⏳ ' + st.textPending + ' donnée(s) en attente de réseau');
    if (st.photoPending > 0) parts.push('📷 ' + st.photoPending + ' photo(s) en attente de WiFi');
    if (parts.length === 0) { b.style.display = 'none'; return; }
    b.innerHTML = parts.join('<br>');
    b.style.display = 'block';
  }

  /* ---------- API publique ---------- */
  function init(opts) {
    opts = opts || {};
    _client = opts.client || _client;
    if (typeof opts.onChange === 'function') _onChange = opts.onChange;
    if (typeof global.addEventListener === 'function') {
      global.addEventListener('online', function () { flushText(); tryAutoPhotos(); });
    }
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (c && typeof c.addEventListener === 'function') {
        c.addEventListener('change', tryAutoPhotos);
      }
    } catch (e) {}
    if (typeof document !== 'undefined') {
      var start = function () { notify(); flushText(); tryAutoPhotos(); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    }
    return API;
  }

  function tryAutoPhotos() { if (isWifi() === true) flushPhotos(false); }

  /* save() : NON bloquant. Le texte est mis en file et une tentative
     d'envoi part immédiatement (auto, sur n'importe quel réseau).
     Les photos sont mises de côté et attendent le WiFi ou un geste manuel. */
  function save(item) {
    var textEntry = {
      id: uid(),
      module: item.module || 'inconnu',
      table: item.table,
      op: item.op || 'insert',
      onConflict: item.onConflict || null,
      row: Object.assign({}, item.row || {}),
      photoField: item.photoField || null,
      bucket: item.bucket || null,
      pendingPhotos: item.photos || [],   // gardées ici jusqu'à ce que le texte soit parti
      ts: new Date().toISOString(),
      tries: 0
    };
    var q = readLS(Q_TEXT); q.push(textEntry); writeLS(Q_TEXT, q);
    setTimeout(flushText, 0);
    return textEntry.id;
  }

  /* ---------- file TEXTE : envoi auto, tout réseau ---------- */
  function flushText() {
    if (_flushingText || !_client) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingText = true;
    var q = readLS(Q_TEXT); var i = 0;

    function next() {
      if (i >= q.length) { _flushingText = false; return; }
      var it = q[i];
      var qb = _client.from(it.table);
      // Pas de .select() après écriture : on ne dépend jamais d'une permission de
      // LECTURE en plus de la permission d'ÉCRITURE (une table plus ancienne peut
      // autoriser l'insert sans autoriser le select en retour — .select() y échouerait
      // silencieusement et la ligne resterait bloquée en file indéfiniment).
      // On utilise l'id fourni côté agent (row.id, déjà généré via uid() par tous les
      // modules) pour rattacher les photos ensuite.
      var req = (it.op === 'upsert')
        ? qb.upsert(it.row, it.onConflict ? { onConflict: it.onConflict } : undefined)
        : qb.insert(it.row);

      req.then(function (res) {
        if (res && res.error) throw res.error;
        // succès texte : retirer de la file texte + logguer
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) cur.splice(idx, 1);
        writeLS(Q_TEXT, cur);
        pushLog({ ts: new Date().toISOString(), module: it.module, table: it.table, kind: 'texte', ok: true });

        // s'il y avait des photos en attente, les basculer dans la file photo
        // (rattachées via l'id fourni côté agent dans row.id)
        var rowId = it.row && it.row.id != null ? it.row.id : null;
        if (it.pendingPhotos && it.pendingPhotos.length) {
          if (rowId == null) {
            console.warn('RDZSync: photos ignorées — aucun id fourni dans row.id pour', it.table);
          } else {
            var pq = readLS(Q_PHOTO);
            it.pendingPhotos.forEach(function (p) {
              pq.push({
                id: uid(), module: it.module, table: it.table, rowId: rowId,
                bucket: it.bucket, field: p.field || it.photoField, name: p.name || 'photo.jpg',
                dataUrl: p.dataUrl, ts: new Date().toISOString(), tries: 0
              });
            });
            writeLS(Q_PHOTO, pq);
            tryAutoPhotos();
          }
        }
        i++; next();
      }).catch(function () {
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; writeLS(Q_TEXT, cur); }
        _flushingText = false; // réseau probablement absent : on retentera au prochain online/ouverture
      });
    }
    next();
  }

  /* ---------- file PHOTOS : envoi WiFi (best-effort) ou manuel (force=true) ---------- */
  function flushPhotos(force) {
    if (_flushingPhotos || !_client) return;
    if (!force && isWifi() !== true) return; // pas de WiFi détecté et pas d'appui manuel -> on attend
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingPhotos = true;
    var q = readLS(Q_PHOTO); var i = 0;

    function next() {
      if (i >= q.length) { _flushingPhotos = false; return; }
      var p = q[i];
      var path = p.module + '/' + Date.now() + '_' + p.name;
      var blob = dataUrlToBlob(p.dataUrl);
      _client.storage.from(p.bucket).upload(path, blob, { upsert: true })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var pub = _client.storage.from(p.bucket).getPublicUrl(path);
          var url = pub && pub.data ? pub.data.publicUrl : null;
          var patch = {}; patch[p.field] = url;
          return _client.from(p.table).update(patch).eq('id', p.rowId);
        })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) cur.splice(idx, 1);
          writeLS(Q_PHOTO, cur);
          pushLog({ ts: new Date().toISOString(), module: p.module, table: p.table, kind: 'photo', ok: true });
          i++; next();
        })
        .catch(function () {
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; writeLS(Q_PHOTO, cur); }
          _flushingPhotos = false;
        });
    }
    next();
  }

  function getStatus() {
    return {
      textPending: readLS(Q_TEXT).length,
      photoPending: readLS(Q_PHOTO).length,
      log: readLS(Q_LOG),
      isWifi: isWifi()
    };
  }

  var API = {
    init: init, save: save, flushText: flushText, flushPhotos: flushPhotos,
    getStatus: getStatus, QUEUE_KEYS: { text: Q_TEXT, photo: Q_PHOTO, log: Q_LOG }
  };
  (typeof window !== 'undefined' ? window : global).RDZSync = API;
})(typeof window !== 'undefined' ? window : this);


const SUPABASE_URL = 'https://pdewmubikmotqzbxmyeq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkZXdtdWJpa21vdHF6YnhteWVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDU3MjgsImV4cCI6MjA5NDg4MTcyOH0.SRuhERPmB5_7a58nJ5oMg4a8mujnoLBv8dxkxvyNWao';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
RDZSync.init({ client: sb });

const AGENT_NOM = localStorage.getItem('rdz_agent_nom') || 'Agent';
function uid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }); }

let articles = [], tailles = [], currentSession = null, lignes = [];

function escHtml(s){ return (s??'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
function toast(msg, err){
  const t = document.createElement('div');
  t.className = 'toast' + (err?' err':'');
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

async function loadHome(){
  try{
    const [{data:art},{data:t},{data:sessions}] = await Promise.all([
      sb.from('stock_vestiaire_items').select('*').eq('actif',true).order('categorie').order('nom'),
      sb.from('stock_tailles').select('*'),
      sb.from('stock_inventaires').select('*').eq('statut','en_cours').order('created_at',{ascending:false})
    ]);
    articles = art||[]; tailles = t||[];
    const el = document.getElementById('sessions-list');
    if(!sessions || !sessions.length){ el.innerHTML=''; return; }
    el.innerHTML = '<div style="font-size:11px;font-weight:700;color:var(--gray3);text-transform:uppercase;margin:14px 0 8px">Inventaires en cours</div>' +
      sessions.map(s => `<div class="session-card" onclick="resumeSession('${s.id}')">
        <div class="session-agent">👤 ${escHtml(s.agent_nom)}</div>
        <div class="session-meta">Démarré le ${new Date(s.created_at).toLocaleDateString('fr-CH')} à ${new Date(s.created_at).toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>`).join('');
  }catch(e){ toast('Erreur chargement : '+e.message, true); }
}

async function startNewSession(){
  const sessionId = uid();
  currentSession = { id: sessionId, agent_nom: AGENT_NOM, statut:'en_cours', created_at: new Date().toISOString() };
  RDZSync.save({
    module: 'inventaire-vestiaire', table: 'stock_inventaires', op:'upsert', onConflict:'id',
    row: currentSession
  });
  lignes = [];
  await openCounting();
}
async function resumeSession(id){
  try{
    const { data, error } = await sb.from('stock_inventaires').select('*').eq('id',id).single();
    if(error) throw error;
    currentSession = data;
    const { data: l } = await sb.from('stock_inventaire_lignes').select('*').eq('inventaire_id', id);
    lignes = l || [];
    await openCounting();
  }catch(e){ toast('Erreur : '+e.message, true); }
}

async function openCounting(){
  document.getElementById('count-agent-name').textContent = currentSession.agent_nom;
  renderCounting();
  showScreen('s-count');
}

function renderCounting(){
  const el = document.getElementById('count-body');
  if(!articles.length){ el.innerHTML = `<div class="state-msg">Aucun article vestiaire configuré.</div>`; return; }
  const byCat = {};
  articles.forEach(a => { (byCat[a.categorie||'Autre'] = byCat[a.categorie||'Autre']||[]).push(a); });

  el.innerHTML = Object.keys(byCat).sort().map(cat => {
    return `<div class="cat-title">${escHtml(cat)}</div>` + byCat[cat].map(art => {
      const artTailles = tailles.filter(t => t.article_id === art.id);
      if(!artTailles.length) return '';
      return `<div class="art-card">
        <div class="art-name">${art.icon||'👕'} ${escHtml(art.nom)}</div>
        ${artTailles.map(t => {
          const ligne = lignes.find(l => l.article_id===art.id && l.taille===t.taille);
          const val = ligne && ligne.quantite_comptee!==null && ligne.quantite_comptee!==undefined ? ligne.quantite_comptee : '';
          const cls = val==='' ? '' : (parseInt(val)===t.quantite ? 'filled' : 'ecart');
          return `<div class="taille-row">
            <div class="taille-lbl">${escHtml(t.taille)}</div>
            <div class="taille-theo">Théo. ${t.quantite}</div>
            <input type="number" min="0" class="taille-input ${cls}" value="${val}"
              data-article="${art.id}" data-article-nom="${escHtml(art.nom)}" data-taille="${escHtml(t.taille)}" data-theo="${t.quantite}"
              placeholder="Compté" onchange="onCountChange(this)">
          </div>`;
        }).join('')}
      </div>`;
    }).join('');
  }).join('');
}

async function onCountChange(input){
  const articleId = input.dataset.article;
  const articleNom = input.dataset.articleNom;
  const taille = input.dataset.taille;
  const theo = parseInt(input.dataset.theo);
  const val = input.value === '' ? null : parseInt(input.value);

  input.classList.remove('filled','ecart');
  if(val !== null) input.classList.add(val===theo ? 'filled' : 'ecart');

  const row = {
    inventaire_id: currentSession.id, article_id: articleId, article_nom: articleNom,
    taille, quantite_theorique: theo, quantite_comptee: val
  };
  RDZSync.save({
    module: 'inventaire-vestiaire', table: 'stock_inventaire_lignes', op:'upsert',
    onConflict: 'inventaire_id,article_id,taille', row
  });
  const idx = lignes.findIndex(l => l.article_id===articleId && l.taille===taille);
  if(idx>-1) lignes[idx]=Object.assign({}, lignes[idx], row); else lignes.push(row);
}

async function finishSession(){
  const compte = lignes.filter(l => l.quantite_comptee !== null && l.quantite_comptee !== undefined).length;
  if(!confirm(compte + ' ligne(s) comptée(s). Terminer et transmettre cet inventaire ?')) return;
  RDZSync.save({
    module: 'inventaire-vestiaire', table: 'stock_inventaires', op:'upsert', onConflict:'id',
    row: { id: currentSession.id, statut:'termine', termine_at: new Date().toISOString() }
  });
  toast('✅ Inventaire pris en compte' + (navigator.onLine ? '' : ' (hors-ligne — remontera dès le retour du réseau)'));
  showScreen('s-home');
  loadHome();
}

loadHome();
</script>

</body>
</html>
