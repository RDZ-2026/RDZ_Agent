<!--
  Page autonome du pilote planning agent.
  - Identification IDENTIQUE à l'application RDZ Agent : choix du nom puis
    code PIN à 4 chiffres (même table agents, même hash, projet RDZ_Agent).
  - Session PARTAGÉE avec application.html (01.10.2026) : mêmes clés
    localStorage rdz_agent_id / rdz_agent_nom / rdz_agent_pin_hash que tous
    les modules agent. Un agent déjà identifié dans l'application arrive
    directement sur son planning, sans ressaisir nom ni PIN. L'écran
    d'identification ne sert plus qu'en secours (page ouverte seule).
    Ouverte depuis le bouton "Mon planning" d'application.html ; bouton
    retour (icône grille, bandeau du haut) vers mobile.html.
  - Seuls les agents inscrits dans rdz_planning_pilot_agents (routeops)
    apparaissent, et seuls les services publiés (≠ "Planifiée") sont lus.
  Prérequis (routeops) : claude_migration-planning-pilote-agents.sql,
  puis -correctif-id.sql, -modifications.sql, -conges.sql,
  -refus-journal.sql, -temps-presence.sql,
  -heures-auto.sql.
-->

.auth-top .logo{height:58px;margin:0 auto;}
.wm{display:flex;flex-direction:column;align-items:center;line-height:1;}
.wm-main{font-weight:800;font-size:26px;letter-spacing:-.02em;color:#fff;}
.wm-sub{font-size:7.5px;letter-spacing:.28em;color:rgba(255,255,255,.7);margin-top:3px;font-weight:600;}

/* ── Écrans d'identification ── */
.auth{min-height:100vh;background:linear-gradient(160deg,var(--ink),var(--ink-2));display:flex;flex-direction:column;}
.auth-top{padding:34px 22px 26px;}
.auth-top .wm-main{font-size:38px;}
.auth-top .wm-sub{font-size:9px;}
.auth-body{flex:1;background:var(--bg);border-radius:22px 22px 0 0;padding:24px 18px 32px;display:flex;flex-direction:column;}
.auth-inner{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;}
.auth-title{font-size:22px;font-weight:800;letter-spacing:-.015em;}
.auth-sub{font-size:13.5px;color:var(--text2);margin:4px 0 18px;line-height:1.45;}
.notice{background:var(--warn-bg);color:#78350f;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:14px;}
.pick{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:16px;font-size:15.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;width:100%;text-align:left;}
.pick:active{background:var(--red-light);}
.pick svg{width:18px;height:18px;color:var(--text3);}
.muted-txt{text-align:center;color:var(--text3);font-size:13.5px;padding:24px 0;line-height:1.5;}

.pin-wrap{display:flex;flex-direction:column;align-items:center;flex:1;}
.pin-name{font-size:19px;font-weight:800;margin-top:6px;text-align:center;}
.pin-msg{font-size:13.5px;color:var(--text2);margin-top:6px;text-align:center;line-height:1.45;min-height:20px;}
.pin-msg.warn{background:var(--warn-bg);color:#78350f;padding:9px 12px;border-radius:10px;}
.pin-msg.err{color:#b91c1c;font-weight:600;}
.dots{display:flex;gap:16px;margin:22px 0 26px;}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);}
.dot.on{background:var(--ink);}
.dots.shake{animation:shake .35s;}
@keyframes shake{20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;}
.key{width:76px;height:76px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.key:active{background:var(--red-light);}
.key.fn{background:none;border:none;font-size:13px;font-weight:700;color:var(--text2);}
.back-link{margin-top:auto;padding-top:24px;font-size:13.5px;color:var(--text2);text-decoration:underline;align-self:center;}

/* ── Boutons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:10px;font-size:15px;font-weight:700;padding:0 16px;text-decoration:none;}
.btn:active{transform:scale(.98);}
.btn-block{width:100%;}
.btn-red{background:var(--red);color:#fff;}
.btn-white{background:#fff;color:var(--ink);}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.btn-ghost{background:var(--muted-bg);color:var(--text);}
.btn-sm{height:40px;font-size:13.5px;padding:0 12px;}
.btn svg{width:17px;height:17px;flex:none;}

/* ── Application ── */
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;height:56px;display:flex;align-items:center;justify-content:center;}
.tb-left,.tb-right{position:absolute;top:0;height:56px;display:flex;align-items:center;}
.tb-left{left:6px;} .tb-right{right:6px;}
.tb-title{font-weight:600;font-size:16px;}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:#fff;}
.icon-btn svg{width:22px;height:22px;}
.icon-btn.spin svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
main{flex:1;padding:18px 16px 96px;max-width:560px;width:100%;margin:0 auto;}
main.with-compose{padding-bottom:170px;}
/* ── Messages ── */
.msg-seg{display:grid;grid-template-columns:1fr 1fr;background:#e5e7eb;border-radius:11px;padding:3px;margin-bottom:14px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:5;}
.msg-seg button{height:38px;border-radius:9px;font-weight:700;font-size:14px;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px;}
.msg-seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.msg-seg .n{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
.msg-day{text-align:center;font-size:11.5px;font-weight:700;color:var(--text3);margin:16px 0 8px;text-transform:capitalize;}
.bub{max-width:82%;padding:9px 12px 6px;border-radius:16px;margin-bottom:6px;font-size:14.5px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;}
.bub .t{display:block;font-size:10.5px;opacity:.7;text-align:right;margin-top:3px;}
.bub.me{margin-left:auto;background:var(--ink);color:#fff;border-bottom-right-radius:5px;}
.bub.them{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;}
.bub.them .who{display:block;font-size:11px;font-weight:700;color:var(--red);margin-bottom:2px;}
.bub.ann{max-width:100%;background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;}
.bub.pending{opacity:.6;}
.compose{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px;}
.compose-in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;}
.compose textarea{flex:1;min-height:44px;max-height:120px;border:1.5px solid var(--line);border-radius:22px;padding:11px 16px;font-size:16px;font-family:inherit;resize:none;background:#fff;line-height:1.35;}
.compose textarea:focus{outline:none;border-color:var(--ink);}
.compose .send{width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
.compose .send:disabled{opacity:.5;}
.compose .send svg{width:20px;height:20px;}
.msg-seg.three{grid-template-columns:1fr 1fr 1fr;}
.msg-seg.three button{font-size:13px;}
.grp-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.grp-row:active{background:#fafafa;}
.grp-av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
.grp-av svg{width:20px;height:20px;}
.grp-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.grp-main b{font-size:15px;}
.grp-main span{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.grp-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;}
.grp-side small{font-size:11px;color:var(--text3);}
.grp-side .n{min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
.grp-head{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 6px;margin-bottom:10px;}
.grp-head b{display:block;font-size:15px;}
.grp-head span{display:block;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icon-b{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
.icon-b svg{width:20px;height:20px;}
.pdsa-box{margin-top:14px;border-radius:12px;padding:12px;background:#fff;border:1px solid var(--line);}
.pdsa-box.dark{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);}
.d-head + .pdsa-box{margin:0 0 12px;}
.pd-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:9px;display:flex;align-items:center;gap:8px;}
.pdsa-box.dark .pd-title{color:rgba(255,255,255,.6);}
.pd-late{background:var(--red);color:#fff;border-radius:20px;padding:2px 8px;font-size:10px;letter-spacing:.02em;animation:pulse 1.4s ease-in-out infinite;}
.pd-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pd-step{display:flex;align-items:center;gap:9px;border-radius:11px;padding:10px;text-align:left;min-height:58px;font-family:inherit;border:1.5px solid transparent;}
.pd-step svg{width:20px;height:20px;flex:none;}
.pd-step b{display:block;font-size:15px;font-weight:800;}
.pd-step span{display:block;font-size:11.5px;line-height:1.3;opacity:.85;}
.pd-step.go.pdsa{background:#f59e0b;color:#1f1300;}
.pd-step.go.pds{background:#16a34a;color:#fff;}
.pd-step.wait{background:var(--muted-bg);color:var(--text3);}
.pdsa-box.dark .pd-step.wait{background:rgba(255,255,255,.08);color:rgba(255,255,255,.55);}
.pd-step.done{background:var(--ok-bg);color:var(--ok);}
.pdsa-box.dark .pd-step.done{background:rgba(22,163,74,.2);color:#86efac;}
.msg-banner{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--red);border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13.5px;font-weight:700;width:100%;text-align:left;color:var(--text);}
.msg-banner svg{width:20px;height:20px;color:var(--red);flex:none;}
.msg-banner span{flex:1;}


.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--text3);padding:4px 0;}
.tab svg{width:23px;height:23px;}
.tab.on{color:var(--red);}

.hello{font-size:26px;font-weight:800;letter-spacing:-.02em;}
.hello-sub{color:var(--text2);font-size:14px;margin:3px 0 18px;}
.next{background:var(--ink);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:22px;box-shadow:0 10px 26px rgba(17,28,46,.25);}
.next-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.6);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.kind-pill{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:0;}
.kind-pill svg{width:14px;height:14px;}
.kind-pill.day{background:var(--day-bg);color:var(--day-tx);}
.kind-pill.day svg{color:var(--day-ic);}
.kind-pill.night{background:#312e81;color:#e0e7ff;}
.kind-pill.night svg{color:var(--night-ic);}
/* code couleur jour / nuit sur les lignes */
.srow.k-day,.tp-row.k-day{border-left:4px solid var(--day-bd);}
.srow.k-night,.tp-row.k-night{border-left:4px solid var(--night-bd);}
.kind-ic{display:inline-flex;width:14px;height:14px;}
.kind-ic svg{width:14px;height:14px;}
.kind-ic.day{color:var(--day-ic);}
.kind-ic.night{color:#4338ca;}
/* Ma semaine */
.week{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px 14px;margin-bottom:22px;}
.week-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;}
.week-head .t{font-size:18px;font-weight:800;letter-spacing:-.01em;}
.week-head .s{font-size:13px;color:var(--text2);margin-top:2px;}
.week-nav{display:flex;gap:8px;}
.week-nav button{width:40px;height:40px;border:1.5px solid var(--line);border-radius:11px;display:flex;align-items:center;justify-content:center;background:#fff;}
.week-nav button svg{width:18px;height:18px;}
.week-nav button.prev svg{transform:rotate(180deg);}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.wday{border-radius:11px;padding:7px 2px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid transparent;min-width:0;background:none;font-family:inherit;}
.wday .dw{font-size:11.5px;font-weight:600;}
.wday .dn{font-size:19px;font-weight:800;line-height:1.05;}
.wday .di{height:17px;display:flex;align-items:center;justify-content:center;}
.wday .di svg{width:16px;height:16px;}
.wday .dh{font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:-.02em;}
.wday.rest{border:1.5px dashed #d1d5db;background:#fafafa;color:var(--text2);}
.wday.rest .di{color:var(--text3);font-weight:800;}
.wday.dayk{background:var(--day-bg);border-color:var(--day-bd);color:var(--day-tx);}
.wday.dayk .di{color:var(--day-ic);}
.wday.nightk{background:var(--night-bg);border-color:var(--night-bd);color:var(--night-tx);}
.wday.nightk .di{color:var(--night-ic);}
.wday.leavek{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6;}
.wday.past{opacity:.55;}
.wday.today{outline:2px solid var(--red);outline-offset:1px;}
.wday.today .dw{color:var(--red);font-weight:800;}
.wday.nightk.today .dw{color:#fca5a5;}
.week-foot{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:12.5px;color:var(--text2);}
.lg{display:inline-flex;align-items:center;gap:6px;}
.lg i{width:14px;height:14px;border-radius:4px;display:inline-block;}
.lg i.d{background:var(--day-bg);border:1.5px solid var(--day-bd);}
.lg i.n{background:var(--night-bg);}
.lg i.r{border:1.5px dashed #d1d5db;}
.week-total{margin-left:auto;font-weight:800;color:var(--text);font-size:14px;white-space:nowrap;}
.week .btn{margin-top:12px;height:46px;background:var(--bg);color:var(--red);border:1px solid var(--line);}
.wd-day{font-size:12.5px;font-weight:800;color:var(--text2);margin:14px 2px 7px;text-transform:capitalize;}
.wd-rest{font-size:13px;color:var(--text3);padding:10px 14px;border:1.5px dashed var(--line);border-radius:12px;}

.live{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;border-radius:20px;padding:2px 8px;font-size:10.5px;}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.3;}}
.next-body{display:flex;align-items:center;gap:10px;cursor:pointer;}
.next-lines{flex:1;display:flex;flex-direction:column;gap:9px;}
.nl{display:flex;align-items:center;gap:10px;font-size:14.5px;}
.nl svg{width:17px;height:17px;flex:none;opacity:.85;}
.nl.site{font-size:22px;font-weight:800;}
.nl .pill{background:#16a34a;color:#fff;border-radius:5px;padding:1px 7px;font-size:12.5px;font-weight:700;}
.nl .pill.tmw{background:#2563eb;}
.chev{width:22px;height:22px;opacity:.7;flex:none;}
.next-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.next-actions.one{grid-template-columns:1fr;}
.sec-title{font-size:18px;font-weight:800;margin:0 0 10px;}
.empty{background:#fff;border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--text2);font-size:14px;line-height:1.5;border:1px dashed var(--line);}
.empty b{display:block;color:var(--text);font-size:15.5px;margin-bottom:4px;}

.srow{background:#fff;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;margin-bottom:9px;border:1px solid var(--line);width:100%;text-align:left;}
.srow:active{background:#fafafa;}
.dblock{width:48px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:10px;}
.dblock .dw{font-size:11px;font-weight:700;color:var(--text3);text-transform:capitalize;}
.dblock .dn{font-size:22px;font-weight:800;line-height:1.1;}
.dblock .dm{font-size:11px;color:var(--text2);}
.dblock.today .dn,.dblock.today .dw{color:var(--red);}
.sinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.sinfo .s1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sinfo .s2,.sinfo .s3{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.sinfo svg{width:14px;height:14px;flex:none;}
.srow .chev{color:var(--text3);opacity:1;width:18px;height:18px;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap;}
.chip.ok{background:var(--ok-bg);color:var(--ok);}
.chip.info{background:var(--info-bg);color:var(--info);}
.chip.muted{background:var(--muted-bg);color:var(--text2);}
.chip.warn{background:var(--warn-bg);color:var(--warn);}

/* ── Carte chiffres ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:22px;overflow:hidden;}
.stat{padding:14px 8px 13px;text-align:center;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;}
.stat:first-child{border-left:none;}
.stat .n{font-size:25px;font-weight:800;line-height:1;letter-spacing:-.02em;}
.stat .l{font-size:11.5px;color:var(--text2);font-weight:600;}
.stat.alert{background:var(--warn-bg);}
.stat.alert .n,.stat.alert .l{color:var(--warn);}
button.stat{font-family:inherit;}

/* ── Journal des modifications ── */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.sec-head .sec-title{margin:0;}
.sec-link{font-size:13px;font-weight:700;color:var(--red);}
.changes{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:22px;}
.chg{display:flex;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left;align-items:flex-start;}
.chg:first-child{border-top:none;}
button.chg:active{background:#fafafa;}
.chg-ic{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;}
.chg-ic svg{width:16px;height:16px;}
.chg-ic.add{background:var(--ok-bg);color:var(--ok);}
.chg-ic.mod{background:var(--info-bg);color:var(--info);}
.chg-ic.del{background:#fee2e2;color:#b91c1c;}
.chg-body{flex:1;min-width:0;}
.chg-top{display:flex;justify-content:space-between;gap:8px;}
.chg-t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
.chg-new{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;}
.chg-at{font-size:11.5px;color:var(--text3);white-space:nowrap;padding-top:2px;}
.chg-s{font-size:13px;color:var(--text2);margin-top:2px;}
.chg.del .chg-s{text-decoration:line-through;}
.chg-d{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.55;background:var(--bg);border-radius:8px;padding:6px 9px;}
.chg-d b{color:var(--text);font-weight:600;}
.chg-empty{padding:18px 14px;text-align:center;font-size:13.5px;color:var(--text2);line-height:1.5;}

/* ── Validation ── */
.validate-bar{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:#78350f;border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:14px;font-size:13.5px;font-weight:600;}
.validate-bar span{flex:1;}
.validate-bar .btn{height:36px;}
.done-banner{display:flex;align-items:center;gap:10px;background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:14px;font-weight:700;font-size:14.5px;margin-top:12px;}
.done-banner svg{width:20px;height:20px;flex:none;}
.d-note{font-size:12.5px;color:var(--text2);margin-top:10px;line-height:1.45;text-align:center;}
.tab{position:relative;}
.tab-dot{position:absolute;top:1px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.sheet-bg{position:fixed;inset:0;background:rgba(17,28,46,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;max-height:85vh;overflow:auto;}
@keyframes up{from{transform:translateY(40px);opacity:0;}}
.sheet h2{text-align:center;font-size:19px;margin-bottom:6px;}
.sheet .sub{text-align:center;font-size:13.5px;color:var(--text2);margin-bottom:14px;line-height:1.45;}
.sheet-list{background:var(--bg);border-radius:12px;padding:4px 12px;margin-bottom:16px;}
.sheet-list div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line);}
.sheet-list div:first-child{border-top:none;}
.sheet-list b{font-weight:700;}
.sheet .btn + .btn{margin-top:10px;}

/* ── Congés ── */
.leave{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:22px;}
.leave-top{display:flex;align-items:center;gap:14px;}
.leave-ring{width:62px;height:62px;flex:none;position:relative;}
.leave-ring svg{width:62px;height:62px;transform:rotate(-90deg);}
.leave-ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
.leave-ring .v b{font-size:19px;font-weight:800;}
.leave-ring .v small{font-size:9.5px;color:var(--text2);font-weight:600;margin-top:2px;}
.leave-txt{flex:1;min-width:0;}
.leave-txt .t{font-weight:800;font-size:16px;}
.leave-txt .s{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.45;}
.leave .btn{margin-top:14px;}
.leave-list{margin-top:12px;border-top:1px solid var(--line);}
.lv{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.lv:last-child{border-bottom:none;}
.lv-main{flex:1;min-width:0;}
.lv-main b{display:block;font-size:13.5px;}
.lv-main span{font-size:12.5px;color:var(--text2);}
.lv-x{font-size:12px;font-weight:700;color:#b91c1c;padding:6px 4px;}
.chip.bad{background:#fee2e2;color:#b91c1c;}
.d-btns2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:10px;}
.btn-danger-o{background:#fff;color:#b91c1c;border:1.5px solid #fecaca;}
.refused-banner{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d;border-radius:12px;padding:14px;margin-top:12px;font-size:13.5px;line-height:1.5;}
.refused-banner b{display:block;font-size:14.5px;color:#b91c1c;margin-bottom:4px;}
.refused-banner .btn{margin-top:10px;}
.presets{display:flex;flex-wrap:wrap;gap:8px;}
.presets button{border:1.5px solid var(--line);border-radius:20px;padding:8px 12px;font-size:13px;font-weight:600;background:#fff;}
.presets button.on{border-color:var(--ink);background:var(--ink);color:#fff;}
.chg-ic.ok{background:var(--ok-bg);color:var(--ok);}
.chg-ic.bad{background:#fee2e2;color:#b91c1c;}
.chg-ic.neutral{background:var(--muted-bg);color:var(--text2);}
.chg-ic.leave{background:#ede9fe;color:#6d28d9;}
.pdf-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 2px 14px;}
.pdf-bar .month-sum{margin:0;}
.btn-pdf{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink);flex:none;}
.btn-pdf svg{width:16px;height:16px;}
.months{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.months button{border:1.5px solid var(--line);border-radius:11px;padding:10px 6px;font-weight:700;font-size:13.5px;background:#fff;text-transform:capitalize;}
.months button small{display:block;font-weight:500;font-size:11.5px;color:var(--text2);margin-top:2px;text-transform:none;}
.months button.on{border-color:var(--ink);background:var(--ink);color:#fff;}
.months button.on small{color:rgba(255,255,255,.75);}
.tp-row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;width:100%;text-align:left;display:flex;gap:12px;align-items:center;}
.tp-row:active{background:#fafafa;}
.tp-row .dblock{align-self:flex-start;}
.tp-lines{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.tp-lines .s1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tp-l{font-size:13px;color:var(--text2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.tp-l b{color:var(--text);}
.tp-diff{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px;}
.tp-diff.plus{background:var(--warn-bg);color:var(--warn);}
.tp-diff.minus{background:var(--info-bg);color:var(--info);}
.tp-rej{font-size:12.5px;color:#b91c1c;margin-top:3px;}
.tp-cta{font-size:12.5px;font-weight:700;color:#fff;background:var(--red);border-radius:8px;padding:7px 10px;flex:none;}
.tp-edit{font-size:12.5px;font-weight:700;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;flex:none;background:#fff;}
.tp-sec{font-size:13px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:20px 2px 9px;}
.tp-intro{font-size:13.5px;color:var(--text2);line-height:1.5;margin:-4px 2px 16px;}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dc-plan{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:4px;}
.dc-plan b{font-weight:700;}
.dc-rej{background:#fef2f2;color:#7f1d1d;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;margin-top:10px;}
.chg-note{font-size:12.5px;color:var(--text2);margin-top:5px;font-style:italic;}
.srow.absence{cursor:default;background:#f8fafc;border-style:dashed;}
.fl{display:block;font-size:12.5px;font-weight:700;color:var(--text2);margin:14px 0 6px;}
.kind-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.kind-seg button{border:1.5px solid var(--line);border-radius:11px;padding:11px 8px;font-weight:700;font-size:14px;background:#fff;}
.kind-seg button.on{border-color:var(--ink);background:var(--ink);color:#fff;}
.one-day{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:14px;font-weight:600;}
.switch{width:46px;height:28px;border-radius:14px;background:#d1d5db;position:relative;transition:.15s;flex:none;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s;}
.switch.on{background:var(--ink);}
.switch.on::after{left:21px;}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dates.one{grid-template-columns:1fr;}
.finp{width:100%;height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;font-family:inherit;background:#fff;color:var(--text);}
textarea.finp{height:70px;padding:10px 12px;resize:none;}
.finp:focus{outline:none;border-color:var(--ink);}
.req-sum{margin-top:14px;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.45;background:var(--bg);color:var(--text2);}
.req-sum.warn{background:var(--warn-bg);color:#78350f;}
.req-err{margin-top:12px;font-size:13px;color:#b91c1c;font-weight:600;min-height:0;}
.chip svg{width:12px;height:12px;}

.seg{display:grid;grid-template-columns:1fr 1fr;background:#e5e7eb;border-radius:11px;padding:3px;margin-bottom:14px;}
.seg button{height:38px;border-radius:9px;font-weight:700;font-size:14px;color:var(--text2);}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.month-sum{font-size:13px;color:var(--text2);margin:-4px 2px 14px;}
.wk{font-size:12.5px;font-weight:700;color:var(--text2);margin:18px 2px 8px;}

.d-head{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--line);}
.d-date{font-size:13.5px;color:var(--text2);text-transform:capitalize;margin-bottom:6px;}
.d-site{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;margin-bottom:10px;}
.d-site svg{width:21px;height:21px;flex:none;}
.d-line{display:flex;align-items:center;gap:9px;font-size:14.5px;margin-top:7px;flex-wrap:wrap;}
.d-line svg{width:17px;height:17px;flex:none;color:var(--text2);}
.d-line .chip{margin-left:auto;}
.d-card{background:#fff;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:12px;overflow:hidden;}
.d-item{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line);}
.d-item:first-child{border-top:none;}
.d-item > svg{width:20px;height:20px;flex:none;margin-top:1px;color:var(--ink);}
.d-item .k{font-weight:700;font-size:14px;margin-bottom:3px;}
.d-item .v{font-size:13.5px;color:var(--text2);line-height:1.5;white-space:pre-line;word-break:break-word;}

.acc-card{background:#fff;border-radius:var(--radius);border:1px solid var(--line);padding:18px;margin-bottom:12px;}
.acc-name{font-size:19px;font-weight:800;}
.acc-card h3{font-size:14.5px;margin-bottom:8px;}
.acc-card p,.acc-card li{font-size:13.5px;color:var(--text2);line-height:1.55;}
.acc-card ol{padding-left:18px;}
.badge-test{display:inline-block;margin-top:8px;background:var(--warn-bg);color:var(--warn);font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:#b91c1c;}
.loader{padding:60px 0;text-align:center;color:var(--text2);font-size:14px;}
.loader::before{content:"";display:block;width:28px;height:28px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;}
</style>

// ── Utils ────────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function $(id){ return document.getElementById(id); }
function cap(s){ s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); }
function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDaysISO(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoDate(d); }
function todayISO(){ return isoDate(new Date()); }
function hhmm(t){ return String(t||'').slice(0,5); }
function toast(msg,err){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.className='toast'; },3200); }
function showScreen(id){ ['scr-loading','scr-ident','scr-pin','app'].forEach(x=>$(x).classList.toggle('hidden',x!==id)); }

function fullName(a){ return [a.nom,a.prenom].filter(Boolean).join(' ') || a.nom || a.prenom || '—'; }

// ── Accès aux deux projets Supabase (fetch natif) ────────────
async function agentGet(q){
  const r = await fetch(AGENT_URL+'/rest/v1/agents?'+q, { headers:{ apikey:AGENT_KEY, Authorization:'Bearer '+AGENT_KEY } });
  const d = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((d&&d.message)||'Connexion impossible');
  return d||[];
}
async function agentRpc(fn,args){
  const r = await fetch(AGENT_URL+'/rest/v1/rpc/'+fn, {
    method:'POST', headers:{ apikey:AGENT_KEY, Authorization:'Bearer '+AGENT_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(args||{})
  });
  const d = await r.json().catch(()=>null);
  if(!r.ok) throw new Error(String((d&&(d.message||d.hint))||'Service indisponible').replace(/^ERROR:\s*/,''));
  return d;
}
async function opsRpc(fn,args){
  const r = await fetch(OPS_URL+'/rest/v1/rpc/'+fn, {
    method:'POST', headers:{ apikey:OPS_KEY, Authorization:'Bearer '+OPS_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(args||{})
  });
  const d = await r.json().catch(()=>null);
  if(!r.ok) throw new Error(String((d&&(d.message||d.hint))||'Service planning indisponible').replace(/^ERROR:\s*/,''));
  return d;
}

// ── PIN : hash identique à mobile.html / parametrage.html ────
async function hashPin(pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('RDZ-PIN-2026-'+pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function getLocal(){ return { id:localStorage.getItem(LS_ID), nom:localStorage.getItem(LS_NOM), hash:localStorage.getItem(LS_HASH) }; }
function setLocal(id,nom,hash){ localStorage.setItem(LS_ID,id); localStorage.setItem(LS_NOM,nom); localStorage.setItem(LS_HASH,hash||''); }
function clearLocal(){ [LS_ID,LS_NOM,LS_HASH].forEach(k=>localStorage.removeItem(k)); }

    list.innerHTML = `<div class="muted-txt">Connexion impossible.<br>${esc(e.message)}<br><br><button class="btn btn-outline btn-sm" onclick="showIdent()">Réessayer</button></div>`;

}

async function selectAgent(id){
  try{
    const rows = await agentGet('select=id,nom,prenom,pin_hash,actif&id=eq.'+encodeURIComponent(id));
    const a = rows[0];
    if(!a || a.actif===false) return showIdent('Ce compte agent n’est plus actif.');
    if(!a.pin_hash) return showIdent('Vous n’avez pas encore de code PIN. Créez-le d’abord dans l’application RDZ Agent, puis revenez ici.');
    openPin(a, null);
  }catch(e){ toast('Erreur : '+e.message, true); }
}

let pinBuf='', pinAgent=null;
function openPin(agent, message){
  pinAgent=agent; pinBuf='';
  $('pin-name').textContent = fullName(agent);
  $('pin-msg').className = 'pin-msg'+(message?' warn':'');
  $('pin-msg').textContent = message || 'Entrez votre code PIN';
  dots(0);
  const keys=['1','2','3','4','5','6','7','8','9','','0','del'];
  $('pin-keypad').innerHTML = keys.map(k=> k===''? '<div></div>' : k==='del'
    ? '<button class="key fn" onclick="pinDigit(null)">Effacer</button>'
    : `<button class="key" onclick="pinDigit('${k}')">${k}</button>`).join('');
  showScreen('scr-pin');
}
function dots(n){ document.querySelectorAll('#pin-dots .dot').forEach((d,i)=>d.classList.toggle('on',i<n)); }
async function pinDigit(d){
  if(d===null){ pinBuf=pinBuf.slice(0,-1); dots(pinBuf.length); return; }
  if(pinBuf.length>=4) return;
  pinBuf+=d; dots(pinBuf.length);
  if(pinBuf.length<4) return;
  const hash = await hashPin(pinBuf);
  if(hash===pinAgent.pin_hash){
    setLocal(pinAgent.id, fullName(pinAgent), hash);
    enterApp(pinAgent);
  }else{
    const el=$('pin-dots'); el.classList.add('shake');
    $('pin-msg').className='pin-msg err'; $('pin-msg').textContent='Code incorrect, réessayez';
    setTimeout(()=>{ el.classList.remove('shake'); pinBuf=''; dots(0); },400);
  }
}
function logout(){ closeSheet(); MSGS=[]; GROUPS=[]; GMSGS=[]; VIEW.groupId=null; MSG_DRAFT=''; if(MSG_POLL){ clearInterval(MSG_POLL); MSG_POLL=null; } const cp=document.getElementById('compose'); if(cp) cp.remove(); clearLocal(); AGENT=null; SHIFTS=[]; ABS={list:[],balance:null,loaded:false}; CHANGES=[]; UNREAD=new Set(); VIEW={tab:'home',detail:null,planMode:'upcoming'}; location.href=APP_HOME; } // session partagée : on se réidentifie dans l'application

// ── Données planning ─────────────────────────────────────────
function mapShift(r){
  return {
    id:String(r.id), version:Number(r.version), date:String(r.date).slice(0,10), start:hhmm(r.start_time), end:hhmm(r.end_time),
    status:r.status, post:r.post_name||'', description:r.description||'',
    breakMinutes:Number(r.break_minutes)||0, breakPaid:!!r.break_paid,
    actualStart:r.actual_start?hhmm(r.actual_start):'', actualEnd:r.actual_end?hhmm(r.actual_end):'',
    seen:r.seen_at||'', siteName:r.site_name||'Site', siteAddress:r.site_address||'',
    refusal: r.refusal? { reason:r.refusal.reason||'', at:r.refusal.at } : null,
    reason:r.reason||'', checked:r.checked_at||'',
    plannedStart:r.planned_start||'', plannedEnd:r.planned_end||'',
    hoursRejection: r.hours_rejection? { note:r.hours_rejection.note||'', at:r.hours_rejection.at } : null
  };
}
function enterApp(agent){
  AGENT=agent; startMsgPoll(); showScreen('app');
  $('btn-refresh').innerHTML=I.refresh;
  $('btn-app').innerHTML=I.apps;
  const tabs={ home:[I.home,'Accueil'], planning:[I.cal,'Planning'], temps:[I.clock,'Temps'], messages:[I.chat,'Messages'], account:[I.user,'Compte'] };
  document.querySelectorAll('.tab').forEach(b=>{ const t=tabs[b.dataset.tab]; b.innerHTML=t[0]+'<span>'+t[1]+'</span>'; });
  render(); reload(false);
}
async function reload(manual){
  if(LOADING||!AGENT) return;
  LOADING=true; $('btn-refresh').classList.add('spin');
  try{
    // Services terminés : heures prévues reportées d'office (modifiables ensuite)
    await opsRpc('rdz_planning_pilot_autofill', { p_agent_id:String(AGENT.id) }).catch(()=>0);
    const [rows, chg, abs, msgs, gfeed] = await Promise.all([
      opsRpc('rdz_planning_pilot_shifts', { p_agent_id:String(AGENT.id) }),
      opsRpc('rdz_planning_pilot_changes', { p_agent_id:String(AGENT.id) }).catch(()=>null),
      opsRpc('rdz_planning_pilot_absences', { p_agent_id:String(AGENT.id) }).catch(()=>null),
      opsRpc('rdz_planning_pilot_messages', { p_agent_id:String(AGENT.id) }).catch(()=>null),
      opsRpc('rdz_planning_pilot_group_feed', { p_agent_id:String(AGENT.id) }).catch(()=>null)
    ]);
    if(msgs) setMessages(msgs);
    if(gfeed) setGroupFeed(gfeed);
    await loadPdsa();
    SHIFTS = (rows||[]).map(mapShift).filter(s=>s.status && s.status!==HIDDEN_STATUS);
    if(chg) setChanges(chg);
    if(abs){
      ABS.list = (abs.absences||[]).map(a=>({ id:String(a.id), kind:a.kind, from:String(a.from).slice(0,10), to:String(a.to).slice(0,10),
        status:a.status, reason:a.reason||'', days:a.days==null?null:Number(a.days) }));
      ABS.balance = abs.balance ? { year:abs.balance.year, opening:Number(abs.balance.opening)||0, taken:Number(abs.balance.taken)||0,
        pending:Number(abs.balance.pending)||0, remaining:Number(abs.balance.remaining)||0 } : null;
      ABS.loaded = true;
    }
    LAST_LOAD=Date.now();
    if(VIEW.detail && !SHIFTS.some(s=>s.id===VIEW.detail)) VIEW.detail=null;
    render();
    if(manual) toast('Planning à jour');
    markSeen();
  }catch(e){
    toast(e.message||'Chargement impossible', true);
    if(!SHIFTS.length) $('main').innerHTML=`<div class="empty"><b>Impossible de charger le planning</b>${esc(e.message||'')}<br><br><button class="btn btn-outline btn-sm" onclick="reload(true)">Réessayer</button></div>`;
  }finally{ LOADING=false; $('btn-refresh').classList.remove('spin'); }
}
// Journal : on retient les modifications arrivées depuis la dernière visite
// sur cet appareil (pastille rouge), puis on mémorise la plus récente.
function setChanges(list){
  CHANGES = (list||[]).map(c=>({ id:Number(c.id), kind:c.kind, shiftId:String(c.shift_id||''), date:String(c.date||'').slice(0,10),
    start:hhmm(c.start), end:hhmm(c.end), site:c.site||'Site', post:c.post||'', details:c.details||{}, at:c.at,
    refType:c.ref_type||'shift', dateTo:String(c.date_to||'').slice(0,10), absKind:c.abs_kind||'', note:c.note||'' }));
  const key = LS_CHG_SEEN+AGENT.id;
  const raw = localStorage.getItem(key);
  const maxId = CHANGES.reduce((m,c)=>Math.max(m,c.id),0);
  if(raw===null){ UNREAD = new Set(); }                // 1re visite : rien n'est « nouveau »
  else { const seen=Number(raw)||0; CHANGES.forEach(c=>{ if(c.id>seen && !OWN_ACTIONS.has(c.kind)) UNREAD.add(c.id); }); }
  try{ localStorage.setItem(key, String(Math.max(maxId, Number(raw)||0))); }catch(e){}
}

// Renseigne seen_at côté admin pour les services à venir encore jamais vus.
function markSeen(){
  const now=new Date();
  const ids = SHIFTS.filter(s=>!s.seen && sEnd(s)>now).map(s=>s.id);
  if(!ids.length) return;
  opsRpc('rdz_planning_pilot_mark_seen', { p_agent_id:String(AGENT.id), p_shift_ids:ids })
    .then(()=>{ SHIFTS.forEach(s=>{ if(ids.includes(s.id)) s.seen=new Date().toISOString(); }); })
    .catch(()=>{ /* non bloquant */ });
}

// ── Dates des services ───────────────────────────────────────
function sStart(s){ return new Date(s.date+'T'+s.start+':00'); }
function sEnd(s){ const st=sStart(s); let e=new Date(s.date+'T'+s.end+':00'); if(e<=st) e=new Date(e.getTime()+86400000); return e; }
function durLabel(s){ const m=Math.round((sEnd(s)-sStart(s))/60000); return Math.floor(m/60)+'h'+(m%60?pad(m%60):''); }
function paidMinutes(s){ return Math.round((sEnd(s)-sStart(s))/60000) - ((s.breakMinutes&&!s.breakPaid)?s.breakMinutes:0); }
// Code couleur : service de nuit = passe minuit, ou commence à partir de 20h,
// ou avant 5h du matin. Sinon service de jour.
function shiftKind(s){ return (s.end<=s.start || s.start>='20:00' || s.start<'05:00') ? 'night' : 'day'; }
function kindIcon(s){ const k=shiftKind(s); return `<span class="kind-ic ${k}">${k==='night'?I.moon:I.sun}</span>`; }
function shortH(t){ const [h,m]=t.split(':'); return m==='00'? h : h+':'+m; }
function dayLabel(iso){
  const t=todayISO();
  if(iso===t) return 'Aujourd’hui';
  if(iso===addDaysISO(t,1)) return 'Demain';
  return cap(new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long'}));
}
function fullDate(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function minusMinutes(t,n){ const [h,m]=t.split(':').map(Number); const x=(h*60+m-n+1440)%1440; return pad(Math.floor(x/60))+':'+pad(x%60); }
function mapsUrl(a){ return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a); }
function mondayOf(iso){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); return isoDate(d); }

const STATUS = {
  'Publiée':  { label:'À valider',       cls:'warn' },
  'Vue':      { label:'À valider',       cls:'warn' },
  'Validée':  { label:'Confirmé',        cls:'ok' },
  'Effectuée':{ label:'Heures déclarées',cls:'info' },
  'Contrôlée':{ label:'Clôturé',         cls:'muted' }
};
function isOpen(s){ return (s.status==='Publiée'||s.status==='Vue') && sEnd(s)>new Date(); }
function needsConfirm(s){ return isOpen(s) && !s.refusal; }
function chip(s){ if(s.refusal && isOpen(s)) return `<span class="chip bad">${I.xmark}Refusé</span>`; const st=STATUS[s.status]||{label:s.status,cls:'muted'}; return `<span class="chip ${st.cls}">${st.cls==='ok'?I.check:''}${esc(st.label)}</span>`; }

// ── Navigation / rendu ───────────────────────────────────────
function go(tab){ VIEW.tab=tab; VIEW.detail=null; render(); window.scrollTo(0,0); }
function openShift(id){ VIEW.detail=id; render(); window.scrollTo(0,0); }
function closeDetail(){ VIEW.detail=null; render(); window.scrollTo(0,0); }
function setPlanMode(m){ VIEW.planMode=m; render(); }

function render(){
  const pending = SHIFTS.filter(needsConfirm).length;
  document.querySelectorAll('.tab').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab===VIEW.tab);
    const old=b.querySelector('.tab-dot'); if(old) old.remove();
    const n = b.dataset.tab==='planning'? pending : b.dataset.tab==='temps'? SHIFTS.filter(toCheck).length : b.dataset.tab==='messages'? totalUnread() : 0;
    if(n){ const d=document.createElement('span'); d.className='tab-dot'; d.textContent=n; b.appendChild(d); }
  });
  const left=$('tb-left'), center=$('tb-center');
  if(VIEW.detail){
    left.innerHTML=`<button class="icon-btn" onclick="closeDetail()" aria-label="Retour">${I.back}</button>`;
    center.innerHTML='<span class="tb-title">Mon service</span>';
    $('main').innerHTML=renderDetail(SHIFTS.find(s=>s.id===VIEW.detail));
    return;
  }
  left.innerHTML='';
  center.innerHTML = VIEW.tab==='home'
    ? '<div class="logo" role="img" aria-label="RDZ Security Management"></div>'
    : `<span class="tb-title">${VIEW.tab==='planning'?'Mon planning':VIEW.tab==='temps'?'Temps &amp; présence':VIEW.tab==='messages'?'Messages':'Mon compte'}</span>`;
  if(!LAST_LOAD && VIEW.tab!=='account'){ $('main').innerHTML='<div class="loader">Chargement de votre planning…</div>'; return; }
  const main=$('main'); if(VIEW.tab!=='messages') main.classList.remove('with-compose');
  const oldCompose=document.getElementById('compose'); if(oldCompose && VIEW.tab!=='messages') oldCompose.remove();
  if(VIEW.tab==='messages'){ renderMessagesTab(); return; }
  main.innerHTML = VIEW.tab==='home'? renderHome() : VIEW.tab==='planning'? renderPlanning() : VIEW.tab==='temps'? renderTemps() : renderAccount();
}

function renderHome(){
  const now=new Date();
  const up = SHIFTS.filter(s=>sEnd(s)>now).sort((a,b)=>sStart(a)-sStart(b));
  const next = up[0];
  let h = `<div class="hello">Bonjour${AGENT.prenom?' '+esc(AGENT.prenom):''}</div>
    <div class="hello-sub">${up.length?'Voici vos prochains services':'Votre planning publié apparaîtra ici'}</div>`;
  if(!next){
    h += `<div class="empty" style="margin-bottom:22px"><b>Aucun service à venir</b>Dès que votre responsable publie votre planning, vos services s’affichent ici et vous recevez un e-mail.</div>`;
  } else {
    const live = sStart(next)<=now, t=todayISO();
    const pill = next.date===t? '' : next.date===addDaysISO(t,1)? 'tmw' : null;
    h += `<div class="next">
    <div class="next-kicker"><span>${live?'<span class="live">EN COURS</span>':'PROCHAIN SERVICE'}</span>${shiftKind(next)==='night'? `<span class="kind-pill night">${I.moon}Service de nuit</span>` : `<span class="kind-pill day">${I.sun}Service de jour</span>`}</div>
    <div class="next-body" onclick="openShift('${esc(next.id)}')">
      <div class="next-lines">
        <div class="nl">${I.cal}${pill!==null?`<span class="pill ${pill}">${esc(dayLabel(next.date))}</span><span style="opacity:.85">${esc(new Date(next.date+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,''))}</span>`:esc(dayLabel(next.date))}</div>
        <div class="nl site">${I.pin}<span>${esc(next.siteName)}</span></div>
        <div class="nl">${I.clock}<span>${esc(next.start)} – ${esc(next.end)} (${durLabel(next)})</span></div>
        ${next.post?`<div class="nl">${I.people}<span>${esc(next.post)}</span></div>`:''}
      </div>
      <span class="chev">${I.chev}</span>
    </div>
    ${pdsaBlock(next, true)}
    <div class="next-actions ${next.siteAddress?'':'one'}">
      <button class="btn btn-red btn-sm" onclick="openShift('${esc(next.id)}')">Voir le service</button>
      ${next.siteAddress?`<a class="btn btn-white btn-sm" href="${esc(mapsUrl(next.siteAddress))}" target="_blank" rel="noopener">${I.pin}Itinéraire</a>`:''}
    </div>
  </div>`;
  }
  const unreadMsg = totalUnread();
  if(unreadMsg) h += `<button class="msg-banner" onclick="VIEW.msgTab=msgUnread('mine')?'mine':msgUnread('groups')?'groups':'broadcast';VIEW.groupId=null;go('messages')">${I.chat}<span>${unreadMsg} nouveau${unreadMsg>1?'x':''} message${unreadMsg>1?'s':''}</span>${I.chev}</button>`;
  h += renderWeek();
  const toDecl = SHIFTS.filter(toCheck).length;
  if(toDecl) h += `<div class="validate-bar"><span>${toDecl} service${toDecl>1?'s':''} terminé${toDecl>1?'s':''} : vérifiez vos heures</span><button class="btn btn-red btn-sm" onclick="go('temps')">Vérifier</button></div>`;
  h += renderStats(up);
  h += renderLeaveCard();
  h += renderChangesBlock();
  const rest = up.slice(1,4);
  if(rest.length){
    h += '<div class="sec-title">Ensuite</div>'+rest.map(shiftRow).join('');
    if(up.length>4) h += `<button class="btn btn-ghost btn-block btn-sm" onclick="setPlanMode('upcoming');go('planning')">Voir tout le planning (${up.length} services)</button>`;
  }
  return h;
}

// ── Carte chiffres : à venir / à valider / heures du mois ────
// ── Ma semaine ───────────────────────────────────────────────
function isoWeek(iso){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const w1=new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7); }
function weekMonday(){ return addDaysISO(mondayOf(todayISO()), 7*(VIEW.weekOffset||0)); }
function shiftWeek(n){ VIEW.weekOffset=(VIEW.weekOffset||0)+n; render(); }
function dayEntries(iso){
  return { shifts: SHIFTS.filter(s=>s.date===iso).sort((a,b)=>sStart(a)-sStart(b)),
           abs: ABS.list.find(a=>a.status==='Acceptée' && a.from<=iso && a.to>=iso) || null };
}
function renderWeek(){
  const mon=weekMonday(), t=todayISO();
  const days=[0,1,2,3,4,5,6].map(i=>addDaysISO(mon,i));
  const WD=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const fmt=iso=>new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{day:'numeric',month:'short'}).replace('.','');
  let total=0;
  const tiles=days.map((iso,i)=>{
    const { shifts, abs } = dayEntries(iso);
    shifts.forEach(s=>{ total+=paidMinutes(s); });
    const cls=[iso<t?'past':'', iso===t?'today':''];
    let icon, hrs, click='';
    if(shifts.length){
      const s=shifts[0], k=shiftKind(s);
      cls.push(k==='night'?'nightk':'dayk');
      icon = k==='night'? I.moon : I.sun;
      hrs = shifts.length>1? shifts.length+' serv.' : shortH(s.start)+'–'+shortH(s.end);
      click = shifts.length===1? `openShift('${esc(s.id)}')` : 'openWeekDetail()';
    } else if(abs){
      cls.push('leavek'); icon=I.sun; hrs = abs.kind==='paid'? 'Congé' : 'Indispo'; click='';
    } else {
      cls.push('rest'); icon='—'; hrs='Repos';
    }
    return `<${click?'button':'div'} class="wday ${cls.join(' ')}" ${click?`onclick="${click}"`:''}>
      <span class="dw">${iso===t?'Auj.':WD[i]}</span><span class="dn">${new Date(iso+'T12:00:00').getDate()}</span>
      <span class="di">${icon}</span><span class="dh">${esc(hrs)}</span></${click?'button':'div'}>`;
  }).join('');
  const off=VIEW.weekOffset||0;
  const title = off===0? 'Ma semaine' : off===1? 'Semaine prochaine' : off===-1? 'Semaine dernière' : 'Semaine '+isoWeek(mon);
  return `<div class="week">
    <div class="week-head">
      <div><div class="t">${title}</div><div class="s">Sem. ${isoWeek(mon)} · ${esc(fmt(mon))} – ${esc(fmt(days[6]))}</div></div>
      <div class="week-nav"><button class="prev" onclick="shiftWeek(-1)" aria-label="Semaine précédente">${I.chev}</button><button onclick="shiftWeek(1)" aria-label="Semaine suivante">${I.chev}</button></div>
    </div>
    <div class="days">${tiles}</div>
    <div class="week-foot"><span class="lg"><i class="d"></i>Jour</span><span class="lg"><i class="n"></i>Nuit</span><span class="lg"><i class="r"></i>Repos</span>
      <span class="week-total">${Math.floor(total/60)}h${total%60?pad(total%60):''} / sem.</span></div>
    <button class="btn btn-block" onclick="openWeekDetail()">Voir le détail de la semaine</button>
  </div>`;
}
function openWeekDetail(){
  const mon=weekMonday();
  const days=[0,1,2,3,4,5,6].map(i=>addDaysISO(mon,i));
  let total=0;
  const body=days.map(iso=>{
    const { shifts, abs } = dayEntries(iso);
    shifts.forEach(s=>{ total+=paidMinutes(s); });
    const lbl=new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long'});
    const rows = shifts.length? shifts.map(s=>shiftRow(s).replace(`onclick="openShift(`, `onclick="closeSheet();openShift(`)).join('')
      : abs? absenceRow(abs) : '<div class="wd-rest">Repos</div>';
    return `<div class="wd-day">${esc(lbl)}${iso===todayISO()?' · aujourd’hui':''}</div>${rows}`;
  }).join('');
  $('sheet-root').innerHTML = `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <h2>Semaine ${isoWeek(mon)}</h2>
    <div class="sub">${Math.floor(total/60)}h${total%60?pad(total%60):''} planifiées (pauses non payées déduites)</div>
    ${body}
    <button class="btn btn-ghost btn-block" style="margin-top:16px" onclick="closeSheet()">Fermer</button>
  </div></div>`;
}

// ── PDSA / PDS (prise de service anticipée / prise de service) ──
// L'agent envoie sa PDSA dès 3 h avant le service (à faire 1 h avant), puis
// sa PDS à la prise de poste (dès 1 h avant). Le centraliste voit le service
// passer de rouge à orange puis vert dans planning-agendrix.
const PDSA_OPEN_MIN = 180, PDS_OPEN_MIN = 60;
let PDSA = {};   // shift id -> { pdsa:{at,matched}, pds:{at,matched} }
function pdsaCandidates(){ const now=new Date(); return SHIFTS.filter(s=>sEnd(s)>now && sStart(s)-now < 24*3600000); }
async function loadPdsa(){
  const ids = pdsaCandidates().map(s=>s.id);
  if(!ids.length || !AGENT){ PDSA={}; return; }
  try{
    const rows = await agentRpc('rdz_agent_pdsa_status', { p_agent_id:String(AGENT.id), p_pin_hash:localStorage.getItem(LS_HASH)||'', p_shift_refs:ids });
    PDSA = {};
    (rows||[]).forEach(r=>{ (PDSA[r.shift_ref] = PDSA[r.shift_ref]||{})[r.kind] = { at:r.at, matched:!!r.matched }; });
  }catch(e){ /* non bloquant */ }
}
function hm(d){ return d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'}); }
function pdsaBlock(s, dark){
  const now=new Date(), st=sStart(s), en=sEnd(s);
  if(en<=now || st-now > 24*3600000) return '';
  const p=PDSA[s.id]||{};
  const openA=new Date(st-PDSA_OPEN_MIN*60000), openS=new Date(st-PDS_OPEN_MIN*60000);
  const step=(kind,label,open,sub)=>{
    const done=p[kind];
    if(done) return `<div class="pd-step done">${I.checkC}<div><b>${label} envoyée</b><span>à ${esc(hm(new Date(done.at)))}${done.matched?'':' · non reçue par le centraliste'}</span></div></div>`;
    if(now<open) return `<button class="pd-step wait" disabled>${I.clock}<div><b>${label}</b><span>dès ${esc(hm(open))}</span></div></button>`;
    return `<button class="pd-step go ${kind}" onclick="event.stopPropagation();askPdsa('${esc(s.id)}','${kind}')">${kind==='pdsa'?I.send:I.check}<div><b>${label}</b><span>${sub}</span></div></button>`;
  };
  const late = !p.pdsa && now > new Date(st-60*60000);
  return `<div class="pdsa-box ${dark?'dark':''}">
    <div class="pd-title">Prise de service${late? ' <span class="pd-late">PDSA attendue</span>' : ''}</div>
    <div class="pd-steps">
      ${step('pdsa','PDSA',openA,'Prise de service anticipée')}
      ${step('pds','PDS',openS,'Je prends mon poste')}
    </div>
  </div>`;
}
function askPdsa(id, kind){
  const s=SHIFTS.find(x=>x.id===id); if(!s) return;
  const lbl = kind==='pdsa'? 'PDSA' : 'PDS';
  $('sheet-root').innerHTML = `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <h2>Envoyer votre ${lbl} ?</h2>
    <div class="sub">${kind==='pdsa'? 'Vous confirmez au centraliste que vous serez à l’heure pour ce service.' : 'Vous confirmez au centraliste que vous prenez votre poste maintenant.'}</div>
    <div class="dc-plan"><b>${esc(s.siteName)}</b>${s.post?' · '+esc(s.post):''}<br>${esc(dayLabel(s.date))} · ${esc(s.start)} – ${esc(s.end)}</div>
    <button class="btn btn-red btn-block" id="pd-btn" style="margin-top:16px" onclick="sendPdsa('${esc(id)}','${kind}')">Envoyer ma ${lbl} (${esc(hm(new Date()))})</button>
    <button class="btn btn-ghost btn-block" onclick="closeSheet()">Annuler</button>
  </div></div>`;
}
async function sendPdsa(id, kind){
  const s=SHIFTS.find(x=>x.id===id); const btn=$('pd-btn'); if(!s) return;
  if(btn){ btn.disabled=true; btn.textContent='Envoi…'; }
  try{
    const r = await agentRpc('rdz_agent_pdsa_signal', { p_agent_id:String(AGENT.id), p_pin_hash:localStorage.getItem(LS_HASH)||'', p_kind:kind,
      p_shift_ref:s.id, p_date:s.date, p_start:s.start, p_end:s.end });
    (PDSA[id] = PDSA[id]||{})[kind] = { at:(r&&r.at)||new Date().toISOString(), matched:!!(r&&r.matched) };
    closeSheet();
    if(r && r.matched) toast((kind==='pdsa'?'PDSA':'PDS')+' envoyée au centraliste');
    else toast((kind==='pdsa'?'PDSA':'PDS')+' enregistrée, mais service introuvable chez le centraliste : prévenez-le', true);
    render();
  }catch(e){
    closeSheet(); toast(e.message||'Envoi impossible', true);
  }
}

function renderStats(up){
  const pending = up.filter(needsConfirm).length;
  const ym = todayISO().slice(0,7);
  const mins = SHIFTS.filter(s=>s.date.slice(0,7)===ym).reduce((n,s)=>n+paidMinutes(s),0);
  const month = new Date().toLocaleDateString('fr-CH',{month:'long'});
  return `<div class="stats">
    <button class="stat" onclick="setPlanMode('upcoming');go('planning')"><span class="n">${up.length}</span><span class="l">Service${up.length>1?'s':''} à venir</span></button>
    <button class="stat ${pending?'alert':''}" onclick="setPlanMode('upcoming');go('planning')"><span class="n">${pending}</span><span class="l">À valider</span></button>
    <div class="stat"><span class="n">${Math.floor(mins/60)}h${mins%60?pad(mins%60):''}</span><span class="l">En ${esc(month)}</span></div>
  </div>`;
}

// ── Congés : carte d'accueil ─────────────────────────────────
const ABS_KIND = { paid:'Congé payé', unavailable:'Indisponibilité' };
function fmtDay(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,''); }
function absPeriod(a){ return a.from===a.to? fmtDay(a.from) : 'Du '+fmtDay(a.from)+' au '+fmtDay(a.to); }
function absChip(a){
  const c = a.status==='Acceptée'? 'ok' : a.status==='Refusée'? 'bad' : 'warn';
  const l = a.status==='Demandée'? 'En attente' : a.status;
  return `<span class="chip ${c}">${esc(l)}</span>`;
}
function jours(n){ n=Number(n)||0; const v=Number.isInteger(n)? n : n.toFixed(1).replace('.',','); return v+' jour'+(Math.abs(n)>1?'s':''); }
function renderLeaveCard(){
  const b = ABS.balance, t = todayISO();
  // Demandes à afficher : en attente + à venir/en cours, puis dernières traitées
  const shown = ABS.list.filter(a=>a.status==='Demandée' || a.to>=t).sort((x,y)=>x.from.localeCompare(y.from)).slice(0,4);
  let top;
  if(b){
    const pct = b.opening>0? Math.max(0,Math.min(1,b.remaining/b.opening)) : 0;
    const C = 2*Math.PI*26;
    top = `<div class="leave-top">
      <div class="leave-ring"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="26" fill="none" stroke="#e5e7eb" stroke-width="6"/><circle cx="31" cy="31" r="26" fill="none" stroke="${b.remaining<0?'#b91c1c':'#16a34a'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}"/></svg>
        <div class="v"><b>${esc(String(Number.isInteger(b.remaining)?b.remaining:b.remaining.toFixed(1)).replace('.',','))}</b><small>jours</small></div></div>
      <div class="leave-txt"><div class="t">Congés ${esc(b.year)}</div>
        <div class="s">${jours(b.remaining)} restant${Math.abs(b.remaining)>1?'s':''} sur ${jours(b.opening)}${b.taken? ' · '+jours(b.taken)+' pris':''}${b.pending? '<br>'+jours(b.pending)+' en attente de réponse':''}</div></div>
    </div>`;
  } else {
    top = `<div class="leave-top"><div class="leave-txt"><div class="t">Mes congés</div><div class="s">Votre solde de congés n’a pas encore été renseigné. Vous pouvez tout de même faire une demande.</div></div></div>`;
  }
  const list = shown.length? `<div class="leave-list">${shown.map(a=>`<div class="lv">
      <div class="lv-main"><b>${ABS_KIND[a.kind]||'Absence'}${a.days&&a.kind==='paid'?' · '+jours(a.days):''}</b><span>${esc(absPeriod(a))}</span></div>
      ${absChip(a)}
      ${a.status==='Demandée'? `<button class="lv-x" onclick="askCancelAbsence('${esc(a.id)}')">Annuler</button>` : ''}
    </div>`).join('')}</div>` : '';
  return `<div class="sec-title">Congés &amp; absences</div><div class="leave">${top}${list}
    <button class="btn btn-red btn-block" onclick="openLeaveForm()">Faire une demande</button></div>`;
}
function absenceRow(a){
  const f=new Date(a.from+'T12:00:00');
  return `<div class="srow absence">
    <div class="dblock"><div class="dw">${esc(f.toLocaleDateString('fr-CH',{weekday:'short'}).replace('.',''))}</div><div class="dn">${f.getDate()}</div><div class="dm">${esc(f.toLocaleDateString('fr-CH',{month:'short'}).replace('.',''))}</div></div>
    <div class="sinfo"><div class="s1">${ABS_KIND[a.kind]||'Absence'}</div><div class="s2">${esc(absPeriod(a))}</div></div>
  </div>`;
}

// ── Formulaire de demande ────────────────────────────────────
let LF = { kind:'paid', oneDay:false, from:'', to:'', reason:'' };
function weekdaysBetween(a,b){ let n=0; const d=new Date(a+'T12:00:00'), e=new Date(b+'T12:00:00'); while(d<=e){ const w=d.getDay(); if(w!==0&&w!==6) n++; d.setDate(d.getDate()+1); } return n; }
function openLeaveForm(){
  LF = { kind:'paid', oneDay:false, from:addDaysISO(todayISO(),1), to:addDaysISO(todayISO(),1), reason:'' };
  renderLeaveForm();
}
function lfSet(k,v){
  LF[k]=v;
  if(k==='oneDay' && v) LF.to=LF.from;
  if(k==='from' && (LF.oneDay || !LF.to || LF.to<v)) LF.to=v;
  renderLeaveForm();
}
function lfSummary(){
  if(!LF.from || !LF.to) return '';
  if(LF.to<LF.from) return '<div class="req-sum warn">La date de fin est avant la date de début.</div>';
  const cal = Math.round((new Date(LF.to+'T12:00:00')-new Date(LF.from+'T12:00:00'))/864e5)+1;

  const after = b.remaining - b.pending - n;

function shortDate(iso){ return iso? new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'') : ''; }
function relTime(ts){
  const d=new Date(ts), diff=(Date.now()-d.getTime())/60000;
  const hm=d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});
  if(diff<1) return 'à l’instant';
  if(diff<60) return 'il y a '+Math.floor(diff)+' min';
  if(isoDate(d)===todayISO()) return 'auj. '+hm;
  if(isoDate(d)===addDaysISO(todayISO(),-1)) return 'hier '+hm;
  return d.toLocaleDateString('fr-CH',{day:'numeric',month:'short'}).replace('.','');
}
