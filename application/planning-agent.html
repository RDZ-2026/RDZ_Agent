function canDeclare(s){ return ['Publiée','Vue','Validée'].includes(s.status) && !s.refusal && sEnd(s)<=new Date(); }
function isPendingHours(s){ return s.status==='Effectuée'; }
function isAuto(s){ return s.status==='Effectuée' && s.reason===AUTO_REASON; }
function toCheck(s){ return canDeclare(s) || isAuto(s); }
function spanMin(a,b){ const [ah,am]=a.split(':').map(Number), [bh,bm]=b.split(':').map(Number); let d=(bh*60+bm)-(ah*60+am); if(d<=0) d+=1440; return d; }
function fmtMin(m){ const neg=m<0; m=Math.abs(m); const h=Math.floor(m/60), r=m%60; return (neg?'−':'+')+(h? h+'h'+(r?pad(r):'') : r+' min'); }
function hoursDiff(s){ if(!s.actualStart||!s.actualEnd) return 0; return spanMin(s.actualStart,s.actualEnd) - spanMin(s.plannedStart||s.start, s.plannedEnd||s.end); }
function diffTag(m){ return m? `<span class="tp-diff ${m>0?'plus':'minus'}">${fmtMin(m)}</span>` : ''; }
function tpRow(s, mode){
  const d=new Date(s.date+'T12:00:00');
  const changed = s.actualStart && (s.actualStart!==(s.plannedStart||s.start) || s.actualEnd!==(s.plannedEnd||s.end));
  const real = s.actualStart? `<div class="tp-l">Réel <b>${esc(s.actualStart)}–${esc(s.actualEnd||'—')}</b> ${diffTag(hoursDiff(s))}${changed&&!hoursDiff(s)?'<span class="tp-diff plus">décalé</span>':''}</div>` : '';
  const auto = isAuto(s);
  const btn = mode==='declare'? '<span class="tp-cta">Déclarer</span>' : auto? '<span class="tp-cta">Vérifier</span>' : mode==='pending'? '<span class="tp-edit">Modifier</span>' : '';
  const click = mode==='done'? `openShift('${esc(s.id)}')` : `openDeclare('${esc(s.id)}')`;
  return `<button class="tp-row k-${shiftKind(s)}" onclick="${click}">
    <div class="dblock"><div class="dw">${esc(d.toLocaleDateString('fr-CH',{weekday:'short'}).replace('.',''))}</div><div class="dn">${d.getDate()}</div><div class="dm">${esc(d.toLocaleDateString('fr-CH',{month:'short'}).replace('.',''))}</div></div>
    <div class="tp-lines">
      <div class="s1">${esc(s.siteName)}</div>
      <div class="tp-l">Prévu ${esc(s.plannedStart||s.start)}–${esc(s.plannedEnd||s.end)}${s.post?' · '+esc(s.post):''}</div>
      ${real}
      ${mode==='declare' && s.hoursRejection? `<div class="tp-rej">Refusé : « ${esc(s.hoursRejection.note)} »</div>` : ''}
      ${auto? '<div class="tp-l"><span class="chip info">Pré-rempli automatiquement</span></div>' : mode==='pending'? '<div class="tp-l"><span class="chip warn">En attente de validation</span></div>' : mode==='done'? '<div class="tp-l"><span class="chip ok">'+I.check+'Validé</span></div>' : ''}
    </div>
    ${btn}
  </button>`;
}
function renderTemps(){
  const byDateDesc=(a,b)=>sStart(b)-sStart(a);
  const toDecl = SHIFTS.filter(toCheck).sort((a,b)=>sStart(a)-sStart(b));
  const pending = SHIFTS.filter(s=>isPendingHours(s) && !isAuto(s)).sort(byDateDesc);
  const done = SHIFTS.filter(s=>s.status==='Contrôlée').sort(byDateDesc);
  const ym=todayISO().slice(0,7);
  const monthMin = done.filter(s=>s.date.slice(0,7)===ym).reduce((n,s)=>n+(s.actualStart&&s.actualEnd? spanMin(s.actualStart,s.actualEnd) : spanMin(s.start,s.end)) - ((s.breakMinutes&&!s.breakPaid)?s.breakMinutes:0),0);
  let h = `<div class="tp-intro">À la fin de chaque service, vos heures prévues sont enregistrées automatiquement. Vérifiez-les et modifiez-les si besoin : votre responsable les valide ensuite.</div>
    <div class="stats">
      <div class="stat ${toDecl.length?'alert':''}"><span class="n">${toDecl.length}</span><span class="l">À vérifier</span></div>
      <div class="stat"><span class="n">${pending.length}</span><span class="l">En attente</span></div>
      <div class="stat"><span class="n">${Math.floor(monthMin/60)}h${monthMin%60?pad(monthMin%60):''}</span><span class="l">Validées ce mois</span></div>
    </div>`;
  if(toDecl.length) h += '<div class="tp-sec">À vérifier</div>'+toDecl.map(s=>tpRow(s, isAuto(s)?'pending':'declare')).join('');
  if(pending.length) h += '<div class="tp-sec">En attente de validation</div>'+pending.map(s=>tpRow(s,'pending')).join('');
  if(done.length) h += '<div class="tp-sec">Validées</div>'+done.slice(0,30).map(s=>tpRow(s,'done')).join('');
  if(!toDecl.length && !pending.length && !done.length) h += '<div class="empty"><b>Aucun service effectué</b>Vos services terminés apparaîtront ici pour que vous puissiez déclarer vos heures.</div>';
  return h;
}

// Déclaration des heures
let DC = { id:null, mode:'conforme', start:'', end:'', reason:'' };
function openDeclare(id){
  const s=SHIFTS.find(x=>x.id===id); if(!s) return;
  const edited = s.actualStart && (s.actualStart!==s.start || s.actualEnd!==s.end);
  DC = { id, mode: edited? 'autre':'conforme', start:s.actualStart||s.start, end:s.actualEnd||s.end, reason: edited? (s.reason||'') : '' };
  renderDeclare();
}
function dcSet(k,v){ DC[k]=v; renderDeclare(); }
function renderDeclare(err){
  const s=SHIFTS.find(x=>x.id===DC.id); if(!s) return closeSheet();
  const other = DC.mode==='autre';
  const diff = other && DC.start && DC.end ? spanMin(DC.start,DC.end)-spanMin(s.start,s.end) : 0;
  $('sheet-root').innerHTML = `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <h2>${isAuto(s)?'Vérifier mes heures':s.status==='Effectuée'?'Modifier ma déclaration':'Déclarer mes heures'}</h2>
    ${isAuto(s)? '<div class="sub">Vos heures prévues ont été enregistrées automatiquement à la fin du service. Confirmez-les ou corrigez-les.</div>' : ''}
    <div class="dc-plan"><b>${esc(s.siteName)}</b>${s.post?' · '+esc(s.post):''}<br>${esc(cap(fullDate(s.date)))}<br>Prévu : <b>${esc(s.start)} – ${esc(s.end)}</b> (${durLabel(s)})</div>
    ${s.hoursRejection? `<div class="dc-rej"><b>Déclaration refusée par votre responsable</b><br>« ${esc(s.hoursRejection.note)} »</div>` : ''}
    <label class="fl">Mes heures réelles</label>
    <div class="kind-seg">
      <button class="${other?'':'on'}" onclick="dcSet('mode','conforme')">${isAuto(s)?'Oui, c’est correct':'Conformes au planning'}</button>
      <button class="${other?'on':''}" onclick="dcSet('mode','autre')">Différentes</button>
    </div>
    ${other? `<div class="times">
        <div><label class="fl" for="dc-s">Début réel</label><input class="finp" type="time" id="dc-s" value="${esc(DC.start)}" onchange="dcSet('start',this.value)"></div>
        <div><label class="fl" for="dc-e">Fin réelle</label><input class="finp" type="time" id="dc-e" value="${esc(DC.end)}" onchange="dcSet('end',this.value)"></div>
      </div>
      <div class="req-sum ${diff?'warn':''}">Durée réelle : <b>${DC.start&&DC.end? (()=>{const m=spanMin(DC.start,DC.end);return Math.floor(m/60)+'h'+(m%60?pad(m%60):'');})() : '—'}</b>${diff? ' · écart '+fmtMin(diff)+' par rapport au planning' : ''}</div>
      <label class="fl" for="dc-r">Motif (obligatoire)</label>
      <textarea class="finp" id="dc-r" maxlength="250" placeholder="Ex. relève arrivée en retard, intervention en fin de service…" oninput="DC.reason=this.value">${esc(DC.reason)}</textarea>` : ''}
    <div class="req-sum">${other? 'Votre responsable devra valider ces heures.' : 'Vous confirmez avoir effectué ce service aux horaires prévus.'}</div>
    ${err? `<div class="req-err">${esc(err)}</div>` : ''}
    <button class="btn btn-red btn-block" id="dc-btn" style="margin-top:16px" onclick="submitDeclare()">Envoyer</button>
    <button class="btn btn-ghost btn-block" onclick="closeSheet()">Annuler</button>
  </div></div>`;
}
async function submitDeclare(){
  const s=SHIFTS.find(x=>x.id===DC.id); if(!s) return closeSheet();
  let start=s.start, end=s.end, reason='';
  if(DC.mode==='autre'){
    start=DC.start; end=DC.end; reason=(DC.reason||'').trim();
    if(!/^\d{2}:\d{2}$/.test(start||'') || !/^\d{2}:\d{2}$/.test(end||'')) return renderDeclare('Renseignez l’heure de début et de fin.');
    if(start===s.start && end===s.end) return renderDeclare('Ces heures sont identiques au planning : choisissez « Conformes au planning ».');
    if(reason.length<3) return renderDeclare('Indiquez pourquoi vos heures diffèrent du planning.');
  }
  const btn=$('dc-btn'); btn.disabled=true; btn.textContent='Envoi…';
  try{
    await opsRpc('rdz_planning_pilot_declare_hours', { p_agent_id:String(AGENT.id), p_shift_id:s.id, p_start:start, p_end:end, p_reason:reason });
    closeSheet(); toast(DC.mode==='autre'? 'Heures envoyées à votre responsable' : 'Heures confirmées');
  }catch(e){ return renderDeclare(e.message||'Envoi impossible'); }
  await reload(false);
}

// ── Export PDF du planning mensuel ───────────────────────────
// jsPDF est chargé à la demande (uniquement au premier export).
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
let PDF = { ym:'' };
function loadJsPdf(){
  if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if(loadJsPdf._p) return loadJsPdf._p;
  loadJsPdf._p = new Promise((res,rej)=>{
    const sc=document.createElement('script'); sc.src=JSPDF_URL; sc.async=true;
    sc.onload=()=> window.jspdf&&window.jspdf.jsPDF? res(window.jspdf.jsPDF) : rej(new Error('PDF indisponible'));
    sc.onerror=()=>{ loadJsPdf._p=null; rej(new Error('Impossible de charger le module PDF, vérifiez votre connexion.')); };
    document.head.appendChild(sc);
  });
  return loadJsPdf._p;
}
function monthShifts(ym){ return SHIFTS.filter(s=>s.date.slice(0,7)===ym).sort((a,b)=>sStart(a)-sStart(b)); }
function monthLabel(ym){ return new Date(ym+'-15T12:00:00').toLocaleDateString('fr-CH',{month:'long',year:'numeric'}); }
function openPdfExport(){
  const t=todayISO(); PDF.ym = PDF.ym || t.slice(0,7);
  renderPdfSheet();
  loadJsPdf().catch(()=>{}); // préchargement
}
function renderPdfSheet(err){
  const base=new Date(todayISO().slice(0,7)+'-15T12:00:00');
  const opts=[-1,0,1].map(k=>{ const d=new Date(base); d.setMonth(d.getMonth()+k); return isoDate(d).slice(0,7); });
  const list=monthShifts(PDF.ym), toVal=list.filter(needsConfirm).length;
  const canShare = !!(navigator.share && navigator.canShare);
  $('sheet-root').innerHTML = `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <h2>Exporter mon planning</h2>
    <div class="sub">Un PDF à garder sur votre téléphone ou à imprimer.</div>
    <div class="months">${opts.map(ym=>{ const n=monthShifts(ym).length; return `<button class="${ym===PDF.ym?'on':''}" onclick="PDF.ym='${ym}';renderPdfSheet()">${esc(new Date(ym+'-15T12:00:00').toLocaleDateString('fr-CH',{month:'long'}))}<small>${n} service${n>1?'s':''}</small></button>`; }).join('')}</div>
    ${!list.length? '<div class="req-sum warn">Aucun service publié sur ce mois.</div>'
      : toVal? `<div class="req-sum warn">${toVal} service${toVal>1?'s':''} de ce mois ${toVal>1?'ne sont':'n’est'} pas encore validé${toVal>1?'s':''}. ${toVal>1?'Ils figureront':'Il figurera'} sur le PDF avec la mention « À valider ».</div>`
      : '<div class="req-sum">Tous les services de ce mois sont validés.</div>'}
    ${err? `<div class="req-err">${esc(err)}</div>` : ''}
    <button class="btn btn-red btn-block" id="pdf-dl" style="margin-top:16px" onclick="exportPdf('download')" ${list.length?'':'disabled'}>${I.pdf}Télécharger le PDF</button>
    ${canShare? `<button class="btn btn-outline btn-block" id="pdf-sh" onclick="exportPdf('share')" ${list.length?'':'disabled'}>${I.send}Partager / enregistrer</button>` : ''}
    <button class="btn btn-ghost btn-block" onclick="closeSheet()">Fermer</button>
  </div></div>`;
}
function logoDataUrl(){
  const el=document.querySelector('.logo'); if(!el) return '';
  const re=/url\(["']?(data:image\/png;base64,[^"')]+)["']?\)/;
  let m=re.exec(getComputedStyle(el).backgroundImage||'');
  if(!m){ const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join(''); m=re.exec(css); }
  return m? m[1] : '';
}
function pdfStatus(s){
  if(s.refusal && isOpen(s)) return ['Refusé',[185,28,28]];
  return ({ 'Publiée':['À valider',[180,83,9]], 'Vue':['À valider',[180,83,9]], 'Validée':['Validé',[21,128,61]],
            'Effectuée':['Heures déclarées',[29,78,216]], 'Contrôlée':['Heures validées',[21,128,61]] })[s.status] || [s.status||'',[75,85,99]];
}
function pdfTxt(v){ return String(v==null?'':v).replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/\u202f|\u00a0/g,' '); }
async function buildPlanningPdf(ym){
  const jsPDF = await loadJsPdf();
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const W=210, H=297, M=12, name=fullName(AGENT);
  const list = monthShifts(ym);
  const abs = ABS.list.filter(a=>a.status==='Acceptée' && a.from.slice(0,7)<=ym && a.to.slice(0,7)>=ym);
  const logo = logoDataUrl();
  const gen = new Date().toLocaleString('fr-CH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const cols=[ {k:'date',t:'Date',w:24}, {k:'site',t:'Site',w:48}, {k:'post',t:'Poste',w:32}, {k:'time',t:'Horaire',w:30}, {k:'dur',t:'Durée',w:15}, {k:'st',t:'Statut',w:37} ];
  const WD=['Dim.','Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.'];
  const dmy=iso=>iso.slice(8,10)+'.'+iso.slice(5,7);
  const dLabel=iso=>WD[new Date(iso+'T12:00:00').getDay()]+' '+dmy(iso);
  let y=0, page=1;

  const header = (first)=>{
    doc.setFillColor(17,28,46); doc.rect(0,0,W, first?34:18,'F');
    if(logo){ try{ doc.addImage(logo,'PNG',M, first?8:4, first?58:32, first?18:10); }catch(e){} }
    doc.setTextColor(255,255,255);
    if(first){
      doc.setFont('helvetica','bold'); doc.setFontSize(15);
      doc.text(pdfTxt('Planning · '+cap(monthLabel(ym))), W-M, 15, {align:'right'});
      doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
      doc.text(pdfTxt(name), W-M, 22, {align:'right'});
      y=44;
    } else {
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      doc.text(pdfTxt(name+' · '+cap(monthLabel(ym))), W-M, 11, {align:'right'});
      y=26;
    }
    // en-têtes de colonnes
    doc.setFillColor(243,244,246); doc.rect(M,y-5,W-2*M,7,'F');
    doc.setTextColor(75,85,99); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    let x=M+2; cols.forEach(c=>{ doc.text(c.t, x, y); x+=c.w; });
    y+=6;
  };
  const footer = ()=>{
    doc.setDrawColor(229,231,235); doc.line(M,H-14,W-M,H-14);
    doc.setTextColor(156,163,175); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.text(pdfTxt('RDZ Security Management · document généré le '+gen+' · seuls les services publiés figurent sur ce document'), M, H-9);
    doc.text('Page '+page, W-M, H-9, {align:'right'});
  };
  const ensure = (need)=>{ if(y+need > H-20){ footer(); doc.addPage(); page++; header(false); } };
  const clip = (txt,w)=>{ txt=pdfTxt(txt); if(doc.getTextWidth(txt)<=w-2) return txt; while(txt.length>1 && doc.getTextWidth(txt+'…')>w-2) txt=txt.slice(0,-1); return txt+'…'; };

  header(true);
  // lignes : services + congés, groupés par semaine
  const items = list.map(s=>({ kind:'shift', date:s.date, key:sStart(s).getTime(), s }))
    .concat(abs.map(a=>({ kind:'abs', date:a.from<ym+'-01'? ym+'-01' : a.from, key:new Date((a.from<ym+'-01'? ym+'-01':a.from)+'T00:00:00').getTime(), a })))
    .sort((p,q)=>p.key-q.key);
  let lastWk='', zebra=false;
  if(!items.length){ doc.setTextColor(107,114,128); doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.text('Aucun service publié sur ce mois.', M+2, y+4); y+=10; }
  items.forEach(it=>{
    const wk=mondayOf(it.date);
    if(wk!==lastWk){
      ensure(15); lastWk=wk; zebra=false;
      doc.setTextColor(17,28,46); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
      doc.text(pdfTxt('Semaine du '+new Date(wk+'T12:00:00').toLocaleDateString('fr-CH',{day:'numeric',month:'long'})), M+1, y+3.5);
      y+=6;
    }
    ensure(8);
    if(zebra){ doc.setFillColor(249,250,251); doc.rect(M,y-1,W-2*M,7,'F'); }
    if(it.kind==='shift'){ if(shiftKind(it.s)==='night') doc.setFillColor(30,27,75); else doc.setFillColor(242,193,78); doc.rect(M,y-1,1.3,7,'F'); }
    zebra=!zebra;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(17,24,39);
    let x=M+2; const ty=y+3.6;
    const put=(txt,c,opt)=>{ doc.text(clip(txt,c.w), x, ty, opt); x+=c.w; };
    if(it.kind==='shift'){
      const s=it.s, [stl,stc]=pdfStatus(s);
      const overnight = sEnd(s).getDate()!==sStart(s).getDate();
      put(dLabel(s.date), cols[0]);
      doc.setFont('helvetica','bold'); put(s.siteName, cols[1]); doc.setFont('helvetica','normal');
      put(s.post||'—', cols[2]);
      put(s.start+' – '+s.end+(overnight?' (+1)':''), cols[3]);
      const m=paidMinutes(s); put(Math.floor(m/60)+'h'+pad(m%60), cols[4]);
      doc.setTextColor(...stc); doc.setFont('helvetica','bold'); put(stl, cols[5]);
    } else {
      const a=it.a;
      put(a.from===a.to? dLabel(a.from) : dmy(a.from)+' au '+dmy(a.to), cols[0]);
      doc.setTextColor(109,40,217); doc.setFont('helvetica','bold'); put(ABS_KIND[a.kind]||'Absence', cols[1]);
      doc.setTextColor(107,114,128); doc.setFont('helvetica','normal'); put('—', cols[2]); put('—', cols[3]); put('—', cols[4]);
      doc.setTextColor(21,128,61); doc.setFont('helvetica','bold'); put('Accepté', cols[5]);
    }
    y+=7;
  });

  // Récapitulatif
  const planned=list.reduce((n,s)=>n+paidMinutes(s),0);
  const validated=list.filter(s=>s.status==='Contrôlée').reduce((n,s)=>n+paidMinutes(s),0);
  const toVal=list.filter(needsConfirm).length;
  ensure(30); y+=4;
  doc.setDrawColor(229,231,235); doc.setFillColor(243,244,246); doc.roundedRect(M,y,W-2*M,toVal?22:16,2,2,'F');
  doc.setTextColor(17,28,46); doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Récapitulatif du mois', M+4, y+6);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(55,65,81);
  const hm=m=>Math.floor(m/60)+'h'+pad(m%60);
  doc.text(pdfTxt(list.length+' service'+(list.length>1?'s':'')+' · '+hm(planned)+' planifiées (pauses non payées déduites) · dont '+hm(validated)+' validées'+(abs.length? ' · '+abs.length+' congé'+(abs.length>1?'s':'')+'/absence'+(abs.length>1?'s':''):'')), M+4, y+12);
  if(toVal){ doc.setTextColor(180,83,9); doc.text(pdfTxt(toVal+' service'+(toVal>1?'s':'')+' encore à valider dans l\'application.'), M+4, y+18); }
  y+= toVal?26:20;
  doc.setTextColor(156,163,175); doc.setFontSize(8);
  doc.text(pdfTxt('Le planning peut évoluer : en cas de modification, vous êtes prévenu par e-mail et dans l\'application.'), M, y+2);
  footer();
  const safe=pdfTxt(name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
  return { doc, filename:'Planning_RDZ_'+safe+'_'+ym+'.pdf' };
}
async function exportPdf(mode){
  const btn=$(mode==='share'?'pdf-sh':'pdf-dl'); const label=btn? btn.innerHTML : '';
  if(btn){ btn.disabled=true; btn.textContent='Création du PDF…'; }
  try{
    const { doc, filename } = await buildPlanningPdf(PDF.ym);
    if(mode==='share'){
      const file = new File([doc.output('blob')], filename, { type:'application/pdf' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        try{ await navigator.share({ files:[file], title:'Mon planning RDZ' }); }
        catch(e){ if(e && e.name==='AbortError'){ if(btn){ btn.disabled=false; btn.innerHTML=label; } return; } throw e; }
      } else doc.save(filename);
    } else {
      doc.save(filename);
    }
    closeSheet(); toast('PDF prêt : '+filename);
  }catch(e){
    renderPdfSheet(e.message||'Création du PDF impossible');
  }
}

// ── Messages : fil privé avec la direction, groupes, annonces ─
// Canaux : 'mine' (fil privé), 'broadcast' (annonces), 'g:<id>' (groupe)
let MSGS = [];            // fil privé + annonces
let GROUPS = [];          // { id, name, members:[noms] }
let GMSGS = [];           // messages de groupe
let MSG_DRAFT = '';
let MSG_POLL = null;
const LS_MSG_SEEN = 'rdz_planning_pilot_msg_seen_'; // + agent + '_' + canal
function setMessages(list){
  const pend = MSGS.filter(m=>m.pending);
  MSGS = (list||[]).map(m=>({ id:String(m.id), channel:m.channel, body:m.body||'', fromMe:!!m.from_agent, name:m.from_agent?'':'Direction RDZ', at:m.created_at }));
  pend.forEach(p=>{ if(!MSGS.some(m=>m.fromMe && m.body===p.body && new Date(m.at)>=new Date(p.at)-60000)) MSGS.push(p); });
}
function setGroupFeed(feed){
  const pend = GMSGS.filter(m=>m.pending);
  GROUPS = (feed&&feed.groups||[]).map(g=>({ id:String(g.id), name:g.name||'Groupe', members:g.members||[] }));
  GMSGS = (feed&&feed.messages||[]).map(m=>({ id:String(m.id), channel:'g:'+m.group_id, body:m.body||'', fromMe:!!m.mine, name:m.sender_name||'', at:m.created_at }));
  pend.forEach(p=>{ if(!GMSGS.some(m=>m.channel===p.channel && m.fromMe && m.body===p.body && new Date(m.at)>=new Date(p.at)-60000)) GMSGS.push(p); });
  if(VIEW.groupId && !GROUPS.some(g=>g.id===VIEW.groupId)) VIEW.groupId=null;
}
function chanMsgs(ch){ return (ch.startsWith('g:')? GMSGS : MSGS).filter(m=>m.channel===ch).sort((a,b)=>new Date(a.at)-new Date(b.at)); }
function msgSeen(ch){ return localStorage.getItem(LS_MSG_SEEN+(AGENT?AGENT.id:'')+'_'+ch)||''; }
function markChannelSeen(ch){
  const last = chanMsgs(ch).filter(m=>!m.pending).reduce((a,m)=> m.at>a? m.at : a, '');
  if(last){ try{ localStorage.setItem(LS_MSG_SEEN+AGENT.id+'_'+ch, last); }catch(e){} }
}
function msgUnread(ch){
  if(!AGENT) return 0;
  if(ch==='groups') return GROUPS.reduce((n,g)=>n+msgUnread('g:'+g.id),0);
  const seen = msgSeen(ch);
  return chanMsgs(ch).filter(m=>!m.fromMe && (!seen || new Date(m.at)>new Date(seen))).length;
}
function totalUnread(){ return msgUnread('mine')+msgUnread('broadcast')+msgUnread('groups'); }
function currentChannel(){ return VIEW.msgTab==='broadcast'? 'broadcast' : VIEW.msgTab==='groups'? (VIEW.groupId? 'g:'+VIEW.groupId : null) : 'mine'; }
function bubbleHtml(m, ch){
  const t = new Date(m.at).toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});
  if(ch==='broadcast') return `<div class="bub ann"><span class="who" style="display:block;font-size:11px;font-weight:700;color:var(--red);margin-bottom:2px;">Annonce · RDZ</span>${esc(m.body)}<span class="t">${esc(t)}</span></div>`;
  return m.fromMe
    ? `<div class="bub me ${m.pending?'pending':''}">${esc(m.body)}<span class="t">${m.pending?'Envoi…':esc(t)}</span></div>`
    : `<div class="bub them"><span class="who">${esc(m.name||'Direction RDZ')}</span>${esc(m.body)}<span class="t">${esc(t)}</span></div>`;
}
function messagesListHtml(ch){
  const list = chanMsgs(ch);
  if(!list.length) return `<div class="empty">${ch==='mine'? '<b>Aucun message</b>Écrivez à la direction : votre message arrive directement dans le planning RDZ.'
    : ch==='broadcast'? '<b>Aucune annonce</b>Les messages envoyés à tous les agents apparaîtront ici.'
    : '<b>Aucun message dans ce groupe</b>Lancez la conversation !'}</div>`;
  let h='', lastDay='';
  list.forEach(m=>{
    const d=isoDate(new Date(m.at));
    if(d!==lastDay){ lastDay=d; h += `<div class="msg-day">${d===todayISO()?'Aujourd’hui':d===addDaysISO(todayISO(),-1)?'Hier':esc(new Date(d+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long'}))}</div>`; }
    h += bubbleHtml(m, ch);
  });
  return h;
}
function groupsListHtml(){
  if(!GROUPS.length) return '<div class="empty"><b>Aucun groupe</b>Quand votre responsable vous ajoute à une conversation de groupe, elle apparaît ici.</div>';
  return GROUPS.map(g=>{
    const list=chanMsgs('g:'+g.id), last=list[list.length-1], n=msgUnread('g:'+g.id);
    const preview = last? (last.fromMe?'Vous : ':(last.name? last.name.split(' ')[0]+' : ' : ''))+last.body : g.members.length+' membre'+(g.members.length>1?'s':'');
    return `<button class="grp-row" onclick="openGroup('${esc(g.id)}')">
      <span class="grp-av">${I.people}</span>
      <span class="grp-main"><b>${esc(g.name)}</b><span>${esc(preview)}</span></span>
      <span class="grp-side">${last? `<small>${esc(relTime(last.at))}</small>` : ''}${n? `<span class="n">${n}</span>` : ''}</span>
    </button>`;
  }).join('');
}
function renderMessagesTab(){
  const tab = VIEW.msgTab==='broadcast'? 'broadcast' : VIEW.msgTab==='groups'? 'groups' : 'mine';
  const ch = currentChannel();
  if(ch) markChannelSeen(ch);
  const um=msgUnread('mine'), ug=msgUnread('groups'), ub=msgUnread('broadcast');
  const badge=(n,on)=> n&&!on? `<span class="n">${n}</span>` : '';
  let body;
  if(tab==='groups' && !ch) body = groupsListHtml();
  else if(tab==='groups'){
    const g=GROUPS.find(x=>'g:'+x.id===ch);
    body = `<div class="grp-head"><button class="icon-b" onclick="closeGroup()" aria-label="Retour">${I.back}</button><div style="min-width:0"><b>${esc(g?g.name:'Groupe')}</b><span>${esc(g? g.members.join(', ') : '')}</span></div></div>
      <div id="msg-list">${messagesListHtml(ch)}</div>`;
  } else body = `<div id="msg-list">${messagesListHtml(ch)}</div>`;
  $('main').innerHTML = `<div class="msg-seg three">
      <button class="${tab==='mine'?'on':''}" onclick="setMsgTab('mine')">Direction${badge(um,tab==='mine')}</button>
      <button class="${tab==='groups'?'on':''}" onclick="setMsgTab('groups')">Groupes${badge(ug,false)}</button>
      <button class="${tab==='broadcast'?'on':''}" onclick="setMsgTab('broadcast')">Annonces${badge(ub,tab==='broadcast')}</button>
    </div>${body}`;
  const withCompose = ch==='mine' || (ch && ch.startsWith('g:'));
  $('main').classList.toggle('with-compose', !!withCompose);
  let c=document.getElementById('compose');
  if(withCompose){
    const ph = ch==='mine'? 'Écrire à la direction…' : 'Écrire au groupe…';
    if(!c){ c=document.createElement('div'); c.id='compose'; c.className='compose'; document.body.appendChild(c);
      c.innerHTML = `<div class="compose-in"><textarea id="msg-in" rows="1" maxlength="2000" oninput="MSG_DRAFT=this.value;autoGrow(this);$('msg-send').disabled=!this.value.trim()"></textarea><button class="send" id="msg-send" onclick="sendMsg()" aria-label="Envoyer" disabled>${I.send}</button></div>`; }
    const ta=document.getElementById('msg-in'); ta.placeholder=ph;
    if(ta.value!==MSG_DRAFT){ ta.value=MSG_DRAFT; autoGrow(ta); $('msg-send').disabled=!MSG_DRAFT.trim(); }
  } else if(c) c.remove();
  if(ch) markChannelSeen(ch);
  updateTabDots();
  if(ch) requestAnimationFrame(()=>window.scrollTo(0, document.body.scrollHeight));
  startMsgPoll();
}
function setMsgTab(t){ if(VIEW.msgTab!==t) MSG_DRAFT=''; VIEW.msgTab=t; if(t!=='groups') VIEW.groupId=null; render(); }
function openGroup(id){ VIEW.msgTab='groups'; VIEW.groupId=id; MSG_DRAFT=''; render(); }
function closeGroup(){ VIEW.groupId=null; MSG_DRAFT=''; render(); window.scrollTo(0,0); }
function autoGrow(ta){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; }
function updateTabDots(){
  document.querySelectorAll('.tab').forEach(b=>{
    if(b.dataset.tab!=='messages') return;
    const old=b.querySelector('.tab-dot'); if(old) old.remove();
    const n=totalUnread();
    if(n){ const d=document.createElement('span'); d.className='tab-dot'; d.textContent=n; b.appendChild(d); }
  });
}
async function sendMsg(){
  const ch=currentChannel(); if(!ch || ch==='broadcast') return;
  const ta=document.getElementById('msg-in'); const body=(ta&&ta.value||'').trim(); if(!body) return;
  const isG = ch.startsWith('g:');
  const pending={ id:'tmp'+Date.now(), channel:ch, body, fromMe:true, name:'', at:new Date().toISOString(), pending:true };
  (isG? GMSGS : MSGS).push(pending); MSG_DRAFT=''; ta.value=''; autoGrow(ta); $('msg-send').disabled=true;
  refreshMsgList();
  try{
    if(isG) await opsRpc('rdz_planning_pilot_group_send', { p_agent_id:String(AGENT.id), p_group_id:ch.slice(2), p_body:body });
    else await opsRpc('rdz_planning_pilot_send_message', { p_agent_id:String(AGENT.id), p_body:body });
    await pollMessages(true);
  }catch(e){
    if(isG) GMSGS=GMSGS.filter(m=>m!==pending); else MSGS=MSGS.filter(m=>m!==pending);
    MSG_DRAFT=body; ta.value=body; autoGrow(ta); $('msg-send').disabled=false;
    refreshMsgList(); toast(e.message||'Envoi impossible', true);
  }
}
// Mise à jour légère : seules les bulles sont redessinées (la saisie reste).
function refreshMsgList(){
  if(VIEW.tab!=='messages' || VIEW.detail){ updateTabDots(); return; }
  const ch=currentChannel();
  if(!ch){ renderMessagesTab(); return; }   // liste des groupes : aperçus à jour
  const el=document.getElementById('msg-list'); if(!el) return;
  const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
  el.innerHTML = messagesListHtml(ch);
  markChannelSeen(ch); updateTabDots();
  if(nearBottom) window.scrollTo(0, document.body.scrollHeight);
}
async function pollMessages(force){
  if(!AGENT) return;
  try{
    const [list, feed] = await Promise.all([
      opsRpc('rdz_planning_pilot_messages', { p_agent_id:String(AGENT.id) }),
      opsRpc('rdz_planning_pilot_group_feed', { p_agent_id:String(AGENT.id) }).catch(()=>null)
    ]);
    const sig = ()=> MSGS.filter(m=>!m.pending).length+'/'+GMSGS.filter(m=>!m.pending).length+'/'+GROUPS.length+'/'+MSGS.filter(m=>m.pending).length+'/'+GMSGS.filter(m=>m.pending).length;
    const before = sig();
    setMessages(list); if(feed) setGroupFeed(feed);
    if(force || sig()!==before) refreshMsgList(); else updateTabDots();
  }catch(e){}
}
// Sondage : toutes les 10 s sur l'onglet Messages, toutes les 60 s ailleurs.
function startMsgPoll(){
  if(MSG_POLL) clearInterval(MSG_POLL);
  let tick=0;
  MSG_POLL = setInterval(()=>{
    if(!AGENT || document.visibilityState!=='visible') return;
    tick++;
    if(VIEW.tab==='messages' || tick%6===0) pollMessages();
  }, 10000);
}

function renderAccount(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="acc-card"><div class="acc-name">${esc(fullName(AGENT))}</div><span class="badge-test">Pilote planning agent</span></div>
    <div class="acc-card"><h3>Ajouter à l’écran d’accueil</h3>${ios
      ? '<ol><li>Ouvrez cette page dans Safari.</li><li>Touchez le bouton Partager.</li><li>Choisissez « Sur l’écran d’accueil ».</li></ol>'
      : '<ol><li>Ouvrez cette page dans Chrome.</li><li>Touchez le menu ⋮ en haut à droite.</li><li>Choisissez « Ajouter à l’écran d’accueil ».</li></ol>'}</div>
    <div class="acc-card"><h3>À savoir</h3><p>Seuls les services publiés par votre responsable apparaissent ici. Votre code PIN est le même que dans l’application RDZ Agent.</p></div>
    <a class="btn btn-outline btn-block" href="${APP_HOME}">Retour à l’application</a>
    <button class="btn btn-outline btn-block" style="margin-top:10px" onclick="logout()">Changer d’agent</button>
    <div style="text-align:center;font-size:11.5px;color:var(--text3);margin-top:14px;">Version ${APP_VERSION}</div>`;
}

// ── Démarrage (même logique que mobile.html) ─────────────────
// Les boutons PDSA / PDS s'activent à l'heure : rafraîchit l'affichage chaque minute
setInterval(()=>{
  if(!AGENT || document.visibilityState!=='visible' || $('sheet-root').innerHTML) return;
  if(VIEW.tab==='home' || VIEW.detail) render();
}, 60000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && AGENT && Date.now()-LAST_LOAD>5*60*1000) reload(false);
});
(async function init(){
  const s=getLocal();
  if(!s.id) return showIdent();
  try{
    const [rows, ids] = await Promise.all([ agentGet('select=id,nom,prenom,pin_hash,actif&id=eq.'+encodeURIComponent(s.id)), pilotIds() ]);
    const a=rows[0];
    if(!a){ clearLocal(); return showIdent(); }
    if(a.actif===false){ clearLocal(); return showIdent('Votre accès a été désactivé. Contactez votre responsable.'); }
    // Session de l'application conservée : on ne déconnecte pas l'agent des autres modules
    if(!ids.has(String(a.id))) return showBlocked(fullName(a)+', votre compte n’a pas encore accès au planning. Contactez votre responsable.');
    if(!a.pin_hash){ clearLocal(); return showIdent('Créez d’abord votre code PIN dans l’application RDZ Agent.'); }
    if(a.pin_hash===s.hash) return enterApp(a);           // reconnexion silencieuse
    openPin(a,'Votre code d’accès a été modifié. Merci de le ressaisir.');
  }catch(e){ showIdent('Connexion impossible pour le moment. Réessayez.'); }
})();
</script>
