<!--
  Page autonome du pilote planning agent.
  - Identification IDENTIQUE à l'application RDZ Agent : choix du nom puis
    code PIN à 4 chiffres (même table agents, même hash, projet RDZ_Agent).
  - Session stockée sous des clés PROPRES (rdz_planning_pilot_*) : se
    connecter ici ne change pas l'agent connecté dans mobile.html, et
    inversement. Aucun lien depuis mobile.html.
  - Seuls les agents inscrits dans rdz_planning_pilot_agents (routeops)
    apparaissent, et seuls les services publiés (≠ "Planifiée") sont lus.
  Prérequis (routeops) : claude_migration-planning-pilote-agents.sql,
  puis -correctif-id.sql, -modifications.sql, -conges.sql,
  -refus-journal.sql, -temps-presence.sql,
  -heures-auto.sql.
-->

.auth-top .logo{height:58px;margin:0 auto;}
.wm{display:flex;flex-direction:column;align-items:center;line-height:1;}
.wm-main{font-weight:800;font-size:26px;letter-spacing:-.02em;color:#fff;}
.wm-sub{font-size:7.5px;letter-spacing:.28em;color:rgba(255,255,255,.7);margin-top:3px;font-weight:600;}

/* ── Écrans d'identification ── */
.auth{min-height:100vh;background:linear-gradient(160deg,var(--ink),var(--ink-2));display:flex;flex-direction:column;}
.auth-top{padding:34px 22px 26px;}
.auth-top .wm-main{font-size:38px;}
.auth-top .wm-sub{font-size:9px;}
.auth-body{flex:1;background:var(--bg);border-radius:22px 22px 0 0;padding:24px 18px 32px;display:flex;flex-direction:column;}
.auth-inner{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;}
.auth-title{font-size:22px;font-weight:800;letter-spacing:-.015em;}
.auth-sub{font-size:13.5px;color:var(--text2);margin:4px 0 18px;line-height:1.45;}
.notice{background:var(--warn-bg);color:#78350f;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:14px;}
.pick{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:16px;font-size:15.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;width:100%;text-align:left;}
.pick:active{background:var(--red-light);}
.pick svg{width:18px;height:18px;color:var(--text3);}
.muted-txt{text-align:center;color:var(--text3);font-size:13.5px;padding:24px 0;line-height:1.5;}

.pin-wrap{display:flex;flex-direction:column;align-items:center;flex:1;}
.pin-name{font-size:19px;font-weight:800;margin-top:6px;text-align:center;}
.pin-msg{font-size:13.5px;color:var(--text2);margin-top:6px;text-align:center;line-height:1.45;min-height:20px;}
.pin-msg.warn{background:var(--warn-bg);color:#78350f;padding:9px 12px;border-radius:10px;}
.pin-msg.err{color:#b91c1c;font-weight:600;}
.dots{display:flex;gap:16px;margin:22px 0 26px;}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);}
.dot.on{background:var(--ink);}
.dots.shake{animation:shake .35s;}
@keyframes shake{20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;}
.key{width:76px;height:76px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.key:active{background:var(--red-light);}
.key.fn{background:none;border:none;font-size:13px;font-weight:700;color:var(--text2);}
.back-link{margin-top:auto;padding-top:24px;font-size:13.5px;color:var(--text2);text-decoration:underline;align-self:center;}

/* ── Boutons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:10px;font-size:15px;font-weight:700;padding:0 16px;text-decoration:none;}
.btn:active{transform:scale(.98);}
.btn-block{width:100%;}
.btn-red{background:var(--red);color:#fff;}
.btn-white{background:#fff;color:var(--ink);}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.btn-ghost{background:var(--muted-bg);color:var(--text);}
.btn-sm{height:40px;font-size:13.5px;padding:0 12px;}
.btn svg{width:17px;height:17px;flex:none;}

/* ── Application ── */
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;height:56px;display:flex;align-items:center;justify-content:center;}
.tb-left,.tb-right{position:absolute;top:0;height:56px;display:flex;align-items:center;}
.tb-left{left:6px;} .tb-right{right:6px;}
.tb-title{font-weight:600;font-size:16px;}

// ── Utils ────────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function $(id){ return document.getElementById(id); }
function cap(s){ s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); }
function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDaysISO(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoDate(d); }
function todayISO(){ return isoDate(new Date()); }
function hhmm(t){ return String(t||'').slice(0,5); }
function toast(msg,err){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.className='toast'; },3200); }
function showScreen(id){ ['scr-loading','scr-ident','scr-pin','app'].forEach(x=>$(x).classList.toggle('hidden',x!==id)); }
// Même rendu de nom que mobile.html
function fullName(a){ return [a.nom,a.prenom].filter(Boolean).join(' ') || a.nom || a.prenom || '—'; }

// ── Accès aux deux projets Supabase (fetch natif) ────────────
async function agentGet(q){
  const r = await fetch(AGENT_URL+'/rest/v1/agents?'+q, { headers:{ apikey:AGENT_KEY, Authorization:'Bearer '+AGENT_KEY } });
  const d = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((d&&d.message)||'Connexion impossible');
  return d||[];
}
async function opsRpc(fn,args){
  const r = await fetch(OPS_URL+'/rest/v1/rpc/'+fn, {
    method:'POST', headers:{ apikey:OPS_KEY, Authorization:'Bearer '+OPS_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(args||{})
  });
  const d = await r.json().catch(()=>null);
  if(!r.ok) throw new Error(String((d&&(d.message||d.hint))||'Service planning indisponible').replace(/^ERROR:\s*/,''));
  return d;
}

// ── PIN : hash identique à mobile.html / parametrage.html ────
async function hashPin(pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('RDZ-PIN-2026-'+pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function getLocal(){ return { id:localStorage.getItem(LS_ID), nom:localStorage.getItem(LS_NOM), hash:localStorage.getItem(LS_HASH) }; }
function setLocal(id,nom,hash){ localStorage.setItem(LS_ID,id); localStorage.setItem(LS_NOM,nom); localStorage.setItem(LS_HASH,hash||''); }
function clearLocal(){ [LS_ID,LS_NOM,LS_HASH].forEach(k=>localStorage.removeItem(k)); }

// ── Identification ───────────────────────────────────────────
async function pilotIds(){ const ids = await opsRpc('rdz_planning_pilot_agent_ids',{}); return new Set((ids||[]).map(String)); }

async function showIdent(notice){
  $('ident-notice').innerHTML = notice? `<div class="notice">${esc(notice)}</div>` : '';
  const list = $('ident-list');
  list.innerHTML = '<div class="muted-txt">Chargement…</div>';
  showScreen('scr-ident');
  try{
    const [ids, agents] = await Promise.all([ pilotIds(), agentGet('select=id,nom,prenom&actif=eq.true&order=nom.asc') ]);
    const pilots = agents.filter(a=>ids.has(String(a.id)));
    list.innerHTML = pilots.length
      ? pilots.map(a=>`<button class="pick" onclick="selectAgent('${esc(a.id)}')">${esc(fullName(a))}${I.chev}</button>`).join('')
      : '<div class="muted-txt">Aucun agent n’est inscrit au pilote planning pour le moment.<br>Contactez votre responsable.</div>';
  }catch(e){
    list.innerHTML = `<div class="muted-txt">Connexion impossible.<br>${esc(e.message)}<br><br><button class="btn btn-outline btn-sm" onclick="showIdent()">Réessayer</button></div>`;
  }
}
function backToIdent(){ clearLocal(); showIdent(); }

async function selectAgent(id){
  try{
    const rows = await agentGet('select=id,nom,prenom,pin_hash,actif&id=eq.'+encodeURIComponent(id));
    const a = rows[0];
    if(!a || a.actif===false) return showIdent('Ce compte agent n’est plus actif.');
    if(!a.pin_hash) return showIdent('Vous n’avez pas encore de code PIN. Créez-le d’abord dans l’application RDZ Agent, puis revenez ici.');
    openPin(a, null);
  }catch(e){ toast('Erreur : '+e.message, true); }
}

let pinBuf='', pinAgent=null;
function openPin(agent, message){
  pinAgent=agent; pinBuf='';
  $('pin-name').textContent = fullName(agent);
  $('pin-msg').className = 'pin-msg'+(message?' warn':'');
  $('pin-msg').textContent = message || 'Entrez votre code PIN';
  dots(0);
  const keys=['1','2','3','4','5','6','7','8','9','','0','del'];
  $('pin-keypad').innerHTML = keys.map(k=> k===''? '<div></div>' : k==='del'
    ? '<button class="key fn" onclick="pinDigit(null)">Effacer</button>'
    : `<button class="key" onclick="pinDigit('${k}')">${k}</button>`).join('');
  showScreen('scr-pin');
}
function dots(n){ document.querySelectorAll('#pin-dots .dot').forEach((d,i)=>d.classList.toggle('on',i<n)); }
async function pinDigit(d){
  if(d===null){ pinBuf=pinBuf.slice(0,-1); dots(pinBuf.length); return; }
  if(pinBuf.length>=4) return;
  pinBuf+=d; dots(pinBuf.length);
  if(pinBuf.length<4) return;
  const hash = await hashPin(pinBuf);
  if(hash===pinAgent.pin_hash){
    setLocal(pinAgent.id, fullName(pinAgent), hash);
    enterApp(pinAgent);
  }else{
    const el=$('pin-dots'); el.classList.add('shake');
    $('pin-msg').className='pin-msg err'; $('pin-msg').textContent='Code incorrect, réessayez';
    setTimeout(()=>{ el.classList.remove('shake'); pinBuf=''; dots(0); },400);
  }
}
function logout(){ closeSheet(); clearLocal(); AGENT=null; SHIFTS=[]; ABS={list:[],balance:null,loaded:false}; CHANGES=[]; UNREAD=new Set(); VIEW={tab:'home',detail:null,planMode:'upcoming'}; showIdent(); }

// ── Données planning ─────────────────────────────────────────
function mapShift(r){
  return {
    id:String(r.id), version:Number(r.version), date:String(r.date).slice(0,10), start:hhmm(r.start_time), end:hhmm(r.end_time),
    status:r.status, post:r.post_name||'', description:r.description||'',
    breakMinutes:Number(r.break_minutes)||0, breakPaid:!!r.break_paid,
    actualStart:r.actual_start?hhmm(r.actual_start):'', actualEnd:r.actual_end?hhmm(r.actual_end):'',
    seen:r.seen_at||'', siteName:r.site_name||'Site', siteAddress:r.site_address||'',
    refusal: r.refusal? { reason:r.refusal.reason||'', at:r.refusal.at } : null,
    reason:r.reason||'', checked:r.checked_at||'',
    hoursRejection: r.hours_rejection? { note:r.hours_rejection.note||'', at:r.hours_rejection.at } : null
  };
}
function enterApp(agent){
  AGENT=agent; showScreen('app');
  $('btn-refresh').innerHTML=I.refresh;
  const tabs={ home:[I.home,'Accueil'], planning:[I.cal,'Planning'], temps:[I.clock,'Temps'], account:[I.user,'Compte'] };
  document.querySelectorAll('.tab').forEach(b=>{ const t=tabs[b.dataset.tab]; b.innerHTML=t[0]+'<span>'+t[1]+'</span>'; });
  render(); reload(false);
}
async function reload(manual){
  if(LOADING||!AGENT) return;
  LOADING=true; $('btn-refresh').classList.add('spin');
  try{
    // Services terminés : heures prévues reportées d'office (modifiables ensuite)
    await opsRpc('rdz_planning_pilot_autofill', { p_agent_id:String(AGENT.id) }).catch(()=>0);
    const [rows, chg, abs] = await Promise.all([
      opsRpc('rdz_planning_pilot_shifts', { p_agent_id:String(AGENT.id) }),
      opsRpc('rdz_planning_pilot_changes', { p_agent_id:String(AGENT.id) }).catch(()=>null),
      opsRpc('rdz_planning_pilot_absences', { p_agent_id:String(AGENT.id) }).catch(()=>null)
    ]);
    SHIFTS = (rows||[]).map(mapShift).filter(s=>s.status && s.status!==HIDDEN_STATUS);
    if(chg) setChanges(chg);
    if(abs){
      ABS.list = (abs.absences||[]).map(a=>({ id:String(a.id), kind:a.kind, from:String(a.from).slice(0,10), to:String(a.to).slice(0,10),
        status:a.status, reason:a.reason||'', days:a.days==null?null:Number(a.days) }));
      ABS.balance = abs.balance ? { year:abs.balance.year, opening:Number(abs.balance.opening)||0, taken:Number(abs.balance.taken)||0,
        pending:Number(abs.balance.pending)||0, remaining:Number(abs.balance.remaining)||0 } : null;
      ABS.loaded = true;
    }
    LAST_LOAD=Date.now();
    if(VIEW.detail && !SHIFTS.some(s=>s.id===VIEW.detail)) VIEW.detail=null;
    render();
    if(manual) toast('Planning à jour');
    markSeen();
  }catch(e){
    toast(e.message||'Chargement impossible', true);
    if(!SHIFTS.length) $('main').innerHTML=`<div class="empty"><b>Impossible de charger le planning</b>${esc(e.message||'')}<br><br><button class="btn btn-outline btn-sm" onclick="reload(true)">Réessayer</button></div>`;
  }finally{ LOADING=false; $('btn-refresh').classList.remove('spin'); }
}
// Journal : on retient les modifications arrivées depuis la dernière visite
// sur cet appareil (pastille rouge), puis on mémorise la plus récente.
function setChanges(list){
  CHANGES = (list||[]).map(c=>({ id:Number(c.id), kind:c.kind, shiftId:String(c.shift_id||''), date:String(c.date||'').slice(0,10),
    start:hhmm(c.start), end:hhmm(c.end), site:c.site||'Site', post:c.post||'', details:c.details||{}, at:c.at,
    refType:c.ref_type||'shift', dateTo:String(c.date_to||'').slice(0,10), absKind:c.abs_kind||'', note:c.note||'' }));
  const key = LS_CHG_SEEN+AGENT.id;
  const raw = localStorage.getItem(key);
  const maxId = CHANGES.reduce((m,c)=>Math.max(m,c.id),0);
  if(raw===null){ UNREAD = new Set(); }                // 1re visite : rien n'est « nouveau »
  else { const seen=Number(raw)||0; CHANGES.forEach(c=>{ if(c.id>seen && !OWN_ACTIONS.has(c.kind)) UNREAD.add(c.id); }); }
  try{ localStorage.setItem(key, String(Math.max(maxId, Number(raw)||0))); }catch(e){}
}

// Renseigne seen_at côté admin pour les services à venir encore jamais vus.
function markSeen(){
  const now=new Date();
  const ids = SHIFTS.filter(s=>!s.seen && sEnd(s)>now).map(s=>s.id);
  if(!ids.length) return;
  opsRpc('rdz_planning_pilot_mark_seen', { p_agent_id:String(AGENT.id), p_shift_ids:ids })
    .then(()=>{ SHIFTS.forEach(s=>{ if(ids.includes(s.id)) s.seen=new Date().toISOString(); }); })
    .catch(()=>{ /* non bloquant */ });
}

// ── Dates des services ───────────────────────────────────────
function sStart(s){ return new Date(s.date+'T'+s.start+':00'); }
function sEnd(s){ const st=sStart(s); let e=new Date(s.date+'T'+s.end+':00'); if(e<=st) e=new Date(e.getTime()+86400000); return e; }
function durLabel(s){ const m=Math.round((sEnd(s)-sStart(s))/60000); return Math.floor(m/60)+'h'+(m%60?pad(m%60):''); }
function paidMinutes(s){ return Math.round((sEnd(s)-sStart(s))/60000) - ((s.breakMinutes&&!s.breakPaid)?s.breakMinutes:0); }
function dayLabel(iso){
  const t=todayISO();
  if(iso===t) return 'Aujourd’hui';
  if(iso===addDaysISO(t,1)) return 'Demain';
  return cap(new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long'}));
}
function fullDate(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function minusMinutes(t,n){ const [h,m]=t.split(':').map(Number); const x=(h*60+m-n+1440)%1440; return pad(Math.floor(x/60))+':'+pad(x%60); }
function mapsUrl(a){ return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a); }
function mondayOf(iso){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); return isoDate(d); }

const STATUS = {
  'Publiée':  { label:'À valider',       cls:'warn' },
  'Vue':      { label:'À valider',       cls:'warn' },
  'Validée':  { label:'Confirmé',        cls:'ok' },
  'Effectuée':{ label:'Heures déclarées',cls:'info' },
  'Contrôlée':{ label:'Clôturé',         cls:'muted' }
};
function isOpen(s){ return (s.status==='Publiée'||s.status==='Vue') && sEnd(s)>new Date(); }
function needsConfirm(s){ return isOpen(s) && !s.refusal; }
function chip(s){ if(s.refusal && isOpen(s)) return `<span class="chip bad">${I.xmark}Refusé</span>`; const st=STATUS[s.status]||{label:s.status,cls:'muted'}; return `<span class="chip ${st.cls}">${st.cls==='ok'?I.check:''}${esc(st.label)}</span>`; }

// ── Navigation / rendu ───────────────────────────────────────
function go(tab){ VIEW.tab=tab; VIEW.detail=null; render(); window.scrollTo(0,0); }
function openShift(id){ VIEW.detail=id; render(); window.scrollTo(0,0); }
function closeDetail(){ VIEW.detail=null; render(); window.scrollTo(0,0); }
function setPlanMode(m){ VIEW.planMode=m; render(); }

function render(){
  const pending = SHIFTS.filter(needsConfirm).length;
  document.querySelectorAll('.tab').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab===VIEW.tab);
    const old=b.querySelector('.tab-dot'); if(old) old.remove();
    const n = b.dataset.tab==='planning'? pending : b.dataset.tab==='temps'? SHIFTS.filter(toCheck).length : 0;
    if(n){ const d=document.createElement('span'); d.className='tab-dot'; d.textContent=n; b.appendChild(d); }
  });
  const left=$('tb-left'), center=$('tb-center');
  if(VIEW.detail){
    left.innerHTML=`<button class="icon-btn" onclick="closeDetail()" aria-label="Retour">${I.back}</button>`;
    center.innerHTML='<span class="tb-title">Mon service</span>';
    $('main').innerHTML=renderDetail(SHIFTS.find(s=>s.id===VIEW.detail));
    return;
  }
  left.innerHTML='';
  center.innerHTML = VIEW.tab==='home'
    ? '<div class="logo" role="img" aria-label="RDZ Security Management"></div>'
    : `<span class="tb-title">${VIEW.tab==='planning'?'Mon planning':VIEW.tab==='temps'?'Temps &amp; présence':'Mon compte'}</span>`;
  if(!LAST_LOAD && VIEW.tab!=='account'){ $('main').innerHTML='<div class="loader">Chargement de votre planning…</div>'; return; }
  $('main').innerHTML = VIEW.tab==='home'? renderHome() : VIEW.tab==='planning'? renderPlanning() : VIEW.tab==='temps'? renderTemps() : renderAccount();
}

function renderHome(){
  const now=new Date();
  const up = SHIFTS.filter(s=>sEnd(s)>now).sort((a,b)=>sStart(a)-sStart(b));
  const next = up[0];
  let h = `<div class="hello">Bonjour${AGENT.prenom?' '+esc(AGENT.prenom):''}</div>
    <div class="hello-sub">${up.length?'Voici vos prochains services':'Votre planning publié apparaîtra ici'}</div>`;
  if(!next){
    h += `<div class="empty" style="margin-bottom:22px"><b>Aucun service à venir</b>Dès que votre responsable publie votre planning, vos services s’affichent ici et vous recevez un e-mail.</div>`;
  } else {
    const live = sStart(next)<=now, t=todayISO();
    const pill = next.date===t? '' : next.date===addDaysISO(t,1)? 'tmw' : null;
    h += `<div class="next">
    <div class="next-kicker">${live?'<span class="live">EN COURS</span>':'PROCHAIN SERVICE'}</div>
    <div class="next-body" onclick="openShift('${esc(next.id)}')">
      <div class="next-lines">
        <div class="nl">${I.cal}${pill!==null?`<span class="pill ${pill}">${esc(dayLabel(next.date))}</span>`:esc(dayLabel(next.date))}</div>
        <div class="nl site">${I.pin}<span>${esc(next.siteName)}</span></div>
        <div class="nl">${I.clock}<span>${esc(next.start)} – ${esc(next.end)} (${durLabel(next)})</span></div>
        ${next.post?`<div class="nl">${I.people}<span>${esc(next.post)}</span></div>`:''}
      </div>
      <span class="chev">${I.chev}</span>
    </div>
    <div class="next-actions ${next.siteAddress?'':'one'}">
      <button class="btn btn-red btn-sm" onclick="openShift('${esc(next.id)}')">Voir le service</button>
      ${next.siteAddress?`<a class="btn btn-white btn-sm" href="${esc(mapsUrl(next.siteAddress))}" target="_blank" rel="noopener">${I.pin}Itinéraire</a>`:''}
    </div>
  </div>`;
  }
  const toDecl = SHIFTS.filter(toCheck).length;
  if(toDecl) h += `<div class="validate-bar"><span>${toDecl} service${toDecl>1?'s':''} terminé${toDecl>1?'s':''} : vérifiez vos heures</span><button class="btn btn-red btn-sm" onclick="go('temps')">Vérifier</button></div>`;
  h += renderStats(up);
  h += renderLeaveCard();
  h += renderChangesBlock();
  const rest = up.slice(1,4);
  if(rest.length){
    h += '<div class="sec-title">Ensuite</div>'+rest.map(shiftRow).join('');
    if(up.length>4) h += `<button class="btn btn-ghost btn-block btn-sm" onclick="setPlanMode('upcoming');go('planning')">Voir tout le planning (${up.length} services)</button>`;
  }
  return h;
}

function absPeriod(a){ return a.from===a.to? fmtDay(a.from) : 'Du '+fmtDay(a.from)+' au '+fmtDay(a.to); }
function absChip(a){

function jours(n){ n=Number(n)||0; const v=Number.isInteger(n)? n : n.toFixed(1).replace('.',','); return v+' jour'+(Math.abs(n)>1?'s':''); }
function renderLeaveCard(){

// ── Formulaire de demande ────────────────────────────────────
let LF = { kind:'paid', oneDay:false, from:'', to:'', reason:'' };
function weekdaysBetween(a,b){ let n=0; const d=new Date(a+'T12:00:00'), e=new Date(b+'T12:00:00'); while(d<=e){ const w=d.getDay(); if(w!==0&&w!==6) n++; d.setDate(d.getDate()+1); } return n; }
function openLeaveForm(){
  LF = { kind:'paid', oneDay:false, from:addDaysISO(todayISO(),1), to:addDaysISO(todayISO(),1), reason:'' };
  renderLeaveForm();
}
function lfSet(k,v){
  LF[k]=v;
  if(k==='oneDay' && v) LF.to=LF.from;
  if(k==='from' && (LF.oneDay || !LF.to || LF.to<v)) LF.to=v;
  renderLeaveForm();
}
function lfSummary(){
  if(!LF.from || !LF.to) return '';
  if(LF.to<LF.from) return '<div class="req-sum warn">La date de fin est avant la date de début.</div>';
  const cal = Math.round((new Date(LF.to+'T12:00:00')-new Date(LF.from+'T12:00:00'))/864e5)+1;
  if(LF.kind!=='paid') return `<div class="req-sum">Indisponibilité de ${jours(cal)} (${esc(absPeriod(LF))}).</div>`;
  const n = weekdaysBetween(LF.from, LF.to), b = ABS.balance;
  if(!n) return '<div class="req-sum warn">Cette période ne contient aucun jour ouvré (lundi → vendredi).</div>';
  if(!b) return `<div class="req-sum">${jours(n)} ouvré${n>1?'s':''} décompté${n>1?'s':''}.</div>`;
  const after = b.remaining - b.pending - n;
  return `<div class="req-sum ${after<0?'warn':''}">${jours(n)} ouvré${n>1?'s':''} décompté${n>1?'s':''}. ${after<0? 'Attention : cela dépasse votre solde disponible ('+jours(b.remaining-b.pending)+').' : 'Il vous resterait '+jours(after)+' si la demande est acceptée.'}</div>`;
}

    <div class="kind-seg">
      <button class="${LF.kind==='paid'?'on':''}" onclick="lfSet('kind','paid')">Congé payé</button>
      <button class="${LF.kind==='unavailable'?'on':''}" onclick="lfSet('kind','unavailable')">Indisponibilité</button>
    </div>
    <div class="one-day"><span>Une seule journée</span><button class="switch ${LF.oneDay?'on':''}" aria-pressed="${LF.oneDay}" onclick="lfSet('oneDay',${!LF.oneDay})"></button></div>
    <div class="dates ${LF.oneDay?'one':''}">
      <div><label class="fl" for="lf-from">${LF.oneDay?'Date':'Du'}</label><input class="finp" type="date" id="lf-from" min="${t}" value="${esc(LF.from)}" onchange="lfSet('from',this.value)"></div>
      ${LF.oneDay? '' : `<div><label class="fl" for="lf-to">Au (inclus)</label><input class="finp" type="date" id="lf-to" min="${esc(LF.from||t)}" value="${esc(LF.to)}" onchange="lfSet('to',this.value)"></div>`}
    </div>

async function submitLeave(){
  const t=todayISO();
  if(!LF.from || !LF.to) return renderLeaveForm('Choisissez la date'+(LF.oneDay?'':'s')+' de votre demande.');
  if(LF.from<t) return renderLeaveForm('La date de début ne peut pas être dans le passé.');
  if(LF.to<LF.from) return renderLeaveForm('La date de fin doit être après la date de début.');
  if(LF.kind==='paid' && !weekdaysBetween(LF.from,LF.to)) return renderLeaveForm('Un congé payé doit contenir au moins un jour ouvré.');
  const btn=$('lf-btn'); btn.disabled=true; btn.textContent='Envoi…';
  try{
    await opsRpc('rdz_planning_pilot_request_absence', { p_agent_id:String(AGENT.id), p_kind:LF.kind, p_from:LF.from, p_to:LF.to, p_reason:(LF.reason||'').trim() });
    closeSheet(); toast('Demande envoyée à votre responsable');
    await reload(false);
  }catch(e){ renderLeaveForm(e.message||'Envoi impossible'); }
}
function askCancelAbsence(id){
  const a=ABS.list.find(x=>x.id===id); if(!a) return;

}
async function doCancelAbsence(id){
  const btn=$('ca-btn'); btn.disabled=true; btn.textContent='Annulation…';

    const ok = await opsRpc('rdz_planning_pilot_cancel_absence', { p_agent_id:String(AGENT.id), p_id:id });
    closeSheet(); toast(ok? 'Demande annulée' : 'Cette demande a déjà été traitée', !ok);
  }catch(e){ closeSheet(); toast(e.message||'Annulation impossible', true); }

// ── Journal des modifications ────────────────────────────────
function shortDate(iso){ return iso? new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'') : ''; }
function relTime(ts){
  const d=new Date(ts), diff=(Date.now()-d.getTime())/60000;
  const hm=d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});
  if(diff<1) return 'à l’instant';
  if(diff<60) return 'il y a '+Math.floor(diff)+' min';
  if(isoDate(d)===todayISO()) return 'auj. '+hm;
  if(isoDate(d)===addDaysISO(todayISO(),-1)) return 'hier '+hm;
  return d.toLocaleDateString('fr-CH',{day:'numeric',month:'short'}).replace('.','');
}

    ${canDeclare(s)? `<button class="btn btn-red btn-block" style="margin-top:10px" onclick="openDeclare('${esc(s.id)}')">Déclarer mes heures</button>` : ''}
    ${isAuto(s)? `<button class="btn btn-red btn-block" style="margin-top:10px" onclick="openDeclare('${esc(s.id)}')">Vérifier mes heures</button><div class="d-note">Heures prévues enregistrées automatiquement : confirmez-les ou corrigez-les.</div>`
      : isPendingHours(s)? `<button class="btn btn-outline btn-block" style="margin-top:10px" onclick="openDeclare('${esc(s.id)}')">Modifier mes heures</button><div class="d-note">Heures en attente de validation par votre responsable.</div>` : ''}`;
}

// ── Validation (un service ou tous ceux en attente) ──────────
function askConfirm(id){
  const items = id? SHIFTS.filter(s=>s.id===id && isOpen(s)) : SHIFTS.filter(needsConfirm).sort((a,b)=>sStart(a)-sStart(b));
  if(!items.length) return;
  const one = items.length===1;
  $('sheet-root').innerHTML = `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <h2>${one?'Valider ce service ?':'Valider '+items.length+' services ?'}</h2>
    <div class="sub">Votre responsable verra que vous avez pris connaissance ${one?'de ce service':'de ces services'}.</div>
    <div class="sheet-list">${items.map(s=>`<div><span>${esc(shortDate(s.date))} · <b>${esc(s.siteName)}</b></span><span>${esc(s.start)}–${esc(s.end)}</span></div>`).join('')}</div>
    <button class="btn btn-red btn-block" id="cf-btn" onclick="doConfirm(${id?`'${esc(id)}'`:'null'})">Oui, je valide</button>
    <button class="btn btn-ghost btn-block" onclick="closeSheet()">Annuler</button>
  </div></div>`;
}
function closeSheet(){ $('sheet-root').innerHTML=''; }

// ── Refus d'un service (motif obligatoire) ───────────────────
const REFUSE_PRESETS = ['Indisponible ce jour-là','Horaires incompatibles','Déjà engagé ailleurs','Raison médicale','Autre'];
let RF = { id:null, preset:'', text:'' };
function openRefuse(id){ RF = { id, preset:'', text:'' }; renderRefuse(); }
function rfPreset(p){ RF.preset = RF.preset===p? '' : p; renderRefuse(); }
function renderRefuse(err){
  const s=SHIFTS.find(x=>x.id===RF.id); if(!s) return;
  $('sheet-root').innerHTML = `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <h2>Refuser ce service ?</h2>
    <div class="sub">${esc(shortDate(s.date))} · <b>${esc(s.siteName)}</b> · ${esc(s.start)}–${esc(s.end)}<br>Votre responsable sera prévenu et pourra réorganiser le planning.</div>
    <label class="fl">Motif</label>
    <div class="presets">${REFUSE_PRESETS.map((p,i)=>`<button class="${RF.preset===p?'on':''}" onclick="rfPreset(REFUSE_PRESETS[${i}])">${esc(p)}</button>`).join('')}</div>
    <label class="fl" for="rf-text">Précisions ${RF.preset && RF.preset!=='Autre'?'(facultatif)':''}</label>
    <textarea class="finp" id="rf-text" maxlength="250" placeholder="Expliquez en quelques mots…" oninput="RF.text=this.value">${esc(RF.text)}</textarea>
    ${err? `<div class="req-err">${esc(err)}</div>` : ''}
    <button class="btn btn-red btn-block" id="rf-btn" style="margin-top:16px" onclick="submitRefuse()">Confirmer le refus</button>
    <button class="btn btn-ghost btn-block" onclick="closeSheet()">Annuler</button>
  </div></div>`;
}
async function submitRefuse(){
  const s=SHIFTS.find(x=>x.id===RF.id); if(!s) return closeSheet();
  const txt=(RF.text||'').trim();
  const reason = RF.preset && RF.preset!=='Autre' ? (txt? RF.preset+' — '+txt : RF.preset) : txt;
  if(reason.length<3) return renderRefuse(RF.preset==='Autre'? 'Précisez le motif du refus.' : 'Choisissez un motif ou expliquez en quelques mots.');
  const btn=$('rf-btn'); btn.disabled=true; btn.textContent='Envoi…';
  try{
    await opsRpc('rdz_planning_pilot_refuse_shift', { p_agent_id:String(AGENT.id), p_shift_id:s.id, p_version:s.version, p_reason:reason });
    closeSheet(); toast('Refus envoyé à votre responsable');
  }catch(e){ return renderRefuse(e.message||'Envoi impossible'); }
  await reload(false);
}
async function doConfirm(id){
  const items = (id? SHIFTS.filter(s=>s.id===id && isOpen(s)) : SHIFTS.filter(needsConfirm)).map(s=>({ id:s.id, version:s.version }));
  const btn=$('cf-btn'); if(!items.length||!btn) return;
  btn.disabled=true; btn.textContent='Envoi…';
  try{
    const n = Number(await opsRpc('rdz_planning_pilot_accept_shifts', { p_agent_id:String(AGENT.id), p_items:items }))||0;
    closeSheet();
    if(n===items.length) toast(n>1? n+' services validés' : 'Service validé');
    else toast((n? n+' validé(s). ' : '')+'Un service a été modifié entre-temps, vérifiez-le à nouveau.', true);
  }catch(e){ closeSheet(); toast(e.message||'Validation impossible', true); }
  await reload(false);
}
// ── Temps & présence ─────────────────────────────────────────
// À déclarer : service terminé, pas encore déclaré, non refusé par l'agent.
function canDeclare(s){ return ['Publiée','Vue','Validée'].includes(s.status) && !s.refusal && sEnd(s)<=new Date(); }
function isPendingHours(s){ return s.status==='Effectuée'; }
function isAuto(s){ return s.status==='Effectuée' && s.reason===AUTO_REASON; }
function toCheck(s){ return canDeclare(s) || isAuto(s); }
function spanMin(a,b){ const [ah,am]=a.split(':').map(Number), [bh,bm]=b.split(':').map(Number); let d=(bh*60+bm)-(ah*60+am); if(d<=0) d+=1440; return d; }
function fmtMin(m){ const neg=m<0; m=Math.abs(m); const h=Math.floor(m/60), r=m%60; return (neg?'−':'+')+(h? h+'h'+(r?pad(r):'') : r+' min'); }
function hoursDiff(s){ if(!s.actualStart||!s.actualEnd) return 0; return spanMin(s.actualStart,s.actualEnd) - spanMin(s.start,s.end); }
function diffTag(m){ return m? `<span class="tp-diff ${m>0?'plus':'minus'}">${fmtMin(m)}</span>` : ''; }
function tpRow(s, mode){
  const d=new Date(s.date+'T12:00:00');
  const changed = s.actualStart && (s.actualStart!==s.start || s.actualEnd!==s.end);
  const real = s.actualStart? `<div class="tp-l">Réel <b>${esc(s.actualStart)}–${esc(s.actualEnd||'—')}</b> ${diffTag(hoursDiff(s))}${changed&&!hoursDiff(s)?'<span class="tp-diff plus">décalé</span>':''}</div>` : '';
  const auto = isAuto(s);
  const btn = mode==='declare'? '<span class="tp-cta">Déclarer</span>' : auto? '<span class="tp-cta">Vérifier</span>' : mode==='pending'? '<span class="tp-edit">Modifier</span>' : '';
  const click = mode==='done'? `openShift('${esc(s.id)}')` : `openDeclare('${esc(s.id)}')`;
  return `<button class="tp-row" onclick="${click}">
    <div class="dblock"><div class="dw">${esc(d.toLocaleDateString('fr-CH',{weekday:'short'}).replace('.',''))}</div><div class="dn">${d.getDate()}</div><div class="dm">${esc(d.toLocaleDateString('fr-CH',{month:'short'}).replace('.',''))}</div></div>
    <div class="tp-lines">
      <div class="s1">${esc(s.siteName)}</div>
      <div class="tp-l">Prévu ${esc(s.start)}–${esc(s.end)}${s.post?' · '+esc(s.post):''}</div>
      ${real}
      ${mode==='declare' && s.hoursRejection? `<div class="tp-rej">Refusé : « ${esc(s.hoursRejection.note)} »</div>` : ''}
      ${auto? '<div class="tp-l"><span class="chip info">Pré-rempli automatiquement</span></div>' : mode==='pending'? '<div class="tp-l"><span class="chip warn">En attente de validation</span></div>' : mode==='done'? '<div class="tp-l"><span class="chip ok">'+I.check+'Validé</span></div>' : ''}
    </div>
    ${btn}
  </button>`;
}
function renderTemps(){
  const byDateDesc=(a,b)=>sStart(b)-sStart(a);
  const toDecl = SHIFTS.filter(toCheck).sort((a,b)=>sStart(a)-sStart(b));
  const pending = SHIFTS.filter(s=>isPendingHours(s) && !isAuto(s)).sort(byDateDesc);
  const done = SHIFTS.filter(s=>s.status==='Contrôlée').sort(byDateDesc);
  const ym=todayISO().slice(0,7);
  const monthMin = done.filter(s=>s.date.slice(0,7)===ym).reduce((n,s)=>n+(s.actualStart&&s.actualEnd? spanMin(s.actualStart,s.actualEnd) : spanMin(s.start,s.end)) - ((s.breakMinutes&&!s.breakPaid)?s.breakMinutes:0),0);
  let h = `<div class="tp-intro">À la fin de chaque service, vos heures prévues sont enregistrées automatiquement. Vérifiez-les et modifiez-les si besoin : votre responsable les valide ensuite.</div>
    <div class="stats">
      <div class="stat ${toDecl.length?'alert':''}"><span class="n">${toDecl.length}</span><span class="l">À vérifier</span></div>
      <div class="stat"><span class="n">${pending.length}</span><span class="l">En attente</span></div>
      <div class="stat"><span class="n">${Math.floor(monthMin/60)}h${monthMin%60?pad(monthMin%60):''}</span><span class="l">Validées ce mois</span></div>
    </div>`;
  if(toDecl.length) h += '<div class="tp-sec">À vérifier</div>'+toDecl.map(s=>tpRow(s, isAuto(s)?'pending':'declare')).join('');
  if(pending.length) h += '<div class="tp-sec">En attente de validation</div>'+pending.map(s=>tpRow(s,'pending')).join('');
  if(done.length) h += '<div class="tp-sec">Validées</div>'+done.slice(0,30).map(s=>tpRow(s,'done')).join('');
  if(!toDecl.length && !pending.length && !done.length) h += '<div class="empty"><b>Aucun service effectué</b>Vos services terminés apparaîtront ici pour que vous puissiez déclarer vos heures.</div>';
  return h;
}

// Déclaration des heures
let DC = { id:null, mode:'conforme', start:'', end:'', reason:'' };
function openDeclare(id){
  const s=SHIFTS.find(x=>x.id===id); if(!s) return;
  const edited = s.actualStart && (s.actualStart!==s.start || s.actualEnd!==s.end);
  DC = { id, mode: edited? 'autre':'conforme', start:s.actualStart||s.start, end:s.actualEnd||s.end, reason: edited? (s.reason||'') : '' };
  renderDeclare();
}
function dcSet(k,v){ DC[k]=v; renderDeclare(); }
function renderDeclare(err){
  const s=SHIFTS.find(x=>x.id===DC.id); if(!s) return closeSheet();
  const other = DC.mode==='autre';
  const diff = other && DC.start && DC.end ? spanMin(DC.start,DC.end)-spanMin(s.start,s.end) : 0;
  $('sheet-root').innerHTML = `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <h2>${isAuto(s)?'Vérifier mes heures':s.status==='Effectuée'?'Modifier ma déclaration':'Déclarer mes heures'}</h2>
    ${isAuto(s)? '<div class="sub">Vos heures prévues ont été enregistrées automatiquement à la fin du service. Confirmez-les ou corrigez-les.</div>' : ''}
    <div class="dc-plan"><b>${esc(s.siteName)}</b>${s.post?' · '+esc(s.post):''}<br>${esc(cap(fullDate(s.date)))}<br>Prévu : <b>${esc(s.start)} – ${esc(s.end)}</b> (${durLabel(s)})</div>
    ${s.hoursRejection? `<div class="dc-rej"><b>Déclaration refusée par votre responsable</b><br>« ${esc(s.hoursRejection.note)} »</div>` : ''}
    <label class="fl">Mes heures réelles</label>
    <div class="kind-seg">
      <button class="${other?'':'on'}" onclick="dcSet('mode','conforme')">${isAuto(s)?'Oui, c’est correct':'Conformes au planning'}</button>
      <button class="${other?'on':''}" onclick="dcSet('mode','autre')">Différentes</button>
    </div>
    ${other? `<div class="times">
        <div><label class="fl" for="dc-s">Début réel</label><input class="finp" type="time" id="dc-s" value="${esc(DC.start)}" onchange="dcSet('start',this.value)"></div>
        <div><label class="fl" for="dc-e">Fin réelle</label><input class="finp" type="time" id="dc-e" value="${esc(DC.end)}" onchange="dcSet('end',this.value)"></div>
      </div>
      <div class="req-sum ${diff?'warn':''}">Durée réelle : <b>${DC.start&&DC.end? (()=>{const m=spanMin(DC.start,DC.end);return Math.floor(m/60)+'h'+(m%60?pad(m%60):'');})() : '—'}</b>${diff? ' · écart '+fmtMin(diff)+' par rapport au planning' : ''}</div>
      <label class="fl" for="dc-r">Motif (obligatoire)</label>
      <textarea class="finp" id="dc-r" maxlength="250" placeholder="Ex. relève arrivée en retard, intervention en fin de service…" oninput="DC.reason=this.value">${esc(DC.reason)}</textarea>` : ''}
    <div class="req-sum">${other? 'Votre responsable devra valider ces heures.' : 'Vous confirmez avoir effectué ce service aux horaires prévus.'}</div>
    ${err? `<div class="req-err">${esc(err)}</div>` : ''}
    <button class="btn btn-red btn-block" id="dc-btn" style="margin-top:16px" onclick="submitDeclare()">Envoyer</button>
    <button class="btn btn-ghost btn-block" onclick="closeSheet()">Annuler</button>
  </div></div>`;
}
async function submitDeclare(){
  const s=SHIFTS.find(x=>x.id===DC.id); if(!s) return closeSheet();
  let start=s.start, end=s.end, reason='';
  if(DC.mode==='autre'){
    start=DC.start; end=DC.end; reason=(DC.reason||'').trim();
    if(!/^\d{2}:\d{2}$/.test(start||'') || !/^\d{2}:\d{2}$/.test(end||'')) return renderDeclare('Renseignez l’heure de début et de fin.');
    if(start===s.start && end===s.end) return renderDeclare('Ces heures sont identiques au planning : choisissez « Conformes au planning ».');
    if(reason.length<3) return renderDeclare('Indiquez pourquoi vos heures diffèrent du planning.');
  }
  const btn=$('dc-btn'); btn.disabled=true; btn.textContent='Envoi…';
  try{
    await opsRpc('rdz_planning_pilot_declare_hours', { p_agent_id:String(AGENT.id), p_shift_id:s.id, p_start:start, p_end:end, p_reason:reason });
    closeSheet(); toast(DC.mode==='autre'? 'Heures envoyées à votre responsable' : 'Heures confirmées');
  }catch(e){ return renderDeclare(e.message||'Envoi impossible'); }
  await reload(false);
}

function renderAccount(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="acc-card"><div class="acc-name">${esc(fullName(AGENT))}</div><span class="badge-test">Pilote planning agent</span></div>
    <div class="acc-card"><h3>Ajouter à l’écran d’accueil</h3>${ios
      ? '<ol><li>Ouvrez cette page dans Safari.</li><li>Touchez le bouton Partager.</li><li>Choisissez « Sur l’écran d’accueil ».</li></ol>'
      : '<ol><li>Ouvrez cette page dans Chrome.</li><li>Touchez le menu ⋮ en haut à droite.</li><li>Choisissez « Ajouter à l’écran d’accueil ».</li></ol>'}</div>
    <div class="acc-card"><h3>À savoir</h3><p>Seuls les services publiés par votre responsable apparaissent ici. Votre code PIN est le même que dans l’application RDZ Agent.</p></div>
    <button class="btn btn-outline btn-block" onclick="logout()">Changer d’agent</button>
    <div style="text-align:center;font-size:11.5px;color:var(--text3);margin-top:14px;">Version ${APP_VERSION}</div>`;
}

// ── Démarrage (même logique que mobile.html) ─────────────────
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && AGENT && Date.now()-LAST_LOAD>5*60*1000) reload(false);
});
(async function init(){
  const s=getLocal();
  if(!s.id) return showIdent();
  try{
    const [rows, ids] = await Promise.all([ agentGet('select=id,nom,prenom,pin_hash,actif&id=eq.'+encodeURIComponent(s.id)), pilotIds() ]);
    const a=rows[0];
    if(!a){ clearLocal(); return showIdent(); }
    if(a.actif===false){ clearLocal(); return showIdent('Votre accès a été désactivé. Contactez votre responsable.'); }
    if(!ids.has(String(a.id))){ clearLocal(); return showIdent('Le pilote planning est terminé pour votre compte.'); }
    if(!a.pin_hash){ clearLocal(); return showIdent('Créez d’abord votre code PIN dans l’application RDZ Agent.'); }
    if(a.pin_hash===s.hash) return enterApp(a);           // reconnexion silencieuse
    openPin(a,'Votre code d’accès a été modifié. Merci de le ressaisir.');
  }catch(e){ showIdent('Connexion impossible pour le moment. Réessayez.'); }
})();
</script>
</body>
