<!-- RDZ · planning-agent (pilote) · v3 · 2026-09-24 · stats + journal + validation -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111c2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RDZ Planning">
<title>RDZ Planning — Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<!--
  Page autonome du pilote planning agent.
  - Identification IDENTIQUE à l'application RDZ Agent : choix du nom puis
    code PIN à 4 chiffres (même table agents, même hash, projet RDZ_Agent).
  - Session stockée sous des clés PROPRES (rdz_planning_pilot_*) : se
    connecter ici ne change pas l'agent connecté dans mobile.html, et
    inversement. Aucun lien depuis mobile.html.
  - Seuls les agents inscrits dans rdz_planning_pilot_agents (routeops)
    apparaissent, et seuls les services publiés (≠ "Planifiée") sont lus.
  Prérequis (routeops) : claude_migration-planning-pilote-agents.sql,
  puis -correctif-id.sql, puis -modifications.sql.
-->
<style>
:root{
  --red:#d71920; --red-dark:#b31219; --red-light:#fdecec;
  --ink:#111c2e; --ink-2:#1c2b40;
  --bg:#f3f4f6; --line:#e5e7eb;
  --text:#111827; --text2:#4b5563; --text3:#9ca3af;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7;
  --info:#1d4ed8; --info-bg:#dbeafe; --muted-bg:#f3f4f6;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;background:var(--ink);}
body{min-height:100%;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.hidden{display:none!important;}

.wm{display:flex;flex-direction:column;align-items:center;line-height:1;}
.wm-main{font-weight:800;font-size:26px;letter-spacing:-.02em;color:#fff;}
.wm-sub{font-size:7.5px;letter-spacing:.28em;color:rgba(255,255,255,.7);margin-top:3px;font-weight:600;}

/* ── Écrans d'identification ── */
.auth{min-height:100vh;background:linear-gradient(160deg,var(--ink),var(--ink-2));display:flex;flex-direction:column;}
.auth-top{padding:34px 22px 26px;}
.auth-top .wm-main{font-size:38px;}
.auth-top .wm-sub{font-size:9px;}
.auth-body{flex:1;background:var(--bg);border-radius:22px 22px 0 0;padding:24px 18px 32px;display:flex;flex-direction:column;}
.auth-inner{max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;}
.auth-title{font-size:22px;font-weight:800;letter-spacing:-.015em;}
.auth-sub{font-size:13.5px;color:var(--text2);margin:4px 0 18px;line-height:1.45;}
.notice{background:var(--warn-bg);color:#78350f;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:14px;}
.pick{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:16px;font-size:15.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;width:100%;text-align:left;}
.pick:active{background:var(--red-light);}
.pick svg{width:18px;height:18px;color:var(--text3);}
.muted-txt{text-align:center;color:var(--text3);font-size:13.5px;padding:24px 0;line-height:1.5;}

.pin-wrap{display:flex;flex-direction:column;align-items:center;flex:1;}
.pin-name{font-size:19px;font-weight:800;margin-top:6px;text-align:center;}
.pin-msg{font-size:13.5px;color:var(--text2);margin-top:6px;text-align:center;line-height:1.45;min-height:20px;}
.pin-msg.warn{background:var(--warn-bg);color:#78350f;padding:9px 12px;border-radius:10px;}
.pin-msg.err{color:#b91c1c;font-weight:600;}
.dots{display:flex;gap:16px;margin:22px 0 26px;}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);}
.dot.on{background:var(--ink);}
.dots.shake{animation:shake .35s;}
@keyframes shake{20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;}
.key{width:76px;height:76px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.key:active{background:var(--red-light);}
.key.fn{background:none;border:none;font-size:13px;font-weight:700;color:var(--text2);}
.back-link{margin-top:auto;padding-top:24px;font-size:13.5px;color:var(--text2);text-decoration:underline;align-self:center;}

/* ── Boutons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:10px;font-size:15px;font-weight:700;padding:0 16px;text-decoration:none;}
.btn:active{transform:scale(.98);}
.btn-block{width:100%;}
.btn-red{background:var(--red);color:#fff;}
.btn-white{background:#fff;color:var(--ink);}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.btn-ghost{background:var(--muted-bg);color:var(--text);}
.btn-sm{height:40px;font-size:13.5px;padding:0 12px;}
.btn svg{width:17px;height:17px;flex:none;}

/* ── Application ── */
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;height:56px;display:flex;align-items:center;justify-content:center;}
.tb-left,.tb-right{position:absolute;top:0;height:56px;display:flex;align-items:center;}
.tb-left{left:6px;} .tb-right{right:6px;}
.tb-title{font-weight:600;font-size:16px;}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:#fff;}
.icon-btn svg{width:22px;height:22px;}
.icon-btn.spin svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
main{flex:1;padding:18px 16px 96px;max-width:560px;width:100%;margin:0 auto;}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--text3);padding:4px 0;}
.tab svg{width:23px;height:23px;}
.tab.on{color:var(--red);}

.hello{font-size:26px;font-weight:800;letter-spacing:-.02em;}
.hello-sub{color:var(--text2);font-size:14px;margin:3px 0 18px;}
.next{background:var(--ink);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:22px;box-shadow:0 10px 26px rgba(17,28,46,.25);}
.next-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.6);margin-bottom:12px;}
.live{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;border-radius:20px;padding:2px 8px;font-size:10.5px;}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.3;}}
.next-body{display:flex;align-items:center;gap:10px;cursor:pointer;}
.next-lines{flex:1;display:flex;flex-direction:column;gap:9px;}
.nl{display:flex;align-items:center;gap:10px;font-size:14.5px;}
.nl svg{width:17px;height:17px;flex:none;opacity:.85;}
.nl.site{font-size:22px;font-weight:800;}
.nl .pill{background:#16a34a;color:#fff;border-radius:5px;padding:1px 7px;font-size:12.5px;font-weight:700;}
.nl .pill.tmw{background:#2563eb;}
.chev{width:22px;height:22px;opacity:.7;flex:none;}
.next-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.next-actions.one{grid-template-columns:1fr;}
.sec-title{font-size:18px;font-weight:800;margin:0 0 10px;}
.empty{background:#fff;border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--text2);font-size:14px;line-height:1.5;border:1px dashed var(--line);}
.empty b{display:block;color:var(--text);font-size:15.5px;margin-bottom:4px;}

.srow{background:#fff;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;margin-bottom:9px;border:1px solid var(--line);width:100%;text-align:left;}
.srow:active{background:#fafafa;}
.dblock{width:48px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:10px;}
.dblock .dw{font-size:11px;font-weight:700;color:var(--text3);text-transform:capitalize;}
.dblock .dn{font-size:22px;font-weight:800;line-height:1.1;}
.dblock .dm{font-size:11px;color:var(--text2);}
.dblock.today .dn,.dblock.today .dw{color:var(--red);}
.sinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.sinfo .s1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sinfo .s2,.sinfo .s3{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.sinfo svg{width:14px;height:14px;flex:none;}
.srow .chev{color:var(--text3);opacity:1;width:18px;height:18px;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap;}
.chip.ok{background:var(--ok-bg);color:var(--ok);}
.chip.info{background:var(--info-bg);color:var(--info);}
.chip.muted{background:var(--muted-bg);color:var(--text2);}
.chip.warn{background:var(--warn-bg);color:var(--warn);}

/* ── Carte chiffres ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:22px;overflow:hidden;}
.stat{padding:14px 8px 13px;text-align:center;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;}
.stat:first-child{border-left:none;}
.stat .n{font-size:25px;font-weight:800;line-height:1;letter-spacing:-.02em;}
.stat .l{font-size:11.5px;color:var(--text2);font-weight:600;}
.stat.alert{background:var(--warn-bg);}
.stat.alert .n,.stat.alert .l{color:var(--warn);}
button.stat{font-family:inherit;}

/* ── Journal des modifications ── */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.sec-head .sec-title{margin:0;}
.sec-link{font-size:13px;font-weight:700;color:var(--red);}
.changes{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:22px;}
.chg{display:flex;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left;align-items:flex-start;}
.chg:first-child{border-top:none;}
button.chg:active{background:#fafafa;}
.chg-ic{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;}
.chg-ic svg{width:16px;height:16px;}
.chg-ic.add{background:var(--ok-bg);color:var(--ok);}
.chg-ic.mod{background:var(--info-bg);color:var(--info);}
.chg-ic.del{background:#fee2e2;color:#b91c1c;}
.chg-body{flex:1;min-width:0;}
.chg-top{display:flex;justify-content:space-between;gap:8px;}
.chg-t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
.chg-new{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;}
.chg-at{font-size:11.5px;color:var(--text3);white-space:nowrap;padding-top:2px;}
.chg-s{font-size:13px;color:var(--text2);margin-top:2px;}
.chg.del .chg-s{text-decoration:line-through;}
.chg-d{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.55;background:var(--bg);border-radius:8px;padding:6px 9px;}
.chg-d b{color:var(--text);font-weight:600;}
.chg-empty{padding:18px 14px;text-align:center;font-size:13.5px;color:var(--text2);line-height:1.5;}

/* ── Validation ── */
.validate-bar{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:#78350f;border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:14px;font-size:13.5px;font-weight:600;}
.validate-bar span{flex:1;}
.validate-bar .btn{height:36px;}
.done-banner{display:flex;align-items:center;gap:10px;background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:14px;font-weight:700;font-size:14.5px;margin-top:12px;}
.done-banner svg{width:20px;height:20px;flex:none;}
.d-note{font-size:12.5px;color:var(--text2);margin-top:10px;line-height:1.45;text-align:center;}
.tab{position:relative;}
.tab-dot{position:absolute;top:1px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.sheet-bg{position:fixed;inset:0;background:rgba(17,28,46,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;max-height:85vh;overflow:auto;}
@keyframes up{from{transform:translateY(40px);opacity:0;}}
.sheet h2{text-align:center;font-size:19px;margin-bottom:6px;}
.sheet .sub{text-align:center;font-size:13.5px;color:var(--text2);margin-bottom:14px;line-height:1.45;}
.sheet-list{background:var(--bg);border-radius:12px;padding:4px 12px;margin-bottom:16px;}
.sheet-list div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line);}
.sheet-list div:first-child{border-top:none;}
.sheet-list b{font-weight:700;}
.sheet .btn + .btn{margin-top:10px;}
.chip svg{width:12px;height:12px;}

.seg{display:grid;grid-template-columns:1fr 1fr;background:#e5e7eb;border-radius:11px;padding:3px;margin-bottom:14px;}
.seg button{height:38px;border-radius:9px;font-weight:700;font-size:14px;color:var(--text2);}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.month-sum{font-size:13px;color:var(--text2);margin:-4px 2px 14px;}
.wk{font-size:12.5px;font-weight:700;color:var(--text2);margin:18px 2px 8px;}

.d-head{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--line);}
.d-date{font-size:13.5px;color:var(--text2);text-transform:capitalize;margin-bottom:6px;}
.d-site{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;margin-bottom:10px;}
.d-site svg{width:21px;height:21px;flex:none;}
.d-line{display:flex;align-items:center;gap:9px;font-size:14.5px;margin-top:7px;flex-wrap:wrap;}
.d-line svg{width:17px;height:17px;flex:none;color:var(--text2);}
.d-line .chip{margin-left:auto;}
.d-card{background:#fff;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:12px;overflow:hidden;}
.d-item{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line);}
.d-item:first-child{border-top:none;}
.d-item > svg{width:20px;height:20px;flex:none;margin-top:1px;color:var(--ink);}
.d-item .k{font-weight:700;font-size:14px;margin-bottom:3px;}
.d-item .v{font-size:13.5px;color:var(--text2);line-height:1.5;white-space:pre-line;word-break:break-word;}

.acc-card{background:#fff;border-radius:var(--radius);border:1px solid var(--line);padding:18px;margin-bottom:12px;}
.acc-name{font-size:19px;font-weight:800;}
.acc-card h3{font-size:14.5px;margin-bottom:8px;}
.acc-card p,.acc-card li{font-size:13.5px;color:var(--text2);line-height:1.55;}
.acc-card ol{padding-left:18px;}
.badge-test{display:inline-block;margin-top:8px;background:var(--warn-bg);color:var(--warn);font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:#b91c1c;}
.loader{padding:60px 0;text-align:center;color:var(--text2);font-size:14px;}
.loader::before{content:"";display:block;width:28px;height:28px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;}
</style>
</head>
<body>

<!-- Chargement -->
<section id="scr-loading" class="auth">
  <div class="auth-top"><div class="wm"><span class="wm-main">RDZ</span><span class="wm-sub">SECURITY MANAGEMENT</span></div></div>
  <div class="auth-body"><div class="loader">Connexion en cours…</div></div>
</section>

<!-- Qui êtes-vous ? -->
<section id="scr-ident" class="auth hidden">
  <div class="auth-top"><div class="wm"><span class="wm-main">RDZ</span><span class="wm-sub">SECURITY MANAGEMENT</span></div></div>
  <div class="auth-body"><div class="auth-inner">
    <div class="auth-title">Qui êtes-vous ?</div>
    <div class="auth-sub">Sélectionnez votre nom, puis saisissez le même code PIN que dans l’application RDZ Agent.</div>
    <div id="ident-notice"></div>
    <div id="ident-list"></div>
  </div></div>
</section>

<!-- PIN -->
<section id="scr-pin" class="auth hidden">
  <div class="auth-top"><div class="wm"><span class="wm-main">RDZ</span><span class="wm-sub">SECURITY MANAGEMENT</span></div></div>
  <div class="auth-body"><div class="auth-inner pin-wrap">
    <div class="pin-name" id="pin-name"></div>
    <div class="pin-msg" id="pin-msg"></div>
    <div class="dots" id="pin-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="keypad" id="pin-keypad"></div>
    <button class="back-link" onclick="backToIdent()">Ce n’est pas moi</button>
  </div></div>
</section>

<!-- Application -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="tb-left" id="tb-left"></div>
    <div id="tb-center"></div>
    <div class="tb-right"><button class="icon-btn" id="btn-refresh" onclick="reload(true)" aria-label="Actualiser"></button></div>
  </header>
  <main id="main"><div class="loader">Chargement de votre planning…</div></main>
  <nav class="tabbar">
    <button class="tab" data-tab="home" onclick="go('home')"></button>
    <button class="tab" data-tab="planning" onclick="go('planning')"></button>
    <button class="tab" data-tab="account" onclick="go('account')"></button>
  </nav>
</div>

<div id="sheet-root"></div>
<div class="toast" id="toast"></div>

<script>

// ── Utils ────────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function $(id){ return document.getElementById(id); }
function cap(s){ s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); }
function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDaysISO(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoDate(d); }
function todayISO(){ return isoDate(new Date()); }
function hhmm(t){ return String(t||'').slice(0,5); }
function toast(msg,err){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.className='toast'; },3200); }
function showScreen(id){ ['scr-loading','scr-ident','scr-pin','app'].forEach(x=>$(x).classList.toggle('hidden',x!==id)); }
// Même rendu de nom que mobile.html
function fullName(a){ return [a.nom,a.prenom].filter(Boolean).join(' ') || a.nom || a.prenom || '—'; }

// ── Accès aux deux projets Supabase (fetch natif) ────────────
async function agentGet(q){
  const r = await fetch(AGENT_URL+'/rest/v1/agents?'+q, { headers:{ apikey:AGENT_KEY, Authorization:'Bearer '+AGENT_KEY } });
  const d = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((d&&d.message)||'Connexion impossible');
  return d||[];
}
async function opsRpc(fn,args){
  const r = await fetch(OPS_URL+'/rest/v1/rpc/'+fn, {
    method:'POST', headers:{ apikey:OPS_KEY, Authorization:'Bearer '+OPS_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(args||{})
  });
  const d = await r.json().catch(()=>null);
  if(!r.ok) throw new Error(String((d&&(d.message||d.hint))||'Service planning indisponible').replace(/^ERROR:\s*/,''));
  return d;
}

// ── PIN : hash identique à mobile.html / parametrage.html ────
async function hashPin(pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('RDZ-PIN-2026-'+pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function getLocal(){ return { id:localStorage.getItem(LS_ID), nom:localStorage.getItem(LS_NOM), hash:localStorage.getItem(LS_HASH) }; }
function setLocal(id,nom,hash){ localStorage.setItem(LS_ID,id); localStorage.setItem(LS_NOM,nom); localStorage.setItem(LS_HASH,hash||''); }
function clearLocal(){ [LS_ID,LS_NOM,LS_HASH].forEach(k=>localStorage.removeItem(k)); }

async function pilotIds(){ const ids = await opsRpc('rdz_planning_pilot_agent_ids',{}); return new Set((ids||[]).map(String)); }

async function showIdent(notice){
  $('ident-notice').innerHTML = notice? `<div class="notice">${esc(notice)}</div>` : '';
  const list = $('ident-list');
  list.innerHTML = '<div class="muted-txt">Chargement…</div>';
  showScreen('scr-ident');
  try{
    const [ids, agents] = await Promise.all([ pilotIds(), agentGet('select=id,nom,prenom&actif=eq.true&order=nom.asc') ]);
    const pilots = agents.filter(a=>ids.has(String(a.id)));
    list.innerHTML = pilots.length
      ? pilots.map(a=>`<button class="pick" onclick="selectAgent('${esc(a.id)}')">${esc(fullName(a))}${I.chev}</button>`).join('')
      : '<div class="muted-txt">Aucun agent n’est inscrit au pilote planning pour le moment.<br>Contactez votre responsable.</div>';
  }catch(e){
    list.innerHTML = `<div class="muted-txt">Connexion impossible.<br>${esc(e.message)}<br><br><button class="btn btn-outline btn-sm" onclick="showIdent()">Réessayer</button></div>`;
  }
}
function backToIdent(){ clearLocal(); showIdent(); }

async function selectAgent(id){
  try{
    const rows = await agentGet('select=id,nom,prenom,pin_hash,actif&id=eq.'+encodeURIComponent(id));
    const a = rows[0];
    if(!a || a.actif===false) return showIdent('Ce compte agent n’est plus actif.');
    if(!a.pin_hash) return showIdent('Vous n’avez pas encore de code PIN. Créez-le d’abord dans l’application RDZ Agent, puis revenez ici.');
    openPin(a, null);
  }catch(e){ toast('Erreur : '+e.message, true); }
}

let pinBuf='', pinAgent=null;
function openPin(agent, message){
  pinAgent=agent; pinBuf='';
  $('pin-name').textContent = fullName(agent);
  $('pin-msg').className = 'pin-msg'+(message?' warn':'');
  $('pin-msg').textContent = message || 'Entrez votre code PIN';
  dots(0);
  const keys=['1','2','3','4','5','6','7','8','9','','0','del'];
  $('pin-keypad').innerHTML = keys.map(k=> k===''? '<div></div>' : k==='del'
    ? '<button class="key fn" onclick="pinDigit(null)">Effacer</button>'
    : `<button class="key" onclick="pinDigit('${k}')">${k}</button>`).join('');
  showScreen('scr-pin');
}
function dots(n){ document.querySelectorAll('#pin-dots .dot').forEach((d,i)=>d.classList.toggle('on',i<n)); }
async function pinDigit(d){
  if(d===null){ pinBuf=pinBuf.slice(0,-1); dots(pinBuf.length); return; }
  if(pinBuf.length>=4) return;
  pinBuf+=d; dots(pinBuf.length);
  if(pinBuf.length<4) return;
  const hash = await hashPin(pinBuf);
  if(hash===pinAgent.pin_hash){
    setLocal(pinAgent.id, fullName(pinAgent), hash);
    enterApp(pinAgent);
  }else{
    const el=$('pin-dots'); el.classList.add('shake');
    $('pin-msg').className='pin-msg err'; $('pin-msg').textContent='Code incorrect, réessayez';
    setTimeout(()=>{ el.classList.remove('shake'); pinBuf=''; dots(0); },400);
  }
}

// ── Données planning ─────────────────────────────────────────
function mapShift(r){
  return {
    id:String(r.id), version:Number(r.version), date:String(r.date).slice(0,10), start:hhmm(r.start_time), end:hhmm(r.end_time),
    status:r.status, post:r.post_name||'', description:r.description||'',
    breakMinutes:Number(r.break_minutes)||0, breakPaid:!!r.break_paid,
    actualStart:r.actual_start?hhmm(r.actual_start):'', actualEnd:r.actual_end?hhmm(r.actual_end):'',
    seen:r.seen_at||'', siteName:r.site_name||'Site', siteAddress:r.site_address||''
  };
}
function enterApp(agent){
  AGENT=agent; showScreen('app');
  $('btn-refresh').innerHTML=I.refresh;
  const tabs={ home:[I.home,'Accueil'], planning:[I.cal,'Planning'], account:[I.user,'Compte'] };
  document.querySelectorAll('.tab').forEach(b=>{ const t=tabs[b.dataset.tab]; b.innerHTML=t[0]+'<span>'+t[1]+'</span>'; });
  render(); reload(false);
}
async function reload(manual){
  if(LOADING||!AGENT) return;
  LOADING=true; $('btn-refresh').classList.add('spin');
  try{
    const [rows, chg] = await Promise.all([
      opsRpc('rdz_planning_pilot_shifts', { p_agent_id:String(AGENT.id) }),
      opsRpc('rdz_planning_pilot_changes', { p_agent_id:String(AGENT.id) }).catch(()=>null)
    ]);
    SHIFTS = (rows||[]).map(mapShift).filter(s=>s.status && s.status!==HIDDEN_STATUS);
    if(chg) setChanges(chg);
    LAST_LOAD=Date.now();
    if(VIEW.detail && !SHIFTS.some(s=>s.id===VIEW.detail)) VIEW.detail=null;
    render();
    if(manual) toast('Planning à jour');
    markSeen();
  }catch(e){
    toast(e.message||'Chargement impossible', true);
    if(!SHIFTS.length) $('main').innerHTML=`<div class="empty"><b>Impossible de charger le planning</b>${esc(e.message||'')}<br><br><button class="btn btn-outline btn-sm" onclick="reload(true)">Réessayer</button></div>`;
  }finally{ LOADING=false; $('btn-refresh').classList.remove('spin'); }
}
// Journal : on retient les modifications arrivées depuis la dernière visite
// sur cet appareil (pastille rouge), puis on mémorise la plus récente.
function setChanges(list){
  CHANGES = (list||[]).map(c=>({ id:Number(c.id), kind:c.kind, shiftId:String(c.shift_id||''), date:String(c.date||'').slice(0,10),
    start:hhmm(c.start), end:hhmm(c.end), site:c.site||'Site', post:c.post||'', details:c.details||{}, at:c.at }));
  const key = LS_CHG_SEEN+AGENT.id;
  const raw = localStorage.getItem(key);
  const maxId = CHANGES.reduce((m,c)=>Math.max(m,c.id),0);
  if(raw===null){ UNREAD = new Set(); }                // 1re visite : rien n'est « nouveau »
  else { const seen=Number(raw)||0; CHANGES.forEach(c=>{ if(c.id>seen) UNREAD.add(c.id); }); }
  try{ localStorage.setItem(key, String(Math.max(maxId, Number(raw)||0))); }catch(e){}
}

// Renseigne seen_at côté admin pour les services à venir encore jamais vus.
function markSeen(){
  const now=new Date();
  const ids = SHIFTS.filter(s=>!s.seen && sEnd(s)>now).map(s=>s.id);
  if(!ids.length) return;
  opsRpc('rdz_planning_pilot_mark_seen', { p_agent_id:String(AGENT.id), p_shift_ids:ids })
    .then(()=>{ SHIFTS.forEach(s=>{ if(ids.includes(s.id)) s.seen=new Date().toISOString(); }); })
    .catch(()=>{ /* non bloquant */ });
}

// ── Dates des services ───────────────────────────────────────
function sStart(s){ return new Date(s.date+'T'+s.start+':00'); }
function sEnd(s){ const st=sStart(s); let e=new Date(s.date+'T'+s.end+':00'); if(e<=st) e=new Date(e.getTime()+86400000); return e; }
function durLabel(s){ const m=Math.round((sEnd(s)-sStart(s))/60000); return Math.floor(m/60)+'h'+(m%60?pad(m%60):''); }
function paidMinutes(s){ return Math.round((sEnd(s)-sStart(s))/60000) - ((s.breakMinutes&&!s.breakPaid)?s.breakMinutes:0); }
function dayLabel(iso){
  const t=todayISO();
  if(iso===t) return 'Aujourd’hui';
  if(iso===addDaysISO(t,1)) return 'Demain';
  return cap(new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long'}));
}
function fullDate(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function minusMinutes(t,n){ const [h,m]=t.split(':').map(Number); const x=(h*60+m-n+1440)%1440; return pad(Math.floor(x/60))+':'+pad(x%60); }
function mapsUrl(a){ return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a); }
function mondayOf(iso){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); return isoDate(d); }

function closeDetail(){ VIEW.detail=null; render(); window.scrollTo(0,0); }

function render(){
  const pending = SHIFTS.filter(needsConfirm).length;
  document.querySelectorAll('.tab').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab===VIEW.tab);
    const old=b.querySelector('.tab-dot'); if(old) old.remove();
    if(b.dataset.tab==='planning' && pending){ const d=document.createElement('span'); d.className='tab-dot'; d.textContent=pending; b.appendChild(d); }
  });
  const left=$('tb-left'), center=$('tb-center');
  if(VIEW.detail){
    left.innerHTML=`<button class="icon-btn" onclick="closeDetail()" aria-label="Retour">${I.back}</button>`;
    center.innerHTML='<span class="tb-title">Mon service</span>';
    $('main').innerHTML=renderDetail(SHIFTS.find(s=>s.id===VIEW.detail));
    return;
  }
  left.innerHTML='';
  center.innerHTML = VIEW.tab==='home'
    ? '<div class="wm"><span class="wm-main">RDZ</span><span class="wm-sub">SECURITY MANAGEMENT</span></div>'
    : `<span class="tb-title">${VIEW.tab==='planning'?'Mon planning':'Mon compte'}</span>`;
  if(!LAST_LOAD && VIEW.tab!=='account'){ $('main').innerHTML='<div class="loader">Chargement de votre planning…</div>'; return; }
  $('main').innerHTML = VIEW.tab==='home'? renderHome() : VIEW.tab==='planning'? renderPlanning() : renderAccount();
}

// ── Carte chiffres : à venir / à valider / heures du mois ────
function renderStats(up){
  const pending = up.filter(needsConfirm).length;
  const ym = todayISO().slice(0,7);
  const mins = SHIFTS.filter(s=>s.date.slice(0,7)===ym).reduce((n,s)=>n+paidMinutes(s),0);
  const month = new Date().toLocaleDateString('fr-CH',{month:'long'});
  return `<div class="stats">
    <button class="stat" onclick="setPlanMode('upcoming');go('planning')"><span class="n">${up.length}</span><span class="l">Service${up.length>1?'s':''} à venir</span></button>
    <button class="stat ${pending?'alert':''}" onclick="setPlanMode('upcoming');go('planning')"><span class="n">${pending}</span><span class="l">À valider</span></button>
    <div class="stat"><span class="n">${Math.floor(mins/60)}h${mins%60?pad(mins%60):''}</span><span class="l">En ${esc(month)}</span></div>
  </div>`;
}

// ── Journal des modifications ────────────────────────────────
function shortDate(iso){ return iso? new Date(iso+'T12:00:00').toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'') : ''; }
function relTime(ts){
  const d=new Date(ts), diff=(Date.now()-d.getTime())/60000;
  const hm=d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});
  if(diff<1) return 'à l’instant';
  if(diff<60) return 'il y a '+Math.floor(diff)+' min';
  if(isoDate(d)===todayISO()) return 'auj. '+hm;
  if(isoDate(d)===addDaysISO(todayISO(),-1)) return 'hier '+hm;
  return d.toLocaleDateString('fr-CH',{day:'numeric',month:'short'}).replace('.','');
}

function changeDetails(d){
  const L=[];
  const pair=(k,x,f)=>{ if(d[k]) L.push(`${k==='horaires'?'Horaires':k==='date'?'Date':k==='site'?'Site':k==='poste'?'Poste':'Pause'} : ${esc(f(d[k].avant))} → <b>${esc(f(d[k].apres))}</b>`); };
  const id=v=>v||'—';
  pair('date',0,v=>shortDate(v));
  pair('horaires',0,id);
  pair('site',0,id);
  pair('poste',0,id);
  pair('pause',0,v=>(Number(v)||0)+' min');
  if(d.consignes) L.push('Consignes mises à jour');
  return L.length? `<div class="chg-d">${L.join('<br>')}</div>` : '';
}
function changeRow(c){
  const m=CHG_META[c.kind]||CHG_META.modification;
  const exists = c.kind!=='suppression' && SHIFTS.some(s=>s.id===c.shiftId);
  const tag = exists? 'button' : 'div';
  const sub = `${esc(c.site)} · ${esc(shortDate(c.date))} · ${esc(c.start)}–${esc(c.end)}`;
  return `<${tag} class="chg ${m.cls}" ${exists?`onclick="openShift('${esc(c.shiftId)}')"`:''}>
    <span class="chg-ic ${m.cls}">${I[m.ic]}</span>
    <div class="chg-body">
      <div class="chg-top"><span class="chg-t">${UNREAD.has(c.id)?'<span class="chg-new"></span>':''}${m.t}</span><span class="chg-at">${esc(relTime(c.at))}</span></div>
      <div class="chg-s">${sub}</div>
      ${c.kind==='modification'? changeDetails(c.details) : ''}
    </div>
  </${tag}>`;
}
function renderChangesBlock(){
  const all = VIEW.allChanges;
  const list = all? CHANGES : CHANGES.slice(0,HOME_CHANGES);
  const unread = CHANGES.filter(c=>UNREAD.has(c.id)).length;
  let h = `<div class="sec-head"><div class="sec-title">Dernières modifications${unread?` <span class="chip warn">${unread} nouvelle${unread>1?'s':''}</span>`:''}</div>
    ${CHANGES.length>HOME_CHANGES? `<button class="sec-link" onclick="VIEW.allChanges=!VIEW.allChanges;render()">${all?'Réduire':'Tout voir ('+CHANGES.length+')'}</button>` : ''}</div>`;
  h += `<div class="changes">${list.length? list.map(changeRow).join('')
    : '<div class="chg-empty">Aucune modification récente.<br>Les ajouts, changements et retraits de services apparaîtront ici.</div>'}</div>`;
  return h;
}
function shiftRow(s){
  const d=new Date(s.date+'T12:00:00');
  return `<button class="srow" onclick="openShift('${esc(s.id)}')">
    <div class="dblock ${s.date===todayISO()?'today':''}">
      <div class="dw">${esc(d.toLocaleDateString('fr-CH',{weekday:'short'}).replace('.',''))}</div>
      <div class="dn">${d.getDate()}</div>
      <div class="dm">${esc(d.toLocaleDateString('fr-CH',{month:'short'}).replace('.',''))}</div>
    </div>
    <div class="sinfo">
      <div class="s1">${esc(s.siteName)}</div>
      <div class="s2">${I.clock}${esc(s.start)} – ${esc(s.end)} · ${durLabel(s)}</div>
      <div class="s3">${s.post?esc(s.post)+' · ':''}${chip(s)}</div>
    </div>
    <span class="chev">${I.chev}</span>
  </button>`;
}
function renderPlanning(){
  const now=new Date(), up=VIEW.planMode==='upcoming', t=todayISO();
  const list = SHIFTS.filter(s=> up? sEnd(s)>now : sEnd(s)<=now).sort((a,b)=> up? sStart(a)-sStart(b) : sStart(b)-sStart(a));
  const ym=t.slice(0,7), month=SHIFTS.filter(s=>s.date.slice(0,7)===ym), mins=month.reduce((n,s)=>n+paidMinutes(s),0);
  let h = `<div class="seg">
      <button class="${up?'on':''}" onclick="setPlanMode('upcoming')">À venir</button>
      <button class="${up?'':'on'}" onclick="setPlanMode('past')">Passés</button>
    </div>
    <div class="month-sum">${cap(new Date(t+'T12:00:00').toLocaleDateString('fr-CH',{month:'long'}))} : ${month.length} service${month.length>1?'s':''} · ${Math.floor(mins/60)}h${pad(mins%60)}</div>`;
  const pending = SHIFTS.filter(needsConfirm);
  if(up && pending.length) h += `<div class="validate-bar"><span>${pending.length} service${pending.length>1?'s':''} à valider</span><button class="btn btn-red btn-sm" onclick="askConfirm(null)">Tout valider</button></div>`;
  if(!list.length) return h+`<div class="empty"><b>${up?'Aucun service à venir':'Aucun service passé'}</b>${up?'Votre planning n’a pas encore été publié pour la période à venir.':'Les services des '+HISTORY_DAYS+' derniers jours s’affichent ici.'}</div>`;
  const thisWk=mondayOf(t); let last='';
  list.forEach(s=>{
    const wk=mondayOf(s.date);
    if(wk!==last){
      last=wk;
      const lbl = wk===thisWk? 'Cette semaine' : wk===addDaysISO(thisWk,7)? 'Semaine prochaine' : wk===addDaysISO(thisWk,-7)? 'Semaine dernière'
        : 'Semaine du '+new Date(wk+'T12:00:00').toLocaleDateString('fr-CH',{day:'numeric',month:'long'});
      h += `<div class="wk">${esc(lbl)}</div>`;
    }
    h += shiftRow(s);
  });
  return h;
}
function renderDetail(s){
  if(!s) return '<div class="empty"><b>Service introuvable</b>Il a peut-être été retiré du planning.</div>';
  const ended = sEnd(s)<=new Date();
  return `<div class="d-head">
      <div class="d-date">${esc(fullDate(s.date))}</div>
      <div class="d-site">${I.pin}<span>${esc(s.siteName)}</span></div>
      <div class="d-line">${I.clock}<span>${esc(s.start)} – ${esc(s.end)} (${durLabel(s)})</span>${chip(s)}</div>
      ${s.post?`<div class="d-line">${I.people}<span>${esc(s.post)}</span></div>`:''}
    </div>
    <div class="d-card">
      ${s.siteAddress?`<div class="d-item">${I.pinO}<div><div class="k">Adresse du site</div><div class="v">${esc(s.siteAddress)}</div></div></div>`:''}
      ${!ended?`<div class="d-item">${I.run}<div><div class="k">Arrivée conseillée</div><div class="v">${esc(minusMinutes(s.start,ARRIVAL_ADVANCE_MIN))}</div></div></div>`:''}
      ${s.breakMinutes?`<div class="d-item">${I.coffee}<div><div class="k">Pause</div><div class="v">${s.breakMinutes} min${s.breakPaid?' (payée)':' (non payée)'}</div></div></div>`:''}
      <div class="d-item">${I.doc}<div><div class="k">Consignes</div><div class="v">${s.description?esc(s.description):'Aucune consigne particulière pour ce service.'}</div></div></div>
      ${s.actualStart?`<div class="d-item">${I.clock}<div><div class="k">Heures déclarées</div><div class="v">${esc(s.actualStart)} – ${esc(s.actualEnd||'—')}</div></div></div>`:''}
    </div>
    ${s.siteAddress?`<a class="btn btn-outline btn-block" href="${esc(mapsUrl(s.siteAddress))}" target="_blank" rel="noopener">${I.pin}Itinéraire</a>`:''}
    ${needsConfirm(s)
      ? `<button class="btn btn-red btn-block" style="margin-top:10px" onclick="askConfirm('${esc(s.id)}')">Valider ce service</button>
         <div class="d-note">En validant, vous confirmez à votre responsable que vous avez pris connaissance de ce service.</div>`
      : (s.status==='Validée' && !ended? `<div class="done-banner">${I.checkC}<span>Vous avez validé ce service</span></div>` : '')}`;
}

// ── Validation (un service ou tous ceux en attente) ──────────
function askConfirm(id){
  const items = id? SHIFTS.filter(s=>s.id===id && needsConfirm(s)) : SHIFTS.filter(needsConfirm).sort((a,b)=>sStart(a)-sStart(b));
  if(!items.length) return;
  const one = items.length===1;
  $('sheet-root').innerHTML = `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <h2>${one?'Valider ce service ?':'Valider '+items.length+' services ?'}</h2>
    <div class="sub">Votre responsable verra que vous avez pris connaissance ${one?'de ce service':'de ces services'}.</div>
    <div class="sheet-list">${items.map(s=>`<div><span>${esc(shortDate(s.date))} · <b>${esc(s.siteName)}</b></span><span>${esc(s.start)}–${esc(s.end)}</span></div>`).join('')}</div>
    <button class="btn btn-red btn-block" id="cf-btn" onclick="doConfirm(${id?`'${esc(id)}'`:'null'})">Oui, je valide</button>
    <button class="btn btn-ghost btn-block" onclick="closeSheet()">Annuler</button>
  </div></div>`;
}
function closeSheet(){ $('sheet-root').innerHTML=''; }
async function doConfirm(id){
  const items = (id? SHIFTS.filter(s=>s.id===id && needsConfirm(s)) : SHIFTS.filter(needsConfirm)).map(s=>({ id:s.id, version:s.version }));
  const btn=$('cf-btn'); if(!items.length||!btn) return;
  btn.disabled=true; btn.textContent='Envoi…';
  try{
    const n = Number(await opsRpc('rdz_planning_pilot_accept_shifts', { p_agent_id:String(AGENT.id), p_items:items }))||0;
    closeSheet();
    if(n===items.length) toast(n>1? n+' services validés' : 'Service validé');
    else toast((n? n+' validé(s). ' : '')+'Un service a été modifié entre-temps, vérifiez-le à nouveau.', true);
  }catch(e){ closeSheet(); toast(e.message||'Validation impossible', true); }
  await reload(false);
}
function renderAccount(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="acc-card"><div class="acc-name">${esc(fullName(AGENT))}</div><span class="badge-test">Pilote planning agent</span></div>
    <div class="acc-card"><h3>Ajouter à l’écran d’accueil</h3>${ios
      ? '<ol><li>Ouvrez cette page dans Safari.</li><li>Touchez le bouton Partager.</li><li>Choisissez « Sur l’écran d’accueil ».</li></ol>'
      : '<ol><li>Ouvrez cette page dans Chrome.</li><li>Touchez le menu ⋮ en haut à droite.</li><li>Choisissez « Ajouter à l’écran d’accueil ».</li></ol>'}</div>
    <div class="acc-card"><h3>À savoir</h3><p>Seuls les services publiés par votre responsable apparaissent ici. Votre code PIN est le même que dans l’application RDZ Agent.</p></div>
    <button class="btn btn-outline btn-block" onclick="logout()">Changer d’agent</button>`;
}

// ── Démarrage (même logique que mobile.html) ─────────────────
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && AGENT && Date.now()-LAST_LOAD>5*60*1000) reload(false);
});
(async function init(){
  const s=getLocal();
  if(!s.id) return showIdent();
  try{
    const [rows, ids] = await Promise.all([ agentGet('select=id,nom,prenom,pin_hash,actif&id=eq.'+encodeURIComponent(s.id)), pilotIds() ]);
    const a=rows[0];
    if(!a){ clearLocal(); return showIdent(); }
    if(a.actif===false){ clearLocal(); return showIdent('Votre accès a été désactivé. Contactez votre responsable.'); }
    if(!ids.has(String(a.id))){ clearLocal(); return showIdent('Le pilote planning est terminé pour votre compte.'); }
    if(!a.pin_hash){ clearLocal(); return showIdent('Créez d’abord votre code PIN dans l’application RDZ Agent.'); }
    if(a.pin_hash===s.hash) return enterApp(a);           // reconnexion silencieuse
    openPin(a,'Votre code d’accès a été modifié. Merci de le ressaisir.');
  }catch(e){ showIdent('Connexion impossible pour le moment. Réessayez.'); }
})();
</script>
