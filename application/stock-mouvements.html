<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RDZ — Mouvements de stock</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
  Mouvements de stock sur mobile — vestiaire & matériel.
  Accès : nom + code PIN (même session que l'application agent), puis fonction
  de l'agent (agents.fonctions, gérée dans comptes-agents.html) :
    'materiel'      → responsable matériel : tous les mouvements
    'controle_loge' → centraliste : contrôle du matériel en loge uniquement
  Chaque geste = une ligne stk_mouvements envoyée via RDZSync (hors-ligne OK,
  upsert sur un id UUID généré ici : un renvoi ne rejoue jamais l'effet).
  Le déclencheur SQL applique l'effet sur le stock / les unités / les dotations.
  Boucle de remontée : stk_mouvements / stk_inventaires → stock-gestion.html.
-->
<style>
:root{
  --red:#8B1A1A; --red-dark:#6B1212;
  --report-red:#C8102E;
  --ink:#1a1a1a; --paper:#ffffff;
  --line:#d0d0d0; --line-soft:#e0e0e0;
  --bg-meta:#f0f0f0; --bg-soft:#f7f7f7;
  --ok:#1b7a3d; --warn:#b8860b; --danger:#8B1A1A;
  --radius-ui:2px; --radius-card:10px; --radius-section:8px;
  --font:Arial, Helvetica, sans-serif;
  --bg:#f5f4f2; --muted:#6b6b6b; --sh:0 2px 8px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);min-height:100vh;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--red);border-bottom:3px solid var(--red-dark);padding:12px 14px;display:flex;align-items:center;gap:10px;color:#fff}
.top .t{flex:1;min-width:0}
.top .n{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.top .s{font-size:11px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:700;padding:8px 11px;border-radius:var(--radius-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
main{padding:14px 14px 90px;max-width:620px;margin:0 auto}
.menu-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:var(--radius-ui);padding:15px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer}
.menu-btn:active{background:var(--bg-soft)}
.menu-btn .i{font-size:24px;width:30px;text-align:center}
.menu-btn .l{font-size:15px;font-weight:700}
.menu-btn .d{font-size:12px;color:var(--muted);margin-top:2px}
.menu-btn .b{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700}
.sec{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--radius-ui);padding:13px;margin-bottom:12px;box-shadow:var(--sh)}
.fg{margin-bottom:12px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.fi{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-ui);padding:11px 12px;color:var(--ink)}
.fi:focus{outline:none;border-color:var(--red)}
.row{display:flex;gap:8px;align-items:center}
.row>.grow{flex:1;min-width:0}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 13px;border-radius:20px;border:1.5px solid var(--line);font-size:13px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink)}
.chip.sel{border-color:var(--red);background:var(--red);color:#fff}
.chip.sm{padding:6px 10px;font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:var(--radius-ui);font-size:14px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;background:var(--red);color:#fff;margin-top:6px}
.btn:active{background:var(--red-dark)}
.btn:disabled{opacity:.45}
.btn.g{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn-add{flex-shrink:0;background:var(--ink);color:#fff;border:none;border-radius:var(--radius-ui);padding:0 16px;height:46px;font-size:18px;cursor:pointer}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line-soft);background:#fff}
.item:last-child{border-bottom:none}
.item .grow{flex:1;min-width:0}
.item .nm{font-size:14px;font-weight:700}
.item .sb{font-size:12px;color:var(--muted);margin-top:2px}
.list{background:#fff;border:1px solid var(--line);border-radius:var(--radius-ui);box-shadow:var(--sh);margin-bottom:12px}
.list .hd{background:var(--ink);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:7px 12px}
.qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qb{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:700;cursor:pointer}
.qv{min-width:26px;text-align:center;font-weight:800;font-size:15px}
.qin{width:64px;text-align:center;padding:8px;border:1.5px solid var(--line);border-radius:var(--radius-ui);font-size:16px}
.qin.ok{background:#dcfce7;border-color:#86efac}.qin.bad{background:#fee2e2;border-color:#fca5a5}
.del{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:4px}
.tag{display:inline-block;background:var(--bg-meta);border:1px solid var(--line);border-radius:var(--radius-ui);padding:1px 6px;font-size:11px;font-weight:700}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px}
.p-ok{background:#dcfce7;color:#166534}.p-warn{background:#fef3c7;color:#92400e}.p-bad{background:#fee2e2;color:#991b1b}.p-info{background:#dbeafe;color:#1e40af}.p-mut{background:#eee;color:#555}
.empty{text-align:center;padding:24px 14px;color:var(--muted);font-size:13px}
.note{background:#eff6ff;border-left:4px solid #1d4ed8;padding:10px 12px;font-size:12.5px;line-height:1.45;margin-bottom:12px;border-radius:var(--radius-ui)}
.warnbox{background:#fef3c7;border-left:4px solid var(--warn);padding:10px 12px;font-size:12.5px;line-height:1.45;margin-bottom:12px;border-radius:var(--radius-ui)}
.ck{width:24px;height:24px;flex-shrink:0}
.sub-opts{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:999;width:calc(100% - 24px);max-width:400px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.err{background:#991b1b}.toast.ok{background:#15803d}
/* identification */
.auth{min-height:100vh;background:var(--red);display:flex;flex-direction:column}
.auth-top{padding:30px 22px 22px;color:#fff;text-align:center}
.auth-top .n{font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.auth-top .s{font-size:12px;color:rgba(255,255,255,.75);margin-top:4px}
.auth-body{flex:1;background:var(--bg);border-radius:16px 16px 0 0;padding:22px 16px 30px}
.auth-in{max-width:420px;margin:0 auto}
.auth-title{font-size:20px;font-weight:700}
.auth-sub{font-size:13px;color:var(--muted);margin:4px 0 16px;line-height:1.45}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:var(--radius-ui);padding:15px;font-size:15px;font-weight:700;margin-bottom:8px;cursor:pointer;text-align:left}
.pin-name{font-size:19px;font-weight:700;text-align:center}
.pin-msg{font-size:13px;color:var(--muted);text-align:center;margin-top:6px;min-height:18px}
.pin-msg.err{color:#b91c1c;font-weight:700}
.dots{display:flex;gap:16px;justify-content:center;margin:20px 0 24px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}.dot.on{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,74px);gap:12px 20px;justify-content:center}
.key{width:74px;height:74px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:26px;font-weight:700;cursor:pointer}
.key.fn{background:none;border:none;font-size:13px;color:var(--muted)}
.link{display:block;margin:22px auto 0;background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer}
</style>
</head>
<body>

<section id="scr-auth" class="auth hidden">
  <div class="auth-top"><div class="n">RDZ Security Management</div><div class="s">Mouvements de stock — vestiaire &amp; matériel</div></div>
  <div class="auth-body"><div class="auth-in" id="auth-in"></div></div>
</section>

<div id="app" class="hidden">
  <header class="top">
    <button class="tb" id="btn-back" onclick="home()">‹</button>
    <div class="t"><div class="n" id="top-title">Stock</div><div class="s" id="top-sub"></div></div>
    <a class="tb" href="mobile.html" id="btn-app">Appli</a>
  </header>
  <main id="main"></main>
</div>
<div id="toasts"></div>

<script>
/* ═══ RDZSync v4 — copie de référence, collée telle quelle (voir application/rdz-sync-v4.js) ═══ */
(function (global) {
  'use strict';

  var Q_TEXT = 'rdz_sync_queue';
  var Q_PHOTO = 'rdz_sync_photo_queue';
  var Q_LOG = 'rdz_sync_log';
  var LOG_MAX = 30;

  var _client = null;
  var _onChange = null;
  var _flushingText = false;
  var _flushingPhotos = false;

  function readLS(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; } }
  function writeLS(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {} notify(); }

  function notify() {
    var st = getStatus();
    if (typeof _onChange === 'function') { try { _onChange(st); } catch (e) {} }
    renderBadge(st);
  }

  function uidSync() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function dataUrlToBlob(dataUrl) {
    var parts = dataUrl.split(',');
    var mime = (parts[0].match(/:(.*?);/) || [, 'application/octet-stream'])[1];
    var bin = atob(parts[1]); var n = bin.length; var u8 = new Uint8Array(n);
    while (n--) u8[n] = bin.charCodeAt(n);
    return new Blob([u8], { type: mime });
  }

  function pushLog(entry) {
    var log = readLS(Q_LOG);
    log.unshift(entry);
    if (log.length > LOG_MAX) log = log.slice(0, LOG_MAX);
    writeLS(Q_LOG, log);
  }

  function isWifi() {
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!c) return null;
      if (typeof c.type === 'string') return c.type === 'wifi';
      if (typeof c.effectiveType === 'string') return null;
      return null;
    } catch (e) { return null; }
  }

  function ensureBadge() {
    var b = document.getElementById('rdz-sync-badge');
    if (b) return b;
    b = document.createElement('div');
    b.id = 'rdz-sync-badge';
    b.style.cssText =
      'position:fixed;left:12px;bottom:12px;z-index:99999;' +
      'font:600 12.5px Arial,Helvetica,sans-serif;color:#fff;' +
      'background:#b8860b;padding:8px 12px;border-radius:2px;line-height:1.5;' +
      'box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;cursor:pointer;max-width:260px;';
    b.title = 'Cliquer pour forcer la synchronisation';
    b.onclick = function () { flushText(); flushPhotos(true); };
    document.body.appendChild(b);
    return b;
  }
  function renderBadge(st) {
    if (typeof document === 'undefined' || !document.body) return;
    var b = ensureBadge();
    var parts = [];
    if (st.textPending > 0) parts.push('⏳ ' + st.textPending + ' donnée(s) en attente de réseau');
    if (st.photoPending > 0) parts.push('📷 ' + st.photoPending + ' photo(s) en attente de WiFi');
    if (parts.length === 0) { b.style.display = 'none'; return; }
    b.innerHTML = parts.join('<br>');
    b.style.display = 'block';
  }

  function init(opts) {
    opts = opts || {};
    _client = opts.client || _client;
    if (typeof opts.onChange === 'function') _onChange = opts.onChange;
    if (typeof global.addEventListener === 'function') {
      global.addEventListener('online', function () { flushText(); tryAutoPhotos(); });
    }
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (c && typeof c.addEventListener === 'function') {
        c.addEventListener('change', tryAutoPhotos);
      }
    } catch (e) {}
    if (typeof document !== 'undefined') {
      var start = function () { notify(); flushText(); tryAutoPhotos(); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    }
    return API;
  }

  function tryAutoPhotos() { if (isWifi() === true) flushPhotos(false); }

  function save(item) {
    var textEntry = {
      id: uidSync(),
      module: item.module || 'inconnu',
      table: item.table,
      op: item.op || 'insert',
      onConflict: item.onConflict || null,
      row: Object.assign({}, item.row || {}),
      photoField: item.photoField || null,
      bucket: item.bucket || null,
      pendingPhotos: item.photos || [],
      ts: new Date().toISOString(),
      tries: 0
    };
    var q = readLS(Q_TEXT); q.push(textEntry); writeLS(Q_TEXT, q);
    setTimeout(flushText, 0);
    return textEntry.id;
  }

  function flushText() {
    if (_flushingText || !_client) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingText = true;
    var q = readLS(Q_TEXT); var i = 0;

    function next() {
      if (i >= q.length) { _flushingText = false; return; }
      var it = q[i];
      var qb = _client.from(it.table);
      var req = (it.op === 'upsert')
        ? qb.upsert(it.row, it.onConflict ? { onConflict: it.onConflict } : undefined)
        : qb.insert(it.row);

      req.then(function (res) {
        if (res && res.error) throw res.error;
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) cur.splice(idx, 1);
        writeLS(Q_TEXT, cur);
        pushLog({ ts: new Date().toISOString(), module: it.module, table: it.table, kind: 'texte', ok: true });

        var rowId = it.row && it.row.id != null ? it.row.id : null;
        if (it.pendingPhotos && it.pendingPhotos.length) {
          if (rowId == null) {
            console.warn('RDZSync: photos ignorées — aucun id fourni dans row.id pour', it.table);
          } else {
            var pq = readLS(Q_PHOTO);
            it.pendingPhotos.forEach(function (p) {
              pq.push({
                id: uidSync(), module: it.module, table: it.table, rowId: rowId,
                bucket: it.bucket, field: p.field || it.photoField, name: p.name || 'photo.jpg',
                dataUrl: p.dataUrl, ts: new Date().toISOString(), tries: 0
              });
            });
            writeLS(Q_PHOTO, pq);
            tryAutoPhotos();
          }
        }
        i++; next();
      }).catch(function () {
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; writeLS(Q_TEXT, cur); }
        _flushingText = false;
      });
    }
    next();
  }

  function flushPhotos(force) {
    if (_flushingPhotos || !_client) return;
    if (!force && isWifi() !== true) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingPhotos = true;
    var q = readLS(Q_PHOTO); var i = 0;

    function next() {
      if (i >= q.length) { _flushingPhotos = false; return; }
      var p = q[i];
      var path = p.module + '/' + Date.now() + '_' + p.name;
      var blob = dataUrlToBlob(p.dataUrl);
      _client.storage.from(p.bucket).upload(path, blob, { upsert: true })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var pub = _client.storage.from(p.bucket).getPublicUrl(path);
          var url = pub && pub.data ? pub.data.publicUrl : null;
          var patch = {}; patch[p.field] = url;
          return _client.from(p.table).update(patch).eq('id', p.rowId);
        })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) cur.splice(idx, 1);
          writeLS(Q_PHOTO, cur);
          pushLog({ ts: new Date().toISOString(), module: p.module, table: p.table, kind: 'photo', ok: true });
          i++; next();
        })
        .catch(function () {
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; writeLS(Q_PHOTO, cur); }
          _flushingPhotos = false;
        });
    }
    next();
  }

  function getStatus() {
    return {
      textPending: readLS(Q_TEXT).length,
      photoPending: readLS(Q_PHOTO).length,
      log: readLS(Q_LOG),
      isWifi: isWifi()
    };
  }

  var API = {
    init: init, save: save, flushText: flushText, flushPhotos: flushPhotos,
    getStatus: getStatus, QUEUE_KEYS: { text: Q_TEXT, photo: Q_PHOTO, log: Q_LOG }
  };
  (typeof window !== 'undefined' ? window : global).RDZSync = API;
})(typeof window !== 'undefined' ? window : this);

const SUPABASE_URL='https://pdewmubikmotqzbxmyeq.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkZXdtdWJpa21vdHF6YnhteWVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDU3MjgsImV4cCI6MjA5NDg4MTcyOH0.SRuhERPmB5_7a58nJ5oMg4a8mujnoLBv8dxkxvyNWao';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
RDZSync.init({client:sb});

const LS_ID='rdz_agent_id', LS_NOM='rdz_agent_nom', LS_HASH='rdz_agent_pin_hash';
const CACHE_KEY='stk_mouv_cache_v1', LAST_LIEU='stk_mouv_last_lieu';
const FONCTIONS_OK=['materiel','controle_loge'];

const ETATS=[['neuf','Neuf'],['bon','Bon'],['use','Usé'],['defectueux','Défectueux'],['hs','Hors service']];
const ETAT_P={neuf:'p-ok',bon:'p-ok',use:'p-warn',defectueux:'p-bad',hs:'p-bad'};
const ETAT_L=Object.fromEntries(ETATS);

let ME=null;           // {id, nom, fonctions}
let D=null;            // données en cache
let VIEW={screen:'home'};
let F={};              // formulaire en cours

// ═══ OUTILS ═══
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;$('toasts').appendChild(e);setTimeout(()=>e.remove(),3000);}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function uuid(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);});
}
function fullName(a){return [a.nom,a.prenom].filter(Boolean).join(' ')||'—';}
function has(f){return ME&&ME.fonctions.includes(f);}
function nowIso(){return new Date().toISOString();}

// ═══ IDENTIFICATION (même PIN que l'application agent) ═══
async function hashPin(pin){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('RDZ-PIN-2026-'+pin));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function showAuth(html){$('app').classList.add('hidden');$('scr-auth').classList.remove('hidden');$('auth-in').innerHTML=html;}
async function identList(msg){
  showAuth(`<div class="auth-title">Qui êtes-vous ?</div><div class="auth-sub">Réservé au responsable matériel et aux centralistes (contrôle de loge). Même code PIN que l'application RDZ Agent.</div>${msg?`<div class="warnbox">${esc(msg)}</div>`:''}<div id="ident-list"><div class="empty">Chargement…</div></div>`);
  try{
    const {data,error}=await sb.from('agents').select('id,nom,prenom,actif,fonctions').eq('actif',true).overlaps('fonctions',FONCTIONS_OK).order('nom');
    if(error)throw error;
    $('ident-list').innerHTML=(data||[]).length?data.map(a=>`<button class="pick" onclick="pickAgent('${esc(a.id)}')">${esc(fullName(a))}<span>›</span></button>`).join('')
      :'<div class="empty">Aucun agent n\'a la fonction « Matériel » ou « Contrôle loge ».<br>À attribuer dans Comptes agents → ⚙ Fonctions.</div>';
  }catch(e){$('ident-list').innerHTML=`<div class="empty">Connexion impossible.<br>${esc(e.message)}<br><br><button class="btn g" onclick="identList()">Réessayer</button></div>`;}
}
let PIN={buf:'',a:null};
async function pickAgent(id){
  try{const {data,error}=await sb.from('agents').select('id,nom,prenom,pin_hash,actif,fonctions').eq('id',id).single();if(error)throw error;
    if(!data.pin_hash)return identList('Créez d\'abord votre code PIN dans l\'application RDZ Agent.');
    PIN={buf:'',a:data};pinScreen('Entrez votre code PIN');}catch(e){toast('Erreur : '+e.message,'err');}
}
function pinScreen(msg,err){
  showAuth(`<div class="pin-name">${esc(fullName(PIN.a))}</div><div class="pin-msg ${err?'err':''}">${esc(msg)}</div>
    <div class="dots" id="dots">${[0,1,2,3].map(i=>`<div class="dot ${i<PIN.buf.length?'on':''}"></div>`).join('')}</div>
    <div class="keypad">${['1','2','3','4','5','6','7','8','9','','0','del'].map(k=>k===''?'<div></div>':k==='del'?'<button class="key fn" onclick="pinKey(null)">Effacer</button>':`<button class="key" onclick="pinKey('${k}')">${k}</button>`).join('')}</div>
    <button class="link" onclick="identList()">Ce n'est pas moi</button>`);
}
async function pinKey(k){
  if(k===null){PIN.buf=PIN.buf.slice(0,-1);return pinScreen('Entrez votre code PIN');}
  if(PIN.buf.length>=4)return;PIN.buf+=k;
  if(PIN.buf.length<4)return pinScreen('Entrez votre code PIN');
  const h=await hashPin(PIN.buf);
  if(h===PIN.a.pin_hash){localStorage.setItem(LS_ID,PIN.a.id);localStorage.setItem(LS_NOM,fullName(PIN.a));localStorage.setItem(LS_HASH,h);enter(PIN.a);}
  else{PIN.buf='';pinScreen('Code incorrect, réessayez',true);}
}
function logout(){[LS_ID,LS_NOM,LS_HASH].forEach(k=>localStorage.removeItem(k));ME=null;identList();}
function enter(a){
  ME={id:String(a.id),nom:fullName(a),fonctions:a.fonctions||[]};
  try{localStorage.setItem('stk_mouv_me',JSON.stringify(ME));}catch(e){}
  if(!FONCTIONS_OK.some(has)){showAuth(`<div class="auth-title">Accès réservé</div><div class="auth-sub">${esc(ME.nom)}, ce module est réservé au responsable matériel et au contrôle de loge. Demandez l'attribution de la fonction dans Comptes agents.</div><a class="btn g" href="mobile.html">Retour à l'application</a><button class="link" onclick="logout()">Changer d'agent</button>`);return;}
  $('scr-auth').classList.add('hidden');$('app').classList.remove('hidden');
  home();loadData();
}
async function init(){
  const id=localStorage.getItem(LS_ID),h=localStorage.getItem(LS_HASH);
  if(!id)return identList();
  try{
    const {data,error}=await sb.from('agents').select('id,nom,prenom,pin_hash,actif,fonctions').eq('id',id).single();
    if(error)throw error;
    if(!data||data.actif===false){logout();return;}
    if(data.pin_hash&&data.pin_hash===h)return enter(data);
    PIN={buf:'',a:data};pinScreen('Votre code a changé, merci de le ressaisir');
  }catch(e){
    // hors-ligne : on reprend la dernière identité validée sur cet appareil
    try{const me=JSON.parse(localStorage.getItem('stk_mouv_me')||'null');if(me&&me.id===id){ME=me;$('scr-auth').classList.add('hidden');$('app').classList.remove('hidden');home();loadData();return;}}catch(_){}
    identList('Connexion impossible pour le moment.');
  }
}

// ═══ DONNÉES (cache local pour travailler hors réseau) ═══
async function loadData(){
  try{
    const r=await Promise.all([
      sb.from('stk_lieux').select('*').eq('actif',true).order('ordre').order('nom'),
      sb.from('stk_articles').select('*').eq('actif',true).order('ordre').order('nom'),
      sb.from('stk_variantes').select('*').eq('actif',true).order('ordre'),
      sb.from('stk_stock').select('*'),
      sb.from('stk_unites').select('*').not('statut','in','(rebut,perdu)').order('numero'),
      sb.from('stk_detentions').select('*'),
      sb.from('agents').select('id,nom,prenom,actif').order('nom'),
      sb.from('stk_commandes').select('*').in('statut',['validee','commandee','recue_partielle']).order('created_at'),
      sb.from('stk_commande_lignes').select('*'),
      sb.from('stk_demandes').select('*').eq('statut','a_remettre'),
      sb.from('stk_inventaires').select('*').eq('statut','en_cours').order('created_at',{ascending:false})
    ]);
    const err=r.find(x=>x.error);if(err)throw err.error;
    const [lieux,articles,variantes,stock,unites,detentions,agents,commandes,lignes,demandes,inventaires]=r.map(x=>x.data||[]);
    const cids=new Set(commandes.map(c=>c.id));
    D={lieux,articles,variantes,stock,unites,detentions,agents,commandes,lignes:lignes.filter(l=>cids.has(l.commande_id)),demandes,inventaires,at:nowIso()};
    replayPending();
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(D));}catch(e){}
  }catch(e){
    try{D=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');}catch(_){D=null;}
    if(D)toast('Hors réseau — données du '+new Date(D.at).toLocaleString('fr-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),'err');
    else toast('Impossible de charger le stock : '+e.message,'err');
  }
  render();
}
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(D));}catch(e){}}
// Les mouvements encore en file d'attente sont réappliqués sur les données fraîches
function replayPending(){
  let q=[];try{q=JSON.parse(localStorage.getItem('rdz_sync_queue')||'[]');}catch(e){}
  q.filter(x=>x.table==='stk_mouvements').forEach(x=>applyLocal(x.row));
}
const art=id=>D.articles.find(a=>a.id===id);
const vari=id=>D.variantes.find(v=>v.id===id);
const lieu=id=>D.lieux.find(l=>l.id===id);
function varsOf(aid){return D.variantes.filter(v=>v.article_id===aid).sort((a,b)=>(a.ordre-b.ordre)||a.taille.localeCompare(b.taille,'fr',{numeric:true}));}
function artsOf(dom){return D.articles.filter(a=>a.domaine===dom).sort((a,b)=>(a.categorie||'').localeCompare(b.categorie||'','fr')||a.nom.localeCompare(b.nom,'fr'));}
function qStock(vid,lid){const s=D.stock.find(x=>x.variante_id===vid&&x.lieu_id===lid);return s?s.quantite:0;}
function unitsAt(lid,aid){return D.unites.filter(u=>u.statut==='stock'&&u.lieu_id===lid&&(!aid||u.article_id===aid));}
function vLabel(vid){const v=vari(vid);if(!v)return '—';const a=art(v.article_id);return (a?(a.icon?a.icon+' ':'')+a.nom:'?')+(v.taille!=='Unique'?' — '+v.taille:'');}
function uLabel(u){const a=art(u.article_id);return (a?(a.icon?a.icon+' ':'')+a.nom:'?')+' n° '+u.numero;}

// Effet local immédiat (même logique que le déclencheur SQL, simplifiée)
function addStock(vid,lid,q){if(!vid||!lid)return;let s=D.stock.find(x=>x.variante_id===vid&&x.lieu_id===lid);if(!s){s={variante_id:vid,lieu_id:lid,quantite:0};D.stock.push(s);}s.quantite+=q;}
function applyLocal(m){
  if(!D)return;
  const u=m.unite_id?D.unites.find(x=>x.id===m.unite_id):null;
  const q=Math.max(0,m.quantite||0);
  if(m.type==='reception'){if(!u&&m.variante_id&&art(m.article_id)?.suivi!=='unite')addStock(m.variante_id,m.lieu_id,q);
    if(m.commande_ligne_id){const l=D.lignes.find(x=>x.id===m.commande_ligne_id);if(l)l.quantite_recue+=q;}}
  else if(m.type==='sortie'){
    if(u)Object.assign(u,{statut:'sorti',lieu_id:null,agent_id:m.agent_id,agent_nom:m.agent_nom,mission:m.mission});
    else{addStock(m.variante_id,m.lieu_id,-q);const type=m.motif==='mission'?'mission':'dotation';
      let d=D.detentions.find(x=>x.variante_id===m.variante_id&&x.type===type&&(x.agent_id||'')===(m.agent_id||'')&&(x.agent_nom||'')===(m.agent_nom||'')&&(x.mission||'')===(m.mission||''));
      if(!d){d={id:'local-'+m.id,variante_id:m.variante_id,type,agent_id:m.agent_id,agent_nom:m.agent_nom,mission:m.mission,quantite:0,date_sortie:m.created_at};D.detentions.push(d);}d.quantite+=q;}
    if(m.agent_id)D.demandes=D.demandes.filter(x=>!(x.agent_id===m.agent_id&&x.variante_id===m.variante_id));
  }
  else if(m.type==='retour'){
    if(u)Object.assign(u,{statut:'stock',lieu_id:m.lieu_id,agent_id:null,agent_nom:null,mission:null,etat:m.etat||u.etat});
    else{const d=D.detentions.find(x=>x.id===m.detention_id);if(d){d.quantite-=q;if(d.quantite<=0)D.detentions=D.detentions.filter(x=>x!==d);}addStock(m.variante_id,m.lieu_id,q);}
  }
  else if(m.type==='rebut'){if(u)u.statut=m.motif==='perte'?'perdu':'rebut';else addStock(m.variante_id,m.lieu_id,-q);}
  else if(m.type==='transfert'){if(u)u.lieu_id=m.lieu_dest_id;else{addStock(m.variante_id,m.lieu_id,-q);addStock(m.variante_id,m.lieu_dest_id,q);}}
  else if(m.type==='constat'&&u){u.etat=m.etat||u.etat;u.derniere_verif=m.created_at;if(m.motif==='reparation')u.statut='reparation';if(m.motif==='repare')u.statut='stock';}
  if(D.unites)D.unites=D.unites.filter(x=>!['rebut','perdu'].includes(x.statut));
}
// Enregistre un mouvement (file hors-ligne RDZSync) + effet local immédiat
function mouvement(m){
  const a=art(m.article_id)||(m.variante_id&&art(vari(m.variante_id)?.article_id))||(m.unite_id&&art(D.unites.find(u=>u.id===m.unite_id)?.article_id));
  const v=m.variante_id&&vari(m.variante_id);const u=m.unite_id&&D.unites.find(x=>x.id===m.unite_id);
  const row=Object.assign({
    id:uuid(),created_at:nowIso(),quantite:1,par:ME.nom,
    domaine:a?a.domaine:null,article_id:a?a.id:null,article_nom:a?a.nom:null,
    variante_id:v?v.id:(u?u.variante_id:null),taille:v?v.taille:null,unite_numero:u?u.numero:null,
    lieu_nom:m.lieu_id?lieu(m.lieu_id)?.nom:null,lieu_dest_nom:m.lieu_dest_id?lieu(m.lieu_dest_id)?.nom:null
  },m);
  RDZSync.save({module:'stock-mouvements',table:'stk_mouvements',op:'upsert',onConflict:'id',row});
  applyLocal(row);
  return row;
}

// Ajoute au panier F.cart : {vid, q} pour la quantité, {uid} pour l'unité
function pickerHtml(lid,opts){
  opts=opts||{};const dom=F.dom||'vestiaire';
  const arts=artsOf(dom);const aid=F.pa&&arts.some(a=>a.id===F.pa)?F.pa:'';
  const a=aid&&art(aid);
  let second='';
  if(a&&a.suivi==='unite'){
    const us=(opts.unitsAll?D.unites.filter(u=>u.article_id===aid&&u.statut!=='sorti'):unitsAt(lid,aid)).filter(u=>!F.cart.some(c=>c.uid===u.id));
    second=opts.newUnits?`<div class="row"><input class="fi grow" type="number" min="1" id="pk-q" value="1"><button class="btn-add" onclick="pkAdd()">➕</button></div><div class="note" style="margin-top:8px">Matériel suivi à l'unité : un numéro sera attribué automatiquement à chaque pièce (visible dans la fiche après synchronisation).</div>`
      :us.length?`<div class="row"><select class="fi grow" id="pk-u">${us.map(u=>`<option value="${u.id}">n° ${esc(u.numero)}${u.numero_serie?' · S/N '+esc(u.numero_serie):''} · ${ETAT_L[u.etat]||u.etat}</option>`).join('')}</select><button class="btn-add" onclick="pkAdd()">➕</button></div>`
      :'<div class="empty">Aucune pièce disponible à ce lieu.</div>';
  }else if(a){
    const vs=varsOf(aid);
    second=`<div class="row"><select class="fi grow" id="pk-v">${vs.map(v=>`<option value="${v.id}">${esc(v.taille)}${opts.noStock?'':' — stock '+qStock(v.id,lid)}</option>`).join('')}</select>
      <input class="qin" type="number" min="1" id="pk-q" value="1"><button class="btn-add" onclick="pkAdd()">➕</button></div>`;
  }
  return `<div class="box">${domChips('pkDom')}
    <div class="fg"><label class="fl">Article</label><select class="fi" onchange="F.pa=this.value;render()"><option value="">— Choisir —</option>${arts.map(x=>`<option value="${x.id}" ${x.id===aid?'selected':''}>${esc((x.icon||'')+' '+x.nom)}${x.suivi==='unite'?' (n°)':''}</option>`).join('')}</select></div>
    ${second}</div>`;
}
function pkDom(d){F.dom=d;F.pa='';render();}
function pkAdd(){
  const a=art(F.pa);if(!a)return;
  if(a.suivi==='unite'&&$('pk-u')){const id=$('pk-u').value;if(id&&!F.cart.some(c=>c.uid===id))F.cart.push({uid:id});}
  else if(a.suivi==='unite'){const q=parseInt($('pk-q').value)||0;if(q<1)return;const v=varsOf(a.id)[0];F.cart.push({aid:a.id,vid:v&&v.id,q,unitNew:true});}
  else{const vid=$('pk-v').value,q=parseInt($('pk-q').value)||0;if(!vid||q<1)return;const ex=F.cart.find(c=>c.vid===vid&&!c.unitNew);if(ex)ex.q+=q;else F.cart.push({vid,q});}
  render();
}
function cartHtml(lid,title,showStock){
  if(!F.cart.length)return `<div class="list"><div class="hd">${title||'Panier'}</div><div class="empty">Ajoutez des articles ci-dessus</div></div>`;
  return `<div class="list"><div class="hd">${title||'Panier'} (${F.cart.length})</div>${F.cart.map((c,i)=>{
    if(c.uid){const u=D.unites.find(x=>x.id===c.uid);return `<div class="item"><div class="grow"><div class="nm">${esc(u?uLabel(u):'?')}</div><div class="sb">${u?'État : '+(ETAT_L[u.etat]||u.etat):''}</div></div><button class="del" onclick="F.cart.splice(${i},1);render()">✕</button></div>`;}
    const st=showStock&&lid?qStock(c.vid,lid):null;
    return `<div class="item"><div class="grow"><div class="nm">${esc(c.unitNew?(art(c.aid)?.nom||''):vLabel(c.vid))}</div>${st!==null?`<div class="sb">${st<c.q?'<span class="pill p-bad">stock '+st+'</span>':'stock '+st}</div>`:''}</div>
      <div class="qty"><button class="qb" onclick="F.cart[${i}].q=Math.max(1,F.cart[${i}].q-1);render()">−</button><span class="qv">${c.q}</span><button class="qb" onclick="F.cart[${i}].q++;render()">+</button></div>
      <button class="del" onclick="F.cart.splice(${i},1);render()">✕</button></div>`;}).join('')}</div>`;
}

        <input class="qin" type="number" min="0" value="${F.recv[l.id]}" onchange="F.recv['${l.id}']=parseInt(this.value)||0"></div>`;}).join('')}</div>

      <button class="btn" ${F.cart.length?'':'disabled'} onclick="doReception()">📥 Entrer en stock</button>`;

}
function doReception(){
  const lid=F.lieu;if(!lid)return toast('Choisissez un lieu','err');
  let n=0;
  if(F.cmd){
    D.lignes.filter(l=>l.commande_id===F.cmd).forEach(l=>{const q=F.recv[l.id]||0;if(q>0){mouvement({type:'reception',article_id:l.article_id,variante_id:l.variante_id,quantite:q,lieu_id:lid,commande_ligne_id:l.id,prix_unitaire:l.prix_unitaire,note:IX_cmd(F.cmd)});n+=q;}});
  }else{
    F.cart.forEach(c=>{mouvement({type:'reception',article_id:c.aid||vari(c.vid)?.article_id,variante_id:c.vid,quantite:c.q,lieu_id:lid,note:F.note||null});n+=c.q;});
  }

  saveCache();toast('📥 '+n+' pièce(s) entrée(s) en stock','ok');home();
}
function IX_cmd(id){const c=D.commandes.find(x=>x.id===id);return c?'Bon '+c.numero:null;}

// ═══ SORTIE ═══
function rSortie(){
  setTop('Sortie','Dotation agent ou mission',true);
  if(F.lieu===undefined){F.lieu=lastLieu();F.cart=[];F.motif='dotation';F.agent='';F.mission='';F.aq='';}
  const ag=D.agents.find(a=>String(a.id)===F.agent);
  const actifs=D.agents.filter(a=>a.actif!==false);
  const filt=F.aq?actifs.filter(a=>norm(fullName(a)).includes(norm(F.aq))):[];
  const rem=ag?D.demandes.filter(d=>d.agent_id===String(ag.id)):[];
  let h=`<div class="box">
    <div class="fg"><label class="fl">Type de sortie</label><div class="chips"><span class="chip ${F.motif==='dotation'?'sel':''}" onclick="F.motif='dotation';render()">👤 Dotation personnelle</span><span class="chip ${F.motif==='mission'?'sel':''}" onclick="F.motif='mission';render()">🎯 Mission particulière</span></div></div>
    <div class="fg"><label class="fl">Agent ${F.motif==='mission'?'(facultatif)':''}</label>
      ${ag?`<div class="item" style="padding:8px 0"><div class="grow"><div class="nm">👤 ${esc(fullName(ag))}</div></div><button class="del" onclick="F.agent='';render()">✕</button></div>`
      :`<input class="fi" placeholder="Tapez un nom…" value="${esc(F.aq)}" oninput="F.aq=this.value;clearTimeout(window._aq);window._aq=setTimeout(render,250)">
        ${filt.slice(0,8).map(a=>`<div class="item" onclick="F.agent='${esc(a.id)}';F.aq='';render()" style="cursor:pointer"><div class="grow nm">${esc(fullName(a))}</div><span>›</span></div>`).join('')}`}</div>
    ${F.motif==='mission'?`<div class="fg"><label class="fl">Mission</label><input class="fi" placeholder="Ex. Événement Palexpo 14.10" value="${esc(F.mission)}" onchange="F.mission=this.value"></div>`:''}
    <div class="fg"><label class="fl">Sortir du lieu</label>${lieuSelect('s-lieu',F.lieu,"F.lieu=this.value;setLastLieu(this.value);render()")}</div></div>`;
  if(rem.length)h+=`<div class="list"><div class="hd">Demandes de l'agent prêtes à remettre</div>${rem.map(d=>`<div class="item"><div class="grow"><div class="nm">${esc(vLabel(d.variante_id))} ×${d.quantite}</div><div class="sb">stock ici : ${qStock(d.variante_id,F.lieu)}</div></div>${(F.dems||[]).includes(d.id)?'<span class="pill p-ok">✓ ajouté</span>':`<button class="chip sm" onclick="addDem('${d.id}')">➕</button>`}</div>`).join('')}</div>`;
  h+=pickerHtml(F.lieu)+cartHtml(F.lieu,'À sortir',true)+
    `<div class="fg"><label class="fl">Note (facultatif)</label><input class="fi" value="${esc(F.note||'')}" onchange="F.note=this.value"></div>
    <button class="btn" ${F.cart.length?'':'disabled'} onclick="doSortie()">📤 Confirmer la sortie</button>`;
  return h;
}
function addDem(id){const d=D.demandes.find(x=>x.id===id);if(!d)return;F.dems=(F.dems||[]).concat(id);const ex=F.cart.find(c=>c.vid===d.variante_id);if(ex)ex.q+=d.quantite;else F.cart.push({vid:d.variante_id,q:d.quantite});render();}
function doSortie(){
  const ag=D.agents.find(a=>String(a.id)===F.agent);
  if(F.motif==='dotation'&&!ag)return toast('Choisissez l\'agent','err');
  if(F.motif==='mission'&&!(F.mission||'').trim())return toast('Indiquez la mission','err');
  const short=F.cart.filter(c=>c.vid&&!c.uid&&qStock(c.vid,F.lieu)<c.q);
  if(short.length&&!confirm('Stock insuffisant affiché pour '+short.length+' ligne(s) à ce lieu. Enregistrer quand même ? (l\'écart sera signalé au responsable)'))return;
  const base={type:'sortie',lieu_id:F.lieu,agent_id:ag?String(ag.id):null,agent_nom:ag?fullName(ag):null,mission:F.motif==='mission'?F.mission.trim():null,motif:F.motif,note:F.note||null};
  let n=0;F.cart.forEach(c=>{if(c.uid)mouvement(Object.assign({},base,{unite_id:c.uid,quantite:1}));else mouvement(Object.assign({},base,{variante_id:c.vid,quantite:c.q}));n+=c.q||1;});
  saveCache();toast('📤 '+n+' pièce(s) sortie(s)','ok');home();
}

// ═══ RETOUR ═══
function holders(){
  const H={};
  const key=o=>o.agent_id?'a:'+o.agent_id:o.agent_nom?'n:'+o.agent_nom:'m:'+o.mission;
  const nm=o=>{const a=o.agent_id&&D.agents.find(x=>String(x.id)===String(o.agent_id));return a?fullName(a):o.agent_nom;};
  D.detentions.forEach(d=>{if(d.quantite<=0)return;const k=key(d);(H[k]=H[k]||{label:nm(d)||('🎯 '+d.mission),agent_id:d.agent_id,items:[]}).items.push({kind:'d',d});});
  D.unites.filter(u=>u.statut==='sorti').forEach(u=>{const k=key(u);(H[k]=H[k]||{label:nm(u)||('🎯 '+u.mission),agent_id:u.agent_id,items:[]}).items.push({kind:'u',u});});
  return Object.entries(H).map(([k,v])=>Object.assign(v,{k})).sort((a,b)=>a.label.localeCompare(b.label,'fr'));
}
function rRetour(){
  setTop('Retour','Réintégration en stock',true);
  if(F.lieu===undefined){F.lieu=lastLieu();F.h='';F.sel={};F.motif='fin_mission';F.hq='';}
  const H=holders();const h0=H.find(x=>x.k===F.h);
  if(!h0){
    const list=F.hq?H.filter(x=>norm(x.label).includes(norm(F.hq))):H;
    return `<div class="box"><label class="fl">Qui rend le matériel ?</label><input class="fi" placeholder="Rechercher un agent / une mission…" value="${esc(F.hq)}" oninput="F.hq=this.value;clearTimeout(window._hq);window._hq=setTimeout(render,250)"></div>
      <div class="list">${list.length?list.map(x=>{const inact=x.agent_id&&D.agents.find(a=>String(a.id)===x.agent_id)?.actif===false;return `<div class="item" style="cursor:pointer" onclick="F.h='${esc(x.k)}';F.sel={};render()"><div class="grow"><div class="nm">${esc(x.label)} ${inact?'<span class="pill p-bad">parti</span>':''}</div><div class="sb">${x.items.length} ligne(s)</div></div><span>›</span></div>`;}).join(''):'<div class="empty">Personne ne détient de matériel.</div>'}</div>`;
  }
  const motifs=[['fin_mission','Fin de mission'],['depart','Départ de l\'agent'],['renouvellement','Renouvellement'],['autre','Autre']];
  return `<div class="box"><div class="item" style="padding:0 0 8px"><div class="grow nm">${esc(h0.label)}</div><button class="del" onclick="F.h='';render()">✕</button></div>
    <div class="fg"><label class="fl">Motif</label><div class="chips">${motifs.map(([k,l])=>`<span class="chip sm ${F.motif===k?'sel':''}" onclick="F.motif='${k}';${k==='depart'?'retAll();':''}render()">${l}</span>`).join('')}</div></div>
    <div class="fg"><label class="fl">Lieu de retour</label>${lieuSelect('rt-lieu',F.lieu,"F.lieu=this.value;setLastLieu(this.value)")}</div></div>
    <div class="list"><div class="hd">Cochez ce qui revient <span style="float:right;cursor:pointer" onclick="retAll();render()">Tout cocher</span></div>
    ${h0.items.map(it=>{
      const id=it.kind==='u'?it.u.id:it.d.id;const s=F.sel[id];
      const lbl=it.kind==='u'?uLabel(it.u):vLabel(it.d.variante_id);
      const sub=it.kind==='u'?(it.u.mission?'Mission '+it.u.mission:'Dotation'):(it.d.type==='mission'?'Mission '+(it.d.mission||''):'Dotation')+' · ×'+it.d.quantite;
      return `<div class="item" style="flex-wrap:wrap"><input type="checkbox" class="ck" ${s?'checked':''} onchange="retCk('${id}',${it.kind==='u'?1:(it.d.quantite)},this.checked)">
        <div class="grow"><div class="nm">${esc(lbl)}</div><div class="sb">${esc(sub)}</div></div>
        ${s&&it.kind==='d'?`<input class="qin" type="number" min="1" max="${it.d.quantite}" value="${s.q}" onchange="F.sel['${id}'].q=Math.min(${it.d.quantite},Math.max(1,parseInt(this.value)||1))">`:''}
        ${s?`<div style="width:100%" class="sub-opts">${it.kind==='u'?`<div class="chips">${ETATS.filter(e=>e[0]!=='neuf').map(([k,l])=>`<span class="chip sm ${s.etat===k?'sel':''}" onclick="F.sel['${id}'].etat='${k}';render()">${l}</span>`).join('')}</div>`
          :`<label class="sb"><input type="checkbox" ${s.rebut?'checked':''} onchange="F.sel['${id}'].rebut=this.checked"> Usé : mettre directement au rebut après réintégration</label>`}</div>`:''}
      </div>`;}).join('')}</div>
    <button class="btn" ${Object.keys(F.sel).length?'':'disabled'} onclick="doRetour()">↩️ Confirmer le retour (${Object.keys(F.sel).length})</button>`;
}
function retCk(id,q,on){if(on)F.sel[id]={q,etat:'bon',rebut:F.motif==='renouvellement'};else delete F.sel[id];render();}
function retAll(){const h0=holders().find(x=>x.k===F.h);if(!h0)return;h0.items.forEach(it=>{const id=it.kind==='u'?it.u.id:it.d.id;if(!F.sel[id])F.sel[id]={q:it.kind==='u'?1:it.d.quantite,etat:'bon',rebut:F.motif==='renouvellement'};});}
function doRetour(){
  const h0=holders().find(x=>x.k===F.h);if(!h0)return;
  let n=0;
  h0.items.forEach(it=>{
    const id=it.kind==='u'?it.u.id:it.d.id;const s=F.sel[id];if(!s)return;
    if(it.kind==='u'){mouvement({type:'retour',unite_id:id,quantite:1,lieu_id:F.lieu,etat:s.etat,motif:F.motif,agent_id:it.u.agent_id,agent_nom:it.u.agent_nom,mission:it.u.mission});
      if(s.etat==='hs'||s.etat==='defectueux')toast('⚠ '+it.u.numero+' signalé '+ETAT_L[s.etat].toLowerCase(),'err');}
    else{const d=it.d;mouvement({type:'retour',variante_id:d.variante_id,detention_id:String(d.id).startsWith('local-')?null:d.id,quantite:s.q,lieu_id:F.lieu,motif:F.motif,agent_id:d.agent_id,agent_nom:d.agent_nom,mission:d.mission});
      if(s.rebut)mouvement({type:'rebut',variante_id:d.variante_id,quantite:s.q,lieu_id:F.lieu,motif:'usure',note:'Retour '+(F.motif==='renouvellement'?'pour renouvellement':'')+' de '+(d.agent_nom||d.mission||'')});}
    n++;
  });
  saveCache();toast('↩️ '+n+' retour(s) enregistré(s)','ok');home();
}

    <div class="fg"><label class="fl">Motif</label><div class="chips">${[['usure','Usure'],['casse','Casse'],['perte','Perte / vol'],['autre','Autre']].map(([k,l])=>`<span class="chip sm ${F.motif===k?'sel':''}" onclick="F.motif='${k}';render()">${l}</span>`).join('')}</div></div></div>

// ═══ INVENTAIRE TOURNANT / CONTRÔLE DE LOGE ═══
const LS_INV='stk_inv_local_';  // + id : lignes comptées (reprise sur cet appareil)
function rInventaire(){
  const loge=F.type==='loge';
  setTop(loge?'Contrôle de loge':'Inventaire tournant',loge?'Matériel laissé à disposition':'Comptage par lieu et catégorie',true);
  if(F.inv)return rComptage();
  const lieuxOk=D.lieux.filter(l=>loge?l.type==='loge':true);
  if(F.lieu===undefined||!lieuxOk.some(l=>l.id===F.lieu)){F.lieu=(lieuxOk.find(l=>l.id===lastLieu())||lieuxOk[0]||{}).id||'';F.cat='';F.dom=loge?'':'vestiaire';}
  if(!lieuxOk.length)return `<div class="empty">Aucune loge n'est configurée.<br>À créer dans Gestion → Lieux (type « Loge »).</div>`;
  const cats=loge?[]:[...new Set(artsOf(F.dom).map(a=>a.categorie||'Autre'))].sort();
  const enCours=D.inventaires.filter(i=>(loge?i.type==='loge':i.type!=='loge'));
  return `${enCours.length?`<div class="list"><div class="hd">À reprendre</div>${enCours.map(i=>`<div class="item" style="cursor:pointer" onclick="resumeInv('${i.id}')"><div class="grow"><div class="nm">${esc(i.lieu_nom||'')}${i.categorie?' · '+esc(i.categorie):''}</div><div class="sb">Démarré le ${new Date(i.created_at).toLocaleString('fr-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} par ${esc(i.par||'')}</div></div><span>›</span></div>`).join('')}</div>`:''}
    <div class="box"><div class="fg"><label class="fl">${loge?'Loge':'Lieu'}</label>${lieuSelect('iv-lieu',F.lieu,"F.lieu=this.value;render()",l=>loge?l.type==='loge':true)}</div>
    ${loge?'':`${domChips('ivDom')}<div class="fg"><label class="fl">Catégorie</label><select class="fi" onchange="F.cat=this.value"><option value="">Toutes les catégories</option>${cats.map(c=>`<option ${F.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`}
    </div>
    <button class="btn" onclick="startInv()">${loge?'🏢 Démarrer le contrôle':'🔄 Démarrer le comptage'}</button>
    <div class="note" style="margin-top:12px">${loge?'Cochez chaque pièce présente et indiquez son état. Les écarts sont transmis au responsable matériel.':'Conseil : une catégorie à la fois, en tournant chaque semaine. Les écarts sont validés ensuite par le responsable sur ordinateur.'}</div>`;
}
function ivDom(d){F.dom=d;F.cat='';render();}
function buildLines(lid,dom,cat){
  const L=[];
  D.articles.filter(a=>(!dom||a.domaine===dom)&&(!cat||(a.categorie||'Autre')===cat)).sort((a,b)=>a.domaine.localeCompare(b.domaine)||(a.categorie||'').localeCompare(b.categorie||'')||a.nom.localeCompare(b.nom,'fr')).forEach(a=>{
    if(a.suivi==='unite')unitsAt(lid,a.id).forEach(u=>L.push({cle:'u:'+u.id,unite_id:u.id,variante_id:u.variante_id,article_nom:a.nom,taille:null,unite_numero:u.numero,theorique:1,compte:null,etat:null,_cat:a.categorie||'Autre',_icon:a.icon,_etat0:u.etat}));
    else varsOf(a.id).forEach(v=>{const th=qStock(v.id,lid);L.push({cle:'v:'+v.id,variante_id:v.id,unite_id:null,article_nom:a.nom,taille:v.taille,unite_numero:null,theorique:th,compte:null,etat:null,_cat:a.categorie||'Autre',_icon:a.icon});});
  });
  return L;
}
function startInv(){
  const loge=F.type==='loge';const l=lieu(F.lieu);if(!l)return toast('Choisissez un lieu','err');
  const inv={id:uuid(),created_at:nowIso(),lieu_id:l.id,lieu_nom:l.nom,domaine:loge?null:F.dom,categorie:loge?null:(F.cat||null),type:loge?'loge':'tournant',par:ME.nom,statut:'en_cours',termine_at:null,valide_at:null,valide_par:null,note:null};
  RDZSync.save({module:'stock-mouvements',table:'stk_inventaires',op:'upsert',onConflict:'id',row:inv});
  D.inventaires.unshift(inv);saveCache();
  F.inv=inv;F.lines=buildLines(l.id,inv.domaine,inv.categorie);saveInvLocal();render();
}
async function resumeInv(id){
  const inv=D.inventaires.find(i=>i.id===id);if(!inv)return;
  F.inv=inv;
  let local=null;try{local=JSON.parse(localStorage.getItem(LS_INV+id)||'null');}catch(e){}
  if(local){F.lines=local;}
  else{
    F.lines=buildLines(inv.lieu_id,inv.domaine,inv.categorie);
    try{const {data}=await sb.from('stk_inventaire_lignes').select('*').eq('inventaire_id',id);(data||[]).forEach(r=>{const l=F.lines.find(x=>x.cle===r.cle);if(l){l.compte=r.compte;l.etat=r.etat;l.theorique=r.theorique;}else F.lines.push(Object.assign({},r));});}catch(e){}
  }
  render();
}
function saveInvLocal(){try{localStorage.setItem(LS_INV+F.inv.id,JSON.stringify(F.lines));}catch(e){}}
function pushLine(l){
  const row={inventaire_id:F.inv.id,cle:l.cle,variante_id:l.variante_id||null,unite_id:l.unite_id||null,article_nom:l.article_nom,taille:l.taille,unite_numero:l.unite_numero,theorique:l.theorique,compte:l.compte,etat:l.etat,updated_at:nowIso()};
  RDZSync.save({module:'stock-mouvements',table:'stk_inventaire_lignes',op:'upsert',onConflict:'inventaire_id,cle',row});
  saveInvLocal();
}
function rComptage(){
  const L=F.lines,inv=F.inv;
  const done=L.filter(l=>l.compte!=null).length;
  let cat=null,h=`<div class="box"><div class="nm" style="font-weight:700">${esc(inv.lieu_nom)}${inv.categorie?' · '+esc(inv.categorie):''}</div><div class="sb" style="font-size:12px;color:var(--muted)">${done} / ${L.length} ligne(s) comptée(s) — les quantités théoriques sont affichées à titre indicatif</div></div>`;
  if(!L.length)h+=`<div class="empty">Rien d'attendu ici. Utilisez « Pièce trouvée » ci-dessous si du matériel est présent.</div>`;
  h+='<div class="list">';
  L.forEach((l,i)=>{
    if(l._cat!==cat){cat=l._cat;h+=`<div class="hd">${esc(cat||'')}</div>`;}
    if(l.unite_id){
      h+=`<div class="item" style="flex-wrap:wrap"><div class="grow"><div class="nm">${esc((l._icon||'')+' '+l.article_nom)} n° ${esc(l.unite_numero)}</div><div class="sb">${l.theorique?'attendu ici':'trouvé ici (non attendu)'}${l._etat0?' · état connu : '+(ETAT_L[l._etat0]||l._etat0):''}</div></div>
        <div class="chips"><span class="chip sm ${l.compte===1?'sel':''}" onclick="setU(${i},1)">✓ Présent</span><span class="chip sm ${l.compte===0?'sel':''}" onclick="setU(${i},0)">✕ Absent</span></div>
        ${l.compte===1?`<div class="sub-opts chips" style="width:100%">${ETATS.filter(e=>e[0]!=='neuf').map(([k,lb])=>`<span class="chip sm ${(l.etat||l._etat0)===k?'sel':''}" onclick="setE(${i},'${k}')">${lb}</span>`).join('')}</div>`:''}</div>`;
    }else{
      const cls=l.compte==null?'':(l.compte===l.theorique?'ok':'bad');
      h+=`<div class="item"><div class="grow"><div class="nm">${esc((l._icon||'')+' '+l.article_nom)}${l.taille&&l.taille!=='Unique'?' — '+esc(l.taille):''}</div><div class="sb">théo. ${l.theorique}</div></div>
        <input class="qin ${cls}" type="number" min="0" inputmode="numeric" value="${l.compte==null?'':l.compte}" placeholder="—" onchange="setQ(${i},this.value)"></div>`;
    }
  });
  h+='</div>';
  const hasUnits=D.articles.some(a=>a.suivi==='unite');
  if(hasUnits)h+=`<div class="box"><label class="fl">Pièce trouvée (non attendue ici)</label><div class="row"><input class="fi grow" id="iv-num" placeholder="N° d'inventaire, ex. RAD-0012"><button class="btn-add" onclick="foundUnit()">➕</button></div></div>`;
  h+=`<div class="fg"><label class="fl">Remarque</label><input class="fi" value="${esc(inv.note||'')}" onchange="F.inv.note=this.value"></div>
    <button class="btn ok" onclick="finishInv()">✅ Terminer et transmettre</button>
    <button class="btn g" onclick="F.inv=null;render()">Continuer plus tard</button>`;
  return h;
}
function setQ(i,v){const l=F.lines[i];l.compte=v===''?null:Math.max(0,parseInt(v)||0);pushLine(l);render();}
function setU(i,v){const l=F.lines[i];l.compte=v;if(v===1&&!l.etat)l.etat=l._etat0||'bon';if(v===0)l.etat=null;pushLine(l);render();}
function setE(i,e){const l=F.lines[i];l.etat=e;pushLine(l);render();}
function foundUnit(){
  const n=($('iv-num').value||'').trim().toUpperCase();if(!n)return;
  if(F.lines.some(l=>(l.unite_numero||'').toUpperCase()===n))return toast('Déjà dans la liste','err');
  const u=D.unites.find(x=>x.numero.toUpperCase()===n);if(!u)return toast('N° inconnu — vérifiez le numéro','err');
  const a=art(u.article_id);
  const l={cle:'u:'+u.id,unite_id:u.id,variante_id:u.variante_id,article_nom:a?a.nom:'',taille:null,unite_numero:u.numero,theorique:0,compte:1,etat:u.etat||'bon',_cat:'Trouvé ici',_icon:a?.icon,_etat0:u.etat};
  F.lines.push(l);pushLine(l);render();
}
function finishInv(){
  const L=F.lines;const nc=L.filter(l=>l.compte==null).length;
  const ec=L.filter(l=>l.compte!=null&&l.compte!==l.theorique).length;
  if(!confirm((nc?nc+' ligne(s) non comptée(s) seront ignorées. ':'')+ec+' écart(s). Terminer et transmettre ?'))return;
  F.inv=Object.assign({},F.inv,{statut:'termine',termine_at:nowIso()});
  RDZSync.save({module:'stock-mouvements',table:'stk_inventaires',op:'upsert',onConflict:'id',row:F.inv});
  D.inventaires=D.inventaires.filter(i=>i.id!==F.inv.id);saveCache();
  try{localStorage.removeItem(LS_INV+F.inv.id);}catch(e){}
  toast('✅ Comptage transmis'+(ec?' — '+ec+' écart(s) à valider par le responsable':''),'ok');home();
}

// ═══ CONSTAT D'ÉTAT ═══
function rConstat(){
  setTop('Constat d\'état','Matériel suivi à l\'unité',true);
  if(F.q===undefined){F.q='';F.uid='';F.etat='';F.motif='constat';}
  const u=D.unites.find(x=>x.id===F.uid);
  if(!u){
    const list=F.q?D.unites.filter(x=>norm(x.numero+' '+(x.numero_serie||'')+' '+(art(x.article_id)?.nom||'')+' '+(x.agent_nom||'')).includes(norm(F.q))).slice(0,25):[];
    return `<div class="box"><label class="fl">Rechercher une pièce</label><input class="fi" placeholder="N°, n° de série, article, agent…" value="${esc(F.q)}" oninput="F.q=this.value;clearTimeout(window._cq);window._cq=setTimeout(render,250)"></div>
      <div class="list">${list.length?list.map(x=>`<div class="item" style="cursor:pointer" onclick="F.uid='${x.id}';F.etat='${x.etat}';render()"><div class="grow"><div class="nm">${esc(uLabel(x))}</div><div class="sb">${x.statut==='sorti'?esc((x.agent_nom||'')+(x.mission?' · '+x.mission:'')):'📍 '+esc(lieu(x.lieu_id)?.nom||x.statut)} · <span class="pill ${ETAT_P[x.etat]||'p-mut'}">${ETAT_L[x.etat]||x.etat}</span></div></div><span>›</span></div>`).join(''):`<div class="empty">${F.q?'Aucune pièce trouvée':'Tapez un numéro ou un nom'}</div>`}</div>`;
  }
  return `<div class="box"><div class="item" style="padding:0 0 8px"><div class="grow"><div class="nm">${esc(uLabel(u))}</div><div class="sb">${u.statut==='sorti'?'Chez '+esc(u.agent_nom||u.mission||''):u.statut==='reparation'?'En réparation':'📍 '+esc(lieu(u.lieu_id)?.nom||'')}</div></div><button class="del" onclick="F.uid='';render()">✕</button></div>
    <div class="fg"><label class="fl">État constaté</label><div class="chips">${ETATS.map(([k,l])=>`<span class="chip sm ${F.etat===k?'sel':''}" onclick="F.etat='${k}';render()">${l}</span>`).join('')}</div></div>
    <div class="fg"><label class="fl">Action</label><div class="chips">
      <span class="chip sm ${F.motif==='constat'?'sel':''}" onclick="F.motif='constat';render()">Simple vérification</span>
      ${u.statut!=='reparation'?`<span class="chip sm ${F.motif==='reparation'?'sel':''}" onclick="F.motif='reparation';render()">Envoyer en réparation</span>`:`<span class="chip sm ${F.motif==='repare'?'sel':''}" onclick="F.motif='repare';render()">Revenu de réparation</span>`}</div></div>
    ${F.motif==='repare'?`<div class="fg"><label class="fl">Rangé à</label>${lieuSelect('cs-lieu',F.lieu||lastLieu(),"F.lieu=this.value")}</div>`:''}
    <div class="fg"><label class="fl">Commentaire</label><input class="fi" placeholder="Ex. antenne fissurée, batterie faible…" value="${esc(F.note||'')}" onchange="F.note=this.value"></div></div>
    <button class="btn" onclick="doConstat()">🔍 Enregistrer le constat</button>`;
}
function doConstat(){
  const u=D.unites.find(x=>x.id===F.uid);if(!u)return;
  const m={type:'constat',unite_id:u.id,quantite:1,etat:F.etat||u.etat,motif:F.motif,note:F.note||null,lieu_id:u.lieu_id};
  if(F.motif==='repare'){m.lieu_id=F.lieu||lastLieu();}
  mouvement(m);
  if(F.motif==='repare'){u.lieu_id=m.lieu_id;mouvement({type:'transfert',unite_id:u.id,quantite:1,lieu_id:m.lieu_id,lieu_dest_id:m.lieu_id,note:'Rangement après réparation'});}
  saveCache();toast('🔍 Constat enregistré','ok');F={};render();go('constat');
}

window.addEventListener('online',()=>{if(ME&&VIEW.screen==='home')setTimeout(()=>{loadData();},1500);});
init();
</script>
