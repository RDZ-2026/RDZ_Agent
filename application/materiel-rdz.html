<!--
  Application du RESPONSABLE MATÉRIEL (radios, lampes…) — dossier /application/.
  Téléphone d'abord, lisible aussi sur ordinateur.
  Accès : nom + code PIN (même table `agents`), réservé aux agents ayant la fonction
  « materiel » (agents.fonctions, cochée dans comptes-agents.html — même fonction que stock-mouvements).

  AUCUNE table créée ni modifiée. Tables existantes utilisées :
   - stock_materiel_items : UNE LIGNE PAR ARTICLE ET PAR LOCAL, nommée « Article — Site / Local »
       quantite_total = pièces rattachées à ce local (en stock + sorties + indisponibles)
       quantite_dispo = pièces en stock, prêtes à sortir
       indisponibles (calculé) = total − disponibles − sorties  → défectueux / hors service
       Les lignes sans « — Site / Local » sont l'ancien stock, à reprendre (écran Reprise).
   - stock_attributions : sorties (statut 'actif') et retours (statut 'rendu', etat_retour)
       la note contient « Mission : … » et « Départ : <état> — commentaire »
   - stock_maintenances : signalements de panne créés au retour / à l'inventaire
   - stock_historique (fonction stock_log, module 'materiel') : entrées, déplacements, inventaires
   - table `sites` (lecture)
  Paramètres (locaux par site, états, catalogue d'articles) + rapports d'inventaire :
   fichiers dans le stockage EXISTANT journal-photos, dossier materiel/ (versions horodatées).
  Réseau requis pour enregistrer (outil de gestion, pas de file hors-ligne).
-->

.btn.full{width:100%;max-width:460px;margin-left:auto;margin-right:auto;display:flex}
.btn.g,.backbtn{background:#f8fafc;border:1px solid var(--control-border);box-shadow:var(--control-shadow)}
.btn.d{box-shadow:0 3px 9px rgba(17,28,46,.13)}
.btn:active:not(:disabled),.backbtn:active,.chip:active{transform:scale(.975)}
.fi{min-height:43px;padding:10px 12px;border:1px solid var(--control-border);border-radius:12px;background:#fbfcfe;font-size:14px;line-height:1.35;box-shadow:inset 0 1px 2px rgba(17,28,46,.025)}
select.fi{padding-right:30px}
textarea.fi{min-height:84px;line-height:1.5}
.fl{font-size:10.5px;letter-spacing:.055em;margin:13px 0 5px}
.fr{gap:9px;min-width:0}.fr>*{min-width:0}
.card.pad{padding:15px}
.card.pad>.btn.full{margin-top:13px}
.sheet{width:min(100%,560px);padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .btn.full{max-width:none}
.chip{min-height:36px;padding:8px 12px;border-radius:10px;font-size:12px;border-color:var(--control-border)}
.qty{gap:6px}.qty button{width:38px;min-width:38px;height:38px;border-radius:11px;background:#f8fafc}.qty input{min-height:38px;width:56px;border-radius:10px}
.pick{min-height:52px;padding:13px 14px;font-size:14px}
.key{width:68px;height:68px;font-size:24px}.keypad{grid-template-columns:repeat(3,68px);gap:12px 17px}
@media(max-width:600px){
 main{padding-left:12px;padding-right:12px}
 .card.pad{padding:13px}
 .fr{grid-template-columns:minmax(0,1fr)}
 .fi{width:100%;min-width:0}
 .sheet{max-height:94dvh}
 .sheet .fr{grid-template-columns:minmax(0,1fr)}
 .row .r .btn{min-height:34px;padding:7px 10px}
 .btn.full{max-width:none}
 .sticky .btn{min-height:44px}
}
@media(max-width:380px){
 .sheet{padding-left:12px;padding-right:12px}
 .btn{padding:9px 11px;font-size:12.5px}
 .card.pad{padding:12px}
 .key{width:62px;height:62px}.keypad{grid-template-columns:repeat(3,62px);gap:10px 15px}
}
@media(hover:hover){.btn:hover:not(:disabled),.backbtn:hover,.chip:hover{box-shadow:0 5px 14px rgba(17,28,46,.10)}}
}
</style>

const SUPABASE_URL='https://pdewmubikmotqzbxmyeq.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkZXdtdWJpa21vdHF6YnhteWVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDU3MjgsImV4cCI6MjA5NDg4MTcyOH0.SRuhERPmB5_7a58nJ5oMg4a8mujnoLBv8dxkxvyNWao';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function normName(s){return norm(s).split(/\s+/).filter(Boolean).sort().join(' ');}
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'ok');e.textContent=m;$('toasts').appendChild(e);setTimeout(()=>e.remove(),3400);}
function errTxt(e){return [e&&e.message,e&&e.details,e&&e.code?'code '+e.code:''].filter(Boolean).join(' — ')||String(e);}
async function q(p){const r=await p;if(r.error)throw r.error;return r.data;}
function fullName(a){return [a.nom,a.prenom].filter(Boolean).join(' ')||'—';}
function fDT(ts){if(!ts)return '';const d=new Date(ts);return d.toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit',year:'numeric'})+' · '+d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});}
function ago(ts){const m=Math.floor((Date.now()-new Date(ts))/60000);if(m<60)return Math.max(1,m)+' min';if(m<1440)return Math.floor(m/60)+' h';return Math.floor(m/1440)+' j';}
function sum(a,f){return a.reduce((s,x)=>s+(Number(f(x))||0),0);}

// ═══ STOCKAGE (paramètres + rapports d'inventaire) ═══
const BUCKET='journal-photos', DIR='materiel';
const pubUrl=p=>sb.storage.from(BUCKET).getPublicUrl(DIR+'/'+p).data.publicUrl;
const stamp=()=>new Date().toISOString().replace(/[:.]/g,'-');
async function sList(p){const r=await sb.storage.from(BUCKET).list(DIR+'/'+p,{limit:500,sortBy:{column:'name',order:'desc'}});if(r.error)throw r.error;return (r.data||[]).map(f=>f.name).filter(n=>n&&n.endsWith('.json'));}
async function sGet(p){const r=await fetch(pubUrl(p),{cache:'no-store'});if(!r.ok)throw new Error('introuvable');return r.json();}
async function sPut(p,obj){const r=await sb.storage.from(BUCKET).upload(DIR+'/'+p,new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}),{upsert:false,contentType:'application/json'});if(r.error)throw r.error;}
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';}

// ═══ PARAMÈTRES (modifiables dans l'onglet Paramètres) ═══
const CFG_DEFAULT={v:1,locaux:{},articles:[],fournisseurs:[],etats:[
  {code:'bon',label:'Bon',couleur:'#1b7a3d',stock:true,panne:false},
  {code:'use',label:'Usé',couleur:'#a76a00',stock:true,panne:false},
  {code:'defectueux',label:'Défectueux',couleur:'#b3122a',stock:false,panne:true},
  {code:'hs',label:'Hors service',couleur:'#6b0f1a',stock:false,panne:true}]};
let CFG=JSON.parse(JSON.stringify(CFG_DEFAULT));
async function loadCfg(){try{const l=await sList('config');if(l[0])CFG=JSON.parse(JSON.stringify(Object.assign({},CFG_DEFAULT,await sGet('config/'+l[0]))));}catch(e){}if(!Array.isArray(CFG.fournisseurs))CFG.fournisseurs=[];}
async function saveCfg(){CFG.updated=new Date().toISOString();CFG.par=ME.nom;await sPut('config/'+stamp()+'.json',CFG);}
const etat=c=>CFG.etats.find(e=>e.code===c)||CFG.etats.find(e=>e.label===c)||{code:c,label:c||'—',couleur:'#63758f',stock:true};
const etatPill=c=>{const e=etat(c);return `<span class="pill" style="background:${e.couleur}1a;color:${e.couleur}"><span class="dot" style="background:${e.couleur}"></span>${esc(e.label)}</span>`;};
const etatOpts=sel=>CFG.etats.map(e=>`<option value="${esc(e.code)}" ${e.code===sel?'selected':''}>${esc(e.label)}</option>`).join('');

// ═══ IDENTIFICATION (PIN + fonction « materiel ») ═══
const LS_ID='rdz_agent_id',LS_NOM='rdz_agent_nom',LS_HASH='rdz_agent_pin_hash',FONCTION='materiel';
let ME=null,PIN={buf:'',a:null};
async function hashPin(pin){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('RDZ-PIN-2026-'+pin));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function showAuth(h){$('app').classList.add('hidden');$('scr-auth').classList.remove('hidden');$('auth-in').innerHTML=h;}
async function identList(msg){
  showAuth(`<h2>Qui êtes-vous ?</h2><div class="sub">Réservé aux responsables du matériel. Choisissez votre nom puis saisissez votre code PIN habituel.</div>${msg?`<div class="warnbox">${esc(msg)}</div>`:''}<div id="ident"><div class="empty">Chargement…</div></div>`);
  try{const d=await q(sb.from('agents').select('id,nom,prenom,actif,fonctions').eq('actif',true).contains('fonctions',[FONCTION]).order('nom'));
    $('ident').innerHTML=d.length?d.map(a=>`<button class="pick" onclick="pickAgent('${esc(a.id)}')">${esc(fullName(a))}<span>›</span></button>`).join(''):'<div class="empty">Aucun agent n\'a encore la fonction « Responsable matériel ».<br>Cochez-la dans le paramétrage des comptes agents.</div>';}
  catch(e){$('ident').innerHTML=`<div class="empty">Connexion impossible.<br>${esc(errTxt(e))}<br><br><button class="btn g" onclick="identList()">Réessayer</button></div>`;}
}
async function pickAgent(id){try{const a=await q(sb.from('agents').select('id,nom,prenom,pin_hash,actif,fonctions').eq('id',id).single());
  if(!a.pin_hash)return identList('Créez d\'abord votre code PIN dans l\'application RDZ Agent.');PIN={buf:'',a};pinScreen('Entrez votre code PIN');}catch(e){toast(errTxt(e),'err');}}
function pinScreen(msg,err){
  showAuth(`<div style="text-align:center;font-size:19px;font-weight:800">${esc(fullName(PIN.a))}</div><div style="text-align:center;font-size:13px;margin-top:6px;color:${err?'var(--bad)':'var(--muted)'}">${esc(msg)}</div>
    <div class="dots">${[0,1,2,3].map(i=>`<div class="dotp ${i<PIN.buf.length?'on':''}"></div>`).join('')}</div>
    <div class="keypad">${['1','2','3','4','5','6','7','8','9','','0','del'].map(k=>k===''?'<div></div>':k==='del'?'<button class="key fn" onclick="pinKey(null)">Effacer</button>':`<button class="key" onclick="pinKey('${k}')">${k}</button>`).join('')}</div>
    <button class="link" onclick="identList()">Ce n'est pas moi</button>`);
}
async function pinKey(k){
  if(k===null){PIN.buf=PIN.buf.slice(0,-1);return pinScreen('Entrez votre code PIN');}
  if(PIN.buf.length>=4)return;PIN.buf+=k;if(PIN.buf.length<4)return pinScreen('Entrez votre code PIN');
  const h=await hashPin(PIN.buf);
  if(h===PIN.a.pin_hash){localStorage.setItem(LS_ID,PIN.a.id);localStorage.setItem(LS_NOM,fullName(PIN.a));localStorage.setItem(LS_HASH,h);enter(PIN.a);}
  else{PIN.buf='';pinScreen('Code incorrect, réessayez',true);}
}
function enter(a){
  if(!(a.fonctions||[]).includes(FONCTION))return identList('Votre compte n\'a pas la fonction « Responsable matériel ».');
  ME={id:String(a.id),nom:fullName(a)};$('scr-auth').classList.add('hidden');$('app').classList.remove('hidden');$('top-sub').textContent='👤 '+ME.nom;
  reload();
}
async function init(){
  const id=localStorage.getItem(LS_ID),h=localStorage.getItem(LS_HASH);if(!id)return identList();
  try{const a=await q(sb.from('agents').select('id,nom,prenom,pin_hash,actif,fonctions').eq('id',id).single());
    if(!a||a.actif===false)return identList('Accès désactivé.');
    if(a.pin_hash&&a.pin_hash===h)return enter(a);PIN={buf:'',a};pinScreen('Entrez votre code PIN');}
  catch(e){identList(errTxt(e));}
}

// ═══ DONNÉES ═══
const SEP=' — ';
let D={rows:[],attr:[],agents:[],stockAgents:[],sites:[],hist:[],maint:[]},T='home',F={};
function parse(r){const i=r.nom.lastIndexOf(SEP);if(i>0){const loc=r.nom.slice(i+SEP.length);const j=loc.indexOf(' / ');if(j>0)return {art:r.nom.slice(0,i),site:loc.slice(0,j),local:loc.slice(j+3)};}return {art:r.nom,site:null,local:null};}
const rowName=(art,site,local)=>art+SEP+site+' / '+local;
async function reload(){
  try{
    const r=await Promise.all([
      sb.from('stock_materiel_items').select('*').order('nom'),
      sb.from('stock_attributions').select('*').order('date_sortie',{ascending:false}).limit(600),
      sb.from('agents').select('id,nom,prenom,actif').eq('actif',true).order('nom'),
      sb.from('stock_agents').select('id,nom'),
      sb.from('sites').select('id,nom,actif').order('nom'),
      sb.from('stock_historique').select('*').eq('module','materiel').order('created_at',{ascending:false}).limit(300),
      sb.from('stock_maintenances').select('*').order('created_at',{ascending:false}).limit(200)]);
    if(r[0].error)throw r[0].error;
    D.rows=(r[0].data||[]).filter(x=>x.actif!==false).map(x=>Object.assign(x,parse(x)));
    D.attr=r[1].data||[];D.agents=r[2].data||[];D.stockAgents=r[3].data||[];D.sites=(r[4].data||[]).filter(s=>s.actif!==false);
    D.hist=r[5].data||[];D.maint=r[6].data||[];
    await loadCfg();await loadBons();
  }catch(e){toast('Chargement impossible : '+errTxt(e),'err');}
  render();
}
const located=()=>D.rows.filter(r=>r.site);
const legacy=()=>D.rows.filter(r=>!r.site);
const actives=()=>D.attr.filter(a=>a.statut==='actif');
const outOf=id=>sum(actives().filter(a=>String(a.materiel_id)===String(id)),a=>a.quantite);
const indispo=r=>Math.max(0,(r.quantite_total||0)-(r.quantite_dispo||0)-outOf(r.id));
const rowById=id=>D.rows.find(r=>String(r.id)===String(id));
function sitesList(){const s=new Set(D.sites.map(x=>x.nom));Object.keys(CFG.locaux||{}).forEach(x=>s.add(x));located().forEach(r=>s.add(r.site));return [...s].sort((a,b)=>a.localeCompare(b,'fr'));}
function locauxOf(site){const s=new Set(CFG.locaux[site]||[]);located().filter(r=>r.site===site).forEach(r=>s.add(r.local));return [...s];}
function articlesList(){const s=new Map();(CFG.articles||[]).forEach(a=>s.set(a.nom,a));D.rows.forEach(r=>{if(!s.has(r.art))s.set(r.art,{nom:r.art,icon:r.icon,seuil:r.seuil_alerte});});return [...s.values()].sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));}
const artIcon=n=>(articlesList().find(a=>a.nom===n)||{}).icon||'📦';
function locSelect(id,site,local,onch){return `<div class="fr"><div><label class="fl">Site</label><select class="fi" id="${id}-site" onchange="$('${id}-local').innerHTML=locOpts(this.value);${onch||''}">${['<option value="">— Choisir —</option>'].concat(sitesList().map(s=>`<option ${s===site?'selected':''}>${esc(s)}</option>`)).join('')}</select></div>
  <div><label class="fl">Local</label><select class="fi" id="${id}-local" ${onch?`onchange="${onch}"`:''}>${locOpts(site,local)}</select></div></div>`;}
function locOpts(site,sel){const l=site?locauxOf(site):[];return l.length?l.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join(''):'<option value="">'+(site?'Aucun local — ajoutez-en dans Paramètres':'— Choisir le site d\'abord —')+'</option>';}
function stockAgentId(nom){const s=D.stockAgents.find(x=>normName(x.nom)===normName(nom));return s?s.id:null;}
async function log(type,art,qte,note){try{await sb.rpc('stock_log',{p_module:'materiel',p_type_op:type,p_agent_nom:ME.nom,p_article_nom:art,p_taille:null,p_quantite:qte,p_note:note||null,p_par:ME.nom});}catch(e){console.warn('stock_log',e);}}
// Ligne de stock d'un article dans un local (créée si besoin)
async function ensureRow(art,site,local){
  const n=rowName(art,site,local);let r=D.rows.find(x=>x.nom===n);
  if(r)return r;const a=articlesList().find(x=>x.nom===art)||{};
  const [nr]=await q(sb.from('stock_materiel_items').insert({nom:n,icon:a.icon||'📦',quantite_total:0,quantite_dispo:0,seuil_alerte:a.seuil||0,actif:true}).select());
  Object.assign(nr,parse(nr));D.rows.push(nr);return nr;
}
// Mise à jour des quantités à partir d'une relecture fraîche (évite d'écraser un geste fait entre-temps)
async function bump(row,dTotal,dDispo){
  const cur=await q(sb.from('stock_materiel_items').select('*').eq('id',row.id).single());
  const upd={quantite_total:Math.max(0,(cur.quantite_total||0)+dTotal),quantite_dispo:Math.max(0,(cur.quantite_dispo||0)+dDispo)};
  await q(sb.from('stock_materiel_items').update(upd).eq('id',row.id));Object.assign(row,upd);
}

// Filtres des tuiles de l'accueil (appliqués à l'écran Stock)
const STOCK_FILTRES={
  dispo:{label:'Disponibles',test:r=>(r.quantite_dispo||0)>0},
  sorti:{label:'Sortis',test:r=>outOf(r.id)>0},
  indispo:{label:'Défectueux / HS',test:r=>indispo(r)>0},
  seuil:{label:'Sous le seuil',test:r=>(r.seuil_alerte||0)>0&&r.quantite_dispo<r.seuil_alerte}
};

// ═══ STOCK ═══
function rStock(){
  const v=F.vue||'local';const FT=STOCK_FILTRES[F.filtre];
  const L=located().filter(r=>!F.site||r.site===F.site).filter(r=>!F.q||norm(r.nom).includes(norm(F.q))).filter(r=>!FT||FT.test(r));
  let h=`<h2>Stock</h2><div class="sub">Disponible = prêt à sortir · Sorti = chez un agent / en mission · Indispo = défectueux ou hors service.</div>
  ${FT?`<div class="filt"><span>${FT.label} — ${L.length} ligne(s)</span><span style="display:flex;gap:6px;flex-wrap:wrap">${F.filtre==='seuil'&&L.length?'<button class="btn sm d" onclick="prepSeuil();tab(\'cmdprep\')">🛒 Commander</button>':''}<button class="btn sm g" onclick="F.filtre='';render()">✕ Tout afficher</button></span></div>`:''}
  ${(()=>{const sansPrix=new Set(L.filter(r=>!artPrix(r.art)).map(r=>r.art)).size;return `<div class="note">💰 Valeur ${FT||F.site||F.q?'de cette sélection':'du stock'} : <b>${chf(sum(L,r=>(r.quantite_total||0)*artPrix(r.art)))}</b> <span style="color:var(--muted)">(quantité totale × prix unitaire${sansPrix?' · '+sansPrix+' article(s) sans prix':''})</span></div>`;})()}
  <div class="card pad"><div class="fr"><select class="fi" onchange="F.site=this.value;render()"><option value="">Tous les sites</option>${sitesList().map(s=>`<option ${F.site===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
    <input class="fi" placeholder="🔍 Article…" value="${esc(F.q||'')}" onchange="F.q=this.value;render()"></div>
    <div class="chips" style="margin-top:10px"><button class="chip ${v==='local'?'on':''}" onclick="F.vue='local';render()">Par local</button><button class="chip ${v==='art'?'on':''}" onclick="F.vue='art';render()">Par article (total)</button></div></div>`;
  const qh=r=>`<div class="q ok"><b>${r.quantite_dispo||0}</b><span>dispo</span></div><div class="q warn"><b>${outOf(r.id)}</b><span>sorti</span></div><div class="q ${indispo(r)?'bad':''}"><b>${indispo(r)}</b><span>indispo</span></div>`;
  if(v==='art'){const by={};L.forEach(r=>{(by[r.art]=by[r.art]||[]).push(r);});
    h+=`<div class="card">${Object.keys(by).sort((a,b)=>a.localeCompare(b,'fr')).map(a=>{const rs=by[a];const T={quantite_dispo:sum(rs,r=>r.quantite_dispo),id:null};
      return `<div class="row"><div class="ic">${esc(artIcon(a))}</div><div class="g"><div class="t">${esc(a)}</div><div class="s">${rs.map(r=>esc(r.site+' · '+r.local)+' : '+r.quantite_dispo).join(' — ')}</div></div><div class="r"><div class="q ok"><b>${sum(rs,r=>r.quantite_dispo)}</b><span>dispo</span></div><div class="q warn"><b>${sum(rs,r=>outOf(r.id))}</b><span>sorti</span></div><div class="q ${sum(rs,indispo)?'bad':''}"><b>${sum(rs,indispo)}</b><span>indispo</span></div></div></div>`;}).join('')||'<div class="empty">Aucun matériel.</div>'}</div>`;
    return h;}
  const by={};L.forEach(r=>{const k=r.site+' · '+r.local;(by[k]=by[k]||[]).push(r);});
  const keys=Object.keys(by).sort((a,b)=>a.localeCompare(b,'fr'));
  h+=keys.length?keys.map(k=>`<div class="sec">📍 ${esc(k)}</div><div class="card">${by[k].sort((a,b)=>a.art.localeCompare(b.art,'fr')).map(r=>`<div class="row click" onclick="rowSheet('${esc(r.id)}')"><div class="ic">${esc(r.icon||'📦')}</div><div class="g"><div class="t">${esc(r.art)}</div>${(r.seuil_alerte||0)>0&&r.quantite_dispo<r.seuil_alerte?`<div class="s" style="color:var(--bad)">⚠ sous le seuil (${r.seuil_alerte})</div>`:''}${F.filtre==='sorti'?`<div class="s">${actives().filter(a=>String(a.materiel_id)===String(r.id)).map(a=>a.quantite+' × '+esc(a.agent_nom||'?')+' · '+ago(a.date_sortie||a.created_at)).join(' — ')}</div>`:''}</div><div class="r">${qh(r)}</div></div>`).join('')}</div>`).join('')
    :FT?`<div class="card"><div class="empty">Aucun élément « ${FT.label.toLowerCase()} ».</div></div>`:`<div class="card"><div class="empty">Aucun matériel rangé dans un local.${legacy().length?'<br><br><button class="btn d" onclick="tab(\'reprise\')">Ranger l\'ancien stock</button>':''}<br><br><button class="btn" onclick="entree()">➕ Entrée de matériel</button></div></div>`;
  return h;
}

async function saveSeuil(id){try{await q(sb.from('stock_materiel_items').update({seuil_alerte:parseInt($('se').value)||0}).eq('id',id));closeSheet();toast('Seuil enregistré');reload();}catch(e){toast(errTxt(e),'err');}}

function moveSheet(id){const r=rowById(id);
  sheet(`<h3>🚚 Déplacer — ${esc(r.art)}</h3><div class="sub">Depuis ${esc(r.site)} · ${esc(r.local)} (${r.quantite_dispo} disponible(s))</div>

async function doMove(id){const r=rowById(id);const n=parseInt($('mv-q').value)||0,s=$('mv-site').value,l=$('mv-local').value;
  if(n<1||n>r.quantite_dispo)return toast('Quantité invalide','err');if(!s||!l)return toast('Choisissez le site et le local','err');if(s===r.site&&l===r.local)return toast('C\'est déjà ce local','err');

function repairSheet(id){const r=rowById(id);sheet(`<h3>🔧 Remettre en service</h3><div class="sub">${esc(r.art)} — ${indispo(r)} indisponible(s)</div><label class="fl">Quantité réparée</label>${qtyField('rp-q',indispo(r))}<label class="fl">Commentaire</label><input class="fi" id="rp-n"><button class="btn full ok" onclick="doRepair('${esc(id)}')">Remettre en stock</button><button class="btn full g" onclick="closeSheet()">Annuler</button>`);}

async function doDecl(id){const r=rowById(id);const n=parseInt($('dc-q').value)||0,e=etat($('dc-e').value),c=$('dc-c').value.trim();

    if(e.panne)await q(sb.from('stock_maintenances').insert({materiel_nom:r.nom,type_probleme:'panne',description:`${n} × ${r.art} — ${e.label} : ${c}`,agent_id:stockAgentId(ME.nom),agent_nom:ME.nom,statut:'ouvert'}));
    closeSheet();toast('⚠️ '+n+' × '+r.art+' : '+e.label);reload();}catch(err){toast(errTxt(err),'err');}}

async function doEntree(){
  let a=$('en-a').value;const n=parseInt($('en-q').value)||0,s=$('en-site').value,l=$('en-local').value;
  if(a==='__new'){a=$('en-nom').value.trim();if(!a)return toast('Nom de l\'article requis','err');if(a.includes(SEP))return toast('Le nom ne peut pas contenir « — »','err');
    if(!CFG.articles.some(x=>x.nom===a)){CFG.articles.push({nom:a,icon:$('en-ico').value.trim()||'📦',seuil:0});try{await saveCfg();}catch(e){}}}
  if(n<1)return toast('Quantité invalide','err');if(!s||!l)return toast('Choisissez le site et le local','err');
  try{const r=await ensureRow(a,s,l);await bump(r,n,n);await log('entree',a,n,($('en-n').value.trim()||'Entrée')+' — '+s+' / '+l);closeSheet();toast('➕ '+n+' × '+a+' ajouté(s)');reload();}catch(e){toast(errTxt(e),'err');}
}

let CART=[];
function rSortie(){
  const site=F.site||'',local=F.local||'';
  const rows=located().filter(r=>r.site===site&&r.local===local&&r.quantite_dispo>0);
  return `<h2>Sortie de matériel</h2><div class="sub">À un agent, pour une mission, ou les deux.</div>
  <div class="grid2"><div>
  <div class="card pad"><label class="fl first">Agent</label><select class="fi" id="so-ag" onchange="F.ag=this.value"><option value="">— Aucun (mission seule) —</option>${D.agents.map(a=>`<option value="${esc(a.id)}" ${String(a.id)===F.ag?'selected':''}>${esc(fullName(a))}</option>`).join('')}</select>
    <label class="fl">Mission (texte libre)</label><input class="fi" id="so-mis" value="${esc(F.mis||'')}" oninput="F.mis=this.value" placeholder="Ex. Événement Palexpo 14.11">
    <div class="fr"><div><label class="fl">État au départ</label><select class="fi" id="so-et" onchange="F.et=this.value">${etatOpts(F.et||'bon')}</select></div><div><label class="fl">Commentaire</label><input class="fi" id="so-com" value="${esc(F.com||'')}" oninput="F.com=this.value"></div></div></div>
  <div class="card pad"><div class="fl first">Depuis</div>${locSelect('so',site,local,"F.site=$('so-site').value;F.local=$('so-local').value;render()")}
    ${site&&local?(rows.length?`<label class="fl">Article</label><select class="fi" id="so-a">${rows.map(r=>`<option value="${esc(r.id)}">${esc((r.icon||'')+' '+r.art)} — ${r.quantite_dispo-sum(CART.filter(c=>c.id===r.id),c=>c.q)} dispo</option>`).join('')}</select>
      <label class="fl">Quantité</label><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${qtyField('so-q',null)}<button class="btn sm d" onclick="addCart()">➕ Ajouter</button></div>`:'<div class="empty">Rien de disponible dans ce local.</div>'):''}</div>
  </div><div>
  <div class="card pad"><div class="fl first">À sortir</div>
    ${CART.length?CART.map((c,i)=>{const r=rowById(c.id);return `<div class="row" style="padding:9px 0"><div class="ic">${esc(r.icon||'📦')}</div><div class="g"><div class="t">${c.q} × ${esc(r.art)}</div><div class="s">${esc(r.site)} · ${esc(r.local)}</div></div><button class="btn sm g" style="flex:0 0 auto;width:38px" onclick="CART.splice(${i},1);render()">✕</button></div>`;}).join(''):'<div class="empty">Ajoutez du matériel.</div>'}
    <button class="btn full" ${CART.length?'':'disabled'} onclick="doSortie()">📤 Confirmer la sortie (${sum(CART,c=>c.q)})</button></div>
  </div></div>`;
}
function addCart(){const id=$('so-a').value;const r=rowById(id);const n=parseInt($('so-q').value)||0;const deja=sum(CART.filter(c=>c.id===id),c=>c.q);
  if(n<1)return toast('Quantité invalide','err');if(n+deja>r.quantite_dispo)return toast('Seulement '+(r.quantite_dispo-deja)+' disponible(s)','err');
  const ex=CART.find(c=>c.id===id);if(ex)ex.q+=n;else CART.push({id,q:n});render();}
async function doSortie(){
  const ag=D.agents.find(a=>String(a.id)===$('so-ag').value);const mis=$('so-mis').value.trim();const et=etat($('so-et').value);const com=$('so-com').value.trim();
  if(!ag&&!mis)return toast('Choisissez un agent et/ou indiquez une mission','err');
  const nom=ag?fullName(ag):'🎯 '+mis;const note=[mis?'Mission : '+mis:'','Départ : '+et.label+(com?' — '+com:''),'Sorti par : '+ME.nom].filter(Boolean).join('\n');
  try{
    for(const c of CART){const r=rowById(c.id);
      const cur=await q(sb.from('stock_materiel_items').select('quantite_dispo').eq('id',r.id).single());
      if(cur.quantite_dispo<c.q)throw new Error('Stock insuffisant pour '+r.art+' (il reste '+cur.quantite_dispo+')');
      await bump(r,0,-c.q);
      await q(sb.from('stock_attributions').insert({agent_id:ag?stockAgentId(fullName(ag)):null,agent_nom:nom,materiel_id:r.id,materiel_nom:r.nom,quantite:c.q,note,statut:'actif'}));}
    toast('📤 Sortie enregistrée → '+nom);CART=[];F={};reload();tab('retour');
  }catch(e){toast(errTxt(e),'err');reload();}
}

// ═══ RETOUR ═══
function holders(){const H={};actives().forEach(a=>{const k=a.agent_nom||'?';const d=a.date_sortie||a.created_at;(H[k]=H[k]||{label:k,agent:!String(k).startsWith('🎯'),items:[],since:d}).items.push(a);if(new Date(d)<new Date(H[k].since))H[k].since=d;});return Object.values(H).sort((a,b)=>a.label.localeCompare(b.label,'fr'));}
function noteGet(n,k){const m=String(n||'').split('\n').find(l=>l.startsWith(k+' : '));return m?m.slice(k.length+3):'';}
function rRetour(){
  const H=holders().filter(h=>!F.q||norm(h.label+' '+h.items.map(a=>a.materiel_nom+' '+a.note).join(' ')).includes(norm(F.q)));
  return `<h2>Retour de matériel</h2><div class="sub">Matériel actuellement sorti. Touchez une personne / une mission pour enregistrer le retour (tout ou partie).</div>
  <input class="fi" placeholder="🔍 Agent, mission, article…" value="${esc(F.q||'')}" onchange="F.q=this.value;render()" style="margin-bottom:12px">
  ${H.length?H.map((h,i)=>`<div class="card"><div class="row click" onclick="retSheet(${holders().findIndex(x=>x.label===h.label)})"><div class="ic">${h.agent?'👤':'🎯'}</div><div class="g"><div class="t">${esc(h.label)}</div><div class="s">depuis ${ago(h.since)}</div></div><button class="btn sm ok">📥 Retour</button></div>
    ${h.items.map(a=>`<div class="row"><div class="ic">${esc((rowById(a.materiel_id)||{}).icon||'📦')}</div><div class="g"><div class="t">${a.quantite} × ${esc(parse({nom:a.materiel_nom}).art)}</div><div class="s">${esc([noteGet(a.note,'Mission'),noteGet(a.note,'Départ')&&'départ : '+noteGet(a.note,'Départ'),fDT(a.date_sortie)].filter(Boolean).join(' · '))}</div></div></div>`).join('')}</div>`).join('')
  :'<div class="card"><div class="empty">✅ Tout le matériel est rentré.</div></div>'}`;
}
function retSheet(hi){
  const h=holders()[hi];if(!h)return;
  sheet(`<h3>📥 Retour — ${esc(h.label)}</h3><div class="sub">Indiquez ce qui revient, son état et où il est rangé.</div>
    ${h.items.map((a,i)=>{const r=rowById(a.materiel_id);const p=r||parse({nom:a.materiel_nom});return `<div class="card pad" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(p.art)}</b><span class="mini" style="font-size:12px;color:var(--muted)">${a.quantite} sorti(s)</span></div>
      <div class="fr"><div><label class="fl">Quantité rendue</label>${qtyField('rt-q'+i,a.quantite,a.quantite)}</div><div><label class="fl">État au retour</label><select class="fi" id="rt-e${i}">${etatOpts('bon')}</select></div></div>
      <label class="fl">Commentaire</label><input class="fi" id="rt-c${i}" placeholder="Obligatoire si défectueux">
      ${locSelect('rt'+i,p.site||'',p.local||'')}</div>`;}).join('')}
    <button class="btn full ok" onclick="doRetour(${hi})">✅ Enregistrer le retour</button><button class="btn full g" onclick="closeSheet()">Annuler</button>`);
}
async function doRetour(hi){
  const h=holders()[hi];const now=new Date().toISOString();let pb=0;
  // vérifications avant écriture
  const lines=h.items.map((a,i)=>({a,n:parseInt($('rt-q'+i).value)||0,e:etat($('rt-e'+i).value),c:$('rt-c'+i).value.trim(),s:$('rt'+i+'-site').value,l:$('rt'+i+'-local').value})).filter(x=>x.n>0);
  for(const x of lines){if(x.n>x.a.quantite)return toast('Quantité trop grande pour '+parse({nom:x.a.materiel_nom}).art,'err');if(!x.s||!x.l)return toast('Choisissez où ranger '+parse({nom:x.a.materiel_nom}).art,'err');if(x.e.panne&&!x.c)return toast('Décrivez le problème ('+x.e.label+')','err');}
  if(!lines.length)return toast('Rien à rendre','err');
  try{
    for(const x of lines){const a=x.a;const orig=rowById(a.materiel_id);const art=orig?orig.art:parse({nom:a.materiel_nom}).art;
      const dest=await ensureRow(art,x.s,x.l);
      const retNote=(a.note?a.note+'\n':'')+'Retour : '+x.e.label+(x.c?' — '+x.c:'')+' (par '+ME.nom+')';
      if(x.n===a.quantite)await q(sb.from('stock_attributions').update({statut:'rendu',date_retour:now,etat_retour:x.e.label,note:retNote}).eq('id',a.id));
      else{await q(sb.from('stock_attributions').update({quantite:a.quantite-x.n}).eq('id',a.id));
        await q(sb.from('stock_attributions').insert({agent_id:a.agent_id,agent_nom:a.agent_nom,materiel_id:a.materiel_id,materiel_nom:a.materiel_nom,quantite:x.n,note:retNote,statut:'rendu',date_sortie:a.date_sortie,date_retour:now,etat_retour:x.e.label}));}
      if(orig&&String(orig.id)!==String(dest.id)){await bump(orig,-x.n,0);await bump(dest,x.n,x.e.stock?x.n:0);}
      else await bump(dest,0,x.e.stock?x.n:0);
      if(x.e.panne){pb+=x.n;await q(sb.from('stock_maintenances').insert({materiel_nom:dest.nom,type_probleme:'panne',description:`${x.n} × ${art} — ${x.e.label} : ${x.c} (retour de ${a.agent_nom})`,agent_id:stockAgentId(ME.nom),agent_nom:ME.nom,statut:'ouvert'}));}
    }
    closeSheet();toast('📥 Retour enregistré'+(pb?' — '+pb+' pièce(s) signalée(s) en panne':''),pb?'err':'ok');reload();
  }catch(e){toast(errTxt(e),'err');reload();}
}

let INV=null;
function rInv(){
  if(INV)return rInvCount();
  return `<h2>Inventaire / état des lieux</h2><div class="sub">Comptez le matériel présent dans un local et notez combien de pièces sont défectueuses. Vous choisissez ensuite si le stock doit être corrigé (inventaire) ou seulement constaté (état des lieux).</div>
  <div class="card pad">${locSelect('iv',F.site||'',F.local||'')}<button class="btn full" onclick="invStart()">✅ Commencer</button></div>
  <div class="sec">Derniers inventaires</div><div id="inv-hist"><div class="empty">Chargement…</div></div>`;
}
async function invHist(){
  const box=$('inv-hist');if(!box)return;
  const sites=sitesList();const all=[];
  await Promise.all(sites.map(async s=>{try{const l=await sList('inventaires/'+slug(s));await Promise.all(l.slice(0,10).map(async n=>{try{all.push(await sGet('inventaires/'+slug(s)+'/'+n));}catch(e){}}));}catch(e){}}));
  all.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(!$('inv-hist'))return;
  $('inv-hist').innerHTML=all.length?`<div class="card">${all.slice(0,25).map(iv=>{const ec=(iv.lignes||[]).filter(l=>l.compte!==l.attendu).length,df=sum(iv.lignes||[],l=>l.defectueux);
    return `<div class="row"><div class="ic">${iv.corrige?'✅':'📋'}</div><div class="g"><div class="t">${esc(iv.site)} · ${esc(iv.local)}</div><div class="s">${fDT(iv.date)} · ${esc(iv.par||'')} · ${iv.corrige?'stock corrigé':'état des lieux'}${iv.commentaire?' · '+esc(iv.commentaire):''}</div></div><div class="r">${ec?`<span class="pill p-bad">${ec} écart(s)</span>`:'<span class="pill p-ok">Conforme</span>'}${df?`<span class="pill p-warn">${df} défect.</span>`:''}</div></div>`;}).join('')}</div>`:'<div class="card"><div class="empty">Aucun inventaire enregistré.</div></div>';
}
function invStart(){const s=$('iv-site').value,l=$('iv-local').value;if(!s||!l)return toast('Choisissez le site et le local','err');
  const rows=located().filter(r=>r.site===s&&r.local===l);
  INV={site:s,local:l,lignes:rows.map(r=>({id:r.id,art:r.art,icon:r.icon,attendu:(r.quantite_total||0)-outOf(r.id),indispo0:indispo(r),compte:null,defectueux:0,com:''}))};render();}
function rInvCount(){
  const L=INV.lignes;const done=L.filter(x=>x.compte!=null).length;
  return `<h2>${esc(INV.site)} · ${esc(INV.local)}</h2><div class="sub">Attendu = pièces qui devraient être dans ce local (hors matériel sorti). ${done}/${L.length} compté(s).</div>
  ${L.length?L.map((x,i)=>`<div class="card pad" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(x.icon||'📦')} ${esc(x.art)}</b><span class="pill p-mut">attendu ${x.attendu}${x.indispo0?' (dont '+x.indispo0+' indispo)':''}</span></div>
    <div class="fr"><div><label class="fl">Présents</label><input class="fi" type="number" min="0" inputmode="numeric" value="${x.compte==null?'':x.compte}" placeholder="—" onchange="INV.lignes[${i}].compte=this.value===''?null:Math.max(0,parseInt(this.value)||0);render()"></div>
    <div><label class="fl">Dont défectueux / HS</label><input class="fi" type="number" min="0" value="${x.defectueux||0}" onchange="INV.lignes[${i}].defectueux=Math.max(0,parseInt(this.value)||0);render()"></div></div>
    <input class="fi" style="margin-top:8px" placeholder="Commentaire (état, problème…)" value="${esc(x.com)}" onchange="INV.lignes[${i}].com=this.value">
    ${x.compte!=null&&x.compte!==x.attendu?`<div style="margin-top:8px"><span class="pill p-bad">Écart ${x.compte>x.attendu?'+':''}${x.compte-x.attendu}</span></div>`:x.compte!=null?'<div style="margin-top:8px"><span class="pill p-ok">Conforme</span></div>':''}</div>`).join('')
  :'<div class="card"><div class="empty">Aucun article attendu dans ce local.</div></div>'}
  <div class="card pad"><label class="fl first">Commentaire général</label><input class="fi" id="iv-com">
    <label style="display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:13px"><input type="checkbox" id="iv-fix" checked style="width:20px;height:20px;flex-shrink:0"><span><b>Corriger le stock</b> avec ces chiffres (inventaire). Décochez pour un simple <b>état des lieux</b>.</span></label>
    <label style="display:flex;gap:9px;align-items:flex-start;margin-top:10px;font-size:13px"><input type="checkbox" id="iv-pan" checked style="width:20px;height:20px;flex-shrink:0"><span>Créer un signalement de panne pour les pièces défectueuses nouvellement constatées</span></label>
    <button class="btn full ok" onclick="invSave()">Enregistrer</button><button class="btn full g" onclick="INV=null;render()">Abandonner</button></div>`;
}
async function invSave(){
  const L=INV.lignes;if(L.some(x=>x.compte==null)&&!confirm('Certaines lignes ne sont pas comptées : elles seront ignorées. Continuer ?'))return;
  for(const x of L)if(x.compte!=null&&x.defectueux>x.compte)return toast('Défectueux > présents pour '+x.art,'err');
  const fix=$('iv-fix').checked,pan=$('iv-pan').checked;const rep={v:1,site:INV.site,local:INV.local,date:new Date().toISOString(),par:ME.nom,corrige:fix,commentaire:$('iv-com').value.trim()||null,
    lignes:L.filter(x=>x.compte!=null).map(x=>({id:x.id,article:x.art,attendu:x.attendu,compte:x.compte,defectueux:x.defectueux,commentaire:x.com||null}))};
  try{
    for(const x of L.filter(x=>x.compte!=null)){const r=rowById(x.id);
      if(fix){const out=outOf(r.id);const upd={quantite_total:x.compte+out,quantite_dispo:Math.max(0,x.compte-x.defectueux)};await q(sb.from('stock_materiel_items').update(upd).eq('id',r.id));
        if(x.compte!==x.attendu||x.defectueux!==x.indispo0)await log('inventaire',r.art,x.compte-x.attendu,`Inventaire ${INV.site} / ${INV.local} : compté ${x.compte} (attendu ${x.attendu}), défectueux ${x.defectueux}`);}
      if(pan&&x.defectueux>x.indispo0)await q(sb.from('stock_maintenances').insert({materiel_nom:r.nom,type_probleme:'panne',description:`${x.defectueux-x.indispo0} × ${r.art} défectueux constaté(s) à l'inventaire${x.com?' : '+x.com:''}`,agent_id:stockAgentId(ME.nom),agent_nom:ME.nom,statut:'ouvert'}));
    }
    try{await sPut('inventaires/'+slug(INV.site)+'/'+stamp()+'.json',rep);}catch(e){toast('Rapport non archivé : '+errTxt(e),'err');}
    toast(fix?'✅ Inventaire enregistré, stock corrigé':'📋 État des lieux enregistré');INV=null;F={};reload();
  }catch(e){toast(errTxt(e),'err');}
}

function rHist(){
  const ev=[];
  D.attr.forEach(a=>{ev.push({d:a.date_sortie,t:'📤 Sortie',x:`${a.quantite} × ${parse({nom:a.materiel_nom}).art} → ${a.agent_nom}`,s:[noteGet(a.note,'Mission'),noteGet(a.note,'Départ')&&'départ : '+noteGet(a.note,'Départ')].filter(Boolean).join(' · ')});
    if(a.statut==='rendu')ev.push({d:a.date_retour,t:'📥 Retour',x:`${a.quantite} × ${parse({nom:a.materiel_nom}).art} ← ${a.agent_nom}`,s:noteGet(a.note,'Retour')||a.etat_retour||''});});
  D.hist.forEach(h=>ev.push({d:h.created_at,t:{entree:'➕ Entrée',transfert:'🚚 Déplacement',inventaire:'✅ Inventaire',reparation:'🔧 Remis en service',commande:'🛒 Réception de commande',rebut:'🗑 Retiré du stock',declassement:'⚠️ Déclaré défectueux',reprise:'📥 Reprise'}[h.type_op]||h.type_op,x:`${h.quantite!=null?h.quantite+' × ':''}${h.article_nom||''}`,s:h.note||''}));

}

async function doReprise(id){

  if(r.error)throw r.error;const d=r.data||[];out=out.concat(d.map(f=>f.name).filter(n=>n&&n.endsWith('.json')));if(d.length<1000)break;off+=1000;}return out.sort().reverse();}

  BONS=(await Promise.all(Object.values(last).map(n=>sGet('commandes/'+n).catch(()=>null)))).filter(Boolean).sort((a,b)=>String(b.numero).localeCompare(String(a.numero)));}

function prepSel(id,v){const x=prepLoad().lignes.find(l=>l.id===id);if(x)x.sel=v;prepSave();render();}
function prepCompact(){const P=PREP;const used=P.bons.map((b,i)=>P.lignes.some(x=>x.bon===i));

function savePrepLine(id){const P=prepLoad();let a=$('pl-a').value,nouveau=false,icon;

    const ex=articlesList().find(z=>norm(z.nom)===norm(a));if(ex){a=ex.nom;icon=ex.icon||'📦';}else{nouveau=true;icon=$('pl-ico').value.trim()||'📦';}}

async function prepCreate(){const P=prepLoad();const groups=P.bons.map((b,i)=>({b,ls:P.lignes.filter(x=>x.bon===i)})).filter(g=>g.ls.length);

    P.lignes.forEach(x=>{const a=CFG.articles.find(z=>z.nom===x.art);
      if(!a){const r=D.rows.find(r=>r.art===x.art);CFG.articles.push({nom:x.art,icon:x.icon||(r&&r.icon)||'📦',seuil:r?r.seuil_alerte||0:0,prix:x.prix||0});chg=true;}
      else if(!a.prix&&x.prix){a.prix=x.prix;chg=true;}});
    if(chg)await saveCfg();
    const made=[];
    for(const g of groups){const now=new Date().toISOString();
      const b={v:1,numero:nextNumero(),fournisseur:g.b.fournisseur||'',note:g.b.note||'',statut:'preparation',cree_le:now,cree_par:ME.nom,
        lignes:g.ls.map(x=>({art:x.art,icon:x.icon||'📦',nouveau:!!x.nouveau,qte:x.qte,prix:x.prix||0,site:x.site||'',local:x.local||'',recu:0})),
        hist:[{statut:'preparation',le:now,par:ME.nom,note:null}]};
      await saveBon(b);made.push(b.numero);}
    PREP={bons:[{fournisseur:''}],lignes:[]};prepSave();toast('🧾 '+made.join(', ')+' enregistré(s)');F={};tab('cmd');
  }catch(e){toast(errTxt(e),'err');}}

// ── Détail, suivi, réception, impression ──
function bonSheet(nu){const b=BONS.find(x=>x.numero===nu);if(!b)return;const prep=b.statut==='preparation';const acts=[];
  if(b.statut==='preparation')acts.push(`<button class="btn full ok" onclick="validSheet('${esc(nu)}')">✔ Validé par la direction</button>`);
  if(b.statut==='valide')acts.push(`<button class="btn full" onclick="setSt('${esc(nu)}','envoyee')">📨 Commande envoyée</button>`);
  if(b.statut==='envoyee')acts.push(`<button class="btn full" onclick="setSt('${esc(nu)}','attente')">⏳ En attente de réception</button>`);
  if(['envoyee','attente'].includes(b.statut))acts.push(`<button class="btn full ok" onclick="recvSheet('${esc(nu)}')">📥 Réceptionner</button>`);
  sheet(`<h3>🧾 ${esc(b.numero)}</h3><div class="sub">${b.fournisseur?'Fournisseur : <b>'+esc(b.fournisseur)+'</b> · ':''}créé le ${fDT(b.cree_le)} par ${esc(b.cree_par||'?')}${b.valide_par?' · validé par '+esc(b.valide_par):''}</div>
   <div style="margin:4px 0 10px">${stPill(b)}</div>${b.note?`<div class="note">${esc(b.note)}</div>`:''}
   <div class="card"><div class="tscroll"><table class="t"><tr><th>Article</th><th>Qté</th><th>Reçu</th><th>Prix u.</th><th>Total</th></tr>
   ${b.lignes.map((x,i)=>`<tr><td>${esc(x.icon||'')} ${esc(x.art)}${x.nouveau?' <span class="pill p-warn">nouveau</span>':''}${x.site?`<div style="font-size:11.5px;color:var(--muted)">→ ${esc(x.site+' / '+x.local)}</div>`:''}</td>
     <td>${prep?`<input class="fi" style="width:70px;padding:6px" type="number" min="0" value="${x.qte}" onchange="editLine('${esc(nu)}',${i},'qte',this.value)">`:x.qte}</td><td>${x.recu||0}</td>
     <td>${prep?`<input class="fi" style="width:90px;padding:6px" type="number" min="0" step="0.05" value="${x.prix||0}" onchange="editLine('${esc(nu)}',${i},'prix',this.value)">`:chf(x.prix)}</td><td>${chf(x.qte*(x.prix||0))}</td></tr>`).join('')}
   <tr><td colspan="4"><b>Total</b></td><td><b>${chf(bonTotal(b))}</b></td></tr></table></div></div>
   ${prep?'<div class="hint" style="margin-bottom:10px">En préparation : quantités et prix modifiables (quantité 0 = ligne retirée).</div>':''}
   ${acts.join('')}<button class="btn full g" onclick="printBon('${esc(nu)}')">🖨 Imprimer / PDF</button>
   ${enCours(b)?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:var(--muted)">Autres actions (corriger le statut, annuler)</summary>
     <select class="fi" id="bs-st" style="margin-top:8px">${['preparation','valide','envoyee','attente','annulee'].map(k=>`<option value="${k}" ${k===b.statut?'selected':''}>${stLabel(k)}</option>`).join('')}</select>
     <button class="btn full g" onclick="setSt('${esc(nu)}',$('bs-st').value)">Appliquer ce statut</button></details>`:''}
   <div class="sec">Suivi du bon</div><div class="card">${(b.hist||[]).slice().reverse().map(h=>`<div class="row"><div class="g"><div class="t" style="font-weight:700">${esc(stLabel(h.statut))}</div><div class="s">${fDT(h.le)} · ${esc(h.par||'')}${h.note?' · '+esc(h.note):''}</div></div></div>`).join('')}</div>
   <button class="btn full g" onclick="closeSheet()">Fermer</button>`);}
async function editLine(nu,i,f,v){const b=BONS.find(x=>x.numero===nu);const x=b.lignes[i];
  if(f==='qte'){const n=parseInt(v)||0;if(n<1){if(!confirm('Retirer « '+x.art+' » du bon ?'))return bonSheet(nu);b.lignes.splice(i,1);}else x.qte=n;}
  else x.prix=Math.max(0,parseFloat(String(v).replace(',','.'))||0);
  if(!b.lignes.length)return toast('Un bon doit garder au moins une ligne (annulez-le plutôt)','err');
  try{await saveBon(b);bonSheet(nu);render();}catch(e){toast(errTxt(e),'err');}}
function validSheet(nu){sheet(`<h3>✔ Validation du bon ${esc(nu)}</h3><div class="sub">La validation est faite par la direction.</div>
  <label class="fl first">Validé par</label><input class="fi" id="va-n" placeholder="Nom de la personne de la direction"><label class="fl">Commentaire (facultatif)</label><input class="fi" id="va-c">
  <button class="btn full ok" onclick="if(!$('va-n').value.trim())return toast('Indiquez qui a validé','err');setSt('${esc(nu)}','valide',$('va-c').value.trim(),{valide_par:$('va-n').value.trim()})">Enregistrer la validation</button><button class="btn full g" onclick="bonSheet('${esc(nu)}')">Retour</button>`);}
async function setSt(nu,st,note,extra){const b=BONS.find(x=>x.numero===nu);if(!b||st===b.statut)return;
  if(st==='annulee'&&!confirm('Annuler le bon '+nu+' ? Il reste dans l\'historique.'))return;
  try{Object.assign(b,extra||{});await saveBon(b,st,note);toast('🧾 '+nu+' : '+stLabel(st));bonSheet(nu);render();}catch(e){toast(errTxt(e),'err');}}
function recvSheet(nu){const b=BONS.find(x=>x.numero===nu);
  sheet(`<h3>📥 Réception — ${esc(nu)}</h3><div class="sub">Indiquez les quantités reçues et où les ranger : le stock est mis à jour directement. Réception partielle possible : le bon reste « en attente » pour le reste.</div>
  ${b.lignes.map((x,i)=>{const rest=Math.max(0,x.qte-(x.recu||0));if(!rest)return `<div class="card pad"><b>${esc(x.icon||'')} ${esc(x.art)}</b> <span class="pill p-ok">entièrement reçu (${x.recu})</span></div>`;
    const loc=x.site?{site:x.site,local:x.local}:(located().find(r=>r.art===x.art)||{site:'',local:''});
    return `<div class="card pad"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(x.icon||'')} ${esc(x.art)}</b><span class="pill p-mut">${x.recu||0} / ${x.qte} reçu(s)</span></div>
     <div class="fr"><div><label class="fl">Reçu maintenant</label><input class="fi" type="number" min="0" max="${rest}" id="rv-q${i}" value="${rest}"></div><div><label class="fl">Prix unitaire (CHF)</label><input class="fi" type="number" min="0" step="0.05" id="rv-p${i}" value="${x.prix||0}"></div></div>
     ${locSelect('rv'+i,loc.site,loc.local)}</div>`;}).join('')}
  <button class="btn full ok" onclick="doRecv('${esc(nu)}')">✅ Confirmer la réception</button><button class="btn full g" onclick="bonSheet('${esc(nu)}')">Retour</button>`);}
async function doRecv(nu){const b=BONS.find(x=>x.numero===nu);const todo=[];
  for(let i=0;i<b.lignes.length;i++){const x=b.lignes[i];const rest=Math.max(0,x.qte-(x.recu||0));if(!rest||!$('rv-q'+i))continue;
    const n=parseInt($('rv-q'+i).value)||0;if(n<0||n>rest)return toast('Quantité invalide pour '+x.art,'err');if(!n)continue;
    const s=$('rv'+i+'-site').value,l=$('rv'+i+'-local').value;if(!s||!l)return toast('Choisissez le site et le local pour '+x.art,'err');
    todo.push({i,n,s,l,p:Math.max(0,parseFloat(String($('rv-p'+i).value).replace(',','.'))||0)});}
  if(!todo.length)return toast('Aucune quantité reçue','err');
  try{let chg=false;const now=new Date().toISOString();
    for(const t of todo){const x=b.lignes[t.i];
      let a=CFG.articles.find(z=>z.nom===x.art);
      if(!a){a={nom:x.art,icon:x.icon||artIcon(x.art)||'📦',seuil:0,prix:t.p};CFG.articles.push(a);chg=true;}
      else if(t.p&&a.prix!==t.p){a.prix=t.p;chg=true;}        // dernier prix d'achat → valorisation du stock
      const r=await ensureRow(x.art,t.s,t.l);await bump(r,t.n,t.n);
      await log('commande',x.art,t.n,`Bon ${b.numero}${b.fournisseur?' — '+b.fournisseur:''} — ${t.s} / ${t.l}`);
      x.recu=(x.recu||0)+t.n;x.prix=t.p;x.site=t.s;x.local=t.l;}
    if(chg){try{await saveCfg();}catch(e){}}
    const all=b.lignes.every(x=>(x.recu||0)>=x.qte),txt=todo.map(t=>t.n+' × '+b.lignes[t.i].art).join(', ');
    b.statut=all?'recue':'attente';(b.hist=b.hist||[]).push({statut:all?'recue':'reception',le:now,par:ME.nom,note:txt});
    await saveBon(b);closeSheet();toast(all?'✅ Bon réceptionné — stock mis à jour':'📥 Réception partielle enregistrée — stock mis à jour');reload();
  }catch(e){toast(errTxt(e),'err');}}
function printBon(nu){const b=BONS.find(x=>x.numero===nu);const logo=(document.querySelector('.logo img')||{}).src||'';const f=(CFG.fournisseurs||[]).find(z=>z.nom===b.fournisseur)||{};
  const w=window.open('','_blank');if(!w)return toast('Autorisez l\'ouverture de fenêtres pour imprimer','err');
  w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(b.numero)}</title><style>body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#102033;margin:32px;font-size:13px}h1{font-size:20px;margin:0}
  table{width:100%;border-collapse:collapse;margin-top:18px}th{background:#142130;color:#fff;text-align:left;padding:8px;font-size:11px;text-transform:uppercase}td{padding:8px;border-bottom:1px solid #dbe3ec}.r{text-align:right}
  .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #e3062c;padding-bottom:14px}.box{border:1px solid #dbe3ec;border-radius:8px;padding:10px 12px;margin-top:14px}@media print{body{margin:14mm}}</style></head><body>
  <div class="hd"><div>${logo?`<img src="${logo}" style="height:46px">`:''}<div style="margin-top:6px;font-weight:700">RDZ Security Management SA</div></div>
  <div style="text-align:right"><h1>Bon de commande</h1><div style="font-size:15px;font-weight:700;margin-top:4px">${esc(b.numero)}</div><div>Date : ${new Date(b.cree_le).toLocaleDateString('fr-CH')}</div><div>Statut : ${esc(stLabel(b.statut))}</div></div></div>
  <div class="box"><b>Fournisseur</b><br>${esc(b.fournisseur||'—')}${f.contact?'<br>'+esc(f.contact):''}${f.tel?'<br>'+esc(f.tel):''}${f.email?'<br>'+esc(f.email):''}</div>
  <table><tr><th>Article</th><th class="r">Quantité</th><th class="r">Prix unitaire</th><th class="r">Total</th></tr>${b.lignes.map(x=>`<tr><td>${esc(x.art)}</td><td class="r">${x.qte}</td><td class="r">${chf(x.prix)}</td><td class="r">${chf(x.qte*(x.prix||0))}</td></tr>`).join('')}
  <tr><td colspan="3" class="r"><b>Total</b></td><td class="r"><b>${chf(bonTotal(b))}</b></td></tr></table>
  ${b.note?`<div class="box"><b>Note</b><br>${esc(b.note)}</div>`:''}
  <div class="box" style="display:flex;justify-content:space-between;gap:20px"><div>Établi par : ${esc(b.cree_par||'')}</div><div>Validé par : ${esc(b.valide_par||'……………………………')}</div></div>
  <script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script></body></html>`);w.document.close();}

// ── Fournisseurs (Paramètres) ──
function fourSheet(i,cb){const f=i>=0?CFG.fournisseurs[i]:{nom:'',contact:'',tel:'',email:''};window._fourCb=cb||null;
  sheet(`<h3>${i>=0?'Fournisseur':'Nouveau fournisseur'}</h3><label class="fl first">Nom</label><input class="fi" id="fo-n" value="${esc(f.nom)}"><label class="fl">Contact</label><input class="fi" id="fo-c" value="${esc(f.contact||'')}">
  <div class="fr"><div><label class="fl">Téléphone</label><input class="fi" id="fo-t" value="${esc(f.tel||'')}"></div><div><label class="fl">E-mail</label><input class="fi" id="fo-e" value="${esc(f.email||'')}"></div></div>
  <button class="btn full" onclick="saveFour(${i})">Enregistrer</button>${i>=0?`<button class="btn full g" onclick="delFour(${i})">🗑 Retirer de la liste</button>`:''}<button class="btn full g" onclick="closeSheet();render()">Annuler</button>`);}
async function saveFour(i){const n=$('fo-n').value.trim();if(!n)return toast('Nom requis','err');CFG.fournisseurs=CFG.fournisseurs||[];
  if(CFG.fournisseurs.some((f,j)=>j!==i&&norm(f.nom)===norm(n)))return toast('Ce fournisseur existe déjà','err');
  const f={nom:n,contact:$('fo-c').value.trim(),tel:$('fo-t').value.trim(),email:$('fo-e').value.trim()};if(i>=0)CFG.fournisseurs[i]=f;else CFG.fournisseurs.push(f);
  try{await saveCfg();closeSheet();toast('Fournisseur enregistré');const cb=window._fourCb;window._fourCb=null;if(cb)cb(n);else render();}catch(e){toast(errTxt(e),'err');}}
async function delFour(i){if(!confirm('Retirer « '+CFG.fournisseurs[i].nom+' » de la liste ? (les anciens bons gardent son nom)'))return;CFG.fournisseurs.splice(i,1);try{await saveCfg();closeSheet();render();}catch(e){toast(errTxt(e),'err');}}

// ═══ FENÊTRE ═══
function sheet(h){$('sheet-root').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet">${h}</div></div>`;}
function closeSheet(){$('sheet-root').innerHTML='';}
const _render=render;render=function(){_render();if(T==='inv'&&!INV)invHist();};
init();
</script>
