<!DOCTYPE html>
<!-- RDZ · auto-evaluation (page agent) · v1 · 2026-11-05
     Ouverte par un lien personnel ?lien=… créé dans « Contrôle des compétences ».
     Lecture et enregistrement uniquement par les fonctions serveur
     autoeval_open / autoeval_submit (contrôle du lien : agent, durée, usage unique).
     Les réponses en cours sont gardées sur le téléphone jusqu'à l'envoi. -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Auto-évaluation des compétences — RDZ</title>
<style>
:root{--red:#c0272d;--red-l:#fdf0f1;--bg:#f5f4f2;--white:#fff;--border:#e2e0dd;--text:#1a1917;--text2:#5a5753;--text3:#9a9794;
  --green:#16a34a;--green-l:#f0fdf4;--orange:#d97706;--orange-l:#fffbeb;--radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
header{background:#1b2537;color:#fff;padding:14px 16px;border-bottom:3px solid var(--red);position:sticky;top:0;z-index:5}
header b{display:block;font-size:13px;letter-spacing:.6px}
header span{font-size:12.5px;opacity:.85}
.prog{height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#4ade80;transition:width .2s}
main{max-width:640px;margin:0 auto;padding:16px 14px 110px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
h1{font-size:19px;margin-bottom:6px}
.lead{color:var(--text2);font-size:14px}
.legend{display:grid;gap:6px;margin-top:10px;font-size:13.5px}
.legend div{display:flex;gap:8px;align-items:flex-start}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin:20px 2px 8px}
.item{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.item.done{border-color:#cfe9d6}
.item .lib{font-weight:600;font-size:14.5px}
.item .doc{font-size:12px;color:var(--text3);margin-top:3px}
.ind{display:inline-block;font-size:10.5px;font-weight:700;color:#7a4300;background:#fff4e0;border:1px solid #e08a00;border-radius:10px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.choices{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;margin-top:10px}
.choices button{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:10px 4px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;min-height:44px}
.choices button.on[data-v=S]{background:var(--green-l);border-color:var(--green);color:var(--green)}
.choices button.on[data-v=J]{background:var(--red-l);border-color:var(--red);color:var(--red)}
.choices button.on[data-v=P]{background:var(--orange-l);border-color:var(--orange);color:#92400e}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar small{flex:1;color:var(--text2);font-size:12.5px}
.btn{border:0;border-radius:10px;padding:13px 18px;font-size:15px;font-weight:700;background:var(--red);color:#fff;cursor:pointer}
.btn:disabled{background:#d6d3cf;cursor:not-allowed}
.msg{text-align:center;padding:40px 18px}
.msg .ic{font-size:44px;margin-bottom:8px}
.err{background:var(--red-l);border:1px solid #f3c2c5;color:var(--red);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--bg);border-radius:10px;padding:10px 4px;text-align:center;font-size:12px;color:var(--text2)}
.stats b{display:block;font-size:22px;color:var(--text)}
ul.docs{margin:8px 0 0 18px;font-size:13.5px}
ul.docs li{margin-bottom:5px}
.hidden{display:none!important}
</style>
</head>
<body>
<header><b>RDZ SECURITY MANAGEMENT</b><span id="h-sub">Auto-évaluation des compétences</span><div class="prog hidden" id="prog"><i id="prog-i"></i></div></header>
<main id="main"><div class="msg"><div class="ic">⏳</div>Chargement…</div></main>
<div class="bar hidden" id="bar"><div class="in"><small id="bar-txt"></small><button class="btn" id="send" disabled onclick="envoyer()">Envoyer</button></div></div>
<script>
const SB_URL = 'https://trdhtlcenmjlcvzuplid.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGh0bGNlbm1qbGN2enVwbGlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NTE2NzQsImV4cCI6MjA5MjAyNzY3NH0.8r-ITHC-w28vQ4_FKI6Hbwg4AYVqYR0i-69_oHSD5DU';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN = new URLSearchParams(location.search).get('lien') || '';
const DRAFT = 'rdz_autoeval_' + TOKEN.slice(0, 16);
let data = null, rep = {};
const ERR = {
  LIEN_INVALIDE: ['🔗', 'Lien non valable', 'Ce lien n\'existe pas. Vérifiez qu\'il est complet, ou demandez-en un nouveau à votre formateur.'],
  LIEN_ANNULE:   ['✕', 'Lien annulé', 'Ce lien a été annulé par votre formateur. Demandez-lui un nouveau lien.'],
  LIEN_UTILISE:  ['✓', 'Déjà envoyée', 'Cette auto-évaluation a déjà été envoyée. Merci ! Votre formateur reviendra vers vous.'],
  LIEN_EXPIRE:   ['⌛', 'Lien expiré', 'Le délai pour répondre est dépassé. Demandez un nouveau lien à votre formateur.']
};
async function call(fn, body){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:SB_KEY, Authorization:'Bearer '+SB_KEY }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || ('Erreur ' + r.status));
  return j;
}
function fail(e){
  const code = Object.keys(ERR).find(k => String(e && e.message).includes(k));
  const m = code ? ERR[code] : ['⚠', 'Connexion impossible', 'Vérifiez votre connexion internet puis rechargez la page. (' + esc(e && e.message) + ')'];
  $('bar').classList.add('hidden'); $('prog').classList.add('hidden');
  $('main').innerHTML = `<div class="card msg"><div class="ic">${m[0]}</div><h1>${m[1]}</h1><p class="lead">${m[2]}</p></div>`;
}
function items(){ return data.sections.flatMap(s => s.items || []); }
async function init(){
  if (!TOKEN) return fail(new Error('LIEN_INVALIDE'));
  try { data = await call('autoeval_open', { p_token: TOKEN }); } catch(e){ return fail(e); }
  try { rep = JSON.parse(localStorage.getItem(DRAFT) || '{}'); } catch(_) { rep = {}; }
  const ids = new Set(items().map(i => i.id)); Object.keys(rep).forEach(k => { if (!ids.has(k)) delete rep[k]; });
  $('h-sub').textContent = data.agent_name + ' · ' + data.campagne;
  render();
}
function render(){
  let h = `<div class="card"><h1>Bonjour ${esc(data.agent_name)}</h1>
    <p class="lead">Pour chaque compétence, répondez franchement. Il n'y a pas de piège : cette grille sert à organiser votre formation sur site.</p>
    <div class="legend">
      <div><b style="color:var(--green)">Oui</b><span>je sais le faire seul.</span></div>
      <div><b style="color:var(--red)">Non</b><span>je ne sais pas encore le faire.</span></div>
      <div><b style="color:#92400e">Je sais où trouver</b><span>je ne le connais pas par cœur, mais je sais où se trouve la procédure.</span></div>
    </div>
    <p class="lead" style="margin-top:10px;font-size:12.5px">Les compétences marquées <span class="ind">indispensable</span> sont prioritaires. Lien valable jusqu'au ${new Date(data.expires_at).toLocaleString('fr-CH',{dateStyle:'short',timeStyle:'short'})}. Vos réponses restent sur ce téléphone jusqu'à l'envoi.</p></div>`;
  data.sections.forEach(s => {
    h += `<div class="sec">${esc(s.titre)}</div>`;
    (s.items||[]).forEach(i => {
      const v = rep[i.id];
      h += `<div class="item ${v?'done':''}" id="it-${i.id}"><div class="lib">${esc(i.libelle)}${i.indispensable?'<span class="ind">indispensable</span>':''}</div>
        ${i.document?`<div class="doc">📄 ${esc(i.document)}</div>`:''}
        <div class="choices" data-id="${i.id}">
          <button data-v="S" class="${v==='S'?'on':''}">Oui</button>
          <button data-v="J" class="${v==='J'?'on':''}">Non</button>
          <button data-v="P" class="${v==='P'?'on':''}">Je sais où trouver</button>
        </div></div>`;
    });
  });
  h += '<div id="send-err"></div>';
  $('main').innerHTML = h;
  $('bar').classList.remove('hidden'); $('prog').classList.remove('hidden');
  progress();
}
$('main').addEventListener('click', e => {
  const b = e.target.closest('.choices button'); if (!b) return;
  const box = b.parentElement, id = box.dataset.id;
  rep[id] = b.dataset.v;
  box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
  $('it-' + id).classList.add('done');
  try { localStorage.setItem(DRAFT, JSON.stringify(rep)); } catch(_) {}
  progress();
});
function progress(){
  const all = items(), n = all.filter(i => rep[i.id]).length;
  $('prog-i').style.width = (100 * n / all.length) + '%';
  $('bar-txt').textContent = n === all.length ? 'Tout est rempli. Vous pouvez envoyer.' : `${n} / ${all.length} réponses`;
  $('send').disabled = n !== all.length;
}
async function envoyer(){
  const all = items();
  const miss = all.find(i => !rep[i.id]);
  if (miss) { $('it-' + miss.id).scrollIntoView({ behavior:'smooth', block:'center' }); return; }
  if (!confirm('Envoyer votre auto-évaluation ? Vous ne pourrez plus la modifier.')) return;
  const b = $('send'); b.disabled = true; b.textContent = 'Envoi…';
  try {
    const r = await call('autoeval_submit', { p_token: TOKEN, p_reponses: all.map(i => ({ competence_id: i.id, valeur: rep[i.id] })) });
    try { localStorage.removeItem(DRAFT); } catch(_) {}
    const docs = [], seen = new Set();
    all.filter(i => rep[i.id] !== 'S' && i.document).forEach(i => { if (!seen.has(i.document)) { seen.add(i.document); docs.push(i.document); } });
    $('bar').classList.add('hidden'); $('prog').classList.add('hidden');
    $('main').innerHTML = `<div class="card msg" style="padding:24px 16px"><div class="ic">✅</div><h1>Merci, c'est envoyé</h1>
      <p class="lead">Votre formateur va reprendre avec vous les points à travailler.</p>
      <div class="stats"><div><b>${r.oui}</b>Oui</div><div><b>${r.procedure}</b>Je sais où trouver</div><div><b>${r.non}</b>Non</div></div>
      ${docs.length ? `<div style="text-align:left"><b style="font-size:14px">Documents à relire en attendant :</b><ul class="docs">${docs.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>` : ''}
    </div>`;
    window.scrollTo(0, 0);
  } catch(e){
    b.disabled = false; b.textContent = 'Envoyer';
    if (/LIEN_/.test(e.message)) return fail(e);
    $('send-err').innerHTML = `<div class="err">Envoi impossible : ${esc(e.message)}. Vos réponses sont conservées sur ce téléphone, réessayez dans un instant.</div>`;
  }
}
init();
</script>
</body>
</html>
