<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning — RDZ Security Management</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c0272d;--accent-hover:#a31f24;--anthracite:#2d2d2d;
  --bg:#f5f4f2;--bg2:#eeecea;--white:#fff;
  --border:#e2e0dd;--border2:#d0cec9;
  --text:#1a1917;--text2:#5a5753;--text3:#9a9794;
  --green:#16a34a;--green-l:#f0fdf4;
  --orange:#d97706;--orange-l:#fffbeb;
  --blue:#2563eb;--blue-l:#eff6ff;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
a{color:var(--red);}

/* ── LOGIN ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--white);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:380px;overflow:hidden;}
.login-head{background:var(--red);padding:28px;color:#fff;text-align:center;}
.login-logo{width:44px;height:44px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:-1px;margin:0 auto 12px;}
.login-title{font-family:'DM Serif Display';font-size:22px;}
.login-sub{font-size:12px;opacity:.8;margin-top:2px;}
.login-body{padding:26px 28px 28px;}
.fg{margin-bottom:14px;}
.flabel{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.finp,.fsel,.ftxt{width:100%;padding:11px 13px;border:1.5px solid var(--border2);border-radius:9px;background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;}
.finp:focus,.fsel:focus,.ftxt:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,39,45,.08);}
.btn{padding:10px 16px;border-radius:9px;border:none;font-weight:600;font-size:13.5px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-primary:disabled{background:var(--border2);cursor:not-allowed;}
.btn-ghost{background:var(--bg2);color:var(--text2);}
.btn-ghost:hover{background:var(--border);}
.btn-success{background:var(--green);color:#fff;}
.btn-danger{background:#fef2f2;color:#b91c1c;}
.btn-danger:hover{background:#fee2e2;}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-block{width:100%;justify-content:center;}
.login-err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;display:none;}

/* ── APP SHELL (sidebar layout) ── */
#app{display:none;min-height:100vh;flex-direction:row;}
.sidebar{background:var(--red);width:220px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:200;}
.sidebar-brand{display:flex;align-items:center;gap:9px;color:#fff;padding:16px 16px 14px;}
.sidebar-logo{width:28px;height:28px;background:rgba(255,255,255,.2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;letter-spacing:-1px;flex-shrink:0;}
.sidebar-title{font-family:'DM Serif Display';font-size:16px;line-height:1;}
.sidebar-sub{font-size:9.5px;opacity:.75;text-transform:uppercase;letter-spacing:.5px;}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;padding:4px 10px;}
.snav-btn{background:transparent;color:rgba(255,255,255,.85);border:none;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:left;white-space:nowrap;transition:all .15s;}
.snav-btn:hover{background:rgba(255,255,255,.16);}
.snav-btn.active{background:#fff;color:var(--red);}
.sidebar-foot{padding:12px 10px 16px;display:flex;flex-direction:column;gap:8px;}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex-shrink:0;}
.sync-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);color:#fff;font-size:11.5px;padding:5px 10px;border-radius:20px;cursor:default;}
.user-pill{background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;width:100%;}
.user-pill:hover{background:rgba(255,255,255,.25);}
.sidebar-toggle{display:none;position:fixed;top:12px;left:12px;z-index:210;background:var(--red);color:#fff;border:none;width:38px;height:38px;border-radius:9px;font-size:17px;cursor:pointer;box-shadow:var(--shadow);}
.sidebar-scrim{display:none;}

.app-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.content{flex:1;padding:20px;max-width:1400px;width:100%;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}

.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.ph-title{font-family:'DM Serif Display';font-size:22px;}
.ph-sub{font-size:12.5px;color:var(--text3);margin-top:2px;}
.ph-right{display:flex;gap:8px;flex-wrap:wrap;}

.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .15s;position:relative;}
.kpi:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:var(--shadow);}
.kpi-val{font-family:'DM Serif Display';font-size:26px;line-height:1;}
.kpi-label{font-size:12px;font-weight:600;color:var(--text2);margin-top:6px;}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.kpi.neutral .kpi-val{color:var(--anthracite);}
.kpi.green .kpi-val{color:var(--green);}
.kpi.blue .kpi-val{color:var(--blue);}
.kpi.red .kpi-val{color:var(--red);}
.kpi.orange .kpi-val{color:var(--orange);}

.sbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.sw{position:relative;flex:1;min-width:180px;}
.sw-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text3);}
.sw .inp{width:100%;padding:9px 12px 9px 30px;border:1.5px solid var(--border2);border-radius:9px;background:#fff;}
.sel{padding:9px 12px;border:1.5px solid var(--border2);border-radius:9px;background:#fff;color:var(--text);}
.count{font-size:11.5px;color:var(--text3);margin:2px 0 10px;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:8px 10px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--border);}
td{padding:8px 10px;border-bottom:1px solid #f0eeeb;font-size:12.5px;vertical-align:middle;}
.tbl-wrap{overflow-x:auto;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
.badge-green{background:var(--green-l);color:#15803d;}
.badge-orange{background:var(--orange-l);color:#b45309;}
.badge-red{background:#fef2f2;color:#b91c1c;}
.badge-blue{background:var(--blue-l);color:#1d4ed8;}
.badge-grey{background:var(--bg2);color:var(--text2);}

/* Agents & sites cards */
.agents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.agent-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .15s;}
.agent-card:hover{border-color:var(--red);box-shadow:var(--shadow);}
.agent-card .ac-name{font-weight:700;font-size:13px;}
.agent-card .ac-meta{font-size:10.5px;color:var(--text3);margin-top:2px;}
.agent-card .ac-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:6px;}
.agent-card .ac-passport{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;}

.sites-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.site-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .15s;}
.site-card:hover{border-color:var(--red);box-shadow:var(--shadow);}
.site-card .sc-name{font-weight:700;font-size:13px;}
.site-card .sc-meta{font-size:10.5px;color:var(--text3);margin-top:2px;}

/* Planning — liste (Heures & présences réutilise ces classes) */
.plan-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.shift-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid #f0eeeb;font-size:12.5px;cursor:pointer;}
.shift-row:hover{background:var(--bg);}
.shift-time{font-family:'DM Mono';font-size:11.5px;color:var(--text2);width:100px;flex-shrink:0;}
.shift-site{width:150px;flex-shrink:0;color:var(--text3);font-size:11px;}
.shift-agent{flex:1;font-weight:600;}

/* Planning — grille site/poste × jours */
.calendar-scroll{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff;max-height:74vh;-webkit-overflow-scrolling:touch;}
.calendar{display:grid;}
.calendar .cell{border-right:1px solid #f0eeeb;border-bottom:1px solid #f0eeeb;padding:5px;min-height:52px;font-size:11px;box-sizing:border-box;}
.calendar .cell.corner{background:var(--bg2);font-weight:700;font-size:11.5px;position:relative;z-index:4;display:flex;align-items:center;box-shadow:2px 0 5px -2px rgba(0,0,0,.18);}
.calendar .cell.day-header{background:var(--bg2);text-align:center;font-weight:700;font-size:11px;position:relative;z-index:3;color:var(--text2);}
.calendar .cell.day-header.is-today{color:var(--red);}
.calendar .cell.row-label{background:#fbfaf9;font-size:11px;position:relative;z-index:2;line-height:1.3;box-shadow:2px 0 5px -2px rgba(0,0,0,.18);}
.calendar .cell.shift-cell.is-today{background:#fff7f0;}
.calendar .cell.shift-cell.drag-over{background:#fff0ef;outline:2px dashed var(--red);outline-offset:-2px;}
.shift-chip{background:#fff;border:1px solid var(--border2);border-left:3px solid var(--text3);border-radius:6px;padding:3px 5px;font-size:10.5px;margin-bottom:3px;cursor:grab;line-height:1.25;}
.shift-chip:hover{box-shadow:var(--shadow);}
.shift-chip:active{cursor:grabbing;}
.shift-chip .sc-time{font-family:'DM Mono';color:var(--text2);}
.shift-chip .sc-agent{font-weight:600;}
.shift-chip .sc-desc{color:var(--text3);font-size:9.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.shift-chip.no-agent{border-left-color:var(--red);}
.shift-chip.no-agent .sc-agent{color:var(--red);}
.shift-chip.status-publiee{border-left-color:var(--blue);}
.shift-chip.status-vue{border-left-color:#7c3aed;}
.shift-chip.status-validee{border-left-color:var(--green);}
.shift-chip.status-effectuee{border-left-color:var(--orange);}
.shift-chip.status-controlee{border-left-color:#15803d;background:#f7fdf9;}
.cell-add{font-size:15px;color:var(--border2);text-align:center;cursor:pointer;line-height:1.4;}
.cell-add:hover{color:var(--red);}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,18,16,.5);z-index:500;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-family:'DM Serif Display';font-size:17px;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text3);}
.modal-body{padding:18px 20px;}
.modal-actions{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fg.full{grid-column:1/-1;}
.modal-err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;display:none;}
.checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;}
.hint{font-size:11px;color:var(--text3);margin-top:4px;}
.sep{height:1px;background:var(--border);margin:14px 0;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--anthracite);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);z-index:900;display:none;}
.toast.error{background:#b91c1c;}
.toast.show{display:block;}

.empty{text-align:center;padding:36px 16px;color:var(--text3);font-size:13px;}
.demo-badge{background:#fef3c7;color:#92400e;}

@media(max-width:880px){
  .fgrid{grid-template-columns:1fr;}
  .sidebar-toggle{display:block;}
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s ease;width:240px;z-index:250;}
  .sidebar.open{transform:translateX(0);}
  .sidebar.open ~ .sidebar-scrim{display:block;}
  .sidebar-scrim{position:fixed;inset:0;background:rgba(20,18,16,.4);z-index:220;}
  .content{padding:16px;padding-top:60px;}
}
</style>

<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login-screen">

// ── UTILS ───────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uuid(){ return crypto.randomUUID(); }
function todayISO(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Zurich'}); }
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d+'T12:00:00Z').toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return d; } }
// Full date+time (used for seen_at/accepted_at/checked_at, which are real
// timestamps, unlike the plain YYYY-MM-DD dates fmtDate handles).
function fmtDateTime(iso){
  if(!iso) return null;
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Zurich'})
      + ' à ' + d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Zurich'});
  }catch(e){ return iso; }
}
function fmtHours(mins){ if(!Number.isFinite(mins)) return '—'; const h=Math.floor(Math.abs(mins)/60), m=Math.round(Math.abs(mins)%60); return (mins<0?'-':'')+h+'h'+String(m).padStart(2,'0'); }
function normalizeName(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''); }

// Legacy agents (created before the nom/prenom split existed, or not yet re-synced) are stored
// with only a single free-text "name" field (usually "Prénom Nom"). We split heuristically:
// last word = nom, everything before = prénom. Agents with real separate .nom/.prenom fields
// (from RH sync or created/edited via the agent form) use those directly — see getNomPrenom().
function splitName(name){
  const parts = String(name||'').trim().split(/\s+/);
  if(parts.length<2) return { prenom:'', nom: parts[0]||'' };
  const nom = parts[parts.length-1];
  const prenom = parts.slice(0,-1).join(' ');
  return { prenom, nom };
}
// Returns { prenom, nom } for an agent object, preferring the real stored fields and
// falling back to the heuristic split of the concatenated name for legacy agents.
function getNomPrenom(agent){
  if(agent && agent.nom) return { nom: agent.nom, prenom: agent.prenom||'' };
  return splitName(agent? agent.name : '');
}
function displayNomPrenom(agent){ const {prenom,nom}=getNomPrenom(agent); return prenom? (nom+' '+prenom) : nom; }
function sortKeyNom(agent){ return normalizeName(getNomPrenom(agent).nom); }
function sortAgentsByNom(list){ return [...list].sort((a,b)=> sortKeyNom(a).localeCompare(sortKeyNom(b)) || normalizeName(a.name).localeCompare(normalizeName(b.name))); }
function sortSitesByName(list){ return [...list].sort((a,b)=> a.name.localeCompare(b.name,'fr')); }
function isDemoAgent(a){ return !a.rhAgentId && a.source!=='supabase-rh' && /^a[0-9]$/.test(a.id) && DEMO_NAMES.includes(a.name); }
function isDemoShift(s){ return /^(s\d|open\d|past\d)/.test(s.id||''); }

function agentById(id){ return (STATE?.agents||[]).find(a=>a.id===id); }
function siteById(id){ return (STATE?.sites||[]).find(s=>s.id===id); }
function clientById(id){ return (STATE?.clients||[]).find(c=>c.id===id); }
function agentLabel(id){ const a=agentById(id); return a? displayNomPrenom(a) : (id? 'Agent introuvable' : 'À affecter'); }
function siteLabel(id){ const s=siteById(id); return s? s.name : id; }

// Contract-based weekly/annual objectives. Falls back to manually stored weekly/annual
// when there is no monthly contract value (locally-created agents without RH sync).
function computeObjectives(agent){
  const monthly = agent.monthly;
  if(Number.isFinite(monthly) && monthly>0){
    const annual = Math.round(monthly*12);
    const weekly = Math.round((annual/52)*10)/10;
    return { weekly, annual, source:'contrat' };
  }
  return { weekly: agent.weekly||0, annual: agent.annual||0, source:'manuel' };
}

function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError?' error':'');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className='toast'; }, 3800);
}

// ── REST/RPC HELPER LAYER ──────────────────────────────────────
// Every call here is a plain native fetch to Supabase's auto-generated
// PostgREST API — never supabase-js. Reads go to /rest/v1/<table>?<query>
// (row visibility is enforced server-side by RLS, see rdz_planning_schema.sql).
// Every mutation goes to /rest/v1/rpc/<function>, which runs a SECURITY
// DEFINER Postgres function that performs its own permission and
// business-rule checks (status transitions, uniqueness, cascades, audit
// logging) — exactly what the old Edge Function's dispatcher did, just
// running as SQL instead of as a hand-deployed Deno script.
function authHeaders(extra){
  return Object.assign({ apikey:SUPA_ANON, Authorization:'Bearer '+currentToken }, extra||{});
}
async function restSelect(table, query){
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+(query?('?'+query):''), { headers: authHeaders() });
  const data = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((data&&(data.message||data.error))||('Lecture impossible : '+table));
  return data||[];
}
async function restInsert(table, rows){
  const r = await fetch(SUPA_URL+'/rest/v1/'+table, {
    method:'POST',
    headers: authHeaders({ 'content-type':'application/json', Prefer:'return=representation' }),
    body: JSON.stringify(rows)
  });
  const data = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((data&&(data.message||data.error))||('Écriture impossible : '+table));
  return data;
}
async function restUpdate(table, filterQuery, patch){
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?'+filterQuery, {
    method:'PATCH',
    headers: authHeaders({ 'content-type':'application/json', Prefer:'return=representation' }),
    body: JSON.stringify(patch)
  });
  const data = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((data&&(data.message||data.error))||('Mise à jour impossible : '+table));
  return data;
}
async function restDelete(table, filterQuery){
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?'+filterQuery, { method:'DELETE', headers: authHeaders() });
  if(!r.ok){ const data = await r.json().catch(()=>null); throw new Error((data&&(data.message||data.error))||('Suppression impossible : '+table)); }
}
async function rpc(name, args){
  const r = await fetch(SUPA_URL+'/rest/v1/rpc/'+name, {
    method:'POST',
    headers: authHeaders({ 'content-type':'application/json' }),
    body: JSON.stringify(args||{})
  });
  const data = await r.json().catch(()=>null);
  if(!r.ok){
    const msg = (data&&(data.message||data.error_description||data.error))||'Action impossible';
    throw new Error(msg.replace(/^ERROR:\s*/,''));
  }
  return data;
}

// ── STATE ASSEMBLER ─────────────────────────────────────────
// Rebuilds the exact STATE shape the (unchanged) render functions below
// expect, out of the normalized tables. This is the only place that knows
// about the new DB column names — every renderer keeps using the old
// short field names (s.agent, s.site, s.post, s.start, s.end, a.sites…).
function mapSite(row, postsBySite, clientNameById){
  return {
    id: row.id, name: row.name, clientId: row.client_id||'', client: row.client_id? (clientNameById[row.client_id]||'') : '',
    address: row.address||'', mode: row.mode, temporary: !!row.temporary, archived: !!row.archived,
    posts: (postsBySite[row.id]||[]).map(p=>({ name:p.name, qualification:p.qualification }))
  };
}
function mapAgent(row, leaveByAgent){
  const a = {
    id: row.id, rhAgentId: row.rh_agent_id||'', source: row.source||'', name: row.name,
    nom: row.nom||'', prenom: row.prenom||'', email: row.email||'', team: row.team||'À définir',
    qualifications: row.qualifications||[], primarySite: row.primary_site||'', additionalSites: row.additional_sites||[],
    sites: row.formation_sites||[], documentsUntil: row.documents_until||'', authorizationUntil: row.authorization_until||'',
    rhFunction: row.rh_function||'', hiredAt: row.hired_at||'', departedAt: row.departed_at||'',
    rhContract: (row.rh_contract && Object.keys(row.rh_contract).length)? {
      type: row.rh_contract.type||'', hours: row.rh_contract.hours ?? null, unit: row.rh_contract.unit||'monthly',
      employmentRate: row.rh_contract.employmentRate ?? null, updatedAt: row.rh_contract.updatedAt||''
    } : undefined,
    weekly: row.weekly, annual: row.annual, monthly: row.monthly ?? undefined, done: row.done||0,
    available: !!row.available, competencePassport: row.competence_passport||[], quizResults: row.quiz_results||[],
    leaveAccounts: (leaveByAgent[row.id]||[]).map(l=>({ year:l.year, opening:l.opening, method:l.method }))
  };
  if(row.deleted_at) a.deletedAt = row.deleted_at;
  return a;
}
function mapShift(row){
  const s = {
    id: row.id, agent: row.agent_id||'', site: row.site_id, post: row.post_name, date: row.date,
    start: (row.start_time||'').slice(0,5), end: (row.end_time||'').slice(0,5), status: row.status,
    description: row.description||'', reason: row.reason||'', version: row.version,
    breakMinutes: row.break_minutes||0, breakPaid: !!row.break_paid
  };
  if(row.actual_start) s.actualStart = row.actual_start.slice(0,5);
  if(row.actual_end) s.actualEnd = row.actual_end.slice(0,5);
  if(row.seen_at) s.seen = row.seen_at;
  if(row.accepted_at) s.accepted = row.accepted_at;
  if(row.checked_at) s.checked = row.checked_at;
  return s;
}
function mapAbsence(row){
  return { id: row.id, agent: row.agent_id, kind: row.kind, days: row.days ?? undefined, from: row.from_date, to: row.to_date, status: row.status, reason: row.reason||'' };
}
function mapMember(row){ return { email: row.email, role: row.role, agent: row.agent_id||'', sites: row.sites||[] }; }
function mapView(row){ return { id: row.id, name: row.name, siteIds: row.site_ids||[], agentIds: row.agent_ids||[] }; }
function groupBy(rows, key){ const m={}; (rows||[]).forEach(r=>{ (m[r[key]] ||= []).push(r); }); return m; }

// Client-side re-shaping used only when a direction/planning user picks
// "Prévisualiser en tant qu'agent" — mirrors what the old Edge Function's
// T(state, actor) did server-side. It only changes what is DISPLAYED for
// this session; actual writes still run under the real signed-in role and
// its own RLS/RPC checks (this is a preview, not a genuine role switch).
function applySimulationView(state, agentId){
  const shifts = state.shifts.filter(s=>s.agent===agentId);
  return {
    ...state,
    agents: state.agents.filter(a=>a.id===agentId),
    shifts,
    sites: state.sites.filter(si=>shifts.some(s=>s.site===si.id)),
    clients: [], members: [], events: [],
    absences: state.absences.filter(a=>a.agent===agentId)
  };
}

// ── API ─────────────────────────────────────────────────────
async function apiGet(){
  setSyncState('saving','Chargement…');
  try{
    const email = (currentSession && currentSession.email || '').toLowerCase();
    const [memberRows, clientRows, siteRows, postRows, agentRows, leaveRows, shiftRows, absenceRows, ruleRows, viewRows] = await Promise.all([
      restSelect('rdz_planning_members', 'select=*&email=eq.'+encodeURIComponent(email)),
      restSelect('rdz_planning_clients', 'select=*&order=name.asc'),
      restSelect('rdz_planning_sites', 'select=*&order=name.asc'),
      restSelect('rdz_planning_site_posts', 'select=*&order=sort_order.asc'),
      restSelect('rdz_planning_agents', 'select=*'),
      restSelect('rdz_planning_leave_accounts', 'select=*'),
      restSelect('rdz_planning_shifts', 'select=*'),
      restSelect('rdz_planning_absences', 'select=*'),
      restSelect('rdz_planning_rules', 'select=*'),
      restSelect('rdz_planning_views', 'select=*&order=name.asc'),
    ]);
    const member = memberRows[0];
    if(!member) throw new Error('Votre compte n’a pas accès à RDZ Planning');

    const clientNameById = {}; (clientRows||[]).forEach(c=>{ clientNameById[c.id]=c.name; });
    const postsBySite = groupBy(postRows, 'site_id');
    const leaveByAgent = groupBy(leaveRows, 'agent_id');

    let state = {
      clients: (clientRows||[]).map(c=>({ id:c.id, name:c.name, archived:!!c.archived })),
      sites: (siteRows||[]).map(s=>mapSite(s, postsBySite, clientNameById)),
      agents: (agentRows||[]).map(a=>mapAgent(a, leaveByAgent)),
      shifts: (shiftRows||[]).map(mapShift),
      absences: (absenceRows||[]).map(mapAbsence),
      members: (memberRows.length && (member.role==='direction'||member.role==='planning'))
        ? await restSelect('rdz_planning_members','select=*&order=email.asc').then(rows=>rows.map(mapMember))
        : [mapMember(member)],
      rules: ruleRows && ruleRows[0]? { rest: ruleRows[0].rest, weekly: ruleRows[0].weekly, annualAlert: ruleRows[0].annual_alert } : { rest:11, weekly:50, annualAlert:94 },
      planningViews: (viewRows||[]).map(mapView),
      events: []
    };

    ACTOR = { role: member.role, agent: member.agent_id||'', sites: member.sites||[], email: currentSession.email, name: currentSession.email, owner: member.role==='direction', simulation:'' };
    RH_CONFIGURED = (member.role==='direction'||member.role==='planning');

    if(UI.simulate && ACTOR.owner){
      const simAgent = state.agents.find(a=>a.id===UI.simulate);
      if(simAgent){
        state = applySimulationView(state, UI.simulate);
        ACTOR = { ...ACTOR, role:'agent', agent: UI.simulate, simulation: displayNomPrenom(simAgent) };
      }
    }

    STATE = state;
    setSyncState('ok', 'Sync '+new Date().toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'}));
    renderNav(); renderCurrentPanel();
    return true;
  }catch(e){
    setSyncState('error','Hors ligne');
    toast(e.message||'Connexion impossible', true);
    return false;
  }
}
function fetchState(){ return apiGet(); }

// Back-compat seam: every render function below still calls
// apiAction('actionName', params) exactly as before. This dispatcher is the
// only thing that changed — it now routes each action to the matching
// Postgres RPC (see rdz_planning_schema.sql, section 7) instead of POSTing
// to the old single Edge Function endpoint, then refetches state the same
// way the old backend returned the whole updated state after every action.
let LAST_RH_SYNC = null;
async function apiAction(action, params){
  if(!STATE){ toast('Chargement en cours, réessayez.', true); return false; }
  setSyncState('saving','Enregistrement…');
  try{
    switch(action){
      case 'saveAgent': await rpc('rdz_planning_save_agent', { p_id: params.id||null, p_values: params.values }); break;
      case 'deleteAgent': await rpc('rdz_planning_delete_agent', { p_id: params.id, p_confirm: !!params.confirm }); break;
      case 'restoreAgent': await rpc('rdz_planning_restore_agent', { p_id: params.id }); break;
      case 'syncRH': LAST_RH_SYNC = await rpc('rdz_planning_sync_rh', {}); break;

      case 'saveClient': await rpc('rdz_planning_save_client', { p_id: params.id||null, p_values: params.values }); break;
      case 'deleteClient': await rpc('rdz_planning_delete_client', { p_id: params.id, p_confirm: !!params.confirm }); break;
      case 'restoreClient': await rpc('rdz_planning_restore_client', { p_id: params.id }); break;

      case 'saveSite': await rpc('rdz_planning_save_site', { p_id: params.id||null, p_values: params.values }); break;
      case 'deleteSite': await rpc('rdz_planning_delete_site', { p_id: params.id, p_confirm: !!params.confirm }); break;
      case 'restoreSite': await rpc('rdz_planning_restore_site', { p_id: params.id }); break;

      case 'create':
      case 'edit': {
        const v = params.values||{};
        await rpc('rdz_planning_shift_upsert', {
          p_id: params.id||null, p_version: params.version ?? null,
          p_site_id: v.site, p_post_name: v.post, p_date: v.date, p_start: v.start, p_end: v.end,
          p_agent_id: v.agent||null, p_description: v.description||'', p_reason: params.reason||null,
          p_break_minutes: v.breakMinutes||0, p_break_paid: !!v.breakPaid
        });
        break;
      }
      case 'deleteShift': await rpc('rdz_planning_delete_shift', { p_id: params.id, p_confirm: !!params.confirm }); break;
      case 'publish': await rpc('rdz_planning_publish_shifts', { p_ids: params.ids }); break;
      case 'duplicateShift': await rpc('rdz_planning_duplicate_shift', { p_id: params.id, p_version: params.version, p_targets: params.targets }); break;
      case 'duplicateWeek': await rpc('rdz_planning_duplicate_week', { p_from: params.from, p_to: params.to, p_site: params.site||null }); break;
      case 'duplicateMonth': await rpc('rdz_planning_duplicate_month', { p_source_month: params.sourceMonth, p_target_month: params.targetMonth, p_site: params.site||null }); break;
      case 'accept': await rpc('rdz_planning_accept_shift', { p_id: params.id, p_version: params.version }); break;
      case 'declare': await rpc('rdz_planning_declare_shift', { p_id: params.id, p_start: params.start, p_end: params.end, p_reason: params.reason||'' }); break;
      case 'check': await rpc('rdz_planning_check_shift', { p_id: params.id }); break;

      case 'absence': await rpc('rdz_planning_request_absence', { p_agent: params.agent||null, p_kind: params.kind||'unavailable', p_from: params.from, p_to: params.to, p_reason: params.reason||'' }); break;
      case 'editAbsence': await rpc('rdz_planning_edit_absence', { p_id: params.id, p_kind: params.kind||null, p_from: params.from, p_to: params.to, p_reason: params.reason||'' }); break;
      case 'deleteAbsence': await rpc('rdz_planning_delete_absence', { p_id: params.id, p_confirm: !!params.confirm }); break;
      case 'approveAbsence': await rpc('rdz_planning_approve_absence', { p_id: params.id, p_accept: !!params.accept }); break;

      case 'saveLeaveAccount': await rpc('rdz_planning_save_leave_account', { p_agent: params.agent, p_year: params.year, p_opening: params.opening, p_method: params.method }); break;

      case 'saveMember': await rpc('rdz_planning_save_member', { p_values: params.values }); break;
      case 'deleteMember': await rpc('rdz_planning_delete_member', { p_email: params.email, p_confirm: !!params.confirm }); break;

      case 'rules': await rpc('rdz_planning_save_rules', { p_rest: params.values.rest, p_weekly: params.values.weekly, p_annual_alert: params.values.annualAlert }); break;

      case 'savePlanningView': await rpc('rdz_planning_save_planning_view', { p_id: params.id||null, p_values: params.values }); break;
      case 'deletePlanningView': await rpc('rdz_planning_delete_planning_view', { p_id: params.id, p_confirm: !!params.confirm }); break;

      default: throw new Error('Action inconnue');
    }
    await apiGet();
    if(action==='syncRH') STATE.rhSync = LAST_RH_SYNC;
    setSyncState('ok','Enregistré · '+new Date().toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'}));
    renderCurrentPanel();
    return true;
  }catch(e){
    setSyncState('error','Hors ligne');
    toast(e.message||'Action impossible', true);
    setSyncState('ok','Connecté');
    return false;
  }
}

// native multi-select requires Ctrl/Cmd-click to pick more than one option, which
// isn't discoverable, and agents routinely cover more than one secondary site.
function renderSiteCheckboxes(inputName, sitesForSelect, selectedIds){
  return sitesForSelect.map(s=>`

      <input type="checkbox" name="${inputName}" value="${s.id}" ${(selectedIds||[]).includes(s.id)?'checked':''}> ${esc(s.name)}

  `).join('');
}
function getCheckedSites(inputName){
  return Array.from(document.querySelectorAll(`input[name="${inputName}"]:checked`)).map(el=>el.value);
}

async function saveAgentSitesForm(id){
  const a = agentById(id);
  if(!a) return;
  const isRh = a.source==='supabase-rh';
  // Rebuild the full required payload from the agent's current data — saveAgent
  // requires name/email/available/weekly/annual on every call, so a partial
  // "just the sites" payload would wipe those fields if left out.
  const values = {
    name: a.name, nom: a.nom, prenom: a.prenom, email: a.email||'', available: !!a.available,
    primarySite: modalVal('as-primary'),
    additionalSites: getCheckedSites('as-additional')
  };
  if(isRh){
    const obj = computeObjectives(a);
    values.weekly = obj.weekly; values.annual = obj.annual; values.monthly = a.monthly;
  } else {
    values.weekly = a.weekly; values.annual = a.annual;
  }
  const ok = await apiAction('saveAgent', { id: a.id, values });
  if(ok){ closeModal(); toast('Sites de l’agent mis à jour'); }
}

async function saveAgentForm(id){
  const a = id? agentById(id) : null;
  const isRh = a && a.source==='supabase-rh';
  const nom = modalVal('af-nom').trim();
  const prenom = modalVal('af-prenom').trim();
  if(!nom){ modalError('Le nom est obligatoire.'); return; }
  const name = prenom? (prenom+' '+nom) : nom;
  // team/qualifications/documentsUntil/authorizationUntil/sites (formation validée) are no
  // longer edited from this form (see "Paramètres avancés" removal) — they are intentionally
  // omitted here so the backend preserves the agent's existing values untouched.
  const values = {
    name, nom, prenom, email: modalVal('af-email'), available: modalVal('af-available')==='1',
    primarySite: modalVal('af-primary'),
    additionalSites: getCheckedSites('af-additional-sites')
  };
  if(isRh){
    const obj = computeObjectives(a);
    values.weekly = obj.weekly; values.annual = obj.annual; values.monthly = a.monthly;
  } else {
    const weekly = Number(modalVal('af-weekly')), annual = Number(modalVal('af-annual'));
    if(!(weekly>0 && weekly<=80) || !(annual>0)){ modalError('Renseignez des objectifs hebdomadaire/annuel valides.'); return; }
    values.weekly = weekly; values.annual = annual;
  }
  const ok = await apiAction('saveAgent', { id: id||undefined, values });
  if(ok){ closeModal(); toast('Fiche agent enregistrée'); }
}

  if(!confirm('Supprimer cet agent du planning ?')) return;

// Full weekday + day + full month name for the planning calendar's day headers
// (e.g. "lundi 21 septembre"), always computed in UTC to match how `days` (an
// array of YYYY-MM-DD strings) is built, regardless of the viewer's local timezone.
function dayHeaderLabel(d){
  const date = new Date(d+'T12:00:00Z');
  const weekday = date.toLocaleDateString('fr-CH', { weekday:'long', timeZone:'UTC' });
  const dayMonth = date.toLocaleDateString('fr-CH', { day:'numeric', month:'long', timeZone:'UTC' });
  return `${weekday}<br>${dayMonth}`;
}
function mondayOf(dateStr){
  const d = new Date(dateStr+'T12:00:00Z');
  const shift = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-shift);
  return d.toISOString().slice(0,10);
}
function addDays(dateStr, n){ const d=new Date(dateStr+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function planInitRange(){
  if(!PLAN_FILTER.anchor) PLAN_FILTER.anchor = PLAN_FILTER.mode==='month' ? todayISO().slice(0,7)+'-01' : mondayOf(todayISO());
}
function planDays(){
  if(PLAN_FILTER.mode==='month'){
    const [y,m] = PLAN_FILTER.anchor.split('-').map(Number);
    const nbDays = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return Array.from({length:nbDays}, (_,i)=> `${String(y)}-${String(m).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`);
  }
  return Array.from({length:7}, (_,i)=> addDays(PLAN_FILTER.anchor, i));
}
function planLabel(){
  if(PLAN_FILTER.mode==='month'){
    return new Date(PLAN_FILTER.anchor+'T12:00:00Z').toLocaleDateString('fr-CH',{month:'long',year:'numeric'});

// ── EXPORT EXCEL ─────────────────────────────────────────────
// Full schedule export for one agent (every site) or one site (every agent),
// over an arbitrary day/week/month — independent of whatever PLAN_FILTER
// currently shows on screen, so the export always reflects what was picked
// in the modal rather than the calendar view underneath it.
function periodDays(mode, anchorDate){
  if(mode==='day') return [anchorDate];
  if(mode==='month'){
    const [y,m] = anchorDate.slice(0,7).split('-').map(Number);
    const nbDays = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return Array.from({length:nbDays}, (_,i)=> `${String(y)}-${String(m).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`);
  }
  const monday = mondayOf(anchorDate);
  return Array.from({length:7}, (_,i)=> addDays(monday, i));
}
function weekdayFullName(d){
  const w = new Date(d+'T12:00:00Z').toLocaleDateString('fr-CH', { weekday:'long', timeZone:'UTC' });
  return w.charAt(0).toUpperCase()+w.slice(1);
}
function periodLabel(mode, anchorDate, days){
  if(mode==='day') return fmtDate(anchorDate);
  if(mode==='month') return new Date(anchorDate+'T12:00:00Z').toLocaleDateString('fr-CH',{month:'long',year:'numeric',timeZone:'UTC'});
  return 'Semaine du '+fmtDate(days[0])+' au '+fmtDate(days[days.length-1]);
}

function generateExcelExport(){
  const type = modalVal('ex-type');
  const targetId = modalVal('ex-target');
  const mode = modalVal('ex-period');
  const anchor = modalVal('ex-anchor');
  if(!targetId){ modalError('Choisissez '+(type==='site'?'un site':'un agent')+'.'); return; }
  if(!anchor){ modalError('Choisissez une date de référence.'); return; }
  if(typeof XLSX==='undefined'){ modalError('La bibliothèque Excel n’a pas pu se charger (vérifiez la connexion internet puis réessayez).'); return; }

  const days = periodDays(mode, anchor);
  const daySet = new Set(days);
  const header = ['Date','Jour',type==='agent'?'Site':'Poste',type==='agent'?'Poste':'Agent','Début','Fin','Pause','Pause payée','Statut','Description'];
  let shifts, title, fileLabel;

  if(type==='agent'){
    const agent = agentById(targetId);
    title = 'Planning de '+displayNomPrenom(agent);
    fileLabel = displayNomPrenom(agent).replace(/\s+/g,'_');
    shifts = STATE.shifts.filter(s=>s.agent===targetId && daySet.has(s.date));
  } else {
    const site = siteById(targetId);
    title = 'Planning du site '+site.name;
    fileLabel = site.name.replace(/\s+/g,'_');
    shifts = STATE.shifts.filter(s=>s.site===targetId && daySet.has(s.date));
  }
  shifts = shifts.sort((a,b)=> a.date===b.date? a.start.localeCompare(b.start) : a.date.localeCompare(b.date));

  const rows = [
    [title], [periodLabel(mode, anchor, days)], [],
    header,
    ...shifts.map(s=>[
      fmtDate(s.date), weekdayFullName(s.date),
      type==='agent'? siteLabel(s.site) : s.post,
      type==='agent'? s.post : (s.agent? displayNomPrenom(agentById(s.agent)) : 'À affecter'),
      s.start, s.end,
      s.breakMinutes? breakLabel(s.breakMinutes) : '—',
      s.breakMinutes? (s.breakPaid?'Oui':'Non') : '—',
      s.status, s.description||''
    ])
  ];

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [ {wch:12},{wch:11},{wch:20},{wch:18},{wch:7},{wch:7},{wch:9},{wch:12},{wch:11},{wch:30} ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Planning');
  XLSX.writeFile(wb, `Planning_${fileLabel}_${anchor}.xlsx`);
  closeModal();
  toast(shifts.length? `${shifts.length} service(s) exporté(s)` : 'Aucun service sur cette période — fichier vide généré');
}
// Freezes the row-label column and the day-header row "by hand" via transform,
// re-applied on every scroll event. CSS position:sticky was tried first and
// turned out not to work reliably on this very wide grid in practice, so this
// JS-driven approach replaces it — same visual result, no reliance on the
// browser's sticky implementation.
function bindCalendarFreeze(){
  const scroller = document.getElementById('calendar-scroll');
  if(!scroller) return;
  const labels = scroller.querySelectorAll('.cell.row-label');
  const headers = scroller.querySelectorAll('.cell.day-header');
  const corner = scroller.querySelector('.cell.corner');
  const apply = () => {
    const x = scroller.scrollLeft, y = scroller.scrollTop;
    labels.forEach(el=>{ el.style.transform = `translateX(${x}px)`; });
    headers.forEach(el=>{ el.style.transform = `translateY(${y}px)`; });
    if(corner) corner.style.transform = `translate(${x}px, ${y}px)`;
  };
  scroller.addEventListener('scroll', apply, { passive:true });
  apply();
}
function renderPlanning(el){
  planInitRange();
  const canManage = ['direction','planning','site'].includes(ACTOR.role);
  // An agent only ever sees their own schedule here: no site scoping, no
  // "vue par site/agent" toggle, no bulk-management tools — just their shifts,
  // always in "vue par agent" restricted to themselves (see renderAgentCalendar).
  const isOwnPlanningOnly = ACTOR.role==='agent';
  if(isOwnPlanningOnly) PLAN_FILTER.view = 'agent';
  const days = planDays();
  const today = todayISO();
  const allSites = sortSitesByName(STATE.sites.filter(s=>!s.archived));
  const planningViews = STATE.planningViews||[];

  else { activeSites = allSites; }

  el.innerHTML = `
    <div class="ph">
      <div><div class="ph-title">${isOwnPlanningOnly? 'Mon planning' : 'Planning'}</div><div class="ph-sub">${esc(planLabel())}</div></div>
      <div class="ph-right">${canManage? `<button class="btn btn-ghost btn-sm" onclick="openExportModal()">📊 Exporter Excel</button> <button class="btn btn-primary btn-sm" onclick="openShiftModal()">+ Nouveau service</button>` : ''}</div>
    </div>
    <div class="plan-toolbar">
      ${(()=>{
        if(!canManage) return '';
        const draftCount = visibleDraftShiftIds(activeSites, days).length;
        return draftCount? `<button class="btn btn-success btn-sm" onclick="publishVisibleDrafts()">📤 Publier ${draftCount} service${draftCount>1?'s':''}</button>` : '';
      })()}
      <div style="display:flex;gap:0;border:1.5px solid var(--border2);border-radius:9px;overflow:hidden;">
        <button class="btn btn-sm ${PLAN_FILTER.mode==='week'?'btn-primary':'btn-ghost'}" style="border-radius:0;" onclick="planSetMode('week')">Semaine</button>
        <button class="btn btn-sm ${PLAN_FILTER.mode==='month'?'btn-primary':'btn-ghost'}" style="border-radius:0;" onclick="planSetMode('month')">Mois</button>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="planNav(-1)">‹</button>
      <button class="btn btn-ghost btn-sm" onclick="planToday()">Aujourd’hui</button>
      <button class="btn btn-ghost btn-sm" onclick="planNav(1)">›</button>
      <input type="date" class="sel" style="max-width:150px;" value="${PLAN_FILTER.anchor}" onchange="planGoTo(this.value)" title="Aller à une date précise">
      ${isOwnPlanningOnly? '' : `
      <select class="sel" onchange="planSetScope(this.value)">
        <option value="all" ${PLAN_FILTER.scope==='all'?'selected':''}>Tous les sites</option>
        <option value="site" ${PLAN_FILTER.scope==='site'?'selected':''}>Par site</option>
        ${planningViews.length? `<optgroup label="Vues personnalisées">${planningViews.map(v=>`<option value="view:${v.id}" ${PLAN_FILTER.scope==='view'&&PLAN_FILTER.viewId===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</optgroup>` : ''}
      </select>
      ${PLAN_FILTER.scope==='site'? `<select class="sel" onchange="PLAN_FILTER.site=this.value;renderCurrentPanel()"><option value="">Tous les sites</option>${allSites.map(s=>`<option value="${s.id}" ${PLAN_FILTER.site===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>` : ''}
      <div style="display:flex;gap:0;border:1.5px solid var(--border2);border-radius:9px;overflow:hidden;">
        <button class="btn btn-sm ${PLAN_FILTER.view==='site'?'btn-primary':'btn-ghost'}" style="border-radius:0;" onclick="planSetView('site')">Vue par site</button>
        <button class="btn btn-sm ${PLAN_FILTER.view==='agent'?'btn-primary':'btn-ghost'}" style="border-radius:0;" onclick="planSetView('agent')">Vue par agent</button>
      </div>`}
      ${canManage? (PLAN_FILTER.mode==='week'
        ? `<button class="btn btn-ghost btn-sm" onclick="openCopyWeekModal()">⧉ Copier la semaine</button>`
        : `<button class="btn btn-ghost btn-sm" onclick="openCopyMonthModal()">⧉ Copier le mois</button>`) : ''}
      ${isOwnPlanningOnly? '' : `<label class="checkline"><input type="checkbox" ${PLAN_FILTER.onlyActive?'checked':''} onchange="PLAN_FILTER.onlyActive=this.checked;renderCurrentPanel()"> Uniquement ${PLAN_FILTER.view==='agent'?'les agents':'les postes'} avec service</label>`}
    </div>
    <div class="plan-legend" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:11px;color:var(--text2);margin:-6px 0 10px;">
      ${renderStatusLegendItem('var(--text3)','Brouillon (non publié)')}
      ${renderStatusLegendItem('var(--blue)','Publié (agent pas encore ouvert)')}
      ${renderStatusLegendItem('#7c3aed','Vu par l’agent')}
      ${renderStatusLegendItem('var(--green)','Validé par l’agent')}
      ${renderStatusLegendItem('var(--orange)','Effectué')}
      ${renderStatusLegendItem('#15803d','Contrôlé')}
    </div>
    <div class="calendar-scroll" id="calendar-scroll">
      ${PLAN_FILTER.view==='agent' ? renderAgentCalendar(days, today, canManage, activeView) : renderSiteCalendar(activeSites, days, today, canManage)}
    </div>
  `;
  bindCalendarFreeze();
}
function rowHasShiftInRange(row, days){ return STATE.shifts.some(s=>s.site===row.siteId && s.post===row.post && days.includes(s.date)); }
function renderSiteCalendar(activeSites, days, today, canManage){
  let rows = planningRows(activeSites, days);
  if(PLAN_FILTER.onlyActive) rows = rows.filter(r=>rowHasShiftInRange(r, days));
  return `
    <div class="calendar" style="grid-template-columns:190px repeat(${days.length}, minmax(${PLAN_FILTER.mode==='month'?100:150}px,1fr));">
      <div class="cell corner">Postes / Services</div>
      ${days.map(d=>`<div class="cell day-header ${d===today?'is-today':''}">${dayHeaderLabel(d)}</div>`).join('')}
      ${rows.length? rows.map(r=>`
        <div class="cell row-label">${esc(r.siteName)}<br><span style="color:var(--text3);font-weight:400;">${esc(r.post)}</span></div>
        ${days.map(d=>renderPlanningCell(r,d,today,canManage)).join('')}
      `).join('') : `<div class="cell" style="grid-column:1/-1;color:var(--text3);">Aucun poste ${PLAN_FILTER.onlyActive?'avec service sur cette période':'configuré'+(PLAN_FILTER.scope==='site'&&PLAN_FILTER.site?' pour ce site':(PLAN_FILTER.scope==='view'?' pour cette vue':''))}.</div>`}
    </div>
  `;
}
function renderPlanningCell(row, date, today, canManage){
  const shifts = STATE.shifts.filter(s=>s.site===row.siteId && s.post===row.post && s.date===date).sort((a,b)=>a.start.localeCompare(b.start));
  const chips = shifts.map(s=>renderShiftChip(s, canManage)).join('');
  const addBtn = canManage? `<div class="cell-add" onclick="openShiftModal(null,{site:'${jsStr(row.siteId)}',post:'${jsStr(row.post)}',date:'${date}'})" title="Ajouter un service">+</div>` : '';
  const dropAttrs = canManage? `ondragover="handleCellDragOver(event)" ondragleave="handleCellDragLeave(event)" ondrop="handleCellDrop(event,{site:'${jsStr(row.siteId)}',post:'${jsStr(row.post)}',date:'${date}'})"` : '';
  return `<div class="cell shift-cell ${date===today?'is-today':''}" ${dropAttrs}>${chips}${addBtn}</div>`;
}
function agentHasShiftInRange(agent, days){ return STATE.shifts.some(s=>s.agent===agent.id && days.includes(s.date)); }
function renderAgentCalendar(days, today, canManage, activeView){
  let agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  let emptyReason = '';
  // An agent's session only ever shows their own row here, regardless of any
  // site/view scoping left over in PLAN_FILTER — this is their planning, not
  // a management view they could widen back out.
  if(ACTOR.role==='agent'){
    agents = agents.filter(a=>a.id===ACTOR.agent);
    return `
    <div class="calendar" style="grid-template-columns:190px repeat(${days.length}, minmax(${PLAN_FILTER.mode==='month'?100:150}px,1fr));">
      <div class="cell corner">Mes services</div>
      ${days.map(d=>`<div class="cell day-header ${d===today?'is-today':''}">${dayHeaderLabel(d)}</div>`).join('')}
      ${agents.length? agents.map(a=>`
        <div class="cell row-label">${esc(displayNomPrenom(a))}</div>
        ${days.map(d=>renderAgentPlanningCell(a,d,today,canManage)).join('')}
      `).join('') : `<div class="cell" style="grid-column:1/-1;color:var(--text3);">Votre compte n’est rattaché à aucun agent — contactez la direction.</div>`}
    </div>
  `;
  }
  if(PLAN_FILTER.scope==='site' && PLAN_FILTER.site){
    // When a specific site is selected, agent view shows agents assigned to it either
    // as their primary site OR as one of their secondary sites — "tous les sites" shows
    // everyone regardless of assignment.
    agents = agents.filter(a=>a.primarySite===PLAN_FILTER.site || (a.additionalSites||[]).includes(PLAN_FILTER.site));
    emptyReason = ' affecté à ce site';
  } else if(PLAN_FILTER.scope==='view'){
    // A saved view's agent list is explicit and authoritative: it ignores
    // primarySite/additionalSites entirely, ­unlike the plain single-site filter above.
    const agentIds = activeView? (activeView.agentIds||[]) : [];
    agents = agents.filter(a=>agentIds.includes(a.id));
    emptyReason = ' dans cette vue';
  }
  if(PLAN_FILTER.onlyActive) agents = agents.filter(a=>agentHasShiftInRange(a, days));
  return `
    <div class="calendar" style="grid-template-columns:190px repeat(${days.length}, minmax(${PLAN_FILTER.mode==='month'?100:150}px,1fr));">
      <div class="cell corner">Agents</div>
      ${days.map(d=>`<div class="cell day-header ${d===today?'is-today':''}">${dayHeaderLabel(d)}</div>`).join('')}
      ${agents.length? agents.map(a=>{
        const isSecondary = PLAN_FILTER.scope==='site' && PLAN_FILTER.site && a.primarySite!==PLAN_FILTER.site;
        return `
        <div class="cell row-label">${esc(displayNomPrenom(a))}${isSecondary? ' <span class="badge badge-grey" style="font-weight:400;">secondaire</span>' : ''}</div>
        ${days.map(d=>renderAgentPlanningCell(a,d,today,canManage)).join('')}
      `;}).join('') : `<div class="cell" style="grid-column:1/-1;color:var(--text3);">Aucun agent${emptyReason}${PLAN_FILTER.onlyActive?' avec service sur cette période':''}.</div>`}
    </div>
  `;
}
function renderAgentPlanningCell(agent, date, today, canManage){
  const shifts = STATE.shifts.filter(s=>s.agent===agent.id && s.date===date).sort((a,b)=>a.start.localeCompare(b.start));
  const chips = shifts.map(s=>renderShiftChip(s, canManage, 'agent')).join('');
  const addBtn = canManage? `<div class="cell-add" onclick="openShiftModal(null,{agent:'${jsStr(agent.id)}',date:'${date}'})" title="Ajouter un service">+</div>` : '';
  const dropAttrs = canManage? `ondragover="handleCellDragOver(event)" ondragleave="handleCellDragLeave(event)" ondrop="handleCellDrop(event,{agent:'${jsStr(agent.id)}',date:'${date}'})"` : '';
  return `<div class="cell shift-cell ${date===today?'is-today':''}" ${dropAttrs}>${chips}${addBtn}</div>`;
}

function openShiftModal(id, prefill){
  const s = id? STATE.shifts.find(x=>x.id===id) : null;
  const canManage = ACTOR.role==='direction'||ACTOR.role==='planning';
  const sites = sortSitesByName(STATE.sites.filter(x=>!x.archived));
  const agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  const preSiteId = s? s.site : (prefill?.site || sites[0]?.id);
  const site = siteById(preSiteId);
  const preAgent = s? s.agent : (prefill?.agent||'');
  const body = `
    <div class="fgrid">
      <div class="fg full"><div class="flabel">Site *</div><select class="fsel" id="sh-site" onchange="onShiftSiteChange()">${sites.map(x=>`<option value="${x.id}" ${preSiteId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="fg full"><div class="flabel">Poste *</div><div id="sh-post-wrap">${renderPostSelect(site, s?s.post:(prefill?.post||''))}</div></div>
      <div class="fg"><div class="flabel">Date *</div><input class="finp" type="date" id="sh-date" value="${s?s.date:(prefill?.date||todayISO())}"></div>
      <div class="fg"><div class="flabel">Agent</div><select class="fsel" id="sh-agent"><option value="">— À affecter —</option>${agents.map(a=>`<option value="${a.id}" ${preAgent===a.id?'selected':''}>${esc(displayNomPrenom(a))}</option>`).join('')}</select></div>
      <div class="fg"><div class="flabel">Début *</div><input class="finp" type="time" id="sh-start" value="${s?s.start:'07:00'}"></div>
      <div class="fg"><div class="flabel">Fin *</div><input class="finp" type="time" id="sh-end" value="${s?s.end:'15:00'}"></div>
      <div class="fg"><div class="flabel">Pause</div><select class="fsel" id="sh-break">${BREAK_OPTIONS.map(o=>`<option value="${o.min}" ${(s?(s.breakMinutes||0):0)===o.min?'selected':''}>${o.label}</option>`).join('')}</select></div>
      <div class="fg"><div class="flabel">Pause payée</div><select class="fsel" id="sh-break-paid"><option value="1" ${!s||s.breakPaid?'selected':''}>Oui</option><option value="0" ${s&&!s.breakPaid?'selected':''}>Non</option></select></div>
      <div class="fg full"><div class="flabel">Description</div><textarea class="ftxt" id="sh-description" rows="2" placeholder="Notes libres sur ce service (optionnel)">${s?esc(s.description||''):''}</textarea></div>
      ${s? `<div class="fg full"><div class="flabel">Motif de la modification *</div><input class="finp" id="sh-reason" placeholder="Ex. remplacement, correction d’horaire…"></div>` : ''}
    </div>
    ${s? `<div class="hint">Statut actuel : ${esc(s.status)}<br>${esc(shiftStatusDetail(s))}</div>` : ''}
  `;
  const actions = `
    ${s&&canManage? `<button class="btn btn-danger btn-sm" onclick="deleteShiftAction('${s.id}','${s.version}')">🗑 Supprimer</button>` : ''}
    ${s&&canManage? `<button class="btn btn-ghost btn-sm" onclick="openCopyShiftModal('${s.id}','${s.version}')">⧉ Copier</button>` : ''}
    ${s&&canManage&&s.status==='Planifiée'? `<button class="btn btn-ghost btn-sm" onclick="publishShift('${s.id}')">Publier</button>` : ''}
    <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
    ${canManage? `<button class="btn btn-primary" onclick="saveShiftForm('${s?s.id+"|"+s.version:''}')">Enregistrer</button>` : ''}
  `;
  openModal('shift-modal', s? 'Service' : 'Nouveau service', body, actions);
}
function renderPostSelect(site, current){
  if(!site) return '<select class="fsel" id="sh-post"></select>';
  if(site.temporary) return `<input class="finp" id="sh-post" placeholder="Intitulé de la mission" value="${esc(current||'')}">`;
  return `<select class="fsel" id="sh-post">${(site.posts||[]).map(p=>`<option value="${esc(p.name)}" ${current===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
}
function onShiftSiteChange(){
  const site = siteById(modalVal('sh-site'));
  document.getElementById('sh-post-wrap').innerHTML = renderPostSelect(site, '');
}
async function saveShiftForm(idVersion){
  const [id, version] = idVersion? idVersion.split('|') : [null,null];
  const values = { site: modalVal('sh-site'), post: modalVal('sh-post'), date: modalVal('sh-date'), start: modalVal('sh-start'), end: modalVal('sh-end'), agent: modalVal('sh-agent'), description: modalVal('sh-description'), breakMinutes: Number(modalVal('sh-break'))||0, breakPaid: modalVal('sh-break-paid')==='1' };
  if(!values.date||!values.start||!values.end){ modalError('Renseignez la date et les horaires.'); return; }
  const params = { values };
  if(id){ params.id=id; params.version=Number(version); params.reason=modalVal('sh-reason'); }
  const ok = await apiAction(id?'edit':'create', params);
  if(ok){ closeModal(); toast(id? 'Service modifié' : 'Service créé'); }
}
async function publishShift(id){
  const ok = await apiAction('publish', { ids:[id] });
  if(ok){ closeModal(); toast('Service publié'); }
}
async function deleteShiftAction(id, version){
  if(!confirm('Supprimer définitivement ce service ?')) return;
  const ok = await apiAction('deleteShift', { id, version:Number(version), confirm:true });
  if(ok){ closeModal(); toast('Service supprimé'); }
}
function openCopyShiftModal(id, version){
  const s = STATE.shifts.find(x=>x.id===id);
  const agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  openModal('copy-shift-modal', 'Copier le service', `
    <div class="hint" style="margin-bottom:10px;">${esc(siteLabel(s.site))} / ${esc(s.post)} · ${s.start}–${s.end}</div>
    <div class="fgrid">
      <div class="fg"><div class="flabel">Nouvelle date *</div><input class="finp" type="date" id="cs-date" value="${s.date}"></div>
      <div class="fg"><div class="flabel">Agent</div><select class="fsel" id="cs-agent"><option value="">— À affecter —</option>${agents.map(a=>`<option value="${a.id}" ${s.agent===a.id?'selected':''}>${esc(displayNomPrenom(a))}</option>`).join('')}</select></div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="doCopyShift('${id}','${version}')">Copier</button>`);
}
async function doCopyShift(id, version){
  const date = modalVal('cs-date'), agent = modalVal('cs-agent');

  const ok = await apiAction('duplicateShift', { id, version:Number(version), targets:[{date, agent}] });

}
function openCopyWeekModal(){

  openModal('copy-week-modal', 'Copier la semaine', `
    <div class="hint" style="margin-bottom:10px;">Copie tous les services de la semaine affichée (${esc(planLabel())}) vers une autre semaine (lundis requis).</div>
    <div class="fgrid">
      <div class="fg full"><div class="flabel">Semaine de destination (lundi) *</div><input class="finp" type="date" id="cw-to" value="${addDays(PLAN_FILTER.anchor,7)}"></div>
      <div class="fg full"><div class="flabel">Limiter à un site</div><select class="fsel" id="cw-site"><option value="">Tous les sites</option>${allSites.map(s=>`<option value="${s.id}" ${PLAN_FILTER.site===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    </div>

async function doCopyWeek(){

function openCopyMonthModal(){

      <div class="fg full"><div class="flabel">Limiter à un site</div><select class="fsel" id="cm-site"><option value="">Tous les sites</option>${allSites.map(s=>`<option value="${s.id}" ${PLAN_FILTER.site===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>

async function doCopyMonth(){
