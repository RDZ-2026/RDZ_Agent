// ── HEURES & PRÉSENCES ──────────────────────────────────────
function renderHeures(el){
  const canManage = ACTOR.role==='direction'||ACTOR.role==='planning';
  const isAgent = ACTOR.role==='agent';
  const myId = ACTOR.agent;
  const shifts = STATE.shifts;
  const toValidate = shifts.filter(s=> (!isAgent || s.agent===myId) && ['Publiée','Vue'].includes(s.status));
  const toDeclare = shifts.filter(s=> (!isAgent || s.agent===myId) && s.status==='Validée' && _shiftEndPassed(s));
  const toControl = shifts.filter(s=> s.status==='Effectuée');
  const absences = (STATE.absences||[]).slice().sort((a,b)=> b.from.localeCompare(a.from));
  const pendingAbsences = absences.filter(a=>a.status==='Demandée');

  el.innerHTML = `
    <div class="ph"><div><div class="ph-title">Heures &amp; présences</div><div class="ph-sub">Validation, déclaration, contrôle et congés</div></div>
      <div class="ph-right"><button class="btn btn-primary btn-sm" onclick="openAbsenceModal()">+ Demande de congé / indisponibilité</button></div>
    </div>

    ${toValidate.length? `<div class="card" style="margin-bottom:14px;"><div style="font-weight:700;margin-bottom:8px;">À valider par l’agent (${toValidate.length})</div>
      ${toValidate.map(s=>renderHeureRow(s,'accept')).join('')}</div>` : ''}

    ${toDeclare.length? `<div class="card" style="margin-bottom:14px;"><div style="font-weight:700;margin-bottom:8px;">Heures à déclarer (${toDeclare.length})</div>
      ${toDeclare.map(s=>renderHeureRow(s,'declare')).join('')}</div>` : ''}

    ${canManage? `<div class="card" style="margin-bottom:14px;"><div style="font-weight:700;margin-bottom:8px;">Écarts à contrôler — heures déclarées (${toControl.length})</div>
      ${toControl.length? toControl.map(s=>renderHeureRow(s,'check')).join('') : '<div class="hint">Rien à contrôler.</div>'}</div>` : ''}

    ${canManage && pendingAbsences.length? `<div class="card" style="margin-bottom:14px;"><div style="font-weight:700;margin-bottom:8px;">Demandes de congé en attente (${pendingAbsences.length})</div>
      ${pendingAbsences.map(a=>renderAbsenceRow(a,true)).join('')}</div>` : ''}

    <div class="card">
      <div style="font-weight:700;margin-bottom:8px;">Congés &amp; indisponibilités</div>
      ${absences.length? absences.map(a=>renderAbsenceRow(a,false)).join('') : '<div class="hint">Aucune demande.</div>'}
    </div>
  `;
}
function _shiftEndPassed(s){
  try{ const end=new Date(s.date+'T'+s.end+':00Z').getTime(); return end<=Date.now(); }catch(e){ return true; }
}
function renderHeureRow(s, kind){
  return `<div class="shift-row" onclick="${kind==='accept'?`openAcceptModal('${s.id}')`:kind==='declare'?`openDeclareModal('${s.id}')`:`openControlModal('${s.id}')`}">
    <span class="shift-time">${esc(fmtDate(s.date))} · ${s.start}–${s.end}</span>
    <span class="shift-site">${esc(siteLabel(s.site))} · ${esc(s.post)}</span>
    <span class="shift-agent">${esc(agentLabel(s.agent))}</span>
    <span class="badge ${statusBadgeClass(s.status)}">${esc(s.status)}</span>
  </div>`;
}
function openAcceptModal(id){
  const s = STATE.shifts.find(x=>x.id===id);
  openModal('accept-modal','Valider le service', `<div>${esc(fmtDate(s.date))} · ${s.start}–${s.end} · ${esc(siteLabel(s.site))} / ${esc(s.post)}</div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Fermer</button><button class="btn btn-primary" onclick="acceptShift('${s.id}','${s.version}')">Valider</button>`);
}
async function acceptShift(id,version){ const ok=await apiAction('accept',{id,version:Number(version)}); if(ok){closeModal();toast('Service validé');} }
function openDeclareModal(id){
  const s = STATE.shifts.find(x=>x.id===id);
  openModal('declare-modal','Déclarer les heures réelles', `
    <div class="fgrid">
      <div class="fg"><div class="flabel">Début réel</div><input class="finp" type="time" id="dc-start" value="${s.start}"></div>
      <div class="fg"><div class="flabel">Fin réelle</div><input class="finp" type="time" id="dc-end" value="${s.end}"></div>
      <div class="fg full"><div class="flabel">Motif si horaire modifié</div><input class="finp" id="dc-reason" placeholder="Conforme au planning si inchangé"></div>
    </div>`, `<button class="btn btn-ghost" onclick="closeModal()">Fermer</button><button class="btn btn-primary" onclick="declareShift('${s.id}')">Déclarer</button>`);
}
async function declareShift(id){
  const ok = await apiAction('declare', { id, start:modalVal('dc-start'), end:modalVal('dc-end'), reason:modalVal('dc-reason') });
  if(ok){ closeModal(); toast('Heures déclarées'); }
}
function openControlModal(id){
  const s = STATE.shifts.find(x=>x.id===id);
  openModal('control-modal','Contrôler le service', `
    <div>${esc(fmtDate(s.date))} · ${esc(siteLabel(s.site))} / ${esc(s.post)} · ${esc(agentLabel(s.agent))}</div>
    <div class="hint">Prévu ${s.start}–${s.end} · Réel ${s.actualStart||'—'}–${s.actualEnd||'—'}${s.reason?' · '+esc(s.reason):''}</div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Fermer</button><button class="btn btn-primary" onclick="controlShift('${s.id}')">Marquer contrôlé</button>`);
}
async function controlShift(id){ const ok=await apiAction('check',{id}); if(ok){closeModal();toast('Heures contrôlées');} }

// ── ABSENCES ────────────────────────────────────────────────
function renderAbsenceRow(a, forApproval){
  const canManage = ACTOR.role==='direction'||ACTOR.role==='planning';
  const mine = ACTOR.role==='agent' && a.agent===ACTOR.agent;
  const canEdit = a.status==='Demandée' && (canManage||mine);
  const canDelete = (a.status==='Demandée' && (canManage||mine)) || canManage;
  const demo = isDemoAgent(agentById(a.agent)||{});
  return `<div class="shift-row" style="cursor:default;">
    <span class="shift-time">${esc(fmtDate(a.from))} → ${esc(fmtDate(a.to))}</span>
    <span class="shift-site">${a.kind==='paid'?'Congé payé':'Indisponibilité'}${a.days?' · '+a.days+' j':''}</span>
    <span class="shift-agent">${esc(agentLabel(a.agent))} ${demo?'<span class="badge demo-badge">Démo</span>':''}</span>
    <span class="badge ${a.status==='Acceptée'?'badge-green':a.status==='Refusée'?'badge-red':'badge-orange'}">${esc(a.status)}</span>
    <span style="display:flex;gap:4px;">
      ${forApproval? `<button class="btn btn-sm btn-success" onclick="decideAbsence('${a.id}',true)">Accepter</button><button class="btn btn-sm btn-danger" onclick="decideAbsence('${a.id}',false)">Refuser</button>` : ''}
      ${canEdit? `<button class="btn btn-sm btn-ghost" onclick="openAbsenceModal('${a.id}')">✏️</button>` : ''}
      ${canDelete? `<button class="btn btn-sm btn-danger" onclick="deleteAbsence('${a.id}','${a.status}')">🗑</button>` : ''}
    </span>
  </div>`;
}
async function decideAbsence(id, accept){ const ok=await apiAction('approveAbsence',{id,accept}); if(ok) toast(accept?'Demande acceptée':'Demande refusée'); }
async function deleteAbsence(id, status){
  const confirmNeeded = status!=='Demandée';
  if(!confirm(confirmNeeded? 'Cette demande a déjà été traitée. La supprimer quand même ?' : 'Supprimer cette demande ?')) return;
  const ok = await apiAction('deleteAbsence', { id, confirm: confirmNeeded||undefined });
  if(ok) toast('Demande supprimée');
}
function openAbsenceModal(id){
  const a = id? STATE.absences.find(x=>x.id===id) : null;
  const canManage = ACTOR.role==='direction'||ACTOR.role==='planning';
  const agents = sortAgentsByNom(STATE.agents.filter(x=>!x.deletedAt));
  const body = `
    <div class="fgrid">
      ${canManage? `<div class="fg full"><div class="flabel">Agent *</div><select class="fsel" id="ab-agent" ${a?'disabled':''}>${agents.map(x=>`<option value="${x.id}" ${(a?a.agent===x.id:x.id===ACTOR.agent)?'selected':''}>${esc(displayNomPrenom(x))}</option>`).join('')}</select></div>` : ''}
      <div class="fg"><div class="flabel">Type *</div><select class="fsel" id="ab-kind"><option value="unavailable" ${a&&a.kind==='unavailable'?'selected':''}>Indisponibilité</option><option value="paid" ${a&&a.kind==='paid'?'selected':''}>Congé payé</option></select></div>
      <div class="fg"><div class="flabel">Du *</div><input class="finp" type="date" id="ab-from" value="${a?a.from:''}"></div>
      <div class="fg"><div class="flabel">Au *</div><input class="finp" type="date" id="ab-to" value="${a?a.to:''}"></div>
      <div class="fg full"><div class="flabel">Motif</div><input class="finp" id="ab-reason" value="${a?esc(a.reason||''):''}"></div>
    </div>
  `;
  openModal('absence-modal', a? 'Modifier la demande' : 'Nouvelle demande', body,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveAbsenceForm('${a?a.id:''}')">Enregistrer</button>`);
}
async function saveAbsenceForm(id){
  const canManage = ACTOR.role==='direction'||ACTOR.role==='planning';
  const params = { kind: modalVal('ab-kind'), from: modalVal('ab-from'), to: modalVal('ab-to'), reason: modalVal('ab-reason') };
  if(!params.from||!params.to){ modalError('Renseignez les deux dates.'); return; }
  if(canManage && !id) params.agent = modalVal('ab-agent');
  let ok;
  if(id) ok = await apiAction('editAbsence', { id, ...params });
  else ok = await apiAction('absence', params);
  if(ok){ closeModal(); toast(id?'Demande modifiée':'Demande envoyée'); }
}

// ── RÉGLAGES ────────────────────────────────────────────────
function renderSettings(el){
  const isOwner = ACTOR.owner;
  const canManageViews = ACTOR.role==='direction'||ACTOR.role==='planning';
  const rules = STATE.rules;
  const members = STATE.members||[];
  const planningViews = STATE.planningViews||[];
  const agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  el.innerHTML = `
    <div class="ph"><div><div class="ph-title">Réglages</div><div class="ph-sub">Règles de contrôle, droits d’accès, comptes congés</div></div></div>

    <div class="card" style="margin-bottom:14px;">
      <div style="font-weight:700;margin-bottom:10px;">Règles de contrôle</div>
      <div class="fgrid">
        <div class="fg"><div class="flabel">Repos minimum (h)</div><input class="finp" type="number" id="rl-rest" value="${rules.rest}"></div>
        <div class="fg"><div class="flabel">Seuil hebdomadaire (h)</div><input class="finp" type="number" id="rl-weekly" value="${rules.weekly}"></div>
        <div class="fg"><div class="flabel">Alerte seuil annuel (%)</div><input class="finp" type="number" id="rl-annual" value="${rules.annualAlert}"></div>
      </div>
      <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="saveRulesForm()">Enregistrer les règles</button>
    </div>

    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-weight:700;">Comptes congés</div>
        <button class="btn btn-ghost btn-sm" onclick="openLeaveAccountModal()">+ Définir un solde</button>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>Agent</th><th>Année</th><th>Solde initial</th><th>Méthode</th></tr></thead><tbody>
        ${agents.flatMap(a=>(a.leaveAccounts||[]).map(la=>`<tr><td>${esc(displayNomPrenom(a))}</td><td>${la.year}</td><td>${la.opening} j</td><td>${la.method==='scheduled'?'Jours planifiés':'Jours ouvrés'}</td></tr>`)).join('') || '<tr><td colspan="4" style="color:var(--text3);">Aucun compte congé défini</td></tr>'}
      </tbody></table></div>
    </div>

    ${canManageViews? `<div class="card" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-weight:700;">Vues de planning</div>
        <button class="btn btn-ghost btn-sm" onclick="openPlanningViewModal()">+ Nouvelle vue</button>
      </div>
      <div class="hint" style="margin-bottom:10px;">Regroupez plusieurs sites et une liste précise d’agents pour créer un filtre réutilisable dans le planning.</div>
      <div class="tbl-wrap"><table><thead><tr><th>Nom</th><th>Sites</th><th>Agents</th><th></th></tr></thead><tbody>
        ${planningViews.map(v=>`<tr><td>${esc(v.name)}</td><td>${(v.siteIds||[]).map(siteLabel).join(', ')||'—'}</td><td>${(v.agentIds||[]).length} agent${(v.agentIds||[]).length>1?'s':''}</td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="btn btn-sm btn-ghost" onclick="openPlanningViewModal('${jsStr(v.id)}')" title="Modifier">✏️</button>
            <button class="btn btn-sm btn-danger" onclick="deletePlanningViewAction('${jsStr(v.id)}')" title="Supprimer">🗑</button>
          </td></tr>`).join('') || '<tr><td colspan="4" style="color:var(--text3);">Aucune vue définie</td></tr>'}
      </tbody></table></div>
    </div>` : ''}

    ${isOwner? `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-weight:700;">Droits d’accès</div>
        <button class="btn btn-ghost btn-sm" onclick="openMemberModal()">+ Ajouter un accès</button>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>E-mail</th><th>Rôle</th><th>Agent lié</th><th>Sites</th><th></th></tr></thead><tbody>
        ${members.map(m=>`<tr><td>${esc(m.email)}</td><td>${esc(m.role)}</td><td>${m.agent?esc(agentLabel(m.agent)):'—'}</td><td>${(m.sites||[]).map(siteLabel).join(', ')||'—'}</td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="btn btn-sm btn-ghost" onclick="openMemberModal('${jsStr(m.email)}')" title="Modifier">✏️</button>
            <button class="btn btn-sm btn-danger" onclick="deleteMember('${jsStr(m.email)}')" title="Supprimer">🗑</button>
          </td></tr>`).join('') || '<tr><td colspan="5" style="color:var(--text3);">Aucun accès défini</td></tr>'}
      </tbody></table></div>
    </div>` : ''}
  `;
}
async function saveRulesForm(){
  const values = { rest:Number(modalVal('rl-rest')), weekly:Number(modalVal('rl-weekly')), annualAlert:Number(modalVal('rl-annual')) };
  const ok = await apiAction('rules', { values });
  if(ok) toast('Règles mises à jour');
}
function openLeaveAccountModal(){
  const agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  openModal('leave-modal','Solde de congés', `
    <div class="fgrid">
      <div class="fg full"><div class="flabel">Agent *</div><select class="fsel" id="la-agent">${agents.map(a=>`<option value="${a.id}">${esc(displayNomPrenom(a))}</option>`).join('')}</select></div>
      <div class="fg"><div class="flabel">Année *</div><input class="finp" type="number" id="la-year" value="${new Date().getFullYear()}"></div>
      <div class="fg"><div class="flabel">Solde initial (j) *</div><input class="finp" type="number" id="la-opening" value="25"></div>
      <div class="fg full"><div class="flabel">Méthode de décompte</div><select class="fsel" id="la-method"><option value="weekdays">Jours ouvrés</option><option value="scheduled">Jours planifiés</option></select></div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveLeaveAccountForm()">Enregistrer</button>`);
}
async function saveLeaveAccountForm(){
  const ok = await apiAction('saveLeaveAccount', { agent: modalVal('la-agent'), year: Number(modalVal('la-year')), opening: Number(modalVal('la-opening')), method: modalVal('la-method') });
  if(ok){ closeModal(); toast('Solde de congés enregistré'); }
}
function openMemberModal(email){
  const m = email? (STATE.members||[]).find(x=>x.email===email) : null;
  const agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  const sites = sortSitesByName(STATE.sites.filter(s=>!s.archived));
  openModal('member-modal', m? 'Modifier le droit d’accès' : 'Nouveau droit d’accès', `
    <div class="fgrid">
      <div class="fg full"><div class="flabel">E-mail *</div><input class="finp" id="mb-email" type="email" value="${m?esc(m.email):''}" ${m?'readonly title="L’e-mail identifie ce droit d’accès et ne peut pas être modifié ici"':''}></div>
      <div class="fg full"><div class="flabel">Rôle *</div><select class="fsel" id="mb-role" onchange="onMemberRoleChange()">
        <option value="agent" ${m&&m.role==='agent'?'selected':''}>Agent</option>
        <option value="site" ${m&&m.role==='site'?'selected':''}>Responsable de site</option>
        <option value="direction" ${m&&m.role==='direction'?'selected':''}>Direction</option></select></div>
      <div class="fg full" id="mb-agent-wrap"><div class="flabel">Agent lié</div><select class="fsel" id="mb-agent"><option value="">—</option>${agents.map(a=>`<option value="${a.id}" ${m&&m.agent===a.id?'selected':''}>${esc(displayNomPrenom(a))}</option>`).join('')}</select></div>
      <div class="fg full" id="mb-sites-wrap" style="display:${m&&m.role==='site'?'block':'none'};"><div class="flabel">Sites</div><select class="fsel" id="mb-sites" multiple size="4">${sites.map(s=>`<option value="${s.id}" ${m&&(m.sites||[]).includes(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveMemberForm('${m?jsStr(m.email):''}')">Enregistrer</button>`);
}
function onMemberRoleChange(){
  const role = modalVal('mb-role');
  document.getElementById('mb-sites-wrap').style.display = role==='site'?'block':'none';
}
async function saveMemberForm(originalEmail){
  const role = modalVal('mb-role');
  const values = { email: (originalEmail||modalVal('mb-email')), role, agent: modalVal('mb-agent'), sites: role==='site'? Array.from(document.getElementById('mb-sites').selectedOptions).map(o=>o.value) : [] };
  // saveMember upserts by e-mail: resubmitting the same address edits the existing row in place.
  const ok = await apiAction('saveMember', { values });
  if(ok){ closeModal(); toast('Droit d’accès enregistré'); }
}
async function deleteMember(email){
  const members = STATE.members||[];
  const m = members.find(x=>x.email===email);
  if(!m) return;
  if(currentSession && currentSession.email && currentSession.email.toLowerCase()===email.toLowerCase()){
    toast('Impossible de supprimer votre propre accès', true); return;
  }
  if(m.role==='direction' && members.filter(x=>x.role==='direction').length<=1){
    toast('Impossible de supprimer le dernier accès direction', true); return;
  }
  if(!confirm('Supprimer le droit d’accès de '+email+' ?')) return;
  const ok = await apiAction('deleteMember', { email, confirm:true });
  if(ok) toast('Droit d’accès supprimé');
}
function openPlanningViewModal(id){
  const v = id? (STATE.planningViews||[]).find(x=>x.id===id) : null;
  const sites = sortSitesByName(STATE.sites.filter(s=>!s.archived));
  const agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  const siteOpts = sites.map(s=>`<option value="${s.id}" ${v&&(v.siteIds||[]).includes(s.id)?'selected':''}>${esc(s.name)}</option>`).join('');
  const agentOpts = agents.map(a=>`<option value="${a.id}" ${v&&(v.agentIds||[]).includes(a.id)?'selected':''}>${esc(displayNomPrenom(a))}</option>`).join('');
  openModal('planning-view-modal', v? 'Modifier la vue' : 'Nouvelle vue de planning', `
    <div class="fgrid">
      <div class="fg full"><div class="flabel">Nom de la vue *</div><input class="finp" id="pv-name" value="${v?esc(v.name):''}"></div>
      <div class="fg full"><div class="flabel">Sites regroupés</div><select class="fsel" id="pv-sites" multiple size="6">${siteOpts}</select></div>
      <div class="fg full"><div class="flabel">Agents à afficher dans cette vue</div><select class="fsel" id="pv-agents" multiple size="6">${agentOpts}</select></div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="savePlanningViewForm('${v?jsStr(v.id):''}')">Enregistrer</button>`);
}
async function savePlanningViewForm(id){
  const name = modalVal('pv-name');
  if(!name || !name.trim()){ modalError('Indiquez un nom pour cette vue.'); return; }
  const siteIds = Array.from(document.getElementById('pv-sites')?.selectedOptions||[]).map(o=>o.value);
  const agentIds = Array.from(document.getElementById('pv-agents')?.selectedOptions||[]).map(o=>o.value);
  const params = { values: { name, siteIds, agentIds } };
  if(id) params.id = id;
  const ok = await apiAction('savePlanningView', params);
  if(ok){ closeModal(); toast('Vue de planning enregistrée'); }
}
async function deletePlanningViewAction(id){
  const v = (STATE.planningViews||[]).find(x=>x.id===id);
  if(!v) return;
  if(!confirm('Supprimer la vue « '+v.name+' » ?')) return;
  const ok = await apiAction('deletePlanningView', { id, confirm:true });
  if(ok){
    // If the deleted view was the one active in the Planning panel, fall back to "Tous les sites" cleanly.
    if(PLAN_FILTER.scope==='view' && PLAN_FILTER.viewId===id){ PLAN_FILTER.scope='all'; PLAN_FILTER.viewId=''; }
    toast('Vue de planning supprimée');
  }
}

// ── BOOT ────────────────────────────────────────────────────
(function init(){
  const s = getSession();
  if(sessionOk(s)){
    applySession(s);
  }
})();
</script>
</body>
</html>
