*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--text)}
button,input,select,textarea{font-family:inherit}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .25s ease,opacity .25s;overflow:hidden}

.app-header-sub{font-size:10.5px;color:rgba(255,255,255,.65)}

.back-btn:active{background:rgba(255,255,255,.3)}
.agent-badge{font-size:10px;color:rgba(255,255,255,.65);margin-top:5px;text-align:right}

.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-bottom:40px}

.menu-btn{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--border);border-left:4px solid var(--red);border-radius:2px;padding:18px;margin-bottom:14px;cursor:pointer;box-shadow:var(--sh)}
.menu-btn:active{background:var(--bg)}

.fg{margin-bottom:14px}
.fl{font-size:10.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px}

.fi:focus{outline:none;border-color:var(--red)}
.fi-ta{min-height:70px;resize:vertical}

.btn-submit{width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:2px;font-size:14px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;margin-top:4px}

<script>
// ═══ RDZSync v4 — brique commune, collée telle quelle (voir rdz-sync-v4.js) ═══
(function (global) {
  'use strict';

  var Q_TEXT = 'rdz_sync_queue';
  var Q_PHOTO = 'rdz_sync_photo_queue';
  var Q_LOG = 'rdz_sync_log';
  var LOG_MAX = 30;

  var _client = null;
  var _onChange = null;
  var _flushingText = false;
  var _flushingPhotos = false;

  function readLS(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; } }
  function writeLS(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {} notify(); }

  function notify() {
    var st = getStatus();
    if (typeof _onChange === 'function') { try { _onChange(st); } catch (e) {} }
    renderBadge(st);
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function dataUrlToBlob(dataUrl) {
    var parts = dataUrl.split(',');
    var mime = (parts[0].match(/:(.*?);/) || [, 'application/octet-stream'])[1];
    var bin = atob(parts[1]); var n = bin.length; var u8 = new Uint8Array(n);
    while (n--) u8[n] = bin.charCodeAt(n);
    return new Blob([u8], { type: mime });
  }

  function pushLog(entry) {
    var log = readLS(Q_LOG);
    log.unshift(entry);
    if (log.length > LOG_MAX) log = log.slice(0, LOG_MAX);
    writeLS(Q_LOG, log);
  }

  /* ---------- détection WiFi (best-effort, jamais garantie) ---------- */
  function isWifi() {
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!c) return null;               // inconnu (iPhone/Safari notamment)
      if (typeof c.type === 'string') return c.type === 'wifi';
      if (typeof c.effectiveType === 'string') return null; // effectiveType = vitesse, pas le support
      return null;
    } catch (e) { return null; }
  }

  /* ---------- badge visuel ---------- */
  function ensureBadge() {
    var b = document.getElementById('rdz-sync-badge');
    if (b) return b;
    b = document.createElement('div');
    b.id = 'rdz-sync-badge';
    b.style.cssText =
      'position:fixed;left:12px;bottom:12px;z-index:99999;' +
      'font:600 12.5px Arial,Helvetica,sans-serif;color:#fff;' +
      'background:#b8860b;padding:8px 12px;border-radius:2px;line-height:1.5;' +
      'box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;cursor:pointer;max-width:260px;';
    b.title = 'Cliquer pour forcer la synchronisation';
    b.onclick = function () { flushText(); flushPhotos(true); };
    document.body.appendChild(b);
    return b;
  }
  function renderBadge(st) {
    if (typeof document === 'undefined' || !document.body) return;
    var b = ensureBadge();
    var parts = [];
    if (st.textPending > 0) parts.push('⏳ ' + st.textPending + ' donnée(s) en attente de réseau');
    if (st.photoPending > 0) parts.push('📷 ' + st.photoPending + ' photo(s) en attente de WiFi');
    if (parts.length === 0) { b.style.display = 'none'; return; }
    b.innerHTML = parts.join('<br>');
    b.style.display = 'block';
  }

  /* ---------- API publique ---------- */
  function init(opts) {
    opts = opts || {};
    _client = opts.client || _client;
    if (typeof opts.onChange === 'function') _onChange = opts.onChange;
    if (typeof global.addEventListener === 'function') {
      global.addEventListener('online', function () { flushText(); tryAutoPhotos(); });
    }
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (c && typeof c.addEventListener === 'function') {
        c.addEventListener('change', tryAutoPhotos);
      }
    } catch (e) {}
    if (typeof document !== 'undefined') {
      var start = function () { notify(); flushText(); tryAutoPhotos(); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    }
    return API;
  }

  function tryAutoPhotos() { if (isWifi() === true) flushPhotos(false); }

  /* save() : NON bloquant. Le texte est mis en file et une tentative
     d'envoi part immédiatement (auto, sur n'importe quel réseau).
     Les photos sont mises de côté et attendent le WiFi ou un geste manuel. */
  function save(item) {
    var textEntry = {
      id: uid(),
      module: item.module || 'inconnu',
      table: item.table,
      op: item.op || 'insert',
      onConflict: item.onConflict || null,
      row: Object.assign({}, item.row || {}),
      photoField: item.photoField || null,
      bucket: item.bucket || null,
      pendingPhotos: item.photos || [],   // gardées ici jusqu'à ce que le texte soit parti
      ts: new Date().toISOString(),
      tries: 0
    };
    var q = readLS(Q_TEXT); q.push(textEntry); writeLS(Q_TEXT, q);
    setTimeout(flushText, 0);
    return textEntry.id;
  }

  /* ---------- file TEXTE : envoi auto, tout réseau ---------- */
  function flushText() {
    if (_flushingText || !_client) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingText = true;
    var q = readLS(Q_TEXT); var i = 0;

    function next() {
      if (i >= q.length) { _flushingText = false; return; }
      var it = q[i];
      var qb = _client.from(it.table);
      // Pas de .select() après écriture : on ne dépend jamais d'une permission de
      // LECTURE en plus de la permission d'ÉCRITURE (une table plus ancienne peut
      // autoriser l'insert sans autoriser le select en retour — .select() y échouerait
      // silencieusement et la ligne resterait bloquée en file indéfiniment).
      // On utilise l'id fourni côté agent (row.id, déjà généré via uid() par tous les
      // modules) pour rattacher les photos ensuite.
      var req = (it.op === 'upsert')
        ? qb.upsert(it.row, it.onConflict ? { onConflict: it.onConflict } : undefined)
        : qb.insert(it.row);

      req.then(function (res) {
        if (res && res.error) throw res.error;
        // succès texte : retirer de la file texte + logguer
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) cur.splice(idx, 1);
        writeLS(Q_TEXT, cur);
        pushLog({ ts: new Date().toISOString(), module: it.module, table: it.table, kind: 'texte', ok: true });

        // s'il y avait des photos en attente, les basculer dans la file photo
        // (rattachées via l'id fourni côté agent dans row.id)
        var rowId = it.row && it.row.id != null ? it.row.id : null;
        if (it.pendingPhotos && it.pendingPhotos.length) {
          if (rowId == null) {
            console.warn('RDZSync: photos ignorées — aucun id fourni dans row.id pour', it.table);
          } else {
            var pq = readLS(Q_PHOTO);
            it.pendingPhotos.forEach(function (p) {
              pq.push({
                id: uid(), module: it.module, table: it.table, rowId: rowId,
                bucket: it.bucket, field: p.field || it.photoField, name: p.name || 'photo.jpg',
                dataUrl: p.dataUrl, ts: new Date().toISOString(), tries: 0
              });
            });
            writeLS(Q_PHOTO, pq);
            tryAutoPhotos();
          }
        }
        i++; next();
      }).catch(function () {
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; writeLS(Q_TEXT, cur); }
        _flushingText = false; // réseau probablement absent : on retentera au prochain online/ouverture
      });
    }
    next();
  }

  /* ---------- file PHOTOS : envoi WiFi (best-effort) ou manuel (force=true) ---------- */
  function flushPhotos(force) {
    if (_flushingPhotos || !_client) return;
    if (!force && isWifi() !== true) return; // pas de WiFi détecté et pas d'appui manuel -> on attend
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingPhotos = true;
    var q = readLS(Q_PHOTO); var i = 0;

    function next() {
      if (i >= q.length) { _flushingPhotos = false; return; }
      var p = q[i];
      var path = p.module + '/' + Date.now() + '_' + p.name;
      var blob = dataUrlToBlob(p.dataUrl);
      _client.storage.from(p.bucket).upload(path, blob, { upsert: true })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var pub = _client.storage.from(p.bucket).getPublicUrl(path);
          var url = pub && pub.data ? pub.data.publicUrl : null;
          var patch = {}; patch[p.field] = url;
          return _client.from(p.table).update(patch).eq('id', p.rowId);
        })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) cur.splice(idx, 1);
          writeLS(Q_PHOTO, cur);
          pushLog({ ts: new Date().toISOString(), module: p.module, table: p.table, kind: 'photo', ok: true });
          i++; next();
        })
        .catch(function () {
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; writeLS(Q_PHOTO, cur); }
          _flushingPhotos = false;
        });
    }
    next();
  }

  function getStatus() {
    return {
      textPending: readLS(Q_TEXT).length,
      photoPending: readLS(Q_PHOTO).length,
      log: readLS(Q_LOG),
      isWifi: isWifi()
    };
  }

  var API = {
    init: init, save: save, flushText: flushText, flushPhotos: flushPhotos,
    getStatus: getStatus, QUEUE_KEYS: { text: Q_TEXT, photo: Q_PHOTO, log: Q_LOG }
  };
  (typeof window !== 'undefined' ? window : global).RDZSync = API;
})(typeof window !== 'undefined' ? window : this);

const AGENT_ID_SESSION=localStorage.getItem('rdz_agent_id');
const AGENT_NOM_SESSION=localStorage.getItem('rdz_agent_nom')||'';
if(!AGENT_ID_SESSION){window.location.href='mobile.html';}

let STOCK_AGENT=null;
let accesItems=[], accesSites=[], accesActifs=[], accesRecept=[];

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function normalize(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function normalizeName(s){return normalize(s).split(/\s+/).filter(Boolean).sort().join(' ');}
function toast(msg,type='ok'){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),3000);}
function currentAgent(){ return STOCK_AGENT ? {id:STOCK_AGENT.id, nom:STOCK_AGENT.nom} : {id:null, nom:AGENT_NOM_SESSION}; }
function formatRecept(r){
  let s = r.nom;
  if (r.societe) s += ` (${r.societe})`;
  if (r.telephone) s += ` (${r.telephone})`;
  return s;
}
function ago(d){
  const m=Math.floor((Date.now()-new Date(d))/60000);
  if(m<1)return "à l'instant";
  if(m<60)return m+' min';
  if(m<1440)return Math.floor(m/60)+' h';
  return Math.floor(m/1440)+' j';
}

// ══ NAVIGATION ══
function goScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='s-remise')renderRemise();
  if(id==='s-retour')renderRetour();
}

async function loadAll(){
  const [stockAgents, aItems, aSites, aActifs, aRecept] = await Promise.all([
    sb.from('stock_agents').select('*').eq('actif',true),
    sb.from('stock_acces_items').select('*').eq('actif',true).order('nom'),
    sb.from('stock_acces_sites').select('*').eq('actif',true).order('nom'),
    sb.from('stock_acces').select('*').eq('statut','actif'),
    sb.from('stock_acces_recept').select('*').eq('actif',true).order('nom'),
  ]);
  accesItems=(aItems.data||[]).filter(i=>!i.public||i.public==='tous'||i.public==='externe');
  accesSites=aSites.data||[];
  accesActifs=aActifs.data||[];
  accesRecept=aRecept.data||[];

  const list=stockAgents.data||[];
  const target=normalizeName(AGENT_NOM_SESSION);
  STOCK_AGENT=list.find(a=>normalizeName(a.nom)===target) || null;
  document.getElementById('agent-badge').textContent = '👤 '+(STOCK_AGENT ? STOCK_AGENT.nom : AGENT_NOM_SESSION);
}

async function refreshActifs(){
  const {data}=await sb.from('stock_acces').select('*').eq('statut','actif');
  accesActifs=data||[];
}

function renderRemise(){
  document.getElementById('remise-body').innerHTML=`
    <div class="section-box section-acc">

      </select>
      <label class="fl" style="margin-top:10px">🔍 Filtrer clé / badge</label>
      <input class="fi" id="flt-item" placeholder="Tapez un nom…" oninput="fillItemSelect()">
      <label class="fl" style="margin-top:10px">Clé / badge</label>
      <select class="fi" id="sel-item"><option value="">Choisir une clé / badge…</option></select>
    </div>

    <div class="section-box section-recept">
      <div class="section-box-title">👤 RÉCEPTIONNAIRE EXTERNE</div>
      <label class="fl">Réceptionnaire existant</label>
      <select class="fi" id="sel-recept" onchange="onReceptChange()">
        <option value="">— Sélectionner —</option>
        ${accesRecept.map(r=>`<option value="${r.id}">${esc(formatRecept(r))}</option>`).join('')}
        <option value="__new__">➕ Nouveau réceptionnaire…</option>
      </select>
      <div id="new-recept-fields" style="display:none;margin-top:10px">
        <label class="fl">Nom du réceptionnaire</label>
        <input class="fi" id="new-recept-nom" placeholder="Nom Prénom">
        <label class="fl" style="margin-top:10px">Société (optionnel)</label>
        <input class="fi" id="new-recept-societe" placeholder="Nom de la société">
        <label class="fl" style="margin-top:10px">Téléphone (optionnel)</label>
        <input class="fi" id="new-recept-telephone" type="tel" placeholder="N° de téléphone">
        <label style="display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:12.5px;color:var(--text2);cursor:pointer">
          <input type="checkbox" id="new-recept-save" style="width:18px;height:18px;flex-shrink:0;margin-top:1px">
          <span>Cette personne est susceptible de revenir → l'ajouter à la liste des réceptionnaires (sinon, gardé uniquement pour cette remise)</span>
        </label>
      </div>
    </div>

    <div class="fg">
      <label class="fl">Date et heure de remise</label>
      <input class="fi" type="datetime-local" id="f-datetime">
    </div>
    <div class="fg">
      <label class="fl">Notes (optionnel)</label>
      <textarea class="fi fi-ta" id="f-notes" placeholder="Informations complémentaires…"></textarea>
    </div>
    <button class="btn-submit" id="btn-submit" onclick="doRemise()">✅ Enregistrer la remise</button>`;

  const now=new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  document.getElementById('f-datetime').value=now.toISOString().slice(0,16);
  fillItemSelect();
}

function fillItemSelect(){
  const q=normalize(document.getElementById('flt-item').value);
  const siteFlt=document.getElementById('flt-site').value;
  const sel=document.getElementById('sel-item');
  const takenIds=new Set(accesActifs.map(a=>a.item_id));
  const avail=accesItems.filter(it=>!takenIds.has(it.id) && (!siteFlt||it.site_nom===siteFlt) && (!q||normalize(it.nom).includes(q)));
  sel.innerHTML='<option value="">Choisir une clé / badge…</option>'+
    avail.map(it=>`<option value="${it.id}">${it.type==='badge'?'🪪':'🔑'} ${esc(it.nom)}${it.site_nom?' — '+esc(it.site_nom):''}</option>`).join('');
}

function onReceptChange(){
  const v=document.getElementById('sel-recept').value;
  document.getElementById('new-recept-fields').style.display = v==='__new__' ? 'block' : 'none';
}

async function doRemise(){
  const itemId=document.getElementById('sel-item').value;
  if(!itemId){toast('⚠️ Choisissez une clé / badge','err');return;}
  const receptSel=document.getElementById('sel-recept').value;
  if(!receptSel){toast('⚠️ Sélectionnez un réceptionnaire','err');return;}

  let receptId=null, receptNom='', receptSociete=null, receptTelephone=null, saveToList=false;
  if(receptSel==='__new__'){
    receptNom=document.getElementById('new-recept-nom').value.trim();
    receptSociete=document.getElementById('new-recept-societe').value.trim()||null;
    receptTelephone=document.getElementById('new-recept-telephone').value.trim()||null;
    saveToList=document.getElementById('new-recept-save').checked;
    if(!receptNom){toast('⚠️ Indiquez le nom du réceptionnaire','err');return;}
  }else{
    const r=accesRecept.find(x=>x.id===receptSel);
    if(!r){toast('⚠️ Réceptionnaire invalide','err');return;}
    receptId=r.id; receptNom=r.nom; receptSociete=r.societe||null; receptTelephone=r.telephone||null;
  }

  const item=accesItems.find(i=>i.id===itemId);
  const datetime=document.getElementById('f-datetime').value;
  const notes=document.getElementById('f-notes').value.trim();
  const ag=currentAgent();

  const btn=document.getElementById('btn-submit');
  btn.disabled=true;btn.textContent='Enregistrement…';

  try{
    await refreshActifs();
    if(accesActifs.some(a=>a.item_id===itemId)){
      toast("🔴 Cette clé/badge vient d'être pris par quelqu'un d'autre",'err');
      btn.disabled=false;btn.textContent='✅ Enregistrer la remise';
      fillItemSelect();
      return;
    }

    if(receptSel==='__new__' && saveToList){
      const {data:newRecept,error:newErr}=await sb.from('stock_acces_recept').insert({nom:receptNom,societe:receptSociete,telephone:receptTelephone,actif:true}).select().single();
      if(newErr) throw newErr;
      receptId=newRecept.id;
      accesRecept.push(newRecept);
    }

    const {error:delErr}=await sb.from('stock_acces').delete().eq('item_id',itemId);
    if(delErr) console.warn('Nettoyage stock_acces:',delErr.message);

    const payload={
      site_id:item.site_id||null, site_nom:item.site_nom||'—',
      agent_id:ag.id, agent_nom:ag.nom,
      item_id:itemId, item_nom:item.nom, item_type:item.type||'clé',
      receptionnaire_id:receptId, receptionnaire_nom:receptNom, receptionnaire_societe:receptSociete,
      receptionnaire_telephone:receptTelephone,
      receptionnaire_type:'externe',
      date_remise:new Date(datetime).toISOString(), date_retour_reel:null,
      statut:'actif', notes:notes||null
    };
    const {error:insErr}=await sb.from('stock_acces').insert(payload);
    if(insErr) throw insErr;

    toast('✅ Remise enregistrée → '+receptNom);
    goScreen('s-home');
  }catch(e){
    toast('❌ '+e.message,'err');
    btn.disabled=false;btn.textContent='✅ Enregistrer la remise';
  }
}

// ══════════════════════════════════════════════════════════════
// RETOUR — simple : une liste, un bouton par ligne
// ══════════════════════════════════════════════════════════════
let retourExternes=[];

async function renderRetour(){
  document.getElementById('retour-body').innerHTML='<div class="state-msg">Chargement…</div>';
  try{
    const {data,error}=await sb.from('stock_acces')
      .select('*')
      .eq('statut','actif')
      .eq('receptionnaire_type','externe')
      .order('date_remise',{ascending:false});
    if(error) throw error;
    retourExternes=data||[];
    drawRetour();
  }catch(e){
    document.getElementById('retour-body').innerHTML=`<div class="state-msg">⚠️ Erreur de chargement.<br><small>${esc(e.message)}</small></div>`;
  }
}

function drawRetour(){
  const el=document.getElementById('retour-body');
  if(!retourExternes.length){
    el.innerHTML='<div class="state-msg">✅ Aucun badge/clé actuellement chez un tiers externe.</div>';
    return;
  }
  el.innerHTML = `
    <input class="fi ret-filter" id="ret-filter" placeholder="🔍 Filtrer par nom, société, badge…" oninput="drawRetourList()">
    <div id="ret-list"></div>`;
  drawRetourList();
}

function drawRetourList(){
  const q = normalize(document.getElementById('ret-filter')?.value || '');
  const el = document.getElementById('ret-list');
  const filtered = retourExternes.filter(a => !q ||
    normalize(a.item_nom).includes(q) ||
    normalize(a.receptionnaire_nom).includes(q) ||
    normalize(a.receptionnaire_societe||'').includes(q)
  );
  if(!filtered.length){
    el.innerHTML = '<div class="state-msg">Aucun résultat.</div>';
    return;
  }
  el.innerHTML = filtered.map(a=>{
    const lateH = Math.floor((Date.now()-new Date(a.date_remise))/3600000);
    const late = lateH > 24;
    return `<div class="ret-item">
      <div class="ret-ico">${a.item_type==='badge'?'🪪':'🔑'}</div>
      <div class="ret-info">
        <div class="ret-name">${esc(a.item_nom)}${a.site_nom?' — '+esc(a.site_nom):''}</div>
        <div class="ret-sub">👤 ${esc(a.receptionnaire_nom)}${a.receptionnaire_societe?' ('+esc(a.receptionnaire_societe)+')':''}</div>
        <div class="ret-sub${late?' late':''}">${late?'⚠️ ':''}depuis ${ago(a.date_remise)}</div>
      </div>
      <button class="ret-btn" onclick="doRetour('${a.id}', this)">✅ Rendu</button>
    </div>`;
  }).join('');
}

async function doRetour(id, btn){
  btn.disabled=true; btn.textContent='…';
  RDZSync.save({
    module: 'badge-externe', table: 'stock_acces', op: 'upsert', onConflict: 'id',
    row: { id, statut:'rendu', date_retour_reel:new Date().toISOString() }
  });
  toast('📥 Badge/clé pris en compte' + (navigator.onLine ? ' ✓' : ' (hors-ligne — remontera dès le retour du réseau)'));
  retourExternes = retourExternes.filter(a=>a.id!==id);
  drawRetourList();
  if(!retourExternes.length) drawRetour();
}

// ══ INIT ══
async function init(){
  try{
    await loadAll();
  }catch(e){
    toast('Erreur de chargement : '+e.message,'err');
  }
}
init();
</script>
