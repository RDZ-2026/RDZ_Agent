<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RDZ — Rapport standard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --red:#8B1A1A; --red-dark:#6B1212;
  --report-red:#C8102E;
  --ink:#1a1a1a; --paper:#ffffff;
  --line:#d0d0d0; --line-soft:#e0e0e0;
  --bg-meta:#f0f0f0; --bg-soft:#f7f7f7;
  --ok:#1b7a3d; --warn:#b8860b; --danger:#8B1A1A;
  --radius-ui:2px; --radius-card:10px; --radius-section:8px;
  --font:Arial, Helvetica, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg-soft);color:var(--ink);-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg-soft);display:flex;flex-direction:column}
header{background:var(--red);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50}
header .brand{font-weight:bold;letter-spacing:.5px;font-size:14px}
header .sub{font-size:12px;opacity:.9;margin-top:2px}
header .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
header a.home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:var(--radius-ui);white-space:nowrap}
main{flex:1;padding:16px}
.hidden{display:none!important}
.screen-title{font-size:17px;font-weight:bold;margin:0 0 14px;color:var(--ink)}
.back-btn{background:none;border:none;color:var(--red);font-size:14px;font-weight:bold;cursor:pointer;padding:6px 0;margin-bottom:10px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#777;font-weight:bold;margin-bottom:6px}
.field .hint{font-size:12px;color:#999;font-weight:normal;text-transform:none;letter-spacing:0;margin-top:2px}
input[type=text],input[type=date],input[type=time],select,textarea{
  width:100%;font-family:var(--font);font-size:15px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:var(--radius-ui);padding:11px 12px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.meta-card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius-section);padding:12px 14px;margin-bottom:18px}
.meta-card .mrow{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
.meta-card .mrow .k{color:#888}
.meta-card .mrow .v{font-weight:bold;color:var(--ink);text-align:right}
.dictable{position:relative}
.mic{position:absolute;right:6px;bottom:6px;background:var(--red);color:#fff;border:none;border-radius:var(--radius-ui);padding:7px 10px;font-size:13px;font-weight:bold;cursor:pointer}
.mic.rec{background:#c0392b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.photo-btns{display:flex;gap:10px;margin-bottom:10px}
.photo-btns button{flex:1;background:#fff;border:1px solid var(--line);border-radius:var(--radius-ui);padding:12px;font-size:14px;font-weight:bold;cursor:pointer;color:var(--ink)}
.photo-item{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius-section);padding:10px;margin-bottom:10px;display:flex;gap:10px}
.photo-item img{width:74px;height:74px;object-fit:cover;border-radius:var(--radius-ui);flex-shrink:0;border:1px solid var(--line-soft)}
.photo-item .pmeta{flex:1;display:flex;flex-direction:column;gap:6px}
.photo-item .rm{background:none;border:none;color:var(--danger);font-size:12.5px;font-weight:bold;cursor:pointer;align-self:flex-start;padding:0}
.save-bar{position:sticky;bottom:0;background:var(--bg-soft);padding:14px 0 4px;margin-top:8px}
.btn-primary{width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--radius-ui);padding:16px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-primary:active{background:var(--red-dark)}
.confirm{text-align:center;padding:40px 20px}
.confirm .big{font-size:52px}
.confirm h2{font-size:19px;margin:14px 0 6px}
.confirm p{color:#666;font-size:14px;margin-bottom:24px}
.confirm .ci{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius-ui);color:var(--red);font-weight:bold;padding:14px;width:100%;cursor:pointer;font-size:15px;margin-bottom:10px}
.err{background:#fdecea;border:1px solid #f5b5ae;color:#8B1A1A;border-radius:var(--radius-ui);padding:10px 12px;font-size:13px;margin-bottom:12px}
.guard{text-align:center;padding:50px 20px;color:#666}
.guard a{display:inline-block;margin-top:16px;background:var(--red);color:#fff;text-decoration:none;padding:12px 18px;border-radius:var(--radius-ui);font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <div class="brand">RDZ SECURITY MANAGEMENT SA</div>
        <div class="sub">Rapport standard</div>
      </div>
      <a class="home" href="journal-de-bord.html">← Journal</a>
    </div>
  </header>

  <main>
    <!-- Garde : ouvert hors contexte (sans site) -->
    <section id="screen-guard" class="hidden">
      <div class="guard">
        <div style="font-size:40px">🧭</div>
        <p style="margin-top:12px">Ce rapport s'ouvre depuis le <b>Journal de bord</b><br>(choix du site et de l'activité).</p>
        <a href="journal-de-bord.html">Ouvrir le journal de bord</a>
      </div>
    </section>

    <!-- Formulaire -->
    <section id="screen-form" class="hidden">
      <a class="back-btn" href="journal-de-bord.html">← Retour au journal</a>
      <div class="screen-title">Nouvelle entrée</div>

      <div class="meta-card">
        <div class="mrow"><span class="k">Agent</span><span class="v" id="m-agent">—</span></div>
        <div class="mrow"><span class="k">Site</span><span class="v" id="m-site">—</span></div>
        <div class="mrow"><span class="k">Activité</span><span class="v" id="m-activite">—</span></div>
      </div>

      <div id="rapport-err"></div>

      <div class="row2">
        <div class="field"><label>Date</label><input type="date" id="f-date"></div>
        <div class="field"><label>Heure</label><input type="time" id="f-heure"></div>
      </div>

      <div class="field">
        <label>Localisation précise</label>
        <select id="f-loc"><option value="">— Choisir —</option></select>
      </div>
      <div class="field">
        <label>Précision (facultatif)</label>
        <input type="text" id="f-loc-autre" placeholder="Ex. porte B2, 3e étage, parking niveau -2…">
      </div>

      <div class="field">
        <label>Que se passe-t-il&nbsp;?
          <span class="hint">La situation à votre arrivée, ce qui motive votre passage.</span>
        </label>
        <div class="dictable">
          <textarea id="f-situation" placeholder="Décrivez ou dictez la situation…"></textarea>
        </div>
      </div>

      <div class="field">
        <label>Qu'avez-vous fait&nbsp;?
          <span class="hint">Les actions menées, comment vous êtes intervenu.</span>
        </label>
        <div class="dictable">
          <textarea id="f-actions" placeholder="Décrivez ou dictez vos actions…"></textarea>
        </div>
      </div>

      <div class="field">
        <label>Photos</label>
        <div class="photo-btns">
          <button type="button" onclick="document.getElementById('photo-camera').click()">📷 Caméra</button>
          <button type="button" onclick="document.getElementById('photo-gallery').click()">🖼 Galerie</button>
        </div>
        <input type="file" id="photo-camera" accept="image/*" capture="environment" style="display:none">
        <input type="file" id="photo-gallery" accept="image/*" style="display:none">
        <div id="photo-list"></div>
      </div>

      <div class="save-bar">
        <button class="btn-primary" id="btn-save" onclick="saveEntry()">✓ Enregistrer dans le journal</button>
      </div>
    </section>

    <!-- Confirmation -->
    <section id="screen-done" class="hidden">
      <div class="confirm">
        <div class="big">✅</div>
        <h2>Entrée enregistrée</h2>
        <p id="done-sub">Elle est dans le journal de bord.</p>
        <button class="ci" onclick="resetForm()">➕ Nouvelle entrée (même activité)</button>
        <a class="ci" href="journal-de-bord.html" style="display:block;text-decoration:none">↩ Retour au journal</a>
      </div>
    </section>
  </main>
</div>

<script>
/* ============================================================================
   RDZ · rdz-sync · v4 · file d'attente hors-ligne PARTAGÉE entre tous les modules
   ----------------------------------------------------------------------------
   v4 : suppression de .select() après écriture. v3 dépendait du retour serveur
   pour connaître l'id de la ligne créée, ce qui exige une permission de LECTURE
   en plus de l'ÉCRITURE — sur une table plus ancienne où le SELECT anonyme ne
   serait pas aussi large que l'INSERT, .select() échoue silencieusement et la
   ligne reste bloquée en file indéfiniment (texte ET photos ne remontent jamais,
   sans erreur visible). v4 utilise à la place l'id fourni côté agent dans
   row.id (déjà généré via uid() par tous les modules), donc ne dépend plus que
   du droit d'écriture. **Obligatoire : toujours fournir un `id` dans `row`
   lors de l'appel à save() si des photos accompagnent la saisie.**
   ----------------------------------------------------------------------------
   v3 : chaque photo peut désormais cibler SON PROPRE champ de destination
   (photos:[{name,dataUrl,field}]) — nécessaire pour les modules à plusieurs
   photos visant des colonnes différentes (ex. photo_vehicule_url,
   photo_denonciation_url... dans ParkGuard). `photoField` au niveau de save()
   reste utilisable comme valeur par défaut si une photo ne précise pas `field`.
   ----------------------------------------------------------------------------
   v2 : séparation TEXTE / PHOTOS.
     - Le TEXTE (la ligne de données) part automatiquement dès qu'il y a
       n'importe quel réseau (4G/5G/WiFi) — c'est la remontée à la direction,
       elle doit arriver vite et elle coûte quasi rien en data.
     - Les PHOTOS sont mises de côté et ne partent PAS automatiquement en
       réseau mobile : elles attendent soit le WiFi (best-effort, selon
       navigateur), soit un appui manuel de l'agent sur "Envoyer les photos".
       Tant qu'elles n'ont pas été envoyées, l'agent peut voir "n photo(s)
       en attente de WiFi" sans que ça bloque quoi que ce soit d'autre.
   Deux files persistées dans localStorage, partagées entre TOUS les modules :
     rdz_sync_queue        -> lignes de texte en attente d'envoi
     rdz_sync_photo_queue  -> photos en attente d'upload (liées à une ligne déjà envoyée)
     rdz_sync_log          -> historique des 30 derniers éléments envoyés (visibilité agent)
   ----------------------------------------------------------------------------
   Usage :
     RDZSync.init({ client: supabase });
     RDZSync.save({
       module: 'parkguard', table: 'vehicles',
       row: { id: uid(), ... },   // <-- id obligatoire si des photos accompagnent la saisie
       bucket: 'parkguard-photos', photoField: 'photo_vehicule_url', // valeur par défaut
       photos: [
         { name:'p1.jpg', dataUrl:'data:image/...', field:'photo_vehicule_url' },
         { name:'p2.jpg', dataUrl:'data:image/...', field:'photo_denonciation_url' }
       ]
     });
     RDZSync.flushPhotos(true);   // forcer l'envoi des photos (bouton manuel)
     RDZSync.getStatus();         // { textPending, photoPending, log, isWifi }
   ============================================================================ */
(function (global) {
  'use strict';

  var Q_TEXT = 'rdz_sync_queue';
  var Q_PHOTO = 'rdz_sync_photo_queue';
  var Q_LOG = 'rdz_sync_log';
  var LOG_MAX = 30;

  var _client = null;
  var _onChange = null;
  var _flushingText = false;
  var _flushingPhotos = false;

  function readLS(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; } }
  function writeLS(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {} notify(); }

  function notify() {
    var st = getStatus();
    if (typeof _onChange === 'function') { try { _onChange(st); } catch (e) {} }
    renderBadge(st);
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function dataUrlToBlob(dataUrl) {
    var parts = dataUrl.split(',');
    var mime = (parts[0].match(/:(.*?);/) || [, 'application/octet-stream'])[1];
    var bin = atob(parts[1]); var n = bin.length; var u8 = new Uint8Array(n);
    while (n--) u8[n] = bin.charCodeAt(n);
    return new Blob([u8], { type: mime });
  }

  function pushLog(entry) {
    var log = readLS(Q_LOG);
    log.unshift(entry);
    if (log.length > LOG_MAX) log = log.slice(0, LOG_MAX);
    writeLS(Q_LOG, log);
  }

  /* ---------- détection WiFi (best-effort, jamais garantie) ---------- */
  function isWifi() {
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!c) return null;               // inconnu (iPhone/Safari notamment)
      if (typeof c.type === 'string') return c.type === 'wifi';
      if (typeof c.effectiveType === 'string') return null; // effectiveType = vitesse, pas le support
      return null;
    } catch (e) { return null; }
  }

  /* ---------- badge visuel ---------- */
  function ensureBadge() {
    var b = document.getElementById('rdz-sync-badge');
    if (b) return b;
    b = document.createElement('div');
    b.id = 'rdz-sync-badge';
    b.style.cssText =
      'position:fixed;left:12px;bottom:12px;z-index:99999;' +
      'font:600 12.5px Arial,Helvetica,sans-serif;color:#fff;' +
      'background:#b8860b;padding:8px 12px;border-radius:2px;line-height:1.5;' +
      'box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;cursor:pointer;max-width:260px;';
    b.title = 'Cliquer pour forcer la synchronisation';
    b.onclick = function () { flushText(); flushPhotos(true); };
    document.body.appendChild(b);
    return b;
  }
  function renderBadge(st) {
    if (typeof document === 'undefined' || !document.body) return;
    var b = ensureBadge();
    var parts = [];
    if (st.textPending > 0) parts.push('⏳ ' + st.textPending + ' donnée(s) en attente de réseau');
    if (st.photoPending > 0) parts.push('📷 ' + st.photoPending + ' photo(s) en attente de WiFi');
    if (parts.length === 0) { b.style.display = 'none'; return; }
    b.innerHTML = parts.join('<br>');
    b.style.display = 'block';
  }

  /* ---------- API publique ---------- */
  function init(opts) {
    opts = opts || {};
    _client = opts.client || _client;
    if (typeof opts.onChange === 'function') _onChange = opts.onChange;
    if (typeof global.addEventListener === 'function') {
      global.addEventListener('online', function () { flushText(); tryAutoPhotos(); });
    }
    try {
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (c && typeof c.addEventListener === 'function') {
        c.addEventListener('change', tryAutoPhotos);
      }
    } catch (e) {}
    if (typeof document !== 'undefined') {
      var start = function () { notify(); flushText(); tryAutoPhotos(); };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    }
    return API;
  }

  function tryAutoPhotos() { if (isWifi() === true) flushPhotos(false); }

  /* save() : NON bloquant. Le texte est mis en file et une tentative
     d'envoi part immédiatement (auto, sur n'importe quel réseau).
     Les photos sont mises de côté et attendent le WiFi ou un geste manuel. */
  function save(item) {
    var textEntry = {
      id: uid(),
      module: item.module || 'inconnu',
      table: item.table,
      op: item.op || 'insert',
      onConflict: item.onConflict || null,
      row: Object.assign({}, item.row || {}),
      photoField: item.photoField || null,
      bucket: item.bucket || null,
      pendingPhotos: item.photos || [],   // gardées ici jusqu'à ce que le texte soit parti
      ts: new Date().toISOString(),
      tries: 0
    };
    var q = readLS(Q_TEXT); q.push(textEntry); writeLS(Q_TEXT, q);
    setTimeout(flushText, 0);
    return textEntry.id;
  }

  /* ---------- file TEXTE : envoi auto, tout réseau ---------- */
  function flushText() {
    if (_flushingText || !_client) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingText = true;
    var q = readLS(Q_TEXT); var i = 0;

    function next() {
      if (i >= q.length) { _flushingText = false; return; }
      var it = q[i];
      var qb = _client.from(it.table);
      // Pas de .select() après écriture : on ne dépend jamais d'une permission de
      // LECTURE en plus de la permission d'ÉCRITURE (une table plus ancienne peut
      // autoriser l'insert sans autoriser le select en retour — .select() y échouerait
      // silencieusement et la ligne resterait bloquée en file indéfiniment).
      // On utilise l'id fourni côté agent (row.id, déjà généré via uid() par tous les
      // modules) pour rattacher les photos ensuite.
      var req = (it.op === 'upsert')
        ? qb.upsert(it.row, it.onConflict ? { onConflict: it.onConflict } : undefined)
        : qb.insert(it.row);

      req.then(function (res) {
        if (res && res.error) throw res.error;
        // succès texte : retirer de la file texte + logguer
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) cur.splice(idx, 1);
        writeLS(Q_TEXT, cur);
        pushLog({ ts: new Date().toISOString(), module: it.module, table: it.table, kind: 'texte', ok: true });

        // s'il y avait des photos en attente, les basculer dans la file photo
        // (rattachées via l'id fourni côté agent dans row.id)
        var rowId = it.row && it.row.id != null ? it.row.id : null;
        if (it.pendingPhotos && it.pendingPhotos.length) {
          if (rowId == null) {
            console.warn('RDZSync: photos ignorées — aucun id fourni dans row.id pour', it.table);
          } else {
            var pq = readLS(Q_PHOTO);
            it.pendingPhotos.forEach(function (p) {
              pq.push({
                id: uid(), module: it.module, table: it.table, rowId: rowId,
                bucket: it.bucket, field: p.field || it.photoField, name: p.name || 'photo.jpg',
                dataUrl: p.dataUrl, ts: new Date().toISOString(), tries: 0
              });
            });
            writeLS(Q_PHOTO, pq);
            tryAutoPhotos();
          }
        }
        i++; next();
      }).catch(function () {
        var cur = readLS(Q_TEXT);
        var idx = cur.findIndex(function (x) { return x.id === it.id; });
        if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; writeLS(Q_TEXT, cur); }
        _flushingText = false; // réseau probablement absent : on retentera au prochain online/ouverture
      });
    }
    next();
  }

  /* ---------- file PHOTOS : envoi WiFi (best-effort) ou manuel (force=true) ---------- */
  function flushPhotos(force) {
    if (_flushingPhotos || !_client) return;
    if (!force && isWifi() !== true) return; // pas de WiFi détecté et pas d'appui manuel -> on attend
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    _flushingPhotos = true;
    var q = readLS(Q_PHOTO); var i = 0;

    function next() {
      if (i >= q.length) { _flushingPhotos = false; return; }
      var p = q[i];
      var path = p.module + '/' + Date.now() + '_' + p.name;
      var blob = dataUrlToBlob(p.dataUrl);
      _client.storage.from(p.bucket).upload(path, blob, { upsert: true })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var pub = _client.storage.from(p.bucket).getPublicUrl(path);
          var url = pub && pub.data ? pub.data.publicUrl : null;
          var patch = {}; patch[p.field] = url;
          return _client.from(p.table).update(patch).eq('id', p.rowId);
        })
        .then(function (res) {
          if (res && res.error) throw res.error;
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) cur.splice(idx, 1);
          writeLS(Q_PHOTO, cur);
          pushLog({ ts: new Date().toISOString(), module: p.module, table: p.table, kind: 'photo', ok: true });
          i++; next();
        })
        .catch(function () {
          var cur = readLS(Q_PHOTO);
          var idx = cur.findIndex(function (x) { return x.id === p.id; });
          if (idx > -1) { cur[idx].tries = (cur[idx].tries || 0) + 1; writeLS(Q_PHOTO, cur); }
          _flushingPhotos = false;
        });
    }
    next();
  }

  function getStatus() {
    return {
      textPending: readLS(Q_TEXT).length,
      photoPending: readLS(Q_PHOTO).length,
      log: readLS(Q_LOG),
      isWifi: isWifi()
    };
  }

  var API = {
    init: init, save: save, flushText: flushText, flushPhotos: flushPhotos,
    getStatus: getStatus, QUEUE_KEYS: { text: Q_TEXT, photo: Q_PHOTO, log: Q_LOG }
  };
  (typeof window !== 'undefined' ? window : global).RDZSync = API;
})(typeof window !== 'undefined' ? window : this);

</script>

async function init(){
  if(!SITE_NOM){ show('screen-guard'); return; }
  document.getElementById('m-agent').textContent = AGENT_NOM;
  document.getElementById('m-site').textContent = SITE_NOM;
  document.getElementById('m-activite').textContent = ACTIVITE;
  await loadLocalisations();
  resetForm();
  bindMics();
  show('screen-form');
}

function resetForm(){
  photos = []; renderPhotos();
  document.getElementById('rapport-err').innerHTML = '';
  const now = new Date();
  document.getElementById('f-date').value = now.toISOString().slice(0,10);
  document.getElementById('f-heure').value = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  document.getElementById('f-situation').value = '';
  document.getElementById('f-actions').value = '';
  document.getElementById('f-loc').value = '';
  document.getElementById('f-loc-autre').value = '';
  show('screen-form');
}

async function loadLocalisations(){
  const sel = document.getElementById('f-loc');
  sel.innerHTML = '<option value="">— Choisir —</option>';
  try{
    let q = sb.from('journal_localisations').select('*').eq('actif',true);
    q = SITE_ID ? q.or('site_id.is.null,site_id.eq.'+SITE_ID) : q.is('site_id',null);
    const { data } = await q.order('ordre');
    (data||[]).forEach(l=>{ const o=document.createElement('option'); o.value=l.label; o.textContent=l.label; sel.appendChild(o); });
  }catch(e){ /* facultatif */ }
  const o=document.createElement('option'); o.value='__autre'; o.textContent='Autre / non listé'; sel.appendChild(o);
}

/* ---------- photos ---------- */
function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 1280; let w=img.width, h=img.height;
        if(w>max || h>max){ const r=Math.min(max/w, max/h); w=Math.round(w*r); h=Math.round(h*r); }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',0.7));
      };
      img.onerror = ()=>resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function onPhotoPicked(input){
  const file = input.files && input.files[0]; input.value='';
  if(!file) return;
  const dataUrl = await compressImage(file);
  photos.push({ name:'photo_'+uid()+'.jpg', dataUrl, legende:'' });
  renderPhotos();
}
document.getElementById('photo-camera').addEventListener('change', e=>onPhotoPicked(e.target));
document.getElementById('photo-gallery').addEventListener('change', e=>onPhotoPicked(e.target));

function renderPhotos(){
  const box = document.getElementById('photo-list');
  box.innerHTML = photos.map((p,i)=>`
    <div class="photo-item">
      <img src="${p.dataUrl}" alt="">
      <div class="pmeta">
        <div class="dictable">
          <input type="text" placeholder="Légende de la photo…" value="${esc(p.legende)}" oninput="photos[${i}].legende=this.value" id="leg-${i}">
        </div>
        <button type="button" class="rm" onclick="removePhoto(${i})">✕ Retirer</button>
      </div>
    </div>`).join('');
  bindMics();
}
function removePhoto(i){ photos.splice(i,1); renderPhotos(); }

/* ---------- dictée (Web Speech API, best-effort) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null, recTargetBtn = null;
function bindMics(){
  document.querySelectorAll('.mic').forEach(btn=>{
    if(btn.dataset.bound) return; btn.dataset.bound='1';
    if(!SR){ btn.style.display='none'; return; }
    btn.addEventListener('click', ()=>toggleDictation(btn));
  });
}
function toggleDictation(btn){
  if(!SR) return;
  if(recognizer && recTargetBtn===btn){ recognizer.stop(); return; }
  if(recognizer){ try{recognizer.stop();}catch(e){} }
  const el = document.getElementById(btn.dataset.target);
  if(!el) return;
  recognizer = new SR(); recognizer.lang='fr-FR'; recognizer.interimResults=false; recognizer.continuous=true;
  recTargetBtn = btn; btn.classList.add('rec'); btn.textContent='● Stop';
  recognizer.onresult = ev=>{
    let txt=''; for(let k=ev.resultIndex;k<ev.results.length;k++){ if(ev.results[k].isFinal) txt+=ev.results[k][0].transcript; }
    if(txt){ el.value = (el.value ? el.value.trim()+' ' : '') + txt.trim(); el.dispatchEvent(new Event('input')); }
  };
  recognizer.onerror = ()=>stopDictationUI(btn);
  recognizer.onend = ()=>stopDictationUI(btn);
  try{ recognizer.start(); }catch(e){ stopDictationUI(btn); }
}
function stopDictationUI(btn){ btn.classList.remove('rec'); btn.textContent = btn.dataset.target.startsWith('leg-')?'🎤':'🎤 Dicter'; recognizer=null; recTargetBtn=null; }

/* ---------- enregistrement ---------- */
function saveEntry(){
  const errBox = document.getElementById('rapport-err'); errBox.innerHTML='';
  const situation = document.getElementById('f-situation').value.trim();
  const actions = document.getElementById('f-actions').value.trim();
  if(!situation && !actions && photos.length===0){
    errBox.innerHTML = '<div class="err">Renseignez au moins une description ou une photo.</div>';
    window.scrollTo(0,0); return;
  }
  let loc = document.getElementById('f-loc').value;
  if(loc==='__autre') loc='';
  const entreeId = uid();
  const row = {
    id: entreeId,
    site_id: SITE_ID || null,
    site_nom: SITE_NOM,
    activite: ACTIVITE,
    agent_nom: AGENT_NOM,
    date_rapport: document.getElementById('f-date').value || null,
    heure_rapport: document.getElementById('f-heure').value || null,
    localisation: loc || null,
    localisation_autre: document.getElementById('f-loc-autre').value.trim() || null,
    situation: situation || null,
    actions: actions || null,
    created_at: new Date().toISOString()
  };
  RDZSync.save({ module:'rapport-standard', table:'journal_entrees', row, op:'upsert', onConflict:'id' });

  photos.forEach(p=>{
    RDZSync.save({
      module:'rapport-standard', table:'journal_photos',
      row:{ id:uid(), entree_id:entreeId, legende:p.legende||null, created_at:new Date().toISOString() },
      op:'upsert', onConflict:'id',
      bucket:'journal-photos', photoField:'url',
      photos:[{ name:p.name, dataUrl:p.dataUrl }]
    });
  });

  document.getElementById('done-sub').textContent =
    photos.length ? `Entrée enregistrée. ${photos.length} photo(s) partiront en WiFi.` : 'Elle est dans le journal de bord.';
  show('screen-done');
}

init();
</script>
