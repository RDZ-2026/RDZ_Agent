<!-- RDZ · alarme-config · v2 · 2026-08-08 -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDZ — Configuration des alarmes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --red:#8B1A1A; --red-dark:#6B1212; --report-red:#C8102E;
  --ink:#1a1a1a; --paper:#ffffff;
  --line:#d0d0d0; --line-soft:#e0e0e0;
  --bg-meta:#f0f0f0; --bg-soft:#f7f7f7;
  --ok:#1b7a3d; --warn:#b8860b; --danger:#8B1A1A;
  --radius-ui:2px; --radius-card:10px; --radius-section:8px;
  --font:Arial, Helvetica, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg-soft);color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;min-height:100vh;background:var(--bg-soft);display:flex;flex-direction:column}
header{background:var(--red);color:#fff;padding:12px 18px}
header .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
header .brand{font-weight:bold;letter-spacing:.5px;font-size:14px}
header .sub{font-size:12px;opacity:.9;margin-top:2px}
header a.home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:var(--radius-ui);white-space:nowrap}
main{flex:1;padding:18px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:11px 18px;border-radius:var(--radius-ui);font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.toast.err{background:var(--danger)}

.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.h2{font-size:16px;font-weight:bold}
.btn{border:none;border-radius:var(--radius-ui);padding:10px 15px;font-size:14px;font-weight:bold;cursor:pointer;font-family:var(--font)}
.btn-red{background:var(--red);color:#fff}
.btn-red:active{background:var(--red-dark)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:#fff;border:1px solid #e0a6a0;color:var(--danger)}
.btn-sm{padding:7px 11px;font-size:13px}

.card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius-section);padding:14px;margin-bottom:11px;cursor:pointer;display:flex;align-items:center;gap:12px}
.card:active{border-color:var(--red)}
.card .code{font-weight:bold;font-size:16px;background:var(--bg-meta);border-radius:var(--radius-ui);padding:6px 11px;letter-spacing:.5px}
.card .info .s{font-weight:bold;font-size:14.5px}
.card .info .z{font-size:12.5px;color:#777;margin-top:2px}
.card .badge{margin-left:auto;font-size:11px;font-weight:bold;padding:3px 9px;border-radius:20px}
.badge.on{background:#e9f4ec;color:var(--ok)}
.badge.off{background:#f2f2f2;color:#999}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#777;font-weight:bold;margin-bottom:6px}
input[type=text],select,textarea{width:100%;font-family:var(--font);font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--radius-ui);padding:11px 12px}
textarea{min-height:78px;resize:vertical;line-height:1.45}
.row2{display:flex;gap:12px}.row2>*{flex:1}
.form-card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius-section);padding:16px;margin-bottom:16px}
.toggle{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{width:auto}

.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--red);font-weight:bold;background:var(--bg-meta);padding:8px 12px;border-radius:var(--radius-ui);margin-bottom:12px}

.ck-row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius-ui);padding:8px;margin-bottom:8px}
.ck-row input[type=text]{border:1px solid var(--line-soft)}
.ck-row .ord{display:flex;flex-direction:column;gap:2px}
.ck-row .ord button{background:var(--bg-meta);border:1px solid var(--line-soft);border-radius:var(--radius-ui);width:30px;height:22px;cursor:pointer;font-size:12px;line-height:1;padding:0}
.ck-row .ord button:disabled{opacity:.3;cursor:default}
.ck-row .del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:4px 6px}
.ck-type{width:auto!important;flex-shrink:0;font-size:12.5px;padding:8px 6px;background:var(--bg-soft)}
.add-row{display:flex;gap:8px;margin-top:10px}
@media(max-width:560px){.ck-row{flex-wrap:wrap}.ck-row input[type=text]{flex-basis:100%;order:5}.add-row{flex-wrap:wrap}#new-step{flex-basis:100%;order:5}}

.state-msg{text-align:center;color:#999;font-size:14px;padding:26px 10px}
.hint{font-size:12.5px;color:#999;margin-top:6px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <div class="brand">RDZ SECURITY MANAGEMENT SA</div>
        <div class="sub">Configuration des alarmes</div>
      </div>
      <a class="home" href="../index.html">← Accueil</a>
    </div>
  </header>

  <main>
    <!-- LISTE -->
    <section id="screen-list">
      <div class="bar">
        <div class="h2">Transmetteurs</div>
        <button class="btn btn-red" onclick="openNew()">＋ Ajouter un transmetteur</button>
      </div>
      <div id="list"><div class="state-msg">Chargement…</div></div>
    </section>

    <!-- EDITION -->
    <section id="screen-edit" class="hidden">
      <div class="bar">
        <button class="btn btn-ghost btn-sm" onclick="backToList()">← Liste</button>
        <div class="h2" id="edit-title">Transmetteur</div>
      </div>

      <div class="form-card">
        <div class="sec-title">Identité</div>
        <div class="row2">
          <div class="field">
            <label>N° transmetteur (CERTAS)</label>
            <input type="text" id="f-code" placeholder="Ex. 10023" inputmode="numeric">
          </div>
          <div class="field">
            <label>Site</label>
            <select id="f-site"><option value="">— Choisir —</option></select>
          </div>
        </div>
        <div class="field">
          <label>Zone (facultatif)</label>
          <input type="text" id="f-zone" placeholder="Ex. Niveau -2, Bâtiment B, Entrée principale">
        </div>
        <div class="field">
          <label>🔑 Emplacement des clés</label>
          <textarea id="f-cles" placeholder="Ex. Trousseau n°4 — armoire loge, crochet A3"></textarea>
        </div>
        <div class="field">
          <label>Consignes d'accès</label>
          <textarea id="f-cons" placeholder="Ex. Accès porte nord. Code portail auprès du centraliste. Désarmer la centrale au tableau."></textarea>
        </div>
        <label class="toggle"><input type="checkbox" id="f-actif" checked> Transmetteur actif</label>

        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
          <button class="btn btn-red" onclick="saveTransmetteur()">💾 Enregistrer</button>
          <button class="btn btn-danger" id="btn-del" onclick="deleteTransmetteur()">🗑 Supprimer</button>
        </div>
      </div>

      <!-- CHECKLIST -->
      <div class="form-card">
        <div class="sec-title">Marche à suivre (checklist)</div>
        <div id="checklist-box"><div class="hint">Enregistrez d'abord le transmetteur pour ajouter des étapes.</div></div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://pdewmubikmotqzbxmyeq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkZXdtdWJpa21vdHF6YnhteWVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDU3MjgsImV4cCI6MjA5NDg4MTcyOH0.SRuhERPmB5_7a58nJ5oMg4a8mujnoLBv8dxkxvyNWao';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let sites = [];
let editing = null;       // ligne transmetteur en cours (null = nouveau)
let currentCode = null;   // code enregistré (checklist reliée à ce code)
let checklist = [];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); setTimeout(()=>t.className='toast',2200); }
function show(id){ ['screen-list','screen-edit'].forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id)); window.scrollTo(0,0); }

/* ---------- sites ---------- */
async function loadSites(){
  try{
    const { data } = await sb.from('sites').select('id,nom').eq('actif',true).order('nom');
    sites = data||[];
    const sel = document.getElementById('f-site');
    sel.innerHTML = '<option value="">— Choisir —</option>' + sites.map(s=>`<option value="${s.id}">${esc(s.nom)}</option>`).join('');
  }catch(e){ toast('Impossible de charger les sites', true); }
}

/* ---------- liste transmetteurs ---------- */
async function loadList(){
  const box = document.getElementById('list');
  try{
    const { data, error } = await sb.from('alarme_transmetteurs').select('*').order('code');
    if(error) throw error;
    if(!data.length){ box.innerHTML = '<div class="state-msg">Aucun transmetteur. Cliquez « Ajouter ».</div>'; return; }
    box.innerHTML = data.map(t=>`
      <div class="card" onclick='openEdit(${JSON.stringify(t).replace(/'/g,"&#39;")})'>
        <div class="code">${esc(t.code)}</div>
        <div class="info"><div class="s">${esc(t.site_nom||'Site non défini')}</div>
          <div class="z">${esc(t.zone||'—')}</div></div>
        <div class="badge ${t.actif?'on':'off'}">${t.actif?'Actif':'Inactif'}</div>
      </div>`).join('');
  }catch(e){ box.innerHTML = '<div class="state-msg">Erreur de chargement (réseau ?).</div>'; }
}

/* ---------- édition ---------- */
function openNew(){
  editing = null; currentCode = null; checklist = [];
  document.getElementById('edit-title').textContent = 'Nouveau transmetteur';
  document.getElementById('f-code').value = '';
  document.getElementById('f-code').removeAttribute('disabled');
  document.getElementById('f-site').value = '';
  document.getElementById('f-zone').value = '';
  document.getElementById('f-cles').value = '';
  document.getElementById('f-cons').value = '';
  document.getElementById('f-actif').checked = true;
  document.getElementById('btn-del').style.display = 'none';
  document.getElementById('checklist-box').innerHTML = '<div class="hint">Enregistrez d\'abord le transmetteur pour ajouter des étapes.</div>';
  show('screen-edit');
}
function openEdit(t){
  editing = t; currentCode = t.code;
  document.getElementById('edit-title').textContent = 'Transmetteur ' + t.code;
  document.getElementById('f-code').value = t.code || '';
  document.getElementById('f-site').value = t.site_id || '';
  document.getElementById('f-zone').value = t.zone || '';
  document.getElementById('f-cles').value = t.emplacement_cles || '';
  document.getElementById('f-cons').value = t.consignes || '';
  document.getElementById('f-actif').checked = t.actif !== false;
  document.getElementById('btn-del').style.display = '';
  loadChecklist(t.code);
  show('screen-edit');
}
function backToList(){ loadList(); show('screen-list'); }

async function saveTransmetteur(){
  const code = document.getElementById('f-code').value.trim();
  const siteId = document.getElementById('f-site').value;
  if(!code){ toast('Entrez un numéro de transmetteur', true); return; }
  if(!siteId){ toast('Choisissez un site', true); return; }
  const site = sites.find(s=>s.id===siteId);
  const payload = {
    code, site_id: siteId, site_nom: site?site.nom:null,
    zone: document.getElementById('f-zone').value.trim() || null,
    emplacement_cles: document.getElementById('f-cles').value.trim() || null,
    consignes: document.getElementById('f-cons').value.trim() || null,
    actif: document.getElementById('f-actif').checked
  };
  try{
    if(editing){
      const oldCode = editing.code;
      const { error } = await sb.from('alarme_transmetteurs').update(payload).eq('id', editing.id);
      if(error) throw error;
      // si le code a changé, répercuter sur la checklist reliée
      if(oldCode !== code){
        await sb.from('alarme_checklist_items').update({ transmetteur_code: code }).eq('transmetteur_code', oldCode);
      }
      editing = { ...editing, ...payload };
    }else{
      const { data, error } = await sb.from('alarme_transmetteurs').insert(payload).select().single();
      if(error) throw error;
      editing = data;
      document.getElementById('btn-del').style.display = '';
      document.getElementById('edit-title').textContent = 'Transmetteur ' + code;
    }
    currentCode = code;
    toast('Transmetteur enregistré ✓');
    loadChecklist(code);
  }catch(e){
    if((e.message||'').toLowerCase().includes('duplicate') || (e.code==='23505')) toast('Ce numéro existe déjà', true);
    else toast('Échec de l\'enregistrement (réseau ?)', true);
  }
}

async function deleteTransmetteur(){
  if(!editing) return;
  if(!confirm('Supprimer ce transmetteur et sa checklist ? Cette action est définitive.')) return;
  try{
    await sb.from('alarme_checklist_items').delete().eq('transmetteur_code', editing.code);
    const { error } = await sb.from('alarme_transmetteurs').delete().eq('id', editing.id);
    if(error) throw error;
    toast('Transmetteur supprimé');
    backToList();
  }catch(e){ toast('Échec de la suppression', true); }
}

/* ---------- checklist ---------- */
async function loadChecklist(code){
  const box = document.getElementById('checklist-box');
  box.innerHTML = '<div class="hint">Chargement…</div>';
  try{
    const { data } = await sb.from('alarme_checklist_items').select('*').eq('transmetteur_code', code).order('ordre');
    checklist = data||[];
    renderChecklist();
  }catch(e){ box.innerHTML = '<div class="hint">Erreur de chargement de la checklist.</div>'; }
}
function renderChecklist(){
  const box = document.getElementById('checklist-box');
  let html = '';
  if(!checklist.length){ html += '<div class="hint">Aucune étape. Ajoutez la première ci-dessous.</div>'; }
  checklist.forEach((c,i)=>{
    html += `<div class="ck-row">
      <div class="ord">
        <button onclick="moveItem(${i},-1)" ${i===0?'disabled':''}>▲</button>
        <button onclick="moveItem(${i},1)" ${i===checklist.length-1?'disabled':''}>▼</button>
      </div>
      <select class="ck-type" onchange="updateItemType(${c.id}, this.value)" title="Type d'étape">
        ${typeOptions(c.type)}
      </select>
      <input type="text" value="${esc(c.libelle)}" onchange="updateItem(${c.id}, this.value)">
      <button class="del" onclick="deleteItem(${c.id})" title="Supprimer">🗑</button>
    </div>`;
  });
  html += `<div class="add-row">
    <select id="new-step-type" class="ck-type">${typeOptions('check')}</select>
    <input type="text" id="new-step" placeholder="Nouvelle étape…" onkeydown="if(event.key==='Enter')addItem()">
    <button class="btn btn-red btn-sm" onclick="addItem()">＋ Ajouter</button>
  </div>
  <div class="hint">✓ Vérification = case à cocher · ⏱ Horodatage = capture une heure · 📝 Note = champ texte (dictable). Les valeurs saisies alimentent le rapport.</div>`;
  box.innerHTML = html;
}
const TYPES = [['check','✓ Vérification'],['heure','⏱ Horodatage'],['note','📝 Note']];
function typeOptions(sel){ return TYPES.map(([v,l])=>`<option value="${v}" ${v===(sel||'check')?'selected':''}>${l}</option>`).join(''); }

async function addItem(){
  const inp = document.getElementById('new-step');
  const libelle = inp.value.trim();
  const type = document.getElementById('new-step-type').value || 'check';
  if(!libelle) return;
  if(!currentCode){ toast('Enregistrez d\'abord le transmetteur', true); return; }
  const maxOrd = checklist.reduce((m,c)=>Math.max(m,c.ordre||0),0);
  try{
    const { data, error } = await sb.from('alarme_checklist_items')
      .insert({ transmetteur_code: currentCode, libelle, type, ordre: maxOrd+10, actif:true }).select().single();
    if(error) throw error;
    checklist.push(data); renderChecklist();
  }catch(e){ toast('Échec de l\'ajout', true); }
}
async function updateItemType(id, val){
  try{ await sb.from('alarme_checklist_items').update({ type:val }).eq('id', id);
    const it = checklist.find(c=>c.id===id); if(it) it.type=val; toast('Type modifié ✓');
  }catch(e){ toast('Échec', true); }
}
async function updateItem(id, val){
  const v = val.trim(); if(!v) return;
  try{ await sb.from('alarme_checklist_items').update({ libelle:v }).eq('id', id);
    const it = checklist.find(c=>c.id===id); if(it) it.libelle=v; toast('Étape modifiée ✓');
  }catch(e){ toast('Échec de la modification', true); }
}
async function deleteItem(id){
  if(!confirm('Supprimer cette étape ?')) return;
  try{ await sb.from('alarme_checklist_items').delete().eq('id', id);
    checklist = checklist.filter(c=>c.id!==id); renderChecklist();
  }catch(e){ toast('Échec de la suppression', true); }
}
async function moveItem(i, dir){
  const j = i+dir; if(j<0||j>=checklist.length) return;
  const a = checklist[i], b = checklist[j];
  const oa = a.ordre, ob = b.ordre;
  try{
    await sb.from('alarme_checklist_items').update({ ordre: ob }).eq('id', a.id);
    await sb.from('alarme_checklist_items').update({ ordre: oa }).eq('id', b.id);
    a.ordre = ob; b.ordre = oa;
    checklist.sort((x,y)=>(x.ordre||0)-(y.ordre||0));
    renderChecklist();
  }catch(e){ toast('Échec du réordonnancement', true); }
}

loadSites();
loadList();
</script>
</body>
</html>
